#map-wrapper::after {

  position: absolute;

  box-shadow:

    inset 0 0 20px rgba(0,0,0,0.5);

  outline: none !important;

}

.leaflet-pane img {
  border: none !important;
}

#map-wrapper {
  height: 90vh;
  width: 90vw;

  position: relative;

#map.zoomed::after {
  content: "";
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  border: 4px solid #0f0b07;

<body>

<div id="marker-form" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
background:#1e1e1e; padding:20px; border-radius:8px; z-index:1000; color:white; width:300px;">

  <h3 id="form-title">Новая метка</h3>

  <input id="marker-title" placeholder="Название" style="width:100%; margin-bottom:10px;" />
  
  <textarea id="marker-desc" placeholder="Описание" style="width:100%; height:80px;"></textarea>

  <select id="marker-type" style="width:100%; margin-top:10px;">
  <option value="note">📜 Заметка</option>
  <option value="camp">🏕 Лагерь</option>
  <option value="cave">🕳 Пещера</option>
  <option value="interest">⭐ Интересное место</option>
  <option value="quest">❓ Квест</option>
</select>
  
  <div style="margin-top:10px; display:flex; justify-content:space-between;">
    <button onclick="saveMarker()">Сохранить</button>
    <button onclick="closeForm()">Отмена</button>
  </div>
</div>

<div id="map-wrapper">
  <div id="map"></div>
</div>

<script>

var currentLatLng = null;
var editId = null;
var popupJustClosed = false;
var icons = {
  camp: L.icon({
    iconUrl: 'camp.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  cave: L.icon({
    iconUrl: 'cave.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  note: L.icon({
    iconUrl: 'note.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  interest: L.icon({
    iconUrl: 'interest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  quest: L.icon({
    iconUrl: 'quest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  })
};

// размеры твоей карты (пока оставим так)
var width = 7016;
var height = 4960;

// создаём карту
var bounds = [[0,0], [height, width]];

var map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 0,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0,
  attributionControl: false,
});

// загружаем картинку
var imageUrl = 'map.jpg';

var bounds = [[0,0], [height, width]];
var overlay = L.imageOverlay(imageUrl, bounds).addTo(map);

map.fitBounds(bounds, {
  padding: [0, 0],
  animate: false
});

map.setMaxBounds(bounds);
map.panInsideBounds(bounds, { animate: false });

map.on('popupclose', function() {
  popupJustClosed = true;

  setTimeout(function() {
    popupJustClosed = false;
  }, 100);
});

function updateFrame() {
  var mapEl = document.getElementById('map');
  var wrapper = document.getElementById('map-wrapper');

  if (map.getZoom() === map.getMinZoom()) {
    // минимальный зум
    wrapper.classList.remove("zoomed");
    mapEl.classList.remove("zoomed");

    map.dragging.disable(); // ← блокируем

  } else {
    // зум есть
    wrapper.classList.add("zoomed");
    mapEl.classList.add("zoomed");

    map.dragging.enable(); // ← ВОТ ЭТО ВАЖНО
  }
}

updateFrame();
map.on('zoomend', updateFrame);

// --- ЗАГРУЗКА СОХРАНЁННЫХ МЕТОК ---
var savedMarkers = JSON.parse(localStorage.getItem("markers") || "[]");

savedMarkers.forEach(function(m) {
  addMarker(m);
});

function addMarker(data) {
  var marker = L.marker(
  [data.lat, data.lng],
  { icon: icons[data.type || "note"] }
).addTo(map);

function renderPopup() {
  return `
    <div class="marker-popup">
      <div class="marker-title">${data.title}</div>
      <div class="marker-desc">${data.description}</div>

      <div class="marker-buttons">
        <button onclick="editMarker(${data.id})">✏️</button>
        <button onclick="deleteMarker(${data.id})">🗑</button>
      </div>
    </div>
  `;
}

  marker.bindPopup(renderPopup());

  marker._customId = data.id;
}

// --- ДОБАВЛЕНИЕ МЕТКИ ПО КЛИКУ ---
map.on('click', function(e) {
  if (popupJustClosed) return; // ← ВОТ ЭТО ГЛАВНОЕ

  if (window.routeMode) {
    window.addPartyRoutePoint(e.latlng);
    return;
  }

  currentLatLng = e.latlng;
  editId = null;

  document.getElementById("form-title").innerText = "Новая метка";
  document.getElementById("marker-title").value = "";
  document.getElementById("marker-desc").value = "";

  document.getElementById("marker-form").style.display = "block";
});

function deleteMarker(id) {
  var confirmDelete = confirm("Удалить метку?");
  if (!confirmDelete) return;

  // удаляем из массива
  savedMarkers = savedMarkers.filter(m => m.id !== id);
  localStorage.setItem("markers", JSON.stringify(savedMarkers));

  // удаляем с карты БЕЗ перезагрузки
  map.eachLayer(function(layer) {
    if (layer instanceof L.Marker && layer._customId === id) {
      map.removeLayer(layer);
    }
  });
}

function editMarker(id) {
  var marker = savedMarkers.find(m => m.id === id);
  if (!marker) return;

  editId = id;
  currentLatLng = { lat: marker.lat, lng: marker.lng };

  document.getElementById("form-title").innerText = "Редактирование";
  document.getElementById("marker-title").value = marker.title;
  document.getElementById("marker-desc").value = marker.description;

  document.getElementById("marker-form").style.display = "block";
}

function closeForm() {
  document.getElementById("marker-form").style.display = "none";
}

function saveMarker() {
  var title = document.getElementById("marker-title").value;
  var desc = document.getElementById("marker-desc").value;
  var type = document.getElementById("marker-type").value;

  if (!title) return;

  if (editId) {
    var marker = savedMarkers.find(m => m.id === editId);
    marker.title = title;
    marker.description = desc;
    marker.type = type;

    // обновляем popup БЕЗ reload
    map.eachLayer(function(layer) {
      if (layer instanceof L.Marker && layer._customId === editId) {
        layer.setIcon(icons[type]);
        layer.setPopupContent(`
          <div class="marker-popup">
            <div class="marker-title">${title}</div>
            <div class="marker-desc">${desc}</div>

            <div class="marker-buttons">
              <button onclick="editMarker(${editId})">✏️</button>
              <button onclick="deleteMarker(${editId})">🗑</button>
            </div>
          </div>
        `);
      }
    });

  } else {
    var newMarker = {
      lat: currentLatLng.lat,
      lng: currentLatLng.lng,
      title: title,
      description: desc,
      type: type,
      id: Date.now()
    };

    savedMarkers.push(newMarker);
    addMarker(newMarker);
  }

  localStorage.setItem("markers", JSON.stringify(savedMarkers));
  closeForm();
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    map.closePopup();
    closeForm(); // если форма открыта
  }
});

</script>

const routePaceLimits = {

const hasMouse = window.matchMedia(

// =====================================
// ДЛИНА МАРШРУТА
// =====================================

function getRouteLength(points) {
  let total = 0;

  for (let i = 1; i < points.length; i++) {
    const dy = points[i].lat - points[i - 1].lat;
    const dx = points[i].lng - points[i - 1].lng;

    total += Math.sqrt(dx * dx + dy * dy);
  }

  return total;
}

// Получение координаты на определённом расстоянии пути
function getRoutePointAtDistance(points, targetDistance) {
  let passed = 0;

  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];

    const dy = end.lat - start.lat;
    const dx = end.lng - start.lng;

    const segmentLength = Math.sqrt(dx * dx + dy * dy);

    if (passed + segmentLength >= targetDistance) {
      const part = (targetDistance - passed) / segmentLength;

      return L.latLng(
        start.lat + dy * part,
        start.lng + dx * part
      );
    }

    passed += segmentLength;
  }

  return null;
}

// =====================================
// ОЧИСТКА ЛИНИИ И ПРИВАЛОВ
// =====================================

function clearRouteDrawing() {
  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  routeRestMarkers.forEach(marker => {
    map.removeLayer(marker);
  });

  routeRestMarkers = [];
}

// =====================================
// ОБНОВЛЕНИЕ И ОТРИСОВКА МАРШРУТА
// =====================================

function updateRouteLine(cursorPosition = null) {
  let pointsToDraw = [...routePoints];

  if (cursorPosition && hasMouse && window.routeMode) {
    pointsToDraw.push(cursorPosition);
  }

  clearRouteDrawing();

  const totalLength = getRouteLength(pointsToDraw);
  const dailyLimit = routePaceLimits[routePace];

  if (pointsToDraw.length >= 2) {
    routeLine = L.polyline(pointsToDraw, {
      color: "#d6b46a",
      weight: 4,
      dashArray: "8, 10",
      opacity: 0.9
    }).addTo(map);
  }

  // Расставляем символы отдыха
  for (let distance = dailyLimit; distance < totalLength; distance += dailyLimit) {
    const restPosition = getRoutePointAtDistance(
      pointsToDraw,
      distance
    );

    if (restPosition) {
      const restMarker = L.circleMarker(restPosition, {
        radius: 7,
        color: "#211b16",
        weight: 2,
        fillColor: "#e6c77d",
        fillOpacity: 1,
        interactive: false
      }).addTo(map);

      routeRestMarkers.push(restMarker);
    }
  }

  // Обновляем информацию в панели
const days = routeRestMarkers.length;

document.getElementById("route-daily-limit").textContent =
  (dailyLimit * KM_PER_PIXEL).toFixed(1) + " км";

document.getElementById("route-distance").textContent =
  (totalLength * KM_PER_PIXEL).toFixed(1) + " км";

    document.getElementById("route-days").textContent =
      days;

    routeConfirmButton.disabled = routePoints.length < 2;
  }

  console.log("Длина маршрута:", Math.round(totalLength));
}

          partyMarker.setLatLng(coordinates);
        }

        console.log("Положение отряда:", coordinates);
      });

    } catch (error) {
      console.error("Ошибка загрузки отряда:", error);
    }
  }

 // Тестовая проверка общей базы
  window.testFirebase = async function() {
    const testRef = ref(database, "connectionTest");

    try {
      await set(testRef, {
        message: "Связь работает!",
        updatedAt: Date.now()
      });

      const snapshot = await get(testRef);

      console.log("Проверка Firebase:", snapshot.val());
      alert("Успешно! Firebase записывает и читает данные.");
    } catch (error) {
      console.error("Ошибка Firebase:", error);
      alert("Ошибка Firebase: " + error.message);
    }
  };

  // Делаем Firebase доступным для следующих частей нашей системы
  window.dndFirebase = {
    app: app,
    auth: auth,
    database: database,
    uid: null,
    ready: false
  };

  // Индикатор подключения на экране
  const status = document.createElement("div");

  status.style.cssText = `
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 2000;
    padding: 8px 12px;
    border-radius: 6px;
    background: #222;
    color: white;
    font: 13px sans-serif;
  `;

  status.textContent = "Firebase: подключение...";
  document.body.appendChild(status);

  // Анонимная авторизация игрока
  onAuthStateChanged(auth, function(user) {
    if (user) {
      window.dndFirebase.uid = user.uid;
      window.dndFirebase.ready = true;

      status.textContent = "Firebase: авторизация выполнена";
      status.style.background = "#245c32";

      console.log("Firebase готов. UID:", user.uid);
      initializeParty();
    } else {
      window.dndFirebase.ready = false;
      status.textContent = "Firebase: выполняется вход...";

      signInAnonymously(auth).catch(function(error) {
        console.error("Ошибка авторизации Firebase:", error);

        status.textContent = "Firebase: ошибка авторизации";
        status.style.background = "#8b2222";
      });
    }
  });
</script>
