<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DND Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
body {
  margin: 0;

  background: url('background.jpg') no-repeat center center fixed;
  background-size: cover;
}

#map {
  height: 100%;
  width: 100%;

  background: transparent;
  position: relative;
}

#map-wrapper::after {
  content: "";
  position: absolute;

  top: -2%;
  bottom: -2%;
  left: 11%;
  right: 11%;

  border: 4px solid #0f0b07;

  box-shadow: 
    0 0 40px rgba(0,0,0,0.9),
    inset 0 0 20px rgba(0,0,0,0.5);

  pointer-events: none;
}
  .leaflet-container {
  outline: none !important;
  border: none !important;
}

.leaflet-pane img {
  border: none !important;
}

.leaflet-marker-icon:focus {
  outline: none !important;
}

.party-marker-icon {
  background: transparent !important;
  border: 0 !important;
}

#map-wrapper {
  height: 90vh;
  width: 90vw;
  margin: 5vh auto;

  position: relative;
}

#map.zoomed::after {
  content: "";
  position: absolute;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  border: 4px solid #0f0b07;

  box-shadow: 
    0 0 40px rgba(0,0,0,0.9),
    inset 0 0 20px rgba(0,0,0,0.5);

  pointer-events: none;
}

#map-wrapper.zoomed::after {
  display: none;
}

.marker-popup {
  background: #1b1b1b;
  color: #f5f5f5;
  padding: 10px;
  border-radius: 8px;
  font-family: sans-serif;
  min-width: 200px;
}

.marker-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 5px;
}

.marker-desc {
  font-size: 13px;
  opacity: 0.8;
  margin-bottom: 10px;
}

.marker-buttons {
  display: flex;
  justify-content: space-between;
}

.marker-buttons button {
  background: #333;
  border: none;
  color: white;
  padding: 5px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.marker-buttons button:hover {
  background: #555;
}


/* Фактура сухой кисти создаётся отдельными сужающимися мазками и щетинками. */
.leaflet-settlement-dry-brush-pane-pane { pointer-events: none; }
  </style>
</head>

<body>

<div id="marker-form" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
background:#1e1e1e; padding:20px; border-radius:8px; z-index:1000; color:white; width:300px;">

  <h3 id="form-title">Новая метка</h3>

  <input id="marker-title" placeholder="Название" style="width:100%; margin-bottom:10px;" />
  
  <textarea id="marker-desc" placeholder="Описание" style="width:100%; height:80px;"></textarea>

  <select id="marker-type" style="width:100%; margin-top:10px;">
  <option value="note">📜 Заметка</option>
  <option value="camp">🏕 Лагерь</option>
  <option value="cave">🕳 Пещера</option>
  <option value="interest">⭐ Интересное место</option>
  <option value="quest">❓ Квест</option>
</select>
  
  <div style="margin-top:10px; display:flex; justify-content:space-between;">
    <button onclick="saveMarker()">Сохранить</button>
    <button onclick="closeForm()">Отмена</button>
  </div>
</div>

<div id="map-wrapper">
  <div id="map"></div>
</div>

<script>

var currentLatLng = null;
var editId = null;
var popupJustClosed = false;
var settlementJustDrew = false;
window.settlementDrawingActive = false;
var icons = {
  camp: L.icon({
    iconUrl: 'camp.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  cave: L.icon({
    iconUrl: 'cave.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  note: L.icon({
    iconUrl: 'note.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  interest: L.icon({
    iconUrl: 'interest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  quest: L.icon({
    iconUrl: 'quest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  })
};

// размеры твоей карты (пока оставим так)
var width = 7016;
var height = 4960;

// создаём карту
var bounds = [[0,0], [height, width]];

var map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 0,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0,
  attributionControl: false,
});

// загружаем картинку
var imageUrl = 'map.jpg';

var bounds = [[0,0], [height, width]];
var overlay = L.imageOverlay(imageUrl, bounds).addTo(map);

map.fitBounds(bounds, {
  padding: [0, 0],
  animate: false
});

map.setMaxBounds(bounds);
map.panInsideBounds(bounds, { animate: false });

map.on('popupclose', function() {
  popupJustClosed = true;

  setTimeout(function() {
    popupJustClosed = false;
  }, 100);
});

function updateFrame() {
  var mapEl = document.getElementById('map');
  var wrapper = document.getElementById('map-wrapper');

  if (map.getZoom() === map.getMinZoom()) {
    // минимальный зум
    wrapper.classList.remove("zoomed");
    mapEl.classList.remove("zoomed");

    map.dragging.disable(); // ← блокируем

  } else {
    // зум есть
    wrapper.classList.add("zoomed");
    mapEl.classList.add("zoomed");

    map.dragging.enable(); // ← ВОТ ЭТО ВАЖНО
  }
}

updateFrame();
map.on('zoomend', updateFrame);

// --- ЗАГРУЗКА СОХРАНЁННЫХ МЕТОК ---
// Личные метки: локальный список остаётся резервной копией и источником
// для однократного переноса в личное хранилище Firebase.
var savedMarkers = JSON.parse(localStorage.getItem("markers") || "[]");

savedMarkers.forEach(function(m) {
  addMarker(m);
});

function persistPersonalMarkers() {
  localStorage.setItem("markers", JSON.stringify(savedMarkers));

  // Firebase может ещё авторизовывать пользователя. В таком случае
  // локальная копия сохранится, а перенос будет выполнен после входа.
  if (window.dndFirebase && typeof window.dndFirebase.savePersonalMarkers === "function") {
    window.dndFirebase.savePersonalMarkers(savedMarkers).catch(function(error) {
      console.error("Не удалось синхронизировать личные метки:", error);
      alert("Не удалось сохранить метки в общей базе. Локальная резервная копия сохранена.");
    });
  }
}

// Вызывается Firebase после загрузки личных меток текущего UID.
// Удаляются только обычные метки, но не маркер отряда и не другие слои карты.
window.applyPersonalMarkers = function(markers) {
  map.eachLayer(function(layer) {
    if (layer instanceof L.Marker && layer._customId !== undefined) {
      map.removeLayer(layer);
    }
  });

  savedMarkers = Array.isArray(markers) ? markers : [];
  savedMarkers.forEach(function(markerData) {
    addMarker(markerData);
  });
  localStorage.setItem("markers", JSON.stringify(savedMarkers));
};

function addMarker(data) {
  var marker = L.marker(
  [data.lat, data.lng],
  { icon: icons[data.type || "note"] }
).addTo(map);

function renderPopup() {
  return `
    <div class="marker-popup">
      <div class="marker-title">${data.title}</div>
      <div class="marker-desc">${data.description}</div>

      <div class="marker-buttons">
        <button onclick="editMarker(${data.id})">✏️</button>
        <button onclick="deleteMarker(${data.id})">🗑</button>
      </div>
    </div>
  `;
}

  marker.bindPopup(renderPopup());

  marker._customId = data.id;
}

// --- ДОБАВЛЕНИЕ МЕТКИ ПО КЛИКУ ---
map.on('click', function(e) {
  // В режиме редактора клики по карте добавляют точки контура,
  // а не создают метки и не прокладывают маршрут.
  if (window.settlementContourEditorActive) {
    if (typeof window.handleSettlementContourEditorMapClick === 'function') {
      window.handleSettlementContourEditorMapClick(e.latlng);
    }
    return;
  }
  if (!window.settlementDrawingActive && !settlementJustDrew &&
      typeof window.handleTerminalSettlementMapClick === "function" &&
      window.handleTerminalSettlementMapClick(e.latlng)) return;
  if (popupJustClosed || window.settlementDrawingActive || settlementJustDrew) return;

  if (window.routeMode) {
  window.handlePartyRouteClick(e.latlng);
  return;
}
  if (window.routePendingConfirmation) return;

  currentLatLng = e.latlng;
  editId = null;

  document.getElementById("form-title").innerText = "Новая метка";
  document.getElementById("marker-title").value = "";
  document.getElementById("marker-desc").value = "";

  document.getElementById("marker-form").style.display = "block";
});

function deleteMarker(id) {
  var confirmDelete = confirm("Удалить метку?");
  if (!confirmDelete) return;

  // удаляем из массива
  savedMarkers = savedMarkers.filter(m => m.id !== id);
  persistPersonalMarkers();

  // удаляем с карты БЕЗ перезагрузки
  map.eachLayer(function(layer) {
    if (layer instanceof L.Marker && layer._customId === id) {
      map.removeLayer(layer);
    }
  });
}

function editMarker(id) {
  var marker = savedMarkers.find(m => m.id === id);
  if (!marker) return;

  editId = id;
  currentLatLng = { lat: marker.lat, lng: marker.lng };

  document.getElementById("form-title").innerText = "Редактирование";
  document.getElementById("marker-title").value = marker.title;
  document.getElementById("marker-desc").value = marker.description;

  document.getElementById("marker-form").style.display = "block";
}

function closeForm() {
  document.getElementById("marker-form").style.display = "none";
}

function saveMarker() {
  var title = document.getElementById("marker-title").value;
  var desc = document.getElementById("marker-desc").value;
  var type = document.getElementById("marker-type").value;

  if (!title) return;

  if (editId) {
    var marker = savedMarkers.find(m => m.id === editId);
    marker.title = title;
    marker.description = desc;
    marker.type = type;

    // обновляем popup БЕЗ reload
    map.eachLayer(function(layer) {
      if (layer instanceof L.Marker && layer._customId === editId) {
        layer.setIcon(icons[type]);
        layer.setPopupContent(`
          <div class="marker-popup">
            <div class="marker-title">${title}</div>
            <div class="marker-desc">${desc}</div>

            <div class="marker-buttons">
              <button onclick="editMarker(${editId})">✏️</button>
              <button onclick="deleteMarker(${editId})">🗑</button>
            </div>
          </div>
        `);
      }
    });

  } else {
    var newMarker = {
      lat: currentLatLng.lat,
      lng: currentLatLng.lng,
      title: title,
      description: desc,
      type: type,
      id: Date.now()
    };

    savedMarkers.push(newMarker);
    addMarker(newMarker);
  }

  persistPersonalMarkers();
  closeForm();
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    // Во время прокладки или подтверждения маршрута Escape
    // выполняет то же действие, что и кнопка «Отменить».
    if (window.routeMode || window.routePendingConfirmation) {
      e.preventDefault();
      e.stopImmediatePropagation();

      window.dispatchEvent(new Event("cancel-party-route"));

      // Убираем клавиатурный фокус с маркера отряда,
      // чтобы браузер не оставлял вокруг него рамку.
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      return;
    }

    map.closePopup();
    closeForm();
  }
});

</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
  import { getDatabase, ref, set, get, update, onValue, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

  // Настройки Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAnH35p8TJPBOyE18omlEbMrdr1RedbNIc",
    authDomain: "dnd-map-b6d21.firebaseapp.com",
    databaseURL: "https://dnd-map-b6d21-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "dnd-map-b6d21",
    storageBucket: "dnd-map-b6d21.firebasestorage.app",
    messagingSenderId: "1012046242037",
    appId: "1:1012046242037:web:7cb1db3ab10beaf66aa5bc"
  };

  // Параметры синхронизации маршрута и обводки доступны всем обработчикам,
  // включая ожидание прибытия, вне зависимости от локальной области видимости.
  window.routeLineDashStep = 18;
  window.routeLineRevealFadeDuration = 220;
  window.routeLineFirstDashDelay = 240;
  window.routeLineDashAcceleration = 1.5;
  window.routeLineMinimumDashDelay = 120;
  window.settlementTraceDashInterval = 95;

  // Единая шкала времени Firebase. Все клиенты сравнивают локальные часы
  // с серверным временем, чтобы запуск маршрута не зависел от часов устройства.
  let firebaseServerTimeOffset = 0;
  let firebaseServerTimeOffsetReady = false;
  let firebaseServerConnected = false;
  let firebaseServerOffsetReceived = false;
  let resolveFirebaseServerTimeOffsetReady;
  const firebaseServerTimeOffsetPromise = new Promise(resolve => {
    resolveFirebaseServerTimeOffsetReady = resolve;
  });
  window.getRouteSynchronizedNow = () => Date.now() + firebaseServerTimeOffset;

  function tryResolveFirebaseServerTimeOffsetReady() {
    // Начальный снимок .info/serverTimeOffset иногда содержит null/0 ещё до
    // установления соединения. Не считаем его готовой синхронизацией часов:
    // ждём одновременно подтверждённое соединение и числовой offset.
    if (firebaseServerTimeOffsetReady || !firebaseServerConnected || !firebaseServerOffsetReceived) return;
    firebaseServerTimeOffsetReady = true;
    resolveFirebaseServerTimeOffsetReady();
  }

  // Подключение Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const database = getDatabase(app);
  onValue(ref(database, ".info/connected"), snapshot => {
    firebaseServerConnected = snapshot.val() === true;
    tryResolveFirebaseServerTimeOffsetReady();
  });
  onValue(ref(database, ".info/serverTimeOffset"), snapshot => {
    const rawOffset = snapshot.val();
    if (rawOffset === null || rawOffset === undefined) return;
    const offset = Number(rawOffset);
    if (!Number.isFinite(offset)) return;
    firebaseServerTimeOffset = offset;
    firebaseServerOffsetReceived = true;
    tryResolveFirebaseServerTimeOffsetReady();
  });

  // Глобальное состояние поселений. Оно хранится на window, чтобы все
  // обработчики и вложенные функции карты обращались к одному экземпляру.
  window.settlementAreas = window.settlementAreas || [];
  // Отдельные невидимые зоны труднопроходимой местности.
  window.terrainAreas = window.terrainAreas || [];
  window.settlementDrawingMode = null;
  window.settlementDraft = [];
  window.settlementDraftLine = null;
  window.settlementPointerDown = false;
  window.settlementToolbar = null;
  window.settlementListenerStarted = false;
  window.settlementContourEditorActive = false;
  window.handleSettlementContourEditorMapClick = null;
  window.routeDestinationCityId = null;
  window.routeDestinationBoundaryPoint = null;
  window.routeDestinationApproachPoint = null;
  window.routeIntermediateCityIds = [];
  // История точек возврата перед входом в каждое промежуточное поселение.
  // Нужна, чтобы возврат от второго поселения сохранял первое.
  window.routeIntermediateSettlementUndoSnapshots = [];

// UID ведущего. Используется только для разграничения прав.
  const GAME_MASTER_UID = "qxdgnWhXmQeqHTLPMI3q8EK60Fi2";

// =====================================
  // СИСТЕМА ОБЩЕГО МАРКЕРА ОТРЯДА
  // =====================================

  // Начальные координаты отряда.
  // Позже заменим их на точное место на карте.
  const partyStartPosition = {
    lat: 2450,
    lng: 3200
  };

let partyMarker = null;
let partyListenerStarted = false;
window.routeMode = false;
window.routeAnimationPublished = false;
window.routeEditingConfirmedRoute = false;

  // Внешний вид маркера отряда с адаптацией под масштаб карты
function getPartyIconSize() {
  const minZoom = map.getMinZoom();
  const maxZoom = map.getMaxZoom();
  const zoom = map.getZoom();

  const progress = (zoom - minZoom) / (maxZoom - minZoom);

  if (progress <= 1 / 3) return 31;
  if (progress <= 2 / 3) return 36;
  return 43;
}

function createPartyIcon() {
  const size = getPartyIconSize();

  return L.divIcon({
    className: "party-marker-icon",
    html: `<img src="party.png" alt="" draggable="false" style="display:block;width:${size}px;height:${size}px;transform-origin:50% 50%;transition:transform 250ms linear;pointer-events:none;">`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2]
  });
}

let partyIcon = createPartyIcon();

  // Время начала загрузки этой страницы. Нужно, чтобы не пропустить
  // маршрут, который подтвердили во время подключения Firebase.
  const sharedRoutePageStartedAt = Date.now();

  // Подключение общего положения отряда
  async function initializeParty() {
    if (partyListenerStarted) return;
    partyListenerStarted = true;

    const partyRef = ref(database, "party/state");
    const sharedRouteRef = ref(database, "party/route");
    // Состояние движения хранится внутри уже разрешённого узла party/route.
    // Отдельный party/movement запрещён текущими правилами Firebase Database.
    window.publishPartyPlaybackState = async function(movement) {
      if (!window.dndFirebase || !window.dndFirebase.ready || !window.dndFirebase.uid) {
        throw new Error("Firebase ещё не готов");
      }
      await firebaseServerTimeOffsetPromise;
      await update(sharedRouteRef, {
        movement: {
          // Метаданные расчёта привалов должны переживать любые последующие
          // Play/Pause и автоматические остановки, а не только запись лагеря.
          restElapsedCarryUnits: Math.max(0, Number(window.routeRestElapsedCarryUnits) || 0),
          forcedSegments: Array.isArray(window.routeForcedSegments)
            ? window.routeForcedSegments.map(segment => ({ ...segment })) : [],
          forcedMarchStartDistance: Math.max(0, Number(window.routeForcedMarchStartDistance) || 0),
          forcedMarchStartUnits: Math.max(0, Number(window.routeForcedMarchStartUnits) || 0),
          forcedMarchEpochStartDistance: Math.max(0, Number(window.routeForcedMarchEpochStartDistance) || 0),
          ...movement,
          updatedAt: window.getRouteSynchronizedNow(),
          updatedBy: window.dndFirebase.uid
        }
      });
    };

    const actionConfirmationRef = ref(database, "party/route/actionConfirmation");
    window.publishPartyActionConfirmation = async function(action) {
      if (!window.dndFirebase || !window.dndFirebase.ready || !window.dndFirebase.uid) {
        throw new Error("Firebase ещё не готов");
      }
      if (!["camp", "fire"].includes(action)) throw new Error("Неизвестное действие отдыха");
      await firebaseServerTimeOffsetPromise;
      const now = window.getRouteSynchronizedNow();
      const request = {
        id: String(now) + "_" + window.dndFirebase.uid,
        action,
        status: "pending",
        createdAt: now,
        createdBy: window.dndFirebase.uid
      };
      const result = await runTransaction(actionConfirmationRef, current => {
        if (current && current.status === "pending" &&
            now - (Number(current.createdAt) || 0) < 120000) return;
        return request;
      });
      if (!result.committed && result.snapshot.exists()) {
        // Если другой игрок уже открыл подтверждение, показываем всем именно его.
        if (typeof window.applyPartyActionConfirmation === "function") {
          window.applyPartyActionConfirmation(result.snapshot.val());
        }
      }
      return result.committed;
    };

    window.resolvePartyActionConfirmation = async function(requestId, answer) {
      if (!window.dndFirebase || !window.dndFirebase.ready || !window.dndFirebase.uid) {
        throw new Error("Firebase ещё не готов");
      }
      if (!["yes", "no"].includes(answer)) return false;
      await firebaseServerTimeOffsetPromise;
      const resolvedAt = window.getRouteSynchronizedNow();
      const result = await runTransaction(actionConfirmationRef, current => {
        if (!current || String(current.id) !== String(requestId) || current.status !== "pending") return;
        return {
          ...current,
          status: "resolved",
          answer,
          resolvedAt,
          resolvedBy: window.dndFirebase.uid
        };
      });
      return Boolean(result.committed && result.snapshot.exists() &&
        String(result.snapshot.val().id) === String(requestId) &&
        result.snapshot.val().answer === answer &&
        result.snapshot.val().resolvedBy === window.dndFirebase.uid);
    };

    let firstSharedRouteSnapshot = true;
    let lastSharedRouteEventId = null;
    // Firebase может вызвать обработчик несколько раз, пока часы ещё
    // синхронизируются. Сериализуем обработку снимков, чтобы старый снимок
    // не применился поверх более нового после завершения await.
    let sharedRouteSnapshotQueue = Promise.resolve();

    function applySharedRouteData(data) {
      // Синхронизация времени уже завершена обработчиком снимка ниже.
      // Не делаем здесь второй await: он не нужен и усложняет порядок событий.
      if (typeof window.applySynchronizedPartyRoute !== "function") {
        // Модуль Firebase и основной скрипт имеют разные области видимости.
        // Поэтому ожидающие данные храним на window, а не в локальной let.
        window.pendingSharedRouteData = data;
        if (data && data.movement) window.pendingSharedPartyMovement = data.movement;
        return;
      }

      window.applySynchronizedPartyRoute(data);
      if ((Array.isArray(data.intermediateSettlementIds) && data.intermediateSettlementIds.length) || data.destinationSettlementId) {
        waitForRouteRevealThenTraceSettlements(data);

      // маркер в целевой угол и уничтожает саму анимацию.
      const movementToRestore = (data && data.movement) ||
        window.pendingSharedPartyMovement || window.partyPlaybackState;
      if (movementToRestore && typeof window.applyPartyPlaybackState === "function" &&
          Number(movementToRestore.routeStartedAt) === Number(window.routePlaybackRouteStartedAt)) {
        window.applyPartyPlaybackState(movementToRestore);
        window.pendingSharedPartyMovement = null;

      // Даже проверка первого снимка должна использовать уже полученную
      // поправку серверного времени, иначе можно ошибочно отбросить событие.
      await firebaseServerTimeOffsetPromise;

      if (typeof window.applyPartyActionConfirmation === "function") {
        window.applyPartyActionConfirmation(data && data.actionConfirmation ? data.actionConfirmation : null);

      // применяем их до проверки eventId (сам маршрут при этом не переигрываем).
      if (data && data.movement) {

        // обновление во время подключения — его обязательно применяем.
        const eventTimestamp = Number(data.startedAt) > 0
          ? Number(data.startedAt)
          : (data.eventId ? Number(String(data.eventId).split("_")[0]) : NaN);
        const pageStartedAtServer = sharedRoutePageStartedAt + firebaseServerTimeOffset;

          eventTimestamp >= pageStartedAtServer - 1000;

          // по ней вычисляется реальное положение отряда из сохранённого

          // но считаем линию уже полностью раскрытой, чтобы не проигрывать
          // построение заново и не возвращать жетон к стартовым координатам.
          lastSharedRouteEventId = data.eventId || null;

            ...data,
            animationStartIndex: Array.isArray(data.points) ? data.points.length : 0,
            animationStartDistance: Number.POSITIVE_INFINITY,
            restoreStaticSettlementOutlines: true
          });
          return;
        }
      }

      if (!data || !Array.isArray(data.points)) return;

      const eventId = data.eventId ? String(data.eventId) : null;
      if (eventId && eventId === lastSharedRouteEventId) return;
      lastSharedRouteEventId = eventId;

      applySharedRouteData(data);
      }).catch(function(error) {

    window.publishPartyRoute = async function(routeData) {

      const sharedStartedAt = window.getRouteSynchronizedNow() + 800;

        // ещё не создан, создаём его сразу в вычисленной позиции движения.
        const hasMatchingPlaybackRoute = Boolean(

const routePaceLimits = {
  slow: 225,
  normal: 300,
  fast: 375
};

// Настройки передвижения хранятся на конечной точке каждого сегмента.
// Поэтому изменение панели влияет только на новый/текущий предпросмотр,
// но не пересчитывает уже зафиксированные нажатием ЛКМ участки.
function getRouteSegmentPace(point) {
  return point && routePaceLimits[point._routePace]
    ? point._routePace : routePace;
}

function getRouteSegmentSpeedReduced(point) {
  return point && point._routeSpeedReduced !== undefined
    ? Boolean(point._routeSpeedReduced) : routeSpeedReduced;
}

function getRouteSegmentDailyLimit(point) {
  const pace = getRouteSegmentPace(point);
  return routePaceLimits[pace] * (getRouteSegmentSpeedReduced(point) ? 0.5 : 1);
}

function applyRouteTravelSettings(point, pace = routePace, speedReduced = routeSpeedReduced) {
  if (!point) return point;
  point._routePace = routePaceLimits[pace] ? pace : routePace;
  point._routeSpeedReduced = Boolean(speedReduced);
  return point;
}

// Обработчики поселений находятся в отдельном ES-модуле, поэтому функция
// фиксации настроек сегмента должна быть доступна через window.
window.applyRouteTravelSettings = applyRouteTravelSettings;

}

function getRoutePointTravelSettingsSnapshot(point, index) {
  return {
    segmentPace: index > 0 ? getRouteSegmentPace(point) : null,
    segmentSpeedReduced: index > 0 ? getRouteSegmentSpeedReduced(point) : null

}

window.applyPartyActionConfirmation = function(confirmation) {
  if (!confirmation || confirmation.status !== "pending") {
    if (!confirmation || (partyActionConfirmationId && confirmation.id === partyActionConfirmationId)) {
      closePartyActionConfirmation();
    }
    return;
  }

  const createdAt = Number(confirmation.createdAt) || 0;
  const remaining = 120000 - (window.getSynchronizedRouteNow() - createdAt);
  if (!confirmation.id || !["camp", "fire"].includes(confirmation.action) || remaining <= 0) {
    closePartyActionConfirmation();
    return;
  }

  const overlay = ensurePartyActionConfirmationDialog();
  partyActionConfirmationId = String(confirmation.id);
  partyActionConfirmationType = confirmation.action;
  const message = overlay.querySelector("#party-action-confirmation-text");
  message.textContent = confirmation.action === "camp"
    ? "Разбить лагерь здесь?"
    : "Остановиться отдохнуть здесь?";

  overlay.querySelectorAll("button").forEach(button => { button.disabled = false; });
  if (partyActionConfirmationExpiryTimer) clearTimeout(partyActionConfirmationExpiryTimer);
  partyActionConfirmationExpiryTimer = setTimeout(function() {
    if (partyActionConfirmationId === String(confirmation.id)) closePartyActionConfirmation();
  }, remaining);
  syncRouteLaunchControls();
};

async function performPartyRest(action) {
  const state = window.partyPlaybackState;
  if (!state || state.status !== "paused" || !["camp", "fire"].includes(action)) return;
  const hours = action === "camp" ? 8 : 1;
  const currentDistance = Math.max(0, Number(state.startDistance) || 0);
  const campHoursElapsed = Math.max(0, Number(state.campHoursElapsed) || 0) + hours;
  // Фиксируем дневной прогресс ДО добавления новой точки лагеря:
  // он нужен, чтобы сдвинуть будущие границы форсированного марша
  // на расстояние, пройденное от предыдущего привала.
  const elapsedUnitsBeforeCamp = action === "camp"
    ? getRouteElapsedUnitsSinceLastRest(routePoints, currentDistance, routeRestElapsedCarryUnits)
    : 0;

  // Сохраняем состояние на случай, если запись отдыха в Firebase не удастся.
  const previousRestResetDistances = routeRestResetDistances.slice();
  const previousRestElapsedCarryUnits = routeRestElapsedCarryUnits;
  const previousForcedSegments = routeForcedSegments.map(segment => ({ ...segment }));
  const previousForcedMarch = routeForcedMarch;
  const previousForcedMarchPendingExit = routeForcedMarchPendingExit;
  const previousForcedMarchStartDistance = routeForcedMarchStartDistance;
  const previousForcedMarchStartUnits = routeForcedMarchStartUnits;
  const previousForcedMarchEpochStartDistance = routeForcedMarchEpochStartDistance;

  if (action === "camp") {
    // Полноценный лагерь начинает новый игровой день в точке отряда.
    // Нулевая дистанция тоже является полноценной точкой сброса: это важно
    // после входа в редактор, где уже пройденная геометрия обрезана до маркера.
    if (currentDistance > 0.001) {
      routeRestResetDistances = routeRestResetDistances
        .filter(distance => Math.abs(distance - currentDistance) > 0.02);
      routeRestResetDistances.push(currentDistance);
      routeRestResetDistances.sort((a, b) => a - b);
    } else {
      // При нулевой точке отсчёта сбрасываем сохранённый carry-in.
      routeRestElapsedCarryUnits = 0;
    }

    const routeLength = getRouteTravelLength(routePoints);

    // Если лагерь разбит внутри уже завершённого форсированного марша,
    // переносим его остаток целиком вперёд. Сохраняем общую длительность
    // участка (включая накопленное до его начала время), но начинаем её
    // заново от текущего маркера. Благодаря этому сдвигается и конечный
    // жетон обязательного привала, а не только разделитель/крестики.
    let futureForcedSegmentShifted = false;
    routeForcedSegments = routeForcedSegments.map(segment => {
      const distances = getForcedSegmentDistances(segment);
      const containsCampPoint = currentDistance >= distances.start - 0.02 &&
        currentDistance < distances.end - 0.001;
      if (!containsCampPoint) {
        // Если лагерь разбит до начала следующего форсированного участка,
        // его прежняя стартовая точка больше не является дневной границей.
        // Когда до неё от лагеря ещё не набирается полный день, переносим
        // весь форсированный участок к новой дневной границе и сохраняем
        // его исходную продолжительность в игровых днях.
        if (distances.start >= currentDistance - 0.02) {
          const timeToOldForcedStart = getRouteTravelTimeUnitsBetweenDistances(
            routePoints, currentDistance, distances.start
          );
          if (!futureForcedSegmentShifted) {
            futureForcedSegmentShifted = true;
            // После лагеря начало следующего форсированного марша должно
            // совпасть с ближайшей целой дневной границей от новой точки
            // отсчёта. Это работает и когда до старого начала меньше дня,
            // и когда прошло один или несколько полных дней с остатком.
            const nextDailyBoundaryUnits = Math.ceil(timeToOldForcedStart - 0.000001);
            const originalForcedDuration = getRouteTravelTimeUnitsBetweenDistances(
              routePoints, distances.start, distances.end
            );
            // Сдвигаем начало форсированного участка на весь прогресс,
            // который отряд набрал от предыдущего привала до лагеря.
            // Сумма оставшегося пути до старой границы и уже пройденного
            // времени даёт новую позицию той же границы относительно лагеря.
            const shiftedStartUnits = timeToOldForcedStart + elapsedUnitsBeforeCamp;
            const shiftedStart = elapsedUnitsBeforeCamp > 0.000001
              ? getRouteDistanceAtElapsedTime(
                  routePoints, currentDistance, shiftedStartUnits, routeLength
                )
              : distances.start;
            const shiftedEnd = shiftedStart > distances.start + 0.001
              ? getRouteDistanceAtElapsedTime(
                  routePoints, shiftedStart, originalForcedDuration, routeLength
                )
              : distances.end;
            return {
              start: shiftedStart,
              end: Math.max(shiftedStart, shiftedEnd),
              startUnits: 0,
              fixed: true
            };
          }
          return {
            start: distances.start,
            end: distances.end,
            startUnits: 0,
            fixed: true
          };
        }
        return { ...segment };
      }

      const previousReset = routeRestResetDistances
        .filter(distance => distance < currentDistance - 0.02 &&
          distance > distances.start + 0.001)
        .sort((a, b) => b - a)[0];
      const elapsedAnchor = Number.isFinite(previousReset) ? previousReset : distances.start;
      const carryAtAnchor = Number.isFinite(previousReset) ? 0 : distances.startUnits;
      const remainingSegmentUnits = getRouteTravelTimeUnitsBetweenDistances(
        routePoints, elapsedAnchor, distances.end
      );
      const preservedSegmentUnits = carryAtAnchor + remainingSegmentUnits;
      const shiftedEnd = getRouteDistanceAtElapsedTime(
        routePoints, currentDistance, preservedSegmentUnits, routeLength
      );
      return {
        start: currentDistance,
        end: Math.max(currentDistance, shiftedEnd),
        startUnits: 0,
        fixed: true
      };
    });

    // Активный (ещё не завершённый) форсированный марш тоже начинает
    // отсчёт заново от лагеря, не создавая отдельного жетона в этой точке.
    if (routeForcedMarch) {
      if (currentDistance >= routeForcedMarchStartDistance - 0.02) {
        // Лагерь разбит уже внутри активного форсированного марша:
        // его начало переносится прямо в точку отряда.
        routeForcedMarchStartDistance = currentDistance;
        routeForcedMarchEpochStartDistance = currentDistance;
      } else {
        // Лагерь разбит ДО начала активного форсированного марша,
        // который заканчивается конечным флажком, а не жетоном привала.
        // Сдвигаем начало так же, как начало завершённого участка:
        // учитываем и оставшееся время до старой границы, и уже пройденное
        // от предыдущего привала время до лагеря. Конечный флажок остаётся
        // на месте, поэтому меняется только длина оставшегося форсированного
        // отрезка.
        const timeToOldForcedStart = getRouteTravelTimeUnitsBetweenDistances(
          routePoints, currentDistance, routeForcedMarchStartDistance
        );
        const shiftedStartUnits = timeToOldForcedStart + elapsedUnitsBeforeCamp;
        const shiftedStart = elapsedUnitsBeforeCamp > 0.000001
          ? getRouteDistanceAtElapsedTime(
              routePoints, currentDistance, shiftedStartUnits, routeLength
            )
          : routeForcedMarchStartDistance;
        routeForcedMarchStartDistance = Math.max(
          currentDistance, Math.min(routeLength, shiftedStart)
        );
        routeForcedMarchEpochStartDistance = routeForcedMarchStartDistance;
      }

      // Новый лагерь обнуляет дневной carry и для активного участка.
      routeForcedMarchStartUnits = 0;

      // Если новая граница начала оказалась у самого флажка, активного
      // форсированного отрезка больше нет — выключаем его без лишней метки.
      if (routeForcedMarchStartDistance >= routeLength - 0.001) {
        routeForcedMarch = false;
        routeForcedMarchPendingExit = false;
        routeForcedMarchStartDistance = 0;
        routeForcedMarchStartUnits = 0;
        routeForcedMarchEpochStartDistance = 0;
        const forcedButton = document.getElementById("route-forced-march");
        if (forcedButton) {
          forcedButton.classList.remove("active");
          forcedButton.setAttribute("aria-pressed", "false");
        }
      }
    }
  }

  // Короткий отдых у костра только добавляет час. Обязательный привал
  // снимается исключительно полноценным разбитием лагеря.
  const campRequired = action === "camp" ? false : Boolean(state.campRequired);
  const restedState = {
    ...state,
    status: "paused",
    startDistance: currentDistance,
    startedAt: null,
    campRequired,
    campHoursElapsed,
    restResetDistances: routeRestResetDistances.slice()
  };
  window.partyPlaybackState = restedState;
  renderPartyPlaybackState(restedState);
  if (action === "camp" && typeof window.updateRouteLine === "function") {
    window.updateRouteLine(null);
    updatePartyPlaybackRouteTokens(currentDistance);
  }
  try {
    await window.publishPartyPlaybackState({
      status: "paused",
      startDistance: currentDistance,
      startedAt: null,
      routeStartedAt: Number(window.routePlaybackRouteStartedAt) || null,
      campRequired,
      campHoursElapsed,
      restResetDistances: routeRestResetDistances.slice(),
      ...(action === "camp" ? {
        restElapsedCarryUnits: Math.max(0, Number(routeRestElapsedCarryUnits) || 0),
        forcedSegments: routeForcedSegments.map(segment => ({ ...segment })),
        forcedMarchStartDistance: Math.max(0, Number(routeForcedMarchStartDistance) || 0),
        forcedMarchStartUnits: Math.max(0, Number(routeForcedMarchStartUnits) || 0),
        forcedMarchEpochStartDistance: Math.max(0, Number(routeForcedMarchEpochStartDistance) || 0)
      } : {})
    });
  } catch (error) {
    routeRestResetDistances = previousRestResetDistances;
    routeRestElapsedCarryUnits = previousRestElapsedCarryUnits;
    routeForcedSegments = previousForcedSegments;
    routeForcedMarch = previousForcedMarch;
    routeForcedMarchPendingExit = previousForcedMarchPendingExit;
    routeForcedMarchStartDistance = previousForcedMarchStartDistance;
    routeForcedMarchStartUnits = previousForcedMarchStartUnits;
    routeForcedMarchEpochStartDistance = previousForcedMarchEpochStartDistance;
    window.partyPlaybackState = state;
    renderPartyPlaybackState(state);
    if (action === "camp" && typeof window.updateRouteLine === "function") {
      window.updateRouteLine(null);
      updatePartyPlaybackRouteTokens(currentDistance);
    }
    console.error("Не удалось сохранить отдых:", error);
  }
}
let routeStatus = null;
let routeConfirmButton = null;

let lastConfirmedRoutePointSnapshot = [];

let pendingRouteResumeState = null;
let pendingRoutePlaybackResumeDistance = null;
let pendingRoutePlaybackResumeCampRequired = false;
// Контрольная точка, к которой редактор подтвердённого маршрута вернул

// Анимация маршрута. Линия раскрывается последовательно от начала
// нового отрезка к его концу; жетоны синхронизированы с достижением
// пунктиром их позиции. Перерисовка не сбрасывает анимацию.
let routeMarkerAnimations = [];
const routeRevealFadeDuration = 520; // прежняя длительность появления жетонов
const routeLineRevealFadeDuration = 220; // плавное появление отдельного штриха
const routeLineDashLength = 8;
const routeLineDashGap = 10;
const routeLineDashStep = routeLineDashLength + routeLineDashGap;
const routeLineFirstDashDelay = 240; // пауза между первыми штрихами
const routeLineDashAcceleration = 1.5; // ускорение плавнее, чтобы конец маршрута не сливался
const routeLineMinimumDashDelay = 120; // более спокойная максимальная скорость штрихов
let settlementTraceDashInterval = routeLineMinimumDashDelay;

// которые находятся вне блока создания маркера отряда.
window.routeLineDashStep = routeLineDashStep;
window.routeLineRevealFadeDuration = routeLineRevealFadeDuration;
window.routeLineFirstDashDelay = routeLineFirstDashDelay;
window.routeLineDashAcceleration = routeLineDashAcceleration;
window.routeLineMinimumDashDelay = routeLineMinimumDashDelay;
window.settlementTraceDashInterval = settlementTraceDashInterval;

// Средний масштаб карты — опорный для скорости анимации.
// При текущих minZoom=-2 и maxZoom=0 это zoom=-1.
// Штрих имеет постоянный экранный размер, поэтому для одинаковой
// скорости движения по самой карте временной интервал корректируется
// обратно пропорционально масштабу относительно средней точки.
function getRouteZoomProgress() {
  if (!map || typeof map.getZoom !== "function") return 0.5;
  const minZoom = typeof map.getMinZoom === "function" ? map.getMinZoom() : -2;
  const maxZoom = typeof map.getMaxZoom === "function" ? map.getMaxZoom() : 0;
  if (!(maxZoom > minZoom)) return 0.5;
  return Math.max(0, Math.min(1, (map.getZoom() - minZoom) / (maxZoom - minZoom)));
}
window.getRouteZoomProgress = getRouteZoomProgress;

function getRouteZoomSpeedMultiplier() {
  if (!map || typeof map.getZoomScale !== "function") return 1;
  const referenceZoom = (map.getMinZoom() + map.getMaxZoom()) / 2;
  const zoomScale = map.getZoomScale(map.getZoom(), referenceZoom);
  return Number.isFinite(zoomScale) && zoomScale > 0 ? 1 / zoomScale : 1;
}

window.getRouteRevealDurationForCurrentRoute = function(startDistance = 0) {
  if (!Array.isArray(routePoints) || routePoints.length < 2) return 5000;
  const displayPoints = createRouteDisplayPoints(routePoints, []);
  const displayLength = getRouteTravelLength(displayPoints);
  const routeLength = getRouteTravelLength(routePoints);
  const rawStart = Math.max(0, Math.min(routeLength, Number(startDistance) || 0));
  const displayStart = routeLength > 0.001
    ? rawStart / routeLength * displayLength : 0;
  const screenStart = getRouteScreenDistanceAtDistance(displayPoints, displayStart);
  const screenEnd = getRouteScreenDistanceAtDistance(displayPoints, displayLength);
  const screenLength = Math.max(0, screenEnd - screenStart);
  const lineDuration = getRouteLineRevealDuration(screenLength);
  return lineDuration + routeRevealFadeDuration;
};

// Задержка каждого штриха считается от начала линии. С каждым штрихом
// интервал немного сокращается, пока не достигнет безопасного минимума.
// Затем весь интервал нормализуется относительно среднего масштаба.
function getRouteLineRevealDelay(dashIndex) {
  const safeDashIndex = Math.max(0, Number(dashIndex) || 0);
  const wholeDashCount = Math.floor(safeDashIndex);
  const fractionalDash = safeDashIndex - wholeDashCount;
  let delay = 0;
  for (let i = 0; i < wholeDashCount; i++) {
    delay += Math.max(
      routeLineMinimumDashDelay,
      routeLineFirstDashDelay - i * routeLineDashAcceleration
    );
  }
  // На максимальном зуме экранных штрихов больше, чем опорных.
  // Дробная часть не даёт нескольким соседним штрихам получить один
  // и тот же момент появления.
  if (fractionalDash > 0) {
    const nextInterval = Math.max(
      routeLineMinimumDashDelay,
      routeLineFirstDashDelay - wholeDashCount * routeLineDashAcceleration
    );
    delay += nextInterval * fractionalDash;
  }
  return delay;
}

function getRouteLineRevealDuration(screenLength) {
  if (screenLength <= 0) return routeLineRevealFadeDuration;
  // Приводим экранную длину к средней точке зума. Поэтому длительность
  // одного и того же маршрута не меняется при приближении/отдалении.
  const referenceLength = screenLength * getRouteZoomSpeedMultiplier();
  const lastDashIndex = Math.max(0, Math.floor((referenceLength - 2) / routeLineDashStep));
  return getRouteLineRevealDelay(lastDashIndex) + routeLineRevealFadeDuration;
}

  return typeof window.getRouteSynchronizedNow === "function"

// шестерёнки. Возвращаем не обрезанный маршрут, а только контрольную копию

  const animation = routeMarkerAnimations
    .filter(item => item && item.end > item.start + 0.001)
    .sort((a, b) => b.startedAtEpoch - a.startedAtEpoch)[0];
  if (!animation) return null;

  const elapsed = window.getSynchronizedRouteNow() - animation.startedAtEpoch;
  // Снимок полного маршрута создаём ДО проверки elapsed: если редактор
  // открыт в первые 800 мс, pending-состояние всё равно должно содержать

      ? Boolean(saved.segmentSpeedReduced) : routeSpeedReduced;
    return getRouteSegmentPace(current) === savedPace &&
      getRouteSegmentSpeedReduced(current) === savedReduced;
  };
  const projectOnSegment = (point, start, end) => {
    const dx = Number(end.lng) - Number(start.lng);
    const dy = Number(end.lat) - Number(start.lat);
    const lengthSquared = dx * dx + dy * dy;
    if (lengthSquared < 1e-12) {
      return samePoint(point, start) ? { t: 0, error: 0 } : null;
    }
    const px = Number(point.lng) - Number(start.lng);
    const py = Number(point.lat) - Number(start.lat);
    const t = (px * dx + py * dy) / lengthSquared;
    if (t < -parameterTolerance || t > 1 + parameterTolerance) return null;
    const clampedT = Math.max(0, Math.min(1, t));
    const projectedLng = Number(start.lng) + dx * clampedT;
    const projectedLat = Number(start.lat) + dy * clampedT;
    return {
      t: clampedT,
      error: Math.hypot(Number(point.lng) - projectedLng, Number(point.lat) - projectedLat)
    };
  };

  // Первая точка нового маршрута должна совпадать с началом старого.
  if (!samePoint(points[0], savedRoute[0]) || !samePointMetadata(points[0], savedRoute[0], 0)) {
    return 0;
  }

  let commonPointCount = 1;
  let commonDistance = 0;
  let lastOldSegmentIndex = -1;
  let lastOldSegmentT = 0;
  const comparisons = [{
    index: 0,
    old: { lat: Number(savedRoute[0].lat), lng: Number(savedRoute[0].lng), segmentMode: savedRoute[0].segmentMode || "normal", settlementId: savedRoute[0].settlementId || null },
    current: { lat: Number(points[0].lat), lng: Number(points[0].lng), segmentMode: "normal", settlementId: points[0]._routeSettlementId || null },
    samePosition: true,
    sameMetadata: true,
    matchedOldSegment: 0,
    matchedOldSegmentT: 0
  }];

  // Сравниваем не только вершины, но и геометрию сегментов. Редактор может
  // превратить точку привала, лежавшую внутри старого отрезка, в отдельную
  // вершину нового маршрута. Такая точка остаётся общей, даже если в старом
  // routeSnapshot она не была отдельной записью.
  for (let i = 1; i < points.length; i++) {
    const currentStart = points[i - 1];
    const currentEnd = points[i];
    const currentMode = getRouteSegmentMode(currentEnd);
    const currentSettlementId = currentEnd._routeSettlementId || null;
    let match = null;

    const firstCandidateSegment = Math.max(0, lastOldSegmentIndex);
    const lastCandidateSegment = Math.min(savedRoute.length - 2, lastOldSegmentIndex + 1);
    for (let j = firstCandidateSegment; j <= lastCandidateSegment; j++) {
      const oldStart = savedRoute[j];
      const oldEnd = savedRoute[j + 1];
      const oldMode = oldEnd.segmentMode || "normal";
      const oldPace = oldEnd.segmentPace || routePace;
      const oldReduced = oldEnd.segmentSpeedReduced !== undefined
        ? Boolean(oldEnd.segmentSpeedReduced) : routeSpeedReduced;
      if (currentMode !== oldMode ||
          getRouteSegmentPace(currentEnd) !== oldPace ||
          getRouteSegmentSpeedReduced(currentEnd) !== oldReduced) continue;

      const startProjection = projectOnSegment(currentStart, oldStart, oldEnd);
      const endProjection = projectOnSegment(currentEnd, oldStart, oldEnd);
      if (!startProjection || !endProjection ||
          startProjection.error > positionTolerance || endProjection.error > positionTolerance ||
          endProjection.t < startProjection.t - parameterTolerance) continue;

      // При переходе на следующий старый сегмент начало нового отрезка
      // обязано находиться ровно в общей старой вершине.
      if (j > lastOldSegmentIndex &&
          (lastOldSegmentIndex >= 0 && lastOldSegmentT < 1 - parameterTolerance ||
           startProjection.t > parameterTolerance)) continue;
      if (j === lastOldSegmentIndex &&
          startProjection.t < lastOldSegmentT - parameterTolerance) continue;

      const endsAtOldVertex = endProjection.t >= 1 - parameterTolerance;
      const settlementMatches = endsAtOldVertex
        ? String(currentSettlementId || "") === String(oldEnd.settlementId || "")
        : !currentSettlementId;
      if (!settlementMatches) continue;

      match = { oldSegmentIndex: j, startT: startProjection.t, endT: endProjection.t };
      break;
    }

    if (!match) {
      comparisons.push({
        index: i,
        current: { lat: Number(currentEnd.lat), lng: Number(currentEnd.lng), segmentMode: currentMode, settlementId: currentSettlementId },
        matchedOldSegment: null,
        sameGeometry: false
      });
      break;
    }

    lastOldSegmentIndex = match.oldSegmentIndex;
    lastOldSegmentT = match.endT;
    commonPointCount++;
    commonDistance = getRouteTravelLength(points.slice(0, i + 1));
    comparisons.push({
      index: i,
      oldSegment: match.oldSegmentIndex,
      oldSegmentStartT: match.startT,
      oldSegmentEndT: match.endT,
      current: { lat: Number(currentEnd.lat), lng: Number(currentEnd.lng), segmentMode: currentMode, settlementId: currentSettlementId },
      sameGeometry: true
    });
  }

  const resumeDistance = Math.min(progressDistance, commonDistance);
  return resumeDistance;
}

function beginRouteMarkerAnimation(startDistance, endDistance, sharedStartedAt, sharedDuration) {
  const length = endDistance - startDistance;
  if (length < 0.001) return;

  const routeTotalLength = getRouteTravelLength(routePoints);
  const displayPoints = createRouteDisplayPoints(routePoints, []);
  const displayTotalLength = getRouteTravelLength(displayPoints);
  const displayStart = routeTotalLength > 0.001
    ? startDistance / routeTotalLength * displayTotalLength : 0;
  const displayEnd = routeTotalLength > 0.001
    ? endDistance / routeTotalLength * displayTotalLength : displayTotalLength;
  const lineStartScreen = getRouteScreenDistanceAtDistance(displayPoints, displayStart);
  const lineEndScreen = getRouteScreenDistanceAtDistance(displayPoints, displayEnd);
  const lineScreenLength = Math.max(0, lineEndScreen - lineStartScreen);
  const referenceLength = lineScreenLength * getRouteZoomSpeedMultiplier();
  const referenceLastDashIndex = Math.max(
    0, Math.floor((referenceLength - 2) / routeLineDashStep)
  );
  const lineRevealDuration = getRouteLineRevealDelay(referenceLastDashIndex) + routeLineRevealFadeDuration;
  // Общая длительность приходит от инициатора. На другом устройстве
  // экранная геометрия может отличаться на доли пикселя (особенно после
  // округления Leaflet), поэтому не позволяем локальному последнему штриху
  // оказаться за пределами общего таймера завершения.
  const locallyRequiredDuration = lineRevealDuration + routeRevealFadeDuration;
  const duration = Number(sharedDuration) > 0
    ? Math.max(Number(sharedDuration), locallyRequiredDuration)
    : locallyRequiredDuration;
  const startedAtEpoch = Number(sharedStartedAt) > 0
    ? Number(sharedStartedAt) : window.getSynchronizedRouteNow() + 500;

  const animation = {
    start: startDistance,
    end: endDistance,
    routeTotalLength,
    displayTotalLength,
    displayPoints,
    lineStartScreen,
    lineEndScreen,
    referenceLastDashIndex,
    startedAtEpoch,
    // Сохраняем исходную длительность, полученную от инициатора:
    // локальная геометрия может потребовать её немного увеличить.
    sharedDuration: Number(sharedDuration) > 0 ? Number(sharedDuration) : 0,
    duration,
    timer: null
  };

  const elapsed = window.getSynchronizedRouteNow() - startedAtEpoch;
  // Если событие пришло уже после завершения, показываем готовый маршрут,
  // а не запускаем устаревшую анимацию с нуля.
  if (elapsed >= duration) {
    return;
  }

  routeMarkerAnimations.push(animation);
  syncRouteLaunchControls();
  animation.timer = setTimeout(function() {
    routeMarkerAnimations = routeMarkerAnimations.filter(item => item !== animation);
    syncRouteLaunchControls();
    updateRouteLine(lastCursorPosition);
  }, Math.max(0, duration - elapsed));
}

// Firebase-модуль использует этот метод, чтобы дождаться окончания
// общей анимации маршрута перед обводкой конечного поселения.
window.isRouteRevealRunning = function() {
  return routeMarkerAnimations.length > 0;
};

// На первом этапе управления блокируем запуск движения, пока всем клиентам
// ещё показывается анимация построения линии маршрута.
function syncRouteLaunchControls() {
  if (!routeLaunchPanel) return;
  const state = window.partyPlaybackState;
  const animationRunning = routeMarkerAnimations.length > 0;
  const playing = Boolean(state && state.status === "playing");
  const paused = Boolean(state && state.status === "paused");
  const campRequired = Boolean(state && state.campRequired);
  const terminalCityPaused = isTerminalSettlementPaused(state);
  const routeTotal = Array.isArray(routePoints) && routePoints.length >= 2
    ? getRouteTravelLength(routePoints) : 0;
  const reachedRouteEnd = Boolean(state && state.status === "paused" && routeTotal > 0.001 &&
    Number(state.startDistance) >= routeTotal - 0.001);
  const playUnavailable = animationRunning || playing || campRequired || terminalCityPaused || reachedRouteEnd;
  const playButton = routeLaunchPanel.querySelector("#route-party-play");
  const editButton = routeLaunchPanel.querySelector("#route-party-edit");
  const campButton = routeLaunchPanel.querySelector("#route-party-camp");
  const shortRestButton = routeLaunchPanel.querySelector("#route-party-short-rest");
  const safetySlider = routeLaunchPanel.querySelector("#route-party-camp-safety-slider");
  if (playButton) {
    playButton.disabled = playUnavailable;
    playButton.classList.toggle("disabled", playUnavailable);
    playButton.setAttribute("aria-disabled", playUnavailable ? "true" : "false");
  }
  // Во время раскрытия маршрута все действия, кроме кнопки паузы,
  // заблокированы до полного завершения анимации.
  if (editButton) editButton.disabled = animationRunning || playing || terminalCityPaused;
  const confirmationOpen = Boolean(partyActionConfirmationId || partyActionConfirmationSubmitting);
  if (campButton) campButton.disabled = animationRunning || !paused || confirmationOpen;
  if (shortRestButton) shortRestButton.disabled = animationRunning || !paused || confirmationOpen;
  if (safetySlider) safetySlider.disabled = animationRunning || !paused;
}

// При зуме меняется только экранная геометрия штрихов. Общие время старта,
// длительность и текущий прогресс остаются неизменными для всех клиентов.
function rebaseRouteMarkerAnimationsForZoom() {
  routeMarkerAnimations.forEach(animation => {
    const displayStart = animation.routeTotalLength > 0.001
      ? animation.start / animation.routeTotalLength * animation.displayTotalLength : 0;
    const displayEnd = animation.routeTotalLength > 0.001
      ? animation.end / animation.routeTotalLength * animation.displayTotalLength
      : animation.displayTotalLength;
    animation.lineStartScreen = getRouteScreenDistanceAtDistance(
      animation.displayPoints, displayStart
    );
    animation.lineEndScreen = getRouteScreenDistanceAtDistance(
      animation.displayPoints, displayEnd
    );
  });
}

function getRouteMarkerAnimation(distance) {
  const now = window.getSynchronizedRouteNow();
  let matchingAnimation = null;

  routeMarkerAnimations.forEach(animation => {
    const elapsed = now - animation.startedAtEpoch;
    const isInsideRange =
      distance > animation.start + 0.05 &&
      distance <= animation.end + 0.01;

    if (
      isInsideRange && elapsed < animation.duration &&
      (!matchingAnimation || animation.startedAtEpoch > matchingAnimation.startedAtEpoch)
    ) {
      matchingAnimation = animation;
    }
  });

  return matchingAnimation;
}

function shouldAnimateRouteMarker(distance) {
  return Boolean(getRouteMarkerAnimation(distance));
}

// Возвращает задержку до появления жетона. Он начинает проявляться
// только после того, как пунктир дошёл до соответствующей позиции.
// Рассчитывает время внутри текущего участка маршрута. Каждая завершённая
// городская обводка начинает новую временную шкалу: следующий участок снова
// отсчитывает штрихи от нуля, не наследуя накопленный индекс предыдущего.
function getRouteAnimationRevealTime(animation, screenProgress) {
  if (!animation) return 0;

  const progress = Math.max(0, Math.min(1, Number(screenProgress) || 0));
  const pauses = Array.isArray(animation.settlementPauses)
    ? animation.settlementPauses : [];
  let segmentStart = 0;
  let elapsedOffset = 0;
  let acceleratedRevealTime = null;

  pauses.forEach(pause => {
    const boundaryProgress = Math.max(
      segmentStart,
      Math.min(1, Number(pause.progress) || 0)
    );
    const resumeProgress = Math.max(
      boundaryProgress,
      Math.min(1, Number(pause.resumeProgress ?? boundaryProgress) || boundaryProgress)
    );
    const acceleratedStartProgress = Number(pause.acceleratedStartProgress);
    const transitSpeedMultiplier = Math.max(1, Number(pause.transitSpeedMultiplier) || 1);
    const hasAcceleratedTransit = Number.isFinite(acceleratedStartProgress) &&
      acceleratedStartProgress < boundaryProgress - 0.0001 && transitSpeedMultiplier > 1;

    // Внутри видимого контура ускоряем только скрытые транзитные штрихи.
    // За пределами этого интервала используется обычный темп маршрута.
    if (progress <= boundaryProgress + 0.0001) {
      if (hasAcceleratedTransit && progress > acceleratedStartProgress) {
        const startDashIndex = Math.max(
          0, (acceleratedStartProgress - segmentStart) * animation.referenceLastDashIndex
        );
        const currentDashIndex = Math.max(
          startDashIndex, (progress - segmentStart) * animation.referenceLastDashIndex
        );
        const startDelay = getRouteLineRevealDelay(startDashIndex);
        const currentDelay = getRouteLineRevealDelay(currentDashIndex);
        acceleratedRevealTime = elapsedOffset + startDelay +
          (currentDelay - startDelay) / transitSpeedMultiplier;
      }
      return;
    }

    // Время завершения участка опирается на тот же дискретный штрих,
    // который использует getRouteBoundaryArrivalDelay. Для скрытого
    // прохода учитываем ускоренную, а не исходную длительность.
    const boundaryDashProgress = Math.max(
      segmentStart,
      Math.min(boundaryProgress, Number(pause.boundaryDashProgress ?? boundaryProgress) || 0)
    );
    const completedSegmentDashIndex = Math.max(
      0, (boundaryDashProgress - segmentStart) * animation.referenceLastDashIndex
    );
    let completedSegmentDelay = getRouteLineRevealDelay(completedSegmentDashIndex);
    if (hasAcceleratedTransit) {
      const startDashIndex = Math.max(
        0, (acceleratedStartProgress - segmentStart) * animation.referenceLastDashIndex
      );
      const startDelay = getRouteLineRevealDelay(startDashIndex);
      completedSegmentDelay = startDelay +
        (completedSegmentDelay - startDelay) / transitSpeedMultiplier;
    }
    elapsedOffset += completedSegmentDelay +
      routeLineRevealFadeDuration + Math.max(0, Number(pause.duration) || 0);
    segmentStart = resumeProgress;
  });

  if (acceleratedRevealTime !== null) return acceleratedRevealTime;

  const localDashIndex = Math.max(
    0, (progress - segmentStart) * animation.referenceLastDashIndex
  );
  return elapsedOffset + getRouteLineRevealDelay(localDashIndex);
}

function getRouteAnimationScreenDistance(animation, distance) {
  if (!animation) return 0;
  const displayDistance = animation.routeTotalLength > 0.001
    ? Math.max(0, Math.min(animation.displayTotalLength,
        distance / animation.routeTotalLength * animation.displayTotalLength))
    : 0;
  return getRouteScreenDistanceAtDistance(animation.displayPoints, displayDistance);
}

function getRouteAnimationScreenProgress(animation, distance) {
  if (!animation) return 0;
  const screenDistance = getRouteAnimationScreenDistance(animation, distance);
  const screenRange = Math.max(0.001, animation.lineEndScreen - animation.lineStartScreen);
  return Math.max(0, Math.min(1,
    (screenDistance - animation.lineStartScreen) / screenRange
  ));
}

// Возвращает прогресс именно того экранного штриха, который должен
// достичь жетона. Если жетон попал в промежуток между штрихами,
// используем следующий штрих, а не предыдущий.
function getRouteAnimationDashProgressAtDistance(
  animation,
  distance,
  nextAfterBoundary = false,
  forBoundaryArrival = false
) {
  if (!animation) return 0;
  const screenRange = Math.max(0.001, animation.lineEndScreen - animation.lineStartScreen);
  const relativeDistance = Math.max(0,
    Math.min(screenRange, getRouteAnimationScreenDistance(animation, distance) - animation.lineStartScreen)
  );
  let dashIndex = Math.floor(relativeDistance / routeLineDashStep);
  const offsetInStep = relativeDistance - dashIndex * routeLineDashStep;

  if (nextAfterBoundary) {
    // Город завершает текущий штрих. Следующий участок начинается
    // с первого нового штриха строго после точки входа.
    dashIndex += 1;
  } else if (!forBoundaryArrival && offsetInStep > routeLineDashLength + 0.001) {
    // Жетон в промежутке: ждём ближайший штрих впереди него.
    // Для границы города это правило не подходит: следующий штрих уже
    // может находиться за городом и не входит в участок до обводки.
    dashIndex += 1;
  }

  let actualLastDashIndex = Math.max(
    0, Math.floor((screenRange - 0.01) / routeLineDashStep)
  );
  if (screenRange - actualLastDashIndex * routeLineDashStep < 0.5) {
    actualLastDashIndex = Math.max(0, actualLastDashIndex - 1);
  }
  dashIndex = Math.max(0, Math.min(actualLastDashIndex, dashIndex));
  return Math.max(0, Math.min(1, dashIndex * routeLineDashStep / screenRange));
}

// Момент, когда линия полностью дошла до точки: нужен для запуска
// городской обводки. В отличие от жетонов, здесь нет опережающего появления.
function getRouteBoundaryArrivalDelay(distance) {
  const animation = getRouteMarkerAnimation(distance);
  if (!animation) return null;
  // Город должен ждать тот же реальный экранный штрих, которого ждут жетоны.
  // Непрерывный progress мог запускать обводку раньше времени, если граница
  // попадала в промежуток между штрихами пунктира.
  const dashProgress = getRouteAnimationDashProgressAtDistance(
    animation, distance, false, true
  );
  const arrivalTime = getRouteAnimationRevealTime(animation, dashProgress) +
    routeLineRevealFadeDuration;
  return arrivalTime - (window.getSynchronizedRouteNow() - animation.startedAtEpoch);
}
window.getRouteBoundaryArrivalDelay = getRouteBoundaryArrivalDelay;

function getRouteMarkerAnimationDelay(distance) {
  const animation = getRouteMarkerAnimation(distance);
  if (!animation) return null;
  // Используем тот же индекс реального экранного штриха, который
  // рассчитывает drawRoutePiece. Не округляем долю всего маршрута.
  const dashProgress = getRouteAnimationDashProgressAtDistance(animation, distance, false);
  const lineRevealTime = getRouteAnimationRevealTime(animation, dashProgress);
  const elapsed = window.getSynchronizedRouteNow() - animation.startedAtEpoch;

  // Жетоны используют ту же временную шкалу штрихов, что и линия.
  // Сохраняем прежнее небольшое опережение на 25 мс и не добавляем
  // отдельную задержку после поселений: она заставляла жетоны отставать
  // от уже проявившейся линии.
  return lineRevealTime - 25 - elapsed;
}

// Добавляет остановки общей шкалы анимации на выходах из поселений.
// Внутренние скрытые участки успевают пройти параллельно сухой кисти.
function refreshRouteAnimationTiming(animation) {
  if (!animation) return;

  const lineScreenLength = Math.max(0, animation.lineEndScreen - animation.lineStartScreen);
  const referenceLength = lineScreenLength * getRouteZoomSpeedMultiplier();
  animation.referenceLastDashIndex = Math.max(
    0, Math.floor((referenceLength - 2) / routeLineDashStep)
  );

  const pauses = Array.isArray(animation.settlementPauses)
    ? animation.settlementPauses : [];
  pauses.forEach(pause => {
    if (Number.isFinite(Number(pause.distance))) {
      pause.progress = getRouteAnimationScreenProgress(animation, Number(pause.distance));
      // Граница завершает последний штрих ДО поселения, а следующий
      // участок начинается с первого штриха ПОСЛЕ него. Оба значения
      // рассчитываются по той же экранной сетке, что и drawRoutePiece.
      pause.boundaryDashProgress = getRouteAnimationDashProgressAtDistance(
        animation, Number(pause.distance), false, true
      );
      pause.resumeProgress = getRouteAnimationDashProgressAtDistance(
        animation, Number(pause.distance), true
      );
    }
  });
  pauses.sort((a, b) => a.progress - b.progress);

  const lineRevealDuration = getRouteLineRevealDelay(animation.referenceLastDashIndex) +
    routeLineRevealFadeDuration;
  const locallyRequiredDuration = lineRevealDuration + routeRevealFadeDuration;
  const baseDuration = Math.max(Number(animation.sharedDuration) || 0, locallyRequiredDuration);
  animation.duration = baseDuration;

  if (pauses.length) {
    const totalPause = pauses.reduce((sum, pause) =>
      sum + Math.max(0, Number(pause.duration) || 0), 0
    );
    const segmentedDuration = getRouteAnimationRevealTime(animation, 1) +
      routeLineRevealFadeDuration * 2;
    animation.duration = Math.max(baseDuration + totalPause, segmentedDuration);
  }

  const elapsed = window.getSynchronizedRouteNow() - animation.startedAtEpoch;
  if (elapsed >= animation.duration) return;
  if (animation.timer) clearTimeout(animation.timer);
  animation.timer = setTimeout(function() {
    routeMarkerAnimations = routeMarkerAnimations.filter(item => item !== animation);
    // После уточнения геометрии таймер завершения может быть переустановлен.
    // Синхронизируем кнопку и в этом пути завершения анимации.
    syncRouteLaunchControls();
    updateRouteLine(lastCursorPosition);
  }, Math.max(0, animation.duration - elapsed));
}

// После построения общей геометрии синхронизируем с ней временную шкалу.
// Это важно: сама линия использует protectedDistances (привалы, границы
// местности и маркеры), а прежняя шкала жетонов строила сглаженную копию
// маршрута без этих ограничений. На длинных маршрутах расхождение копилось.
function syncRouteAnimationGeometry(displayPoints, routeLength, displayLength) {
  if (!Array.isArray(displayPoints) || displayPoints.length < 2) return;
  routeMarkerAnimations.forEach(animation => {
    if (Math.abs(animation.routeTotalLength - routeLength) > 0.01) return;

    animation.displayPoints = displayPoints;
    animation.displayTotalLength = displayLength;
    const displayStart = animation.routeTotalLength > 0.001
      ? animation.start / animation.routeTotalLength * displayLength : 0;
    const displayEnd = animation.routeTotalLength > 0.001
      ? animation.end / animation.routeTotalLength * displayLength : displayLength;
    animation.lineStartScreen = getRouteScreenDistanceAtDistance(displayPoints, displayStart);
    animation.lineEndScreen = getRouteScreenDistanceAtDistance(displayPoints, displayEnd);
    refreshRouteAnimationTiming(animation);
  });
}

window.setRouteSettlementAnimationPauses = function(checkpoints) {
  const animation = routeMarkerAnimations[routeMarkerAnimations.length - 1];
  if (!animation) return;

  // Сначала упорядочиваем поселения по маршруту. Важно считать скрытый
  // транзит относительно начала ТЕКУЩЕГО участка, а не от начала всего
  // маршрута: после каждого города шкала штрихов начинается заново.
  const orderedCheckpoints = (Array.isArray(checkpoints) ? checkpoints : [])
    .map(item => ({ ...item, distance: Number(item.distance) }))
    .sort((a, b) => a.distance - b.distance);

  let segmentStart = 0;
  animation.settlementPauses = orderedCheckpoints.map(item => {
    const distance = item.distance;
    const boundaryDashProgress = getRouteAnimationDashProgressAtDistance(
      animation, distance, false, true
    );
    const startDistance = Number(item.startDistance);
    let transitDuration = 0;
    let acceleratedStartProgress = null;
    const transitSpeedMultiplier = 2.5;

    // Ускоряем только скрытый участок от входа до выхода из текущего
    // поселения. Индексы обязательно локальные: предыдущие города уже
    // сбросили шкалу и не должны влиять на длительность этого транзита.
    if (Number.isFinite(startDistance) && distance > startDistance + 0.001) {
      acceleratedStartProgress = Math.max(
        segmentStart,
        getRouteAnimationDashProgressAtDistance(animation, startDistance, false, true)
      );
      const startDashIndex = Math.max(
        0, (acceleratedStartProgress - segmentStart) * animation.referenceLastDashIndex
      );
      const endDashIndex = Math.max(
        startDashIndex,
        (boundaryDashProgress - segmentStart) * animation.referenceLastDashIndex
      );
      const normalTransitDuration = Math.max(0,
        getRouteLineRevealDelay(endDashIndex) - getRouteLineRevealDelay(startDashIndex)
      );
      transitDuration = normalTransitDuration / transitSpeedMultiplier;
    }

    const resumeProgress = getRouteAnimationDashProgressAtDistance(
      animation, distance, true
    );
    const pause = {
      distance,
      progress: getRouteAnimationScreenProgress(animation, distance),
      boundaryDashProgress,
      acceleratedStartProgress,
      transitSpeedMultiplier,
      resumeProgress,
      duration: Math.max(0, (Number(item.duration) || 0) - transitDuration),
      areaId: item.areaId
    };
    segmentStart = Math.max(segmentStart, resumeProgress);
    return pause;
  });
  refreshRouteAnimationTiming(animation);
};

// Firebase-модуль находится в отдельном script type="module" и не видит
// локальные функции обычного script. Публикуем узкий мост для расчёта
// момента появления жетонов и синхронного запуска обводки поселения.
window.getRouteMarkerAnimationDelay = getRouteMarkerAnimationDelay;

// Запускаем появление жетона только после того, как Leaflet добавил его в DOM.
// Это надёжнее CSS animation-delay, назначаемого уже созданному SVG-маркеру
// на мобильных браузерах. Отрицательная задержка сохраняет общую синхронизацию.
function animateRouteToken(marker, delay, innerSelector = null) {
  if (!marker || delay === null || !Number.isFinite(Number(delay))) return;
  const duration = routeRevealFadeDuration;
  const effectiveDelay = Number(delay);
  if (effectiveDelay <= -duration) return;
  const root = typeof marker.getElement === "function" ? marker.getElement() : null;
  if (!root) return;
  const target = innerSelector ? root.querySelector(innerSelector) : root;
  if (!target || typeof target.animate !== "function") return;
  target.animate(
    [{ opacity: 0 }, { opacity: 1 }],
    { duration, delay: effectiveDelay, easing: "ease-out", fill: "both" }
  );
}

  return window.matchMedia("(max-height: 600px) and (orientation: landscape) and (pointer: coarse)").matches;

function syncRoutePanelOrientation() {
  if (!routePanel || routePanel.style.display === "none") return;
  routePanel.style.display = isCompactRoutePanelLandscape() ? "grid" : "block";

    const total = getRouteTravelLength(routePoints);

        startedAt: window.getSynchronizedRouteNow(),

  editButton.addEventListener("click", function() {
    if (window.partyPlaybackState && window.partyPlaybackState.status === "playing") return;
    // Завершённые обводки сохраняются при входе в редактор.
    // Повторное подтверждение неизменённого маршрута оставляет контур статичным.

    // Запоминаем реальную точку завершённых штрихов до остановки таймера.
    // Полный маршрут при возврате в редактор по-прежнему отрисуется статично.
    pendingRouteResumeState = captureRouteRevealProgressForEditing();
    // Отдельно сохраняем положение отряда. Прогресс движения нельзя брать
    // из анимации раскрытия линии: это две независимые временные шкалы.
    pendingRoutePlaybackResumeDistance = window.partyPlaybackState
      ? window.getPartyPlaybackDistance(window.partyPlaybackState, window.getSynchronizedRouteNow())
      : 0;
    // Редактор открывается от текущего положения отряда, а не от исходного
    // старта путешествия: вся уже пройденная геометрия удаляется из редактора.
    const originalRouteLength = getRouteTravelLength(routePoints);
    const editOriginDistance = Math.max(0, Math.min(
      originalRouteLength, pendingRoutePlaybackResumeDistance
    ));
    if (editOriginDistance > 0.001) {
      routeRestElapsedCarryUnits = getRouteElapsedUnitsSinceLastRest(
        routePoints, editOriginDistance, routeRestElapsedCarryUnits
      );

      // До обрезки сохраняем уже пройденное время внутри каждого форсированного
      // участка. После переноса начала маршрута к маркеру оно становится
      // начальным накопленным временем нового локального участка.
      const adjustedForcedSegments = routeForcedSegments.map(segment => {
        const distances = getForcedSegmentDistances(segment);
        const elapsedBeforeMarker = editOriginDistance > distances.start
          ? getRouteTravelTimeUnitsBetweenDistances(
              routePoints,
              distances.start,
              Math.min(editOriginDistance, distances.end)
            )
          : 0;
        const markerInsideSegment = editOriginDistance >= distances.start - 0.001 &&
          editOriginDistance < distances.end - 0.001;
        return {
          start: Math.max(0, distances.start - editOriginDistance),
          end: distances.end - editOriginDistance,
          startUnits: markerInsideSegment
            ? routeRestElapsedCarryUnits
            : distances.startUnits + elapsedBeforeMarker,
          fixed: true
        };
      }).filter(segment => segment.end > 0.001);

      // Аналогично переносим накопленное время активного форсированного марша.
      if (routeForcedMarch && editOriginDistance > routeForcedMarchStartDistance) {
        routeForcedMarchStartUnits = routeRestElapsedCarryUnits;
      }

      routePoints = getRoutePointsBetweenDistances(
        routePoints, editOriginDistance, originalRouteLength
      );
      // В новой геометрии начало пути — сам отряд, поэтому его дистанция 0.
      pendingRoutePlaybackResumeDistance = 0;
      routeForcedMarchStartDistance = Math.max(0, routeForcedMarchStartDistance - editOriginDistance);
      routeForcedMarchEpochStartDistance = Math.max(0, routeForcedMarchEpochStartDistance - editOriginDistance);
      routeForcedSegments = adjustedForcedSegments;
      routeRestResetDistances = routeRestResetDistances
        .map(distance => distance - editOriginDistance)
        .filter(distance => distance > 0.001);
      lastConfirmedRoutePointSnapshot = routePoints.map((point, index) => ({
        lat: Number(point.lat), lng: Number(point.lng),
        segmentMode: index > 0 ? getRouteSegmentMode(point) : "normal",
        settlementId: point._routeSettlementId || null,
        ...getRoutePointTravelSettingsSnapshot(point, index)
      }));
      // Пройденный участок уже не является частью редактируемого маршрута.
      pendingRouteResumeState = null;
    }
    // В редакторе текущая позиция отряда становится нулевой точкой новой
    // геометрии. Не оставляем старую абсолютную дистанцию в playback state:
    // zoomend и функции обрезки линии иначе применят её к уже укороченному
    // маршруту, из-за чего исчезают участки предпросмотра и скачет маркер.
    partyPlaybackDistance = 0;
    if (window.partyPlaybackState) {
      window.partyPlaybackState = {
        ...window.partyPlaybackState,
        status: "paused",
        startDistance: 0,
        startedAt: null
      };
    }
    // Принудительный привал сохраняется, даже если маршрут редактируют.
    pendingRoutePlaybackResumeCampRequired = Boolean(
      window.partyPlaybackState && window.partyPlaybackState.campRequired
    );
    // Останавливаем раскрытие линии и удаляем её временные штрихи.
    // Повторная отрисовка без активных анимаций вернёт полный маршрут
    // в точности в статичном виде, пригодном для дальнейшего редактирования.
    stopRouteMarkerAnimation();
    if (typeof window.cancelPendingRouteSettlementTraces === "function") {
      window.cancelPendingRouteSettlementTraces();
    }
    if (typeof window.cancelActiveRouteSettlementAnimations === "function") {
      window.cancelActiveRouteSettlementAnimations();
    }
    window.routeAnimationPublished = false;
    window.routePendingConfirmation = false;
    window.routeMode = true;
    routeFinished = true;
    // После возврата из панели подтверждения конечный флажок/город остаётся
    // зафиксированной точкой. Карта не принимает новые точки маршрута, пока
    // игрок явно не нажмёт «Вернуть» или «Отменить».
    window.routeEditingConfirmedRoute = false;
    lastCursorPosition = null;
    map.doubleClickZoom.disable();

    routeLaunchPanel.style.display = "none";
    createRoutePanel();
    routePanel.style.display = isCompactRoutePanelLandscape() ? "grid" : "block";
    updateRouteTravelSettingsControls();
    routePanel.querySelectorAll(".route-speed").forEach(button => {
      button.classList.toggle("active", button.dataset.pace === routePace);
    });
    const reducedButton = document.getElementById("route-reduced-speed");
    if (reducedButton) {
      reducedButton.classList.toggle("active", routeSpeedReduced);
      reducedButton.setAttribute("aria-pressed", routeSpeedReduced ? "true" : "false");
    }

    const forcedButton = document.getElementById("route-forced-march");
    if (forcedButton) {
      forcedButton.disabled = false;
      forcedButton.classList.toggle("active", routeForcedMarch);
      forcedButton.setAttribute("aria-pressed", routeForcedMarch ? "true" : "false");
    }
    refreshRouteIntermediateCityOutlines();
    updateRouteLine();
    // Маркер фиксируется на начале новой геометрии ещё до подтверждения.
    if (partyMarker && routePoints.length >= 2) {
      partyMarker.setLatLng(routePoints[0]);
      window.setPartyMarkerPlaybackPosition(routePoints[0]);
    }
    if (window.routeDestinationCityId && window.showSettlementOutline) {
      const destinationArea = (window.settlementAreas || []).find(area =>
        String(area.id) === String(window.routeDestinationCityId)
      );
      if (destinationArea) window.showSettlementOutline(destinationArea, 1);
    }
    // При возврате в редактор маршрут перерисовывается заново.
    // Повторно накладываем маски всех промежуточных городов: иначе
    // сохранённые транзитные сегменты могут стать видимыми внутри кисти,
    // особенно когда конечная точка маршрута совпадает с городом.
    if (window.hideRouteDashesInsideSettlement) {
      const intermediateIds = Array.isArray(window.routeIntermediateCityIds)
        ? window.routeIntermediateCityIds : [];
      intermediateIds.forEach(id => {
        const area = (window.settlementAreas || []).find(item => String(item.id) === String(id));
        if (area) window.hideRouteDashesInsideSettlement(area, true);
      });
    }
  });
