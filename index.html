<script>

var currentLatLng = null;
var editId = null;
var popupJustClosed = false;
var icons = {
  camp: L.icon({
    iconUrl: 'camp.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  cave: L.icon({
    iconUrl: 'cave.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  note: L.icon({
    iconUrl: 'note.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  interest: L.icon({
    iconUrl: 'interest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  quest: L.icon({
    iconUrl: 'quest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  })
};

// размеры твоей карты (пока оставим так)
var width = 7016;
var height = 4960;

// создаём карту
var bounds = [[0,0], [height, width]];

var map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 0,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0,
  attributionControl: false,
});

// загружаем картинку
var imageUrl = 'map.jpg';

var bounds = [[0,0], [height, width]];
var overlay = L.imageOverlay(imageUrl, bounds).addTo(map);

map.fitBounds(bounds, {
  padding: [0, 0],
  animate: false
});

map.setMaxBounds(bounds);
map.panInsideBounds(bounds, { animate: false });

map.on('popupclose', function() {
  popupJustClosed = true;

  setTimeout(function() {
    popupJustClosed = false;
  }, 100);
});

function updateFrame() {
  var mapEl = document.getElementById('map');
  var wrapper = document.getElementById('map-wrapper');

  if (map.getZoom() === map.getMinZoom()) {
    // минимальный зум
    wrapper.classList.remove("zoomed");
    mapEl.classList.remove("zoomed");

    map.dragging.disable(); // ← блокируем

  } else {
    // зум есть
    wrapper.classList.add("zoomed");
    mapEl.classList.add("zoomed");

    map.dragging.enable(); // ← ВОТ ЭТО ВАЖНО
  }
}

updateFrame();
map.on('zoomend', updateFrame);

// --- ЗАГРУЗКА СОХРАНЁННЫХ МЕТОК ---
var savedMarkers = JSON.parse(localStorage.getItem("markers") || "[]");

savedMarkers.forEach(function(m) {
  addMarker(m);
});

function addMarker(data) {
  var marker = L.marker(
  [data.lat, data.lng],
  { icon: icons[data.type || "note"] }
).addTo(map);

function renderPopup() {
  return `
    <div class="marker-popup">
      <div class="marker-title">${data.title}</div>
      <div class="marker-desc">${data.description}</div>

      <div class="marker-buttons">
        <button onclick="editMarker(${data.id})">✏️</button>
        <button onclick="deleteMarker(${data.id})">🗑</button>
      </div>
    </div>
  `;
}

  marker.bindPopup(renderPopup());

  marker._customId = data.id;
}

// --- ДОБАВЛЕНИЕ МЕТКИ ПО КЛИКУ ---
map.on('click', function(e) {
  if (popupJustClosed) return; // ← ВОТ ЭТО ГЛАВНОЕ

  if (window.routeMode) {
  window.handlePartyRouteClick(e.latlng);
  return;
}
  if (window.routePendingConfirmation) return;

  currentLatLng = e.latlng;
  editId = null;

  document.getElementById("form-title").innerText = "Новая метка";
  document.getElementById("marker-title").value = "";
  document.getElementById("marker-desc").value = "";

  document.getElementById("marker-form").style.display = "block";
});

function deleteMarker(id) {
  var confirmDelete = confirm("Удалить метку?");
  if (!confirmDelete) return;

  // удаляем из массива
  savedMarkers = savedMarkers.filter(m => m.id !== id);
  localStorage.setItem("markers", JSON.stringify(savedMarkers));

  // удаляем с карты БЕЗ перезагрузки
  map.eachLayer(function(layer) {
    if (layer instanceof L.Marker && layer._customId === id) {
      map.removeLayer(layer);
    }
  });
}

function editMarker(id) {
  var marker = savedMarkers.find(m => m.id === id);
  if (!marker) return;

  editId = id;
  currentLatLng = { lat: marker.lat, lng: marker.lng };

  document.getElementById("form-title").innerText = "Редактирование";
  document.getElementById("marker-title").value = marker.title;
  document.getElementById("marker-desc").value = marker.description;

  document.getElementById("marker-form").style.display = "block";
}

function closeForm() {
  document.getElementById("marker-form").style.display = "none";
}

function saveMarker() {
  var title = document.getElementById("marker-title").value;
  var desc = document.getElementById("marker-desc").value;
  var type = document.getElementById("marker-type").value;

  if (!title) return;

  if (editId) {
    var marker = savedMarkers.find(m => m.id === editId);
    marker.title = title;
    marker.description = desc;
    marker.type = type;

    // обновляем popup БЕЗ reload
    map.eachLayer(function(layer) {
      if (layer instanceof L.Marker && layer._customId === editId) {
        layer.setIcon(icons[type]);
        layer.setPopupContent(`
          <div class="marker-popup">
            <div class="marker-title">${title}</div>
            <div class="marker-desc">${desc}</div>

            <div class="marker-buttons">
              <button onclick="editMarker(${editId})">✏️</button>
              <button onclick="deleteMarker(${editId})">🗑</button>
            </div>
          </div>
        `);
      }
    });

  } else {
    var newMarker = {
      lat: currentLatLng.lat,
      lng: currentLatLng.lng,
      title: title,
      description: desc,
      type: type,
      id: Date.now()
    };

    savedMarkers.push(newMarker);
    addMarker(newMarker);
  }

  localStorage.setItem("markers", JSON.stringify(savedMarkers));
  closeForm();
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    // Во время прокладки или подтверждения маршрута Escape
    // выполняет то же действие, что и кнопка «Отменить».
    if (window.routeMode || window.routePendingConfirmation) {
      e.preventDefault();
      e.stopImmediatePropagation();

      window.dispatchEvent(new Event("cancel-party-route"));

      // Убираем клавиатурный фокус с маркера отряда,
      // чтобы браузер не оставлял вокруг него рамку.
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      return;
    }

    map.closePopup();
    closeForm();
  }
});

</script>

  routeStatus = routePanel.querySelector(".route-info");
  routeConfirmButton = document.getElementById("route-confirm");

  // Выбор темпа
  routePanel.querySelectorAll(".route-speed").forEach(button => {
    button.addEventListener("click", function() {
      routePace = this.dataset.pace;

      routePanel.querySelectorAll(".route-speed").forEach(b => {
        b.classList.toggle("active", b === this);
      });

      updateRouteLine(lastCursorPosition);
    });
  });

// Переключатель сниженной скорости
const reducedSpeedButton = document.getElementById("route-reduced-speed");

reducedSpeedButton.addEventListener("click", function() {
  routeSpeedReduced = !routeSpeedReduced;

  this.classList.toggle("active", routeSpeedReduced);

  this.setAttribute("aria-pressed", routeSpeedReduced);

  updateRouteLine(lastCursorPosition);
});

// Переключатель форсированного марша
const forcedMarchButton = document.getElementById("route-forced-march");

forcedMarchButton.addEventListener("click", function() {
  // После установки флажка переключатель недоступен.
  if (routeFinished || window.routePendingConfirmation) return;

  const fixedLength = getRouteLength(routePoints);
  const dailyLimit =
    routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);

  lastCursorPosition = null;

  if (!routeForcedMarch) {
    // Начинаем форсированный марш от последнего обычного привала.
    const previousRests = getNormalRestDistances(fixedLength, dailyLimit);
    const lastRestDistance = previousRests.length
      ? previousRests[previousRests.length - 1]
      : 0;

    // Здесь маршрут действительно откатывается к последнему привалу.
    routePoints = getRoutePointsUpToDistance(routePoints, lastRestDistance);
    routeForcedSegments = routeForcedSegments.filter(
      segment => segment.end <= lastRestDistance + 0.001
    );

    routeForcedMarchStartDistance = lastRestDistance;
    routeForcedMarch = true;

    this.classList.add("active");
    this.setAttribute("aria-pressed", "true");
    console.log("Форсированный марш включён");
  } else {
    // Выключаем форсированный марш.
    const forcedDistance = fixedLength - routeForcedMarchStartDistance;

    if (forcedDistance >= dailyLimit - 0.001) {
      // Весь форсированный участок считается одним днём,
      // независимо от того, сколько норм пройдено.
      routeForcedSegments.push({
        start: routeForcedMarchStartDistance,
        end: fixedLength,
        dailyLimit: dailyLimit
      });
      console.log("Форсированный марш завершён: создан один привал");
    } else {
      // Если дневная черта не достигнута — возвращаемся к началу марша.
      routePoints = getRoutePointsUpToDistance(
        routePoints,
        routeForcedMarchStartDistance
      );
      routeForcedSegments = routeForcedSegments.filter(
        segment => segment.end <= routeForcedMarchStartDistance + 0.001
      );
      console.log("Форсированный марш отменён: маршрут возвращён к привалу");
    }

    routeForcedMarch = false;
    routeForcedMarchStartDistance = 0;
    this.classList.remove("active");
    this.setAttribute("aria-pressed", "false");
  }

  updateRouteLine();
});

  // Подтверждение маршрута
  routeConfirmButton.addEventListener("click", function() {
if (!routeFinished) return;

window.routeMode = false;
map.doubleClickZoom.enable();
window.routePendingConfirmation = false;

    window.confirmedPartyRoute = routePoints.map(point => ({
      lat: point.lat,
      lng: point.lng
    }));

    lastCursorPosition = null;
    updateRouteLine();

    routePanel.style.display = "none";

    console.log("Маршрут подтверждён:", window.confirmedPartyRoute);
  });

  // Возврат к предыдущему привалу
  document.getElementById("route-undo").addEventListener("click", function() {
    if (pendingRouteClickTimer) {
      clearTimeout(pendingRouteClickTimer);
      pendingRouteClickTimer = null;
      pendingRouteClickPosition = null;
    }

    const totalLength = getRouteLength(routePoints);
    const dailyLimit =
      routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);

    let targetDistance = 0;

    if (routeForcedMarch) {
      // Во время форсированного марша возвращаемся к его началу.
      targetDistance = routeForcedMarchStartDistance;
      routeForcedMarch = false;
      routeForcedMarchStartDistance = 0;
      const forcedButton = document.getElementById("route-forced-march");
      if (forcedButton) {
        forcedButton.classList.remove("active");
        forcedButton.setAttribute("aria-pressed", "false");
      }
    } else {
      // Выбираем последний привал строго перед текущим концом маршрута.
      const rests = getNormalRestDistances(totalLength, dailyLimit);
      for (let i = rests.length - 1; i >= 0; i--) {
        if (rests[i] < totalLength - 0.01) {
          targetDistance = rests[i];
          break;
        }
      }
    }

    routePoints = getRoutePointsUpToDistance(routePoints, targetDistance);

    // Сначала обрезаем геометрию, затем синхронизируем с ней историю маршей.
    const actualLength = getRouteLength(routePoints);
    routeForcedSegments = routeForcedSegments.filter(
      segment => segment.end <= actualLength + 0.01
    );

    if (routeFinished) {
      routeFinished = false;
      window.routePendingConfirmation = false;
      window.routeMode = true;
      map.doubleClickZoom.disable();
    }

    lastCursorPosition = null;
    updateRouteLine();
    console.log("Маршрут возвращён к предыдущему привалу");
  });

  // Кнопка и клавиша Escape используют одну и ту же отмену.
  document.getElementById("route-cancel").addEventListener("click", cancelPartyRoute);
  window.addEventListener("cancel-party-route", cancelPartyRoute);

}

// =====================================
// ДЛИНА МАРШРУТА
// =====================================

function getRouteLength(points) {
  let total = 0;

  for (let i = 1; i < points.length; i++) {
    const dy = points[i].lat - points[i - 1].lat;
    const dx = points[i].lng - points[i - 1].lng;

    total += Math.sqrt(dx * dx + dy * dy);
  }

  return total;
}

// =====================================
// ВИЗУАЛЬНАЯ ОБРАБОТКА ЛИНИИ МАРШРУТА
// =====================================

function createRouteDisplayPoints(points, protectedDistances = []) {
  if (points.length < 2) return points;

  const roundedPoints = [];
  const cornerRadius = 30;

  // Скругляем углы, только если в маршруте есть хотя бы 3 точки
  roundedPoints.push(points[0]);

  if (points.length >= 3) {
    for (let i = 1; i < points.length - 1; i++) {
      const prev = points[i - 1];
      const corner = points[i];
      const next = points[i + 1];

      // Не скругляем вершину, если на ней расположен привал или другой маркер.
      let cornerDistance = 0;
      for (let k = 1; k <= i; k++) {
        const dy = points[k].lat - points[k - 1].lat;
        const dx = points[k].lng - points[k - 1].lng;
        cornerDistance += Math.sqrt(dx * dx + dy * dy);
      }
      // Не сглаживаем повороты рядом с привалом/маркером: иначе
      // следующий резкий изгиб может визуально утянуть линию от точки привала.
      const isProtectedCorner = protectedDistances.some(
        distance => Math.abs(distance - cornerDistance) <= cornerRadius * 2
      );
      if (isProtectedCorner) {
        roundedPoints.push(corner);
        continue;
      }

      const dx1 = prev.lng - corner.lng;
      const dy1 = prev.lat - corner.lat;
      const dx2 = next.lng - corner.lng;
      const dy2 = next.lat - corner.lat;

      const len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
      const len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

      if (len1 < 1 || len2 < 1) {
        roundedPoints.push(corner);
        continue;
      }

      const cut1 = Math.min(cornerRadius, len1 * 0.4);
      const cut2 = Math.min(cornerRadius, len2 * 0.4);

      const before = L.latLng(
        corner.lat + dy1 / len1 * cut1,
        corner.lng + dx1 / len1 * cut1
      );

      const after = L.latLng(
        corner.lat + dy2 / len2 * cut2,
        corner.lng + dx2 / len2 * cut2
      );

      roundedPoints.push(before);

      // Плавная кривая Безье вокруг угла
      for (let j = 1; j <= 5; j++) {
        const t = j / 6;
        const oneMinusT = 1 - t;

        roundedPoints.push(L.latLng(
          oneMinusT * oneMinusT * before.lat +
          2 * oneMinusT * t * corner.lat +
          t * t * after.lat,

          oneMinusT * oneMinusT * before.lng +
          2 * oneMinusT * t * corner.lng +
          t * t * after.lng
        ));
      }

      roundedPoints.push(after);
    }
  }

  roundedPoints.push(points[points.length - 1]);

  // Добавляем небольшую хаотичную неровность
  const result = [roundedPoints[0]];

  for (let i = 1; i < roundedPoints.length; i++) {
    const start = roundedPoints[i - 1];
    const end = roundedPoints[i];

    const dx = end.lng - start.lng;
    const dy = end.lat - start.lat;
    const length = Math.sqrt(dx * dx + dy * dy);

    // Короткие участки не изменяем
    if (length < 60) {
      result.push(end);
      continue;
    }

    const steps = Math.floor(length / 20);

    for (let j = 1; j <= steps; j++) {
      const t = j / (steps + 1);

      // Детерминированное псевдослучайное отклонение
      const seed = (
        start.lat * 12.9898 +
        start.lng * 78.233 +
        end.lat * 37.719 +
        end.lng * 19.913 +
        j * 53.117
      );

      const random = Math.sin(seed) * 43758.5453;
      const noise = (random - Math.floor(random)) * 2 - 1;

      // Отклонение плавно уменьшается у концов отрезка
      const taper = Math.sin(Math.PI * t);
      const offset = noise * 8 * taper;

      result.push(L.latLng(
        start.lat + dy * t + (dx / length) * offset,
        start.lng + dx * t - (dy / length) * offset
      ));
    }

    result.push(end);
  }

  return result;
}

// Получение координаты на определённом расстоянии пути
function getRoutePointAtDistance(points, targetDistance) {
  let passed = 0;

  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];

    const dy = end.lat - start.lat;
    const dx = end.lng - start.lng;

    const segmentLength = Math.sqrt(dx * dx + dy * dy);

    // Пропускаем нулевые отрезки, чтобы не получить деление на ноль.
    if (segmentLength < 0.001) continue;

    if (passed + segmentLength >= targetDistance) {
      const part = (targetDistance - passed) / segmentLength;

      return L.latLng(
        start.lat + dy * part,
        start.lng + dx * part
      );
    }

    passed += segmentLength;
  }

  return null;
}

// Возвращает часть маршрута до указанного расстояния
function getRoutePointsUpToDistance(points, targetDistance) {
  if (!points.length) return [];

  if (targetDistance <= 0) {
    return [points[0]];
  }

  const totalLength = getRouteLength(points);

  if (targetDistance >= totalLength) {
    return [...points];
  }

  const result = [points[0]];
  let passed = 0;

  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];

    const dy = end.lat - start.lat;
    const dx = end.lng - start.lng;
    const segmentLength = Math.sqrt(dx * dx + dy * dy);

    if (passed + segmentLength <= targetDistance + 0.001) {
      result.push(end);
      passed += segmentLength;

      if (passed >= targetDistance - 0.001) {
        break;
      }
    } else {
      const remaining = targetDistance - passed;

      if (segmentLength > 0) {
        const part = remaining / segmentLength;

        result.push(L.latLng(
          start.lat + dy * part,
          start.lng + dx * part
        ));
      }

      break;
    }
  }

  return result;
}

// Вставляет в геометрию точные точки на заданных расстояниях.
// Это гарантирует, что привалы, черты и крестики лежат непосредственно на линии.
function getRoutePointsWithDistanceAnchors(points, distances) {
  if (points.length < 2) return [...points];

  const totalLength = getRouteLength(points);
  const entries = [];
  let passed = 0;

  points.forEach((point, index) => {
    if (index > 0) {
      const previous = points[index - 1];
      passed += Math.hypot(point.lat - previous.lat, point.lng - previous.lng);
    }
    entries.push({ distance: passed, point: point });
  });

  distances.forEach(distance => {
    if (distance < -0.001 || distance > totalLength + 0.001) return;
    const point = getRoutePointAtDistance(points, Math.max(0, Math.min(totalLength, distance)));
    if (point) entries.push({ distance: Math.max(0, Math.min(totalLength, distance)), point });
  });

  entries.sort((a, b) => a.distance - b.distance);
  const result = [];
  entries.forEach(entry => {
    const last = result[result.length - 1];
    if (!last || Math.hypot(entry.point.lat - last.lat, entry.point.lng - last.lng) > 0.001) {
      result.push(entry.point);
    }
  });
  return result;
}

// Возвращает исходную геометрию маршрута между двумя расстояниями.
function getRoutePointsBetweenDistances(points, startDistance, endDistance) {
  const totalLength = getRouteLength(points);
  const start = Math.max(0, Math.min(totalLength, startDistance));
  const end = Math.max(start, Math.min(totalLength, endDistance));
  const anchored = getRoutePointsWithDistanceAnchors(points, [start, end]);
  const result = [];
  let passed = 0;

  anchored.forEach((point, index) => {
    if (index > 0) {
      const previous = anchored[index - 1];
      passed += Math.hypot(point.lat - previous.lat, point.lng - previous.lng);
    }
    if (passed >= start - 0.01 && passed <= end + 0.01) result.push(point);
  });
  return result;
}

// Угол поперечной черты в экранных координатах карты.
function getPerpendicularRouteAngle(points, targetDistance) {
  let passed = 0;
  for (let i = 1; i < points.length; i++) {
    const previous = points[i - 1];
    const current = points[i];
    const routeLength = Math.hypot(
      current.lat - previous.lat,
      current.lng - previous.lng
    );
    if (routeLength < 0.001) continue;

    if (passed + routeLength >= targetDistance - 0.001) {
      // Для направления используем экранные координаты, а для поиска
      // нужного сегмента — те же координатные единицы, что и длина маршрута.
      const a = map.latLngToLayerPoint(previous);
      const b = map.latLngToLayerPoint(current);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      return Math.atan2(dy, dx) * 180 / Math.PI + 90;
    }
    passed += routeLength;
  }
  return 90;
}

// Пересчитывает все привалы для текущей дневной нормы.
// Завершённый форсированный участок считается ровно одним днём.
function getNormalRestDistances(totalLength, dailyLimit) {
  const result = [];
  const segments = [...routeForcedSegments]
    .filter(segment => segment.end <= totalLength + 0.01)
    .sort((a, b) => a.start - b.start);

  let previousAnchor = 0;

  function addRest(distance) {
    if (distance <= 0.001) return;
    if (!result.length || Math.abs(result[result.length - 1] - distance) > 0.001) {
      result.push(distance);
    }
  }

  segments.forEach(segment => {
    // Обычные дневные привалы до начала форсированного участка.
    let nextRest = previousAnchor + dailyLimit;
    while (nextRest < segment.start - 0.001) {
      addRest(nextRest);
      nextRest += dailyLimit;
    }

    // Точка начала марша — привал, от которого он был начат.
    if (segment.start > previousAnchor + 0.001) {
      addRest(segment.start);
    }

    // Весь форсированный участок даёт ровно один следующий привал.
    addRest(segment.end);
    previousAnchor = segment.end;
  });

  // Обычные дни после последнего завершённого форсированного участка.
  let nextRest = previousAnchor + dailyLimit;
  while (nextRest <= totalLength + 0.001) {
    addRest(nextRest);
    nextRest += dailyLimit;
  }

  return result;
}

// =====================================
// ОЧИСТКА ЛИНИИ И ПРИВАЛОВ
// =====================================

function clearRouteDrawing() {
  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  routeRestMarkers.forEach(marker => {
    map.removeLayer(marker);
  });

  routeRestMarkers = [];
  if (routeEndMarker) {
  map.removeLayer(routeEndMarker);
  routeEndMarker = null;
}
}

// Единая отмена маршрута: вызывается кнопкой и клавишей Escape.
function cancelPartyRoute() {
  if (pendingRouteClickTimer) {
    clearTimeout(pendingRouteClickTimer);
  }
  pendingRouteClickTimer = null;
  pendingRouteClickPosition = null;

  routeFinished = false;
  window.routePendingConfirmation = false;
  window.routeMode = false;
  map.doubleClickZoom.enable();

  routeForcedMarch = false;
  routeForcedMarchStartDistance = 0;
  routeForcedSegments = [];
  routePoints = [];
  lastCursorPosition = null;

  clearRouteDrawing();

  const forcedButton = document.getElementById("route-forced-march");
  if (forcedButton) {
    forcedButton.classList.remove("active");
    forcedButton.setAttribute("aria-pressed", "false");
    forcedButton.disabled = false;
  }

  if (routePanel) {
    routePanel.style.display = "none";
  }

  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  console.log("Прокладка маршрута отменена");
}

// =====================================
// ОБНОВЛЕНИЕ И ОТРИСОВКА МАРШРУТА
// =====================================

function updateRouteLine(cursorPosition = null) {
  // Для preview используем те же расчёты, что и для зафиксированного маршрута,
  // но ничего не записываем в состояние до клика.
  const pointsToDraw = [...routePoints];
  if (cursorPosition && hasMouse && window.routeMode) {
    pointsToDraw.push(cursorPosition);
  }

  clearRouteDrawing();

  const totalLength = getRouteLength(pointsToDraw);
  const dailyLimit =
    routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);

  const restCalculationLength = routeForcedMarch
    ? routeForcedMarchStartDistance
    : totalLength;
  const restDistancesToDraw = getNormalRestDistances(
    restCalculationLength,
    dailyLimit
  );

  // Подготовим историю завершённых маршей и текущий активный марш.
  const forcedVisualSegments = routeForcedSegments
    .filter(segment => segment.end <= totalLength + 0.01)
    .map(segment => ({
      start: segment.start,
      end: Math.min(segment.end, totalLength),
      dailyLimit: segment.dailyLimit || dailyLimit
    }));

  if (routeForcedMarch) {
    forcedVisualSegments.push({
      start: routeForcedMarchStartDistance,
      end: totalLength,
      dailyLimit: dailyLimit,
      active: true
    });
  }

  const protectedDistances = [...restDistancesToDraw];
  forcedVisualSegments.forEach(segment => {
    const boundary = segment.start + segment.dailyLimit;
    if (boundary <= segment.end + 0.01) protectedDistances.push(boundary);
    const interval = segment.dailyLimit / 8;
    for (let d = boundary + interval; d <= segment.end + 0.01; d += interval) {
      protectedDistances.push(d);
    }
    protectedDistances.push(segment.end);
  });

  // Вставляем реальные точки привалов и отметок в исходную геометрию.
  const anchoredPoints = getRoutePointsWithDistanceAnchors(
    pointsToDraw,
    protectedDistances
  );

  // Основная линия маршрута.
  if (anchoredPoints.length >= 2) {
    routeLine = L.polyline(
      createRouteDisplayPoints(anchoredPoints, protectedDistances),
      {
        color: "#d6b46a",
        weight: 4,
        dashArray: "8, 10",
        opacity: 0.9
      }
    ).addTo(map);
  }

  // Обычные привалы.
  restDistancesToDraw.forEach(distance => {
    if (distance > totalLength + 0.01) return;
    const position = getRoutePointAtDistance(pointsToDraw, distance);
    if (!position) return;

    const marker = L.circleMarker(position, {
      radius: 7,
      color: "#211b16",
      weight: 2,
      fillColor: "#e6c77d",
      fillOpacity: 1,
      interactive: false
    }).addTo(map);
    routeRestMarkers.push(marker);
  });

  // Визуал форсированных маршей остаётся на карте и после их завершения.
  forcedVisualSegments.forEach(segment => {
    const boundaryDistance = segment.start + segment.dailyLimit;
    if (boundaryDistance > segment.end + 0.01) return;

    const boundaryPosition = getRoutePointAtDistance(pointsToDraw, boundaryDistance);
    if (!boundaryPosition) return;

    // Чёрная линия после разделительной черты — до привала,
    // которым завершился этот форсированный марш.
    const blackSection = getRoutePointsBetweenDistances(
      pointsToDraw,
      boundaryDistance,
      segment.end
    );
    if (blackSection.length >= 2) {
      const blackAnchors = getRoutePointsWithDistanceAnchors(
        blackSection,
        [0, getRouteLength(blackSection)]
      );
      L.polyline(createRouteDisplayPoints(blackAnchors, [0, getRouteLength(blackAnchors)]), {
        color: "#171717",
        weight: 4,
        opacity: 0.98,
        lineCap: "round",
        lineJoin: "round"
      }).addTo(map);
    }

    // Направление черты всегда перпендикулярно касательной маршрута.
    const angle = getPerpendicularRouteAngle(pointsToDraw, boundaryDistance);
    const boundaryIcon = L.divIcon({
      className: "route-march-boundary",
      html: `<div style="width:30px;height:4px;background:#e6c77d;border:1px solid #211b16;border-radius:1px;transform:rotate(${angle}deg);box-shadow:1px 2px 4px #000;"></div>`,
      iconSize: [32, 6],
      iconAnchor: [16, 3]
    });
    const boundaryMarker = L.marker(boundaryPosition, {
      icon: boundaryIcon,
      interactive: false,
      keyboard: false,
      zIndexOffset: 1100
    }).addTo(map);
    routeRestMarkers.push(boundaryMarker);

    // Крестики истощения — каждые 1/8 дневной нормы после черты.
    const interval = segment.dailyLimit / 8;
    for (let distance = boundaryDistance + interval;
         distance <= segment.end + 0.01;
         distance += interval) {
      const position = getRoutePointAtDistance(pointsToDraw, distance);
      if (!position) continue;

      const exhaustionIcon = L.divIcon({
        className: "route-exhaustion-mark",
        html: `<div style="color:#d58b70;font-size:24px;font-weight:bold;line-height:24px;text-shadow:1px 2px 4px #000;">×</div>`,
        iconSize: [20, 24],
        iconAnchor: [10, 12]
      });
      const marker = L.marker(position, {
        icon: exhaustionIcon,
        interactive: false,
        keyboard: false,
        zIndexOffset: 1100
      }).addTo(map);
      routeRestMarkers.push(marker);
    }
  });

  // Флажок конечной точки.
  if (routeFinished && routePoints.length >= 2) {
    const endPoint = routePoints[routePoints.length - 1];
    const flagIcon = L.divIcon({
      className: "route-end-flag",
      html: `<div style="font-size:30px;line-height:30px;color:#e6c77d;text-shadow:1px 2px 4px #000;">⚑</div>`,
      iconSize: [24, 30],
      iconAnchor: [5, 28]
    });
    routeEndMarker = L.marker(endPoint, {
      icon: flagIcon,
      interactive: false,
      keyboard: false,
      zIndexOffset: 1200
    }).addTo(map);
  }

  // Информация в панели.
  if (routePanel) {
    document.getElementById("route-daily-limit").textContent =
      (dailyLimit * KM_PER_PIXEL).toFixed(1) + " км";
    document.getElementById("route-distance").textContent =
      (totalLength * KM_PER_PIXEL).toFixed(1) + " км";

    const completedDays = routeForcedMarch
      ? getNormalRestDistances(routeForcedMarchStartDistance, dailyLimit).length
      : getNormalRestDistances(totalLength, dailyLimit).length;
    document.getElementById("route-days").textContent = completedDays;

    routeConfirmButton.disabled = !routeFinished;

    const forcedButton = document.getElementById("route-forced-march");
    if (forcedButton) {
      forcedButton.disabled = routeFinished || window.routePendingConfirmation;
    }

    document.getElementById("route-undo").disabled = routePoints.length <= 1;
  }

  console.log("Длина маршрута:", Math.round(totalLength));
}

// =====================================
// ДОБАВЛЕНИЕ ТОЧКИ МАРШРУТА
// =====================================

window.addPartyRoutePoint = function(latlng) {
  routePoints.push(latlng);
  lastCursorPosition = null;

  updateRouteLine();

  console.log("Точки маршрута:", routePoints);
};

// =====================================
// ОБРАБОТКА КЛИКОВ И ЗАВЕРШЕНИЕ МАРШРУТА
// =====================================

// Завершение построения маршрута
function finishPartyRoute(latlng) {
  // Добавляем последнюю точку, если она отличается от предыдущей
  const lastPoint = routePoints[routePoints.length - 1];

  if (
    !lastPoint ||
    map.latLngToContainerPoint(lastPoint)
      .distanceTo(map.latLngToContainerPoint(latlng)) > 3
  ) {
    routePoints.push(latlng);
  }

  // Маршрут должен содержать хотя бы одну линию
  if (routePoints.length < 2) {
    console.log("Для завершения маршрута нужна хотя бы одна точка");
    return;
  }

  routeFinished = true;
  window.routeMode = false;
  window.routePendingConfirmation = true;

  lastCursorPosition = null;

  // Возвращаем обычное приближение двойным кликом
  map.doubleClickZoom.enable();

  updateRouteLine();

  console.log("Маршрут завершён:", routePoints);
}

// Обработка одиночного и двойного клика
window.handlePartyRouteClick = function(latlng) {
  if (!window.routeMode || routeFinished) return;

  // Если уже ожидается одиночный клик,
  // проверяем, является ли новый клик вторым
  if (pendingRouteClickTimer) {
    const firstPoint = map.latLngToContainerPoint(
      pendingRouteClickPosition
    );

    const secondPoint = map.latLngToContainerPoint(latlng);

    const distance = firstPoint.distanceTo(secondPoint);

    // Два клика рядом друг с другом — завершаем маршрут
    if (distance <= 30) {
      clearTimeout(pendingRouteClickTimer);

      pendingRouteClickTimer = null;
      pendingRouteClickPosition = null;

      finishPartyRoute(latlng);
      return;
    }

    // Если второй клик далеко — фиксируем предыдущий
    clearTimeout(pendingRouteClickTimer);

    window.addPartyRoutePoint(pendingRouteClickPosition);

    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
  }

  // Запоминаем новый клик
  pendingRouteClickPosition = latlng;

  // Ждём 300 мс: если второго клика не будет,
  // добавляем обычную точку маршрута
  pendingRouteClickTimer = setTimeout(function() {
    window.addPartyRoutePoint(pendingRouteClickPosition);

    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
  }, 180);
};

// Движение курсора на ПК
map.on("mousemove", function(e) {
  if (!window.routeMode || !hasMouse) return;

  lastCursorPosition = e.latlng;

  updateRouteLine(e.latlng);
});

        } else {
          // Если маркер уже есть — меняем его положение
          partyMarker.setLatLng(coordinates);
        }

        console.log("Положение отряда:", coordinates);
      });

    } catch (error) {
      console.error("Ошибка загрузки отряда:", error);
    }
  }

 // Тестовая проверка общей базы
  window.testFirebase = async function() {
    const testRef = ref(database, "connectionTest");

    try {
      await set(testRef, {
        message: "Связь работает!",
        updatedAt: Date.now()
      });

      const snapshot = await get(testRef);

      console.log("Проверка Firebase:", snapshot.val());
      alert("Успешно! Firebase записывает и читает данные.");
    } catch (error) {
      console.error("Ошибка Firebase:", error);
      alert("Ошибка Firebase: " + error.message);
    }
  };

  // Делаем Firebase доступным для следующих частей нашей системы
  window.dndFirebase = {
    app: app,
    auth: auth,
    database: database,
    uid: null,
    ready: false
  };

  // Индикатор подключения на экране
  const status = document.createElement("div");

  status.style.cssText = `
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 2000;
    padding: 8px 12px;
    border-radius: 6px;
    background: #222;
    color: white;
    font: 13px sans-serif;
  `;

  status.textContent = "Firebase: подключение...";
  document.body.appendChild(status);

  // Анонимная авторизация игрока
  onAuthStateChanged(auth, function(user) {
    if (user) {
      window.dndFirebase.uid = user.uid;
      window.dndFirebase.ready = true;

      status.textContent = "Firebase: авторизация выполнена";
      status.style.background = "#245c32";

      console.log("Firebase готов. UID:", user.uid);
      initializeParty();
    } else {
      window.dndFirebase.ready = false;
      status.textContent = "Firebase: выполняется вход...";

      signInAnonymously(auth).catch(function(error) {
        console.error("Ошибка авторизации Firebase:", error);

        status.textContent = "Firebase: ошибка авторизации";
        status.style.background = "#8b2222";
      });
    }
  });
