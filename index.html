<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DND Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
body {
  margin: 0;

  background: url('background.jpg') no-repeat center center fixed;
  background-size: cover;
}

#map {
  height: 100%;
  width: 100%;

  background: transparent;
  position: relative;
}

#map-wrapper::after {
  content: "";
  position: absolute;

  top: -2%;
  bottom: -2%;
  left: 11%;
  right: 11%;

  border: 4px solid #0f0b07;

  box-shadow: 
    0 0 40px rgba(0,0,0,0.9),
    inset 0 0 20px rgba(0,0,0,0.5);

  pointer-events: none;
}
  .leaflet-container {
  outline: none !important;
  border: none !important;
}

.leaflet-pane img {
  border: none !important;
}

.leaflet-marker-icon:focus {
  outline: none !important;
}

#map-wrapper {
  height: 90vh;
  width: 90vw;
  margin: 5vh auto;

  position: relative;
}

#map.zoomed::after {
  content: "";
  position: absolute;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  border: 4px solid #0f0b07;

  box-shadow: 
    0 0 40px rgba(0,0,0,0.9),
    inset 0 0 20px rgba(0,0,0,0.5);

  pointer-events: none;
}

#map-wrapper.zoomed::after {
  display: none;
}

.marker-popup {
  background: #1b1b1b;
  color: #f5f5f5;
  padding: 10px;
  border-radius: 8px;
  font-family: sans-serif;
  min-width: 200px;
}

.marker-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 5px;
}

.marker-desc {
  font-size: 13px;
  opacity: 0.8;
  margin-bottom: 10px;
}

.marker-buttons {
  display: flex;
  justify-content: space-between;
}

.marker-buttons button {
  background: #333;
  border: none;
  color: white;
  padding: 5px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.marker-buttons button:hover {
  background: #555;
}

  </style>
</head>

<body>

<div id="marker-form" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
background:#1e1e1e; padding:20px; border-radius:8px; z-index:1000; color:white; width:300px;">

  <h3 id="form-title">Новая метка</h3>

  <input id="marker-title" placeholder="Название" style="width:100%; margin-bottom:10px;" />
  
  <textarea id="marker-desc" placeholder="Описание" style="width:100%; height:80px;"></textarea>

  <select id="marker-type" style="width:100%; margin-top:10px;">
  <option value="note">📜 Заметка</option>
  <option value="camp">🏕 Лагерь</option>
  <option value="cave">🕳 Пещера</option>
  <option value="interest">⭐ Интересное место</option>
  <option value="quest">❓ Квест</option>
</select>
  
  <div style="margin-top:10px; display:flex; justify-content:space-between;">
    <button onclick="saveMarker()">Сохранить</button>
    <button onclick="closeForm()">Отмена</button>
  </div>
</div>

<div id="map-wrapper">
  <div id="map"></div>
</div>

<script>

var currentLatLng = null;
var editId = null;
var popupJustClosed = false;
var settlementJustDrew = false;
window.settlementDrawingActive = false;
var icons = {
  camp: L.icon({
    iconUrl: 'camp.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  cave: L.icon({
    iconUrl: 'cave.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  note: L.icon({
    iconUrl: 'note.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  interest: L.icon({
    iconUrl: 'interest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  quest: L.icon({
    iconUrl: 'quest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  })
};

// размеры твоей карты (пока оставим так)
var width = 7016;
var height = 4960;

// создаём карту
var bounds = [[0,0], [height, width]];

var map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 0,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0,
  attributionControl: false,
});

// загружаем картинку
var imageUrl = 'map.jpg';

var bounds = [[0,0], [height, width]];
var overlay = L.imageOverlay(imageUrl, bounds).addTo(map);

map.fitBounds(bounds, {
  padding: [0, 0],
  animate: false
});

map.setMaxBounds(bounds);
map.panInsideBounds(bounds, { animate: false });

map.on('popupclose', function() {
  popupJustClosed = true;

  setTimeout(function() {
    popupJustClosed = false;
  }, 100);
});

function updateFrame() {
  var mapEl = document.getElementById('map');
  var wrapper = document.getElementById('map-wrapper');

  if (map.getZoom() === map.getMinZoom()) {
    // минимальный зум
    wrapper.classList.remove("zoomed");
    mapEl.classList.remove("zoomed");

    map.dragging.disable(); // ← блокируем

  } else {
    // зум есть
    wrapper.classList.add("zoomed");
    mapEl.classList.add("zoomed");

    map.dragging.enable(); // ← ВОТ ЭТО ВАЖНО
  }
}

updateFrame();
map.on('zoomend', updateFrame);

// --- ЗАГРУЗКА СОХРАНЁННЫХ МЕТОК ---
// Личные метки: локальный список остаётся резервной копией и источником
// для однократного переноса в личное хранилище Firebase.
var savedMarkers = JSON.parse(localStorage.getItem("markers") || "[]");

savedMarkers.forEach(function(m) {
  addMarker(m);
});

function persistPersonalMarkers() {
  localStorage.setItem("markers", JSON.stringify(savedMarkers));

  // Firebase может ещё авторизовывать пользователя. В таком случае
  // локальная копия сохранится, а перенос будет выполнен после входа.
  if (window.dndFirebase && typeof window.dndFirebase.savePersonalMarkers === "function") {
    window.dndFirebase.savePersonalMarkers(savedMarkers).catch(function(error) {
      console.error("Не удалось синхронизировать личные метки:", error);
      alert("Не удалось сохранить метки в общей базе. Локальная резервная копия сохранена.");
    });
  }
}

// Вызывается Firebase после загрузки личных меток текущего UID.
// Удаляются только обычные метки, но не маркер отряда и не другие слои карты.
window.applyPersonalMarkers = function(markers) {
  map.eachLayer(function(layer) {
    if (layer instanceof L.Marker && layer._customId !== undefined) {
      map.removeLayer(layer);
    }
  });

  savedMarkers = Array.isArray(markers) ? markers : [];
  savedMarkers.forEach(function(markerData) {
    addMarker(markerData);
  });
  localStorage.setItem("markers", JSON.stringify(savedMarkers));
};

function addMarker(data) {
  var marker = L.marker(
  [data.lat, data.lng],
  { icon: icons[data.type || "note"] }
).addTo(map);

function renderPopup() {
  return `
    <div class="marker-popup">
      <div class="marker-title">${data.title}</div>
      <div class="marker-desc">${data.description}</div>

      <div class="marker-buttons">
        <button onclick="editMarker(${data.id})">✏️</button>
        <button onclick="deleteMarker(${data.id})">🗑</button>
      </div>
    </div>
  `;
}

  marker.bindPopup(renderPopup());

  marker._customId = data.id;
}

// --- ДОБАВЛЕНИЕ МЕТКИ ПО КЛИКУ ---
map.on('click', function(e) {
  if (popupJustClosed || window.settlementDrawingActive || settlementJustDrew) return;

  if (window.routeMode) {
  window.handlePartyRouteClick(e.latlng);
  return;
}
  if (window.routePendingConfirmation) return;

  currentLatLng = e.latlng;
  editId = null;

  document.getElementById("form-title").innerText = "Новая метка";
  document.getElementById("marker-title").value = "";
  document.getElementById("marker-desc").value = "";

  document.getElementById("marker-form").style.display = "block";
});

function deleteMarker(id) {
  var confirmDelete = confirm("Удалить метку?");
  if (!confirmDelete) return;

  // удаляем из массива
  savedMarkers = savedMarkers.filter(m => m.id !== id);
  persistPersonalMarkers();

  // удаляем с карты БЕЗ перезагрузки
  map.eachLayer(function(layer) {
    if (layer instanceof L.Marker && layer._customId === id) {
      map.removeLayer(layer);
    }
  });
}

function editMarker(id) {
  var marker = savedMarkers.find(m => m.id === id);
  if (!marker) return;

  editId = id;
  currentLatLng = { lat: marker.lat, lng: marker.lng };

  document.getElementById("form-title").innerText = "Редактирование";
  document.getElementById("marker-title").value = marker.title;
  document.getElementById("marker-desc").value = marker.description;

  document.getElementById("marker-form").style.display = "block";
}

function closeForm() {
  document.getElementById("marker-form").style.display = "none";
}

function saveMarker() {
  var title = document.getElementById("marker-title").value;
  var desc = document.getElementById("marker-desc").value;
  var type = document.getElementById("marker-type").value;

  if (!title) return;

  if (editId) {
    var marker = savedMarkers.find(m => m.id === editId);
    marker.title = title;
    marker.description = desc;
    marker.type = type;

    // обновляем popup БЕЗ reload
    map.eachLayer(function(layer) {
      if (layer instanceof L.Marker && layer._customId === editId) {
        layer.setIcon(icons[type]);
        layer.setPopupContent(`
          <div class="marker-popup">
            <div class="marker-title">${title}</div>
            <div class="marker-desc">${desc}</div>

            <div class="marker-buttons">
              <button onclick="editMarker(${editId})">✏️</button>
              <button onclick="deleteMarker(${editId})">🗑</button>
            </div>
          </div>
        `);
      }
    });

  } else {
    var newMarker = {
      lat: currentLatLng.lat,
      lng: currentLatLng.lng,
      title: title,
      description: desc,
      type: type,
      id: Date.now()
    };

    savedMarkers.push(newMarker);
    addMarker(newMarker);
  }

  persistPersonalMarkers();
  closeForm();
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    // Во время прокладки или подтверждения маршрута Escape
    // выполняет то же действие, что и кнопка «Отменить».
    if (window.routeMode || window.routePendingConfirmation) {
      e.preventDefault();
      e.stopImmediatePropagation();

      window.dispatchEvent(new Event("cancel-party-route"));

      // Убираем клавиатурный фокус с маркера отряда,
      // чтобы браузер не оставлял вокруг него рамку.
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      return;
    }

    map.closePopup();
    closeForm();
  }
});

</script>

partyMarker.on("click", function() {

window.routeMode = true;
routeFinished = false;

// Сбрасываем состояние форсированного марша
routeForcedMarch = false;

if (forcedButton) {

// =====================================
// ПОСТРОЕНИЕ МАРШРУТА
// =====================================

let routePoints = [];
let routeLine = null;
let routeRestMarkers = [];
let routeEndMarker = null;

// Невидимые области поселений и состояние маршрута обрабатываются ниже.

// Состояние завершения маршрута
let routeFinished = false;

// Обработка одиночного и двойного клика
let pendingRouteClickTimer = null;
let pendingRouteClickPosition = null;

let routePace = "normal";
let routeSpeedReduced = false;
let routeForcedMarch = false;

// Завершённые участки форсированного марша: абсолютные расстояния для отображения
// плюс startUnits/lengthUnits для пересчёта при смене дневной нормы.
let routeForcedSegments = [];

// Начало форсированного марша хранится в долях дневной нормы,
// чтобы оно перемещалось вместе с привалами при смене темпа.
let routeForcedMarchStartDistance = 0;
let routeForcedMarchStartUnits = 0;

const routePaceLimits = {
  slow: 225,
  normal: 300,
  fast: 375
};
const KM_PER_PIXEL = 38.6 / 300;
let routePanel = null;
let routeStatus = null;
let routeConfirmButton = null;
let lastCursorPosition = null;

// Анимация маршрута. Линия раскрывается последовательно от начала
// нового отрезка к его концу; жетоны синхронизированы с достижением
// пунктиром их позиции. Перерисовка не сбрасывает анимацию.
let routeMarkerAnimations = [];
const routeRevealFadeDuration = 520; // прежняя длительность появления жетонов
const routeLineRevealFadeDuration = 220; // плавное появление отдельного штриха
const routeLineDashLength = 8;
const routeLineDashGap = 10;
const routeLineDashStep = routeLineDashLength + routeLineDashGap;
const routeLineFirstDashDelay = 220; // пауза между первыми штрихами
const routeLineDashAcceleration = 3; // каждый следующий интервал короче на 3 мс
const routeLineMinimumDashDelay = 95; // предел ускорения, чтобы штрихи не сливались

// Задержка каждого штриха считается от начала линии. С каждым штрихом
// интервал немного сокращается, пока не достигнет безопасного минимума.
function getRouteLineRevealDelay(dashIndex) {
  let delay = 0;
  for (let i = 0; i < dashIndex; i++) {
    delay += Math.max(
      routeLineMinimumDashDelay,
      routeLineFirstDashDelay - i * routeLineDashAcceleration
    );
  }
  return delay;
}

function getRouteLineRevealDuration(screenLength) {
  if (screenLength <= 0) return routeLineRevealFadeDuration;
  const lastDashIndex = Math.max(0, Math.floor((screenLength - 2) / routeLineDashStep));
  return getRouteLineRevealDelay(lastDashIndex) + routeLineRevealFadeDuration;
}

function stopRouteMarkerAnimation() {
  routeMarkerAnimations.forEach(animation => {
    if (animation.timer) clearTimeout(animation.timer);
  });

  routeMarkerAnimations = [];
}

function beginRouteMarkerAnimation(startDistance, endDistance) {
  const length = endDistance - startDistance;
  if (length < 0.001) return;

  // Линия и жетоны используют одну и ту же сглаженную геометрию.
  // Это позволяет запускать каждый жетон только после того, как
  // последовательность штрихов дошла до его позиции.
  // Экранные координаты нужны, чтобы размер штрихов и их интервалы
  // оставались одинаковыми при разных уровнях масштаба карты.
  const routeTotalLength = getRouteLength(routePoints);
  const displayPoints = createRouteDisplayPoints(routePoints, []);
  const displayTotalLength = getRouteLength(displayPoints);
  const displayStart = routeTotalLength > 0.001
    ? startDistance / routeTotalLength * displayTotalLength
    : 0;
  const displayEnd = routeTotalLength > 0.001
    ? endDistance / routeTotalLength * displayTotalLength
    : displayTotalLength;
  const lineStartScreen = getRouteScreenDistanceAtDistance(displayPoints, displayStart);
  const lineEndScreen = getRouteScreenDistanceAtDistance(displayPoints, displayEnd);
  const lineDuration = getRouteLineRevealDuration(lineEndScreen - lineStartScreen);
  // Держим анимацию активной и на время плавного появления последнего жетона.
  const duration = lineDuration + routeRevealFadeDuration;

  const animation = {
    start: startDistance,
    end: endDistance,
    routeTotalLength,
    displayTotalLength,
    displayPoints,
    lineStartScreen,
    lineEndScreen,
    startedAt: Date.now(),
    duration,
    timer: null
  };

  routeMarkerAnimations.push(animation);

  animation.timer = setTimeout(function() {
    routeMarkerAnimations = routeMarkerAnimations.filter(
      item => item !== animation
    );

    updateRouteLine(lastCursorPosition);
  }, duration + 100);
}

// При смене масштаба пересчитываем экранную длину активных анимаций,
// сохраняя уже пройденную долю времени. Благодаря этому новый зум не
// заставляет штрихи перескакивать вперёд/назад и не запускает линию заново.
function rebaseRouteMarkerAnimationsForZoom() {
  const now = Date.now();

  routeMarkerAnimations.forEach(animation => {
    const oldDuration = Math.max(1, animation.duration);
    const elapsed = Math.max(0, now - animation.startedAt);
    const progress = Math.max(0, Math.min(1, elapsed / oldDuration));

    const lineStartScreen = getRouteScreenDistanceAtDistance(
      animation.displayPoints,
      animation.start / animation.routeTotalLength * animation.displayTotalLength
    );
    const lineEndScreen = getRouteScreenDistanceAtDistance(
      animation.displayPoints,
      animation.end / animation.routeTotalLength * animation.displayTotalLength
    );
    const lineDuration = getRouteLineRevealDuration(lineEndScreen - lineStartScreen);
    const newDuration = lineDuration + routeRevealFadeDuration;

    animation.lineStartScreen = lineStartScreen;
    animation.lineEndScreen = lineEndScreen;
    animation.duration = newDuration;
    animation.startedAt = now - progress * newDuration;

    if (animation.timer) clearTimeout(animation.timer);
    const remaining = Math.max(0, newDuration - progress * newDuration);
    animation.timer = setTimeout(function() {
      routeMarkerAnimations = routeMarkerAnimations.filter(item => item !== animation);
      updateRouteLine(lastCursorPosition);
    }, remaining + 100);
  });
}

function getRouteMarkerAnimation(distance) {
  const now = Date.now();
  let matchingAnimation = null;

  routeMarkerAnimations.forEach(animation => {
    const elapsed = now - animation.startedAt;
    const isInsideRange =
      distance > animation.start + 0.05 &&
      distance <= animation.end + 0.01;

    if (
      isInsideRange &&
      elapsed < animation.duration &&
      (!matchingAnimation || animation.startedAt > matchingAnimation.startedAt)
    ) {
      matchingAnimation = animation;
    }
  });

  return matchingAnimation;
}

function shouldAnimateRouteMarker(distance) {
  return Boolean(getRouteMarkerAnimation(distance));
}

// Возвращает задержку до появления жетона. Он начинает проявляться
// только после того, как пунктир дошёл до соответствующей позиции.
function getRouteMarkerAnimationDelay(distance) {
  const animation = getRouteMarkerAnimation(distance);
  if (!animation) return null;

  const displayDistance = animation.routeTotalLength > 0.001
    ? distance / animation.routeTotalLength * animation.displayTotalLength
    : 0;
  const markerScreenDistance = getRouteScreenDistanceAtDistance(
    animation.displayPoints,
    displayDistance
  );
  const relativeScreenDistance = Math.max(
    0,
    markerScreenDistance - animation.lineStartScreen
  );

  // Если жетон находится внутри штриха, ждём этот штрих;
  // если в промежутке между штрихами — следующий за ним.
  const dashOffset = relativeScreenDistance % routeLineDashStep;
  let dashIndex = Math.floor(relativeScreenDistance / routeLineDashStep);
  if (dashOffset > routeLineDashLength) dashIndex++;

  const lastDashIndex = Math.max(
    0,
    Math.floor((animation.lineEndScreen - animation.lineStartScreen - 2) / routeLineDashStep)
  );
  dashIndex = Math.min(dashIndex, lastDashIndex);

  const markerRevealTime =
    getRouteLineRevealDelay(dashIndex) + routeLineRevealFadeDuration;
  return markerRevealTime - (Date.now() - animation.startedAt);
}

// =====================================
// ДЛИНА МАРШРУТА
// =====================================

function getRouteLength(points) {
  let total = 0;

  for (let i = 1; i < points.length; i++) {
    const dy = points[i].lat - points[i - 1].lat;
    const dx = points[i].lng - points[i - 1].lng;

    total += Math.sqrt(dx * dx + dy * dy);
  }

  return total;
}

// Экранное расстояние вдоль визуальной линии. Используется только для
// равномерного по пикселям проявления штрихов, а не для расчёта пути.
function getRouteScreenDistanceAtDistance(points, targetDistance) {
  if (!points || points.length < 2) return 0;

  let routePassed = 0;
  let screenPassed = 0;

  for (let i = 1; i < points.length; i++) {
    const previous = points[i - 1];
    const current = points[i];
    const routeLength = Math.hypot(
      current.lat - previous.lat,
      current.lng - previous.lng
    );
    if (routeLength < 0.000001) continue;

    const a = map.latLngToLayerPoint(previous);
    const b = map.latLngToLayerPoint(current);
    const screenLength = a.distanceTo(b);

    if (routePassed + routeLength >= targetDistance) {
      const part = Math.max(0, Math.min(1, (targetDistance - routePassed) / routeLength));
      return screenPassed + screenLength * part;
    }

    routePassed += routeLength;
    screenPassed += screenLength;
  }

  return screenPassed;
}

// =====================================
// ВИЗУАЛЬНАЯ ОБРАБОТКА ЛИНИИ МАРШРУТА
// =====================================

function createRouteDisplayPoints(points, protectedDistances = []) {
  if (points.length < 2) return points;

  const roundedPoints = [];
  const cornerRadius = 30;

  // Скругляем углы, только если в маршруте есть хотя бы 3 точки
  roundedPoints.push(points[0]);

  if (points.length >= 3) {
    for (let i = 1; i < points.length - 1; i++) {
      const prev = points[i - 1];
      const corner = points[i];
      const next = points[i + 1];

      // Не скругляем вершину, если на ней расположен привал или другой маркер.
      let cornerDistance = 0;
      for (let k = 1; k <= i; k++) {
        const dy = points[k].lat - points[k - 1].lat;
        const dx = points[k].lng - points[k - 1].lng;
        cornerDistance += Math.sqrt(dx * dx + dy * dy);
      }
      // Не сглаживаем повороты рядом с привалом/маркером: иначе
      // следующий резкий изгиб может визуально утянуть линию от точки привала.
      const isProtectedCorner = protectedDistances.some(
        distance => Math.abs(distance - cornerDistance) <= cornerRadius * 2
      );
      if (isProtectedCorner) {
        roundedPoints.push(corner);
        continue;
      }

      const dx1 = prev.lng - corner.lng;
      const dy1 = prev.lat - corner.lat;
      const dx2 = next.lng - corner.lng;
      const dy2 = next.lat - corner.lat;

      const len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
      const len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

      if (len1 < 1 || len2 < 1) {
        roundedPoints.push(corner);
        continue;
      }

      const cut1 = Math.min(cornerRadius, len1 * 0.4);
      const cut2 = Math.min(cornerRadius, len2 * 0.4);

      const before = L.latLng(
        corner.lat + dy1 / len1 * cut1,
        corner.lng + dx1 / len1 * cut1
      );

      const after = L.latLng(
        corner.lat + dy2 / len2 * cut2,
        corner.lng + dx2 / len2 * cut2
      );

      roundedPoints.push(before);

      // Плавная кривая Безье вокруг угла
      for (let j = 1; j <= 5; j++) {
        const t = j / 6;
        const oneMinusT = 1 - t;

        roundedPoints.push(L.latLng(
          oneMinusT * oneMinusT * before.lat +
          2 * oneMinusT * t * corner.lat +
          t * t * after.lat,

          oneMinusT * oneMinusT * before.lng +
          2 * oneMinusT * t * corner.lng +
          t * t * after.lng
        ));
      }

      roundedPoints.push(after);
    }
  }

  roundedPoints.push(points[points.length - 1]);

  // Добавляем небольшую хаотичную неровность
  const result = [roundedPoints[0]];

  for (let i = 1; i < roundedPoints.length; i++) {
    const start = roundedPoints[i - 1];
    const end = roundedPoints[i];

    const dx = end.lng - start.lng;
    const dy = end.lat - start.lat;
    const length = Math.sqrt(dx * dx + dy * dy);

    // Короткие участки не изменяем
    if (length < 60) {
      result.push(end);
      continue;
    }

    const steps = Math.floor(length / 20);

    for (let j = 1; j <= steps; j++) {
      const t = j / (steps + 1);

      // Детерминированное псевдослучайное отклонение
      const seed = (
        start.lat * 12.9898 +
        start.lng * 78.233 +
        end.lat * 37.719 +
        end.lng * 19.913 +
        j * 53.117
      );

      const random = Math.sin(seed) * 43758.5453;
      const noise = (random - Math.floor(random)) * 2 - 1;

      // Отклонение плавно уменьшается у концов отрезка
      const taper = Math.sin(Math.PI * t);
      const offset = noise * 8 * taper;

      result.push(L.latLng(
        start.lat + dy * t + (dx / length) * offset,
        start.lng + dx * t - (dy / length) * offset
      ));
    }

    result.push(end);
  }

  return result;
}

// Получение координаты на определённом расстоянии пути
function getRoutePointAtDistance(points, targetDistance) {
  let passed = 0;

  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];

    const dy = end.lat - start.lat;
    const dx = end.lng - start.lng;

    const segmentLength = Math.sqrt(dx * dx + dy * dy);

    // Пропускаем нулевые отрезки, чтобы не получить деление на ноль.
    if (segmentLength < 0.001) continue;

    if (passed + segmentLength >= targetDistance) {
      const part = (targetDistance - passed) / segmentLength;

      return L.latLng(
        start.lat + dy * part,
        start.lng + dx * part
      );
    }

    passed += segmentLength;
  }

  return null;
}

// Возвращает часть маршрута до указанного расстояния
function getRoutePointsUpToDistance(points, targetDistance) {
  if (!points.length) return [];

  if (targetDistance <= 0) {
    return [points[0]];
  }

  const totalLength = getRouteLength(points);

  if (targetDistance >= totalLength) {
    return [...points];
  }

  const result = [points[0]];
  let passed = 0;

  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];

    const dy = end.lat - start.lat;
    const dx = end.lng - start.lng;
    const segmentLength = Math.sqrt(dx * dx + dy * dy);

    if (passed + segmentLength <= targetDistance + 0.001) {
      result.push(end);
      passed += segmentLength;

      if (passed >= targetDistance - 0.001) {
        break;
      }
    } else {
      const remaining = targetDistance - passed;

      if (segmentLength > 0) {
        const part = remaining / segmentLength;

        result.push(L.latLng(
          start.lat + dy * part,
          start.lng + dx * part
        ));
      }

      break;
    }
  }

  return result;
}

// Вставляет в геометрию точные точки на заданных расстояниях.
// Это гарантирует, что привалы, черты и крестики лежат непосредственно на линии.
function getRoutePointsWithDistanceAnchors(points, distances) {
  if (points.length < 2) return [...points];

  const totalLength = getRouteLength(points);
  const entries = [];
  let passed = 0;

  points.forEach((point, index) => {
    if (index > 0) {
      const previous = points[index - 1];
      passed += Math.hypot(point.lat - previous.lat, point.lng - previous.lng);
    }
    entries.push({ distance: passed, point: point });
  });

  distances.forEach(distance => {
    if (distance < -0.001 || distance > totalLength + 0.001) return;
    const point = getRoutePointAtDistance(points, Math.max(0, Math.min(totalLength, distance)));
    if (point) entries.push({ distance: Math.max(0, Math.min(totalLength, distance)), point });
  });

  entries.sort((a, b) => a.distance - b.distance);
  const result = [];
  entries.forEach(entry => {
    const last = result[result.length - 1];
    if (!last || Math.hypot(entry.point.lat - last.lat, entry.point.lng - last.lng) > 0.001) {
      result.push(entry.point);
    }
  });
  return result;
}

// Возвращает исходную геометрию маршрута между двумя расстояниями.
function getRoutePointsBetweenDistances(points, startDistance, endDistance) {
  const totalLength = getRouteLength(points);
  const start = Math.max(0, Math.min(totalLength, startDistance));
  const end = Math.max(start, Math.min(totalLength, endDistance));
  const anchored = getRoutePointsWithDistanceAnchors(points, [start, end]);
  const result = [];
  let passed = 0;

  anchored.forEach((point, index) => {
    if (index > 0) {
      const previous = anchored[index - 1];
      passed += Math.hypot(point.lat - previous.lat, point.lng - previous.lng);
    }
    if (passed >= start - 0.01 && passed <= end + 0.01) result.push(point);
  });
  return result;
}

// Угол поперечной черты в экранных координатах карты.
function getPerpendicularRouteAngle(points, targetDistance) {
  let passed = 0;
  for (let i = 1; i < points.length; i++) {
    const previous = points[i - 1];
    const current = points[i];
    const routeLength = Math.hypot(
      current.lat - previous.lat,
      current.lng - previous.lng
    );
    if (routeLength < 0.001) continue;

    if (passed + routeLength >= targetDistance - 0.001) {
      // Для направления используем экранные координаты, а для поиска
      // нужного сегмента — те же координатные единицы, что и длина маршрута.
      const a = map.latLngToLayerPoint(previous);
      const b = map.latLngToLayerPoint(current);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      return Math.atan2(dy, dx) * 180 / Math.PI + 90;
    }
    passed += routeLength;
  }
  return 90;
}

// Переводит сохранённый форсированный участок в расстояния
// для текущей дневной нормы. startUnits и lengthUnits — доли дневного пути.
function getForcedSegmentDistances(segment, dailyLimit) {
  const start = Number.isFinite(segment.startUnits)
    ? segment.startUnits * dailyLimit
    : segment.start;
  const length = Number.isFinite(segment.lengthUnits)
    ? segment.lengthUnits * dailyLimit
    : segment.end - segment.start;

  return {
    start,
    end: start + length
  };
}

// Пересчитывает все привалы для текущей дневной нормы.
// Завершённый форсированный участок считается ровно одним днём.
function getNormalRestDistances(totalLength, dailyLimit) {
  const result = [];
  const segments = routeForcedSegments
    .map(segment => getForcedSegmentDistances(segment, dailyLimit))
    .filter(segment => segment.start < totalLength + 0.01)
    .sort((a, b) => a.start - b.start);

  let previousAnchor = 0;

  function addRest(distance) {
  if (distance <= 0.001) return;

  // Если привал практически совпадает с концом маршрута,
  // привязываем его непосредственно к концу.
  if (distance > totalLength && distance - totalLength <= 0.05) {
    distance = totalLength;
  }

  if (!result.length || Math.abs(result[result.length - 1] - distance) > 0.001) {
    result.push(distance);
  }
}

  segments.forEach(segment => {
    // Обычные дневные привалы до начала форсированного участка.
    let nextRest = previousAnchor + dailyLimit;
    while (nextRest < segment.start - 0.001) {
      addRest(nextRest);
      nextRest += dailyLimit;
    }

    // Точка начала марша — привал, от которого он был начат.
    if (segment.start > previousAnchor + 0.001) {
      addRest(segment.start);
    }

    // Конец форсированного участка — следующий привал, если он
    // ещё находится в пределах проложенного маршрута.
    if (segment.end <= totalLength + 0.05) {
      addRest(segment.end);
    }
    previousAnchor = segment.end;
  });

  // Обычные дни после последнего завершённого форсированного участка.
  let nextRest = previousAnchor + dailyLimit;
  while (nextRest <= totalLength + 0.05) {
    addRest(nextRest);
    nextRest += dailyLimit;
  }

  return result;
}

// Единая отмена маршрута: вызывается кнопкой и клавишей Escape.

  if (pendingRouteClickTimer) {
    clearTimeout(pendingRouteClickTimer);
  }
  pendingRouteClickTimer = null;
  pendingRouteClickPosition = null;

  routeFinished = false;
  window.routePendingConfirmation = false;

  map.doubleClickZoom.enable();

  routeForcedMarch = false;
  routeForcedMarchStartDistance = 0;
  routeForcedMarchStartUnits = 0;
  routeForcedSegments = [];
  routePoints = [];
  lastCursorPosition = null;
  window.routeDestinationCityId = null;

  stopRouteMarkerAnimation();

// =====================================

// Слои задают строгий порядок: линии < крестики < привалы < флажок.
function ensureRouteMarkerPanes() {
  let restPane = map.getPane("route-rest-pane");
  if (!restPane) restPane = map.createPane("route-rest-pane");
  restPane.style.zIndex = "650";

  let flagPane = map.getPane("route-flag-pane");
  if (!flagPane) flagPane = map.createPane("route-flag-pane");
  flagPane.style.zIndex = "700";
}

// Объединяем крестики только тогда, когда их экранные области 28x28 px
// действительно пересекаются. Если пересекаются соседние группы, они тоже
// объединяются: A-B и B-C превращаются в одну группу A-B-C.
function getExhaustionMarkerClusters(markers, markerSize = 28) {
  const points = markers.map(item => ({
    item,
    point: map.latLngToContainerPoint(item.position)
  }));
  const parents = points.map((_, index) => index);

  function find(index) {
    while (parents[index] !== index) {
      parents[index] = parents[parents[index]];
      index = parents[index];
    }
    return index;
  }

  function unite(a, b) {
    const rootA = find(a);
    const rootB = find(b);
    if (rootA !== rootB) parents[rootB] = rootA;
  }

  // Для одинаковых квадратных значков пересечение есть, пока разница
  // по каждой оси меньше размера значка. Касание по краю не объединяем.
  for (let i = 0; i < points.length; i++) {
    for (let j = i + 1; j < points.length; j++) {
      const dx = Math.abs(points[i].point.x - points[j].point.x);
      const dy = Math.abs(points[i].point.y - points[j].point.y);
      if (dx < markerSize && dy < markerSize) unite(i, j);
    }
  }

  const groups = new Map();
  points.forEach((entry, index) => {
    const root = find(index);
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(entry);
  });

  return Array.from(groups.values()).map(group => {
    const items = group.map(entry => entry.item);

    if (items.length === 1) {
      return {
        position: items[0].position,
        count: 1,
        distances: [items[0].distance]
      };
    }

    // Ставим общий маркер в геометрическую середину группы на экране.
    const minX = Math.min(...group.map(entry => entry.point.x));
    const maxX = Math.max(...group.map(entry => entry.point.x));
    const minY = Math.min(...group.map(entry => entry.point.y));
    const maxY = Math.max(...group.map(entry => entry.point.y));
    const center = L.point((minX + maxX) / 2, (minY + maxY) / 2);

    return {
      position: map.containerPointToLatLng(center),
      count: items.length,
      distances: items.map(item => item.distance)
    };
  });
}

function updateRouteLine(cursorPosition = null) {
  // Перерисовка карты не отменяет и не перезапускает анимацию жетонов.
  // Время анимации учитывается при создании каждого нового DOM-элемента.
  ensureRouteMarkerPanes();

  // Для preview используем те же расчёты, что и для зафиксированного маршрута,
  // но ничего не записываем в состояние до клика.
  const pointsToDraw = [...routePoints];
  if (cursorPosition && hasMouse && window.routeMode) {
    pointsToDraw.push(cursorPosition);
  }

  clearRouteDrawing();

  const totalLength = getRouteLength(pointsToDraw);
  const dailyLimit =
    routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);

  // Активный марш также привязан к текущей дневной норме.
  // Если новая точка начала пока дальше проложенного пути, она проявится
  // по мере дальнейшего построения маршрута.
  if (routeForcedMarch) {
    routeForcedMarchStartDistance = routeForcedMarchStartUnits * dailyLimit;
  }

  const restCalculationLength = routeForcedMarch
    ? routeForcedMarchStartDistance
    : totalLength;
  const restDistancesToDraw = getNormalRestDistances(
    restCalculationLength,
    dailyLimit
  );

  // Подготовим историю завершённых маршей и текущий активный марш.
  const forcedVisualSegments = routeForcedSegments
    .map(segment => getForcedSegmentDistances(segment, dailyLimit))
    .filter(segment => segment.start < totalLength + 0.01)
    .map(segment => ({
      start: segment.start,
      end: Math.min(segment.end, totalLength),
      // Черта и интервалы крестиков всегда пересчитываются
      // по текущему темпу, а не по темпу в момент выключения марша.
      dailyLimit: dailyLimit
    }));

  if (routeForcedMarch) {
    forcedVisualSegments.push({
      start: routeForcedMarchStartDistance,
      end: totalLength,
      dailyLimit: dailyLimit,
      active: true
    });
  }

  const protectedDistances = [...restDistancesToDraw];
  forcedVisualSegments.forEach(segment => {
    const boundary = segment.start + segment.dailyLimit;
    if (boundary <= segment.end + 0.01) protectedDistances.push(boundary);
    const interval = segment.dailyLimit / 8;
    for (let d = boundary + interval; d <= segment.end + 0.01; d += interval) {
      protectedDistances.push(d);
    }
    protectedDistances.push(segment.end);
  });

  // Вставляем реальные точки привалов и отметок в исходную геометрию.
  const anchoredPoints = getRoutePointsWithDistanceAnchors(
    pointsToDraw,
    protectedDistances
  );

  // ВАЖНО: сначала формируем одну общую сглаженную геометрию всего маршрута,
  // и только затем нарезаем её на анимируемые фрагменты. Иначе каждый короткий
  // фрагмент сглаживается отдельно и на время проявления превращается в прямую.
  const displayRoutePoints = createRouteDisplayPoints(
    pointsToDraw,
    protectedDistances
  );
  const displayRouteLength = getRouteLength(displayRoutePoints);

  // Основная линия маршрута.
  // Разделяем маршрут на золотые и чёрные участки.
  // Золотая линия не рисуется там, где должен идти форсированный марш.

  const blackIntervals = forcedVisualSegments
    .map(segment => ({
      start: segment.start + segment.dailyLimit,
      end: segment.end
    }))
    .filter(interval => interval.end > interval.start + 0.001)
    .sort((a, b) => a.start - b.start);

  // Объединяем пересекающиеся чёрные участки.
  const mergedBlackIntervals = [];

  blackIntervals.forEach(interval => {
    const previous = mergedBlackIntervals[mergedBlackIntervals.length - 1];

    if (previous && interval.start <= previous.end + 0.001) {
      previous.end = Math.max(previous.end, interval.end);
    } else {
      mergedBlackIntervals.push({
        start: interval.start,
        end: interval.end
      });
    }
  });

  // При движении мыши отделяем уже зафиксированный маршрут
  // от полупрозрачного предпросмотра.
  const previewIsActive =
    Boolean(cursorPosition && hasMouse && window.routeMode);

  const committedLength = getRouteLength(routePoints);

  // Универсальное создание отрезка маршрута.
  function drawRoutePiece(
    startDistance,
    endDistance,
    color,
    committedOpacity,
    previewOpacity
  ) {
    if (endDistance - startDistance < 0.001) return;

    function addPiece(from, to, opacity) {
      if (to - from < 0.001) return;

      // Делим участок только по границам анимаций. Сами штрихи линии
      // проявляются последовательно от начала нового отрезка к его концу.
      const boundaries = [from, to];
      routeMarkerAnimations.forEach(animation => {
        if (animation.start > from && animation.start < to) boundaries.push(animation.start);
        if (animation.end > from && animation.end < to) boundaries.push(animation.end);
      });
      boundaries.sort((a, b) => a - b);

      for (let part = 0; part < boundaries.length - 1; part++) {
        const partStart = boundaries[part];
        const partEnd = boundaries[part + 1];
        if (partEnd - partStart < 0.001) continue;

        const midpoint = (partStart + partEnd) / 2;
        const activeAnimation = getRouteMarkerAnimation(midpoint);

        // Отдельно рассчитываем экранную геометрию участка. Активная линия
        // будет рисоваться не крупными отрывками, а короткими штрихами.
        const partDisplayStart = totalLength > 0.001
          ? partStart / totalLength * displayRouteLength
          : 0;
        const partDisplayEnd = totalLength > 0.001
          ? partEnd / totalLength * displayRouteLength
          : displayRouteLength;
        const sectionPoints = getRoutePointsBetweenDistances(
          displayRoutePoints,
          partDisplayStart,
          partDisplayEnd
        );
        if (sectionPoints.length < 2) continue;

        const localProtectedDistances = protectedDistances
          .filter(distance =>
            distance >= partStart - 0.01 &&
            distance <= partEnd + 0.01
          )
          .map(distance => distance - partStart);
        const partDisplayPoints = createRouteDisplayPoints(
          sectionPoints,
          localProtectedDistances
        );

        const screenEntries = [];
        let partScreenLength = 0;
        partDisplayPoints.forEach((point, index) => {
          const layerPoint = map.latLngToLayerPoint(point);
          if (index > 0) {
            partScreenLength += layerPoint.distanceTo(screenEntries[index - 1].layerPoint);
          }
          screenEntries.push({ point, layerPoint, distance: partScreenLength });
        });

        if (!activeAnimation) {
          const line = L.polyline(partDisplayPoints, {
            color: color,
            weight: 4.5,
            dashArray: "8, 10",
            opacity: opacity,
            lineCap: "round",
            lineJoin: "round",
            className: "route-line-raised"
          }).addTo(map);
          routeRestMarkers.push(line);
          continue;
        }

        // Получаем кусочек кривой между двумя расстояниями в экранных пикселях.
        // Так каждый штрих сохраняет кривизну общего маршрута.
        function getScreenPointAtDistance(targetDistance) {
          if (targetDistance <= 0) return screenEntries[0].layerPoint;
          if (targetDistance >= partScreenLength) {
            return screenEntries[screenEntries.length - 1].layerPoint;
          }
          for (let i = 1; i < screenEntries.length; i++) {
            const previous = screenEntries[i - 1];
            const current = screenEntries[i];
            if (current.distance >= targetDistance) {
              const segmentLength = current.distance - previous.distance;
              const t = segmentLength > 0.001
                ? (targetDistance - previous.distance) / segmentLength
                : 0;
              return L.point(
                previous.layerPoint.x + (current.layerPoint.x - previous.layerPoint.x) * t,
                previous.layerPoint.y + (current.layerPoint.y - previous.layerPoint.y) * t
              );
            }
          }
          return screenEntries[screenEntries.length - 1].layerPoint;
        }

        function getScreenLinePoints(startPx, endPx) {
          const points = [getScreenPointAtDistance(startPx)];
          screenEntries.forEach(entry => {
            if (entry.distance > startPx + 0.01 && entry.distance < endPx - 0.01) {
              points.push(entry.layerPoint);
            }
          });
          points.push(getScreenPointAtDistance(endPx));
          return points.map(point => map.layerPointToLatLng(point));
        }

        const globalScreenStart = getRouteScreenDistanceAtDistance(
          displayRoutePoints,
          partDisplayStart
        );
        const elapsed = Date.now() - activeAnimation.startedAt;

        // Привязываем пунктир к единой экранной шкале всего отрезка, чтобы
        // при внутренних границах (например, у привалов) рисунок не сбивался.
        const firstDashIndex = Math.max(
          0,
          Math.floor((globalScreenStart - activeAnimation.lineStartScreen) / routeLineDashStep)
        );
        const partGlobalScreenEnd = globalScreenStart + partScreenLength;

        for (let dashIndex = firstDashIndex; ; dashIndex++) {
          const dashGlobalStart = activeAnimation.lineStartScreen + dashIndex * routeLineDashStep;
          if (dashGlobalStart >= partGlobalScreenEnd - 0.01) break;

          const dashGlobalEnd = dashGlobalStart + routeLineDashLength;
          const dashStart = Math.max(0, dashGlobalStart - globalScreenStart);
          const dashEnd = Math.min(partScreenLength, dashGlobalEnd - globalScreenStart);
          if (dashEnd - dashStart < 2) continue;

          // Очередь каждого штриха идёт от начальной точки. Интервал
          // постепенно уменьшается, поэтому линия плавно набирает скорость.
          const delay = getRouteLineRevealDelay(dashIndex) - elapsed;
          const dashPoints = getScreenLinePoints(dashStart, dashEnd);
          if (dashPoints.length < 2) continue;

          const line = L.polyline(dashPoints, {
            color: color,
            weight: 4.5,
            opacity: 0,
            lineCap: "round",
            lineJoin: "round",
            className: "route-line-raised route-line-reveal"
          }).addTo(map);

          const path = line.getElement();
          if (path) {
            path.style.setProperty("--route-line-opacity", String(opacity));
            path.style.animationDuration = `${routeLineRevealFadeDuration}ms`;
            path.style.animationDelay = `${delay}ms`;
          }
          routeRestMarkers.push(line);
        }
      }
    }

    if (!previewIsActive) {
      addPiece(startDistance, endDistance, committedOpacity);
      return;
    }

    // Весь отрезок уже зафиксирован.
    if (endDistance <= committedLength + 0.001) {
      addPiece(startDistance, endDistance, committedOpacity);
      return;
    }

    // Весь отрезок относится к предпросмотру.
    if (startDistance >= committedLength - 0.001) {
      addPiece(startDistance, endDistance, previewOpacity);
      return;
    }

    // Отрезок пересекает границу между маршрутом и предпросмотром.
    addPiece(startDistance, committedLength, committedOpacity);
    addPiece(committedLength, endDistance, previewOpacity);
  }

  // Рисуем золотые участки, пропуская все чёрные интервалы.
  let goldStart = 0;

  mergedBlackIntervals.forEach(interval => {
    if (interval.start > goldStart + 0.001) {
      drawRoutePiece(
        goldStart,
        interval.start,
        "#e2b95f",
        1.0,
        0.22
      );
    }

    goldStart = Math.max(goldStart, interval.end);
  });

  // Последний золотой участок после всех форсированных маршей.
  if (goldStart < totalLength - 0.001) {
    drawRoutePiece(
      goldStart,
      totalLength,
      "#e2b95f",
      1.0,
      0.22
    );
  }

  // Визуал форсированных маршей остаётся на карте и после их завершения.
  forcedVisualSegments.forEach(segment => {
    const boundaryDistance = segment.start + segment.dailyLimit;
    if (boundaryDistance > segment.end + 0.01) return;

    const boundaryPosition = getRoutePointAtDistance(pointsToDraw, boundaryDistance);
    if (!boundaryPosition) return;

    // Чёрная линия после разделительной черты —
    // до привала, которым завершился форсированный марш.
    drawRoutePiece(
      boundaryDistance,
      segment.end,
      "#171717",
      1.0,
      0.26
    );

    // Направление черты всегда перпендикулярно касательной маршрута.
    const angle = getPerpendicularRouteAngle(pointsToDraw, boundaryDistance);
    const boundaryIsPreview =
      previewIsActive && boundaryDistance > committedLength + 0.001;
    const boundaryAnimationDelay =
      getRouteMarkerAnimationDelay(boundaryDistance);
    const boundaryShouldAnimate = boundaryAnimationDelay !== null;

    const boundaryIcon = L.divIcon({
      className:
        "route-march-boundary" +
        (boundaryIsPreview ? " route-preview-marker" : ""),
      html: `<div class="${boundaryShouldAnimate ? "route-token-appear" : ""}" style="--route-animation-delay:${boundaryAnimationDelay || 0}ms;width:30px;height:4px;"><div style="width:30px;height:4px;background:#e6c77d;border:1px solid #211b16;border-radius:1px;transform:rotate(${angle}deg);box-shadow:1px 2px 4px #000;"></div></div>`,
      iconSize: [32, 6],
      iconAnchor: [16, 3]
    });
    const boundaryMarker = L.marker(boundaryPosition, {
      icon: boundaryIcon,
      interactive: false,
      keyboard: false,
      zIndexOffset: 1100
    }).addTo(map);
    routeRestMarkers.push(boundaryMarker);

    // Крестики истощения — каждые 1/8 дневной нормы после черты.
    const interval = segment.dailyLimit / 8;
    const exhaustionPositions = [];

    for (let distance = boundaryDistance + interval;
         distance <= segment.end + 0.01;
         distance += interval) {
      const position = getRoutePointAtDistance(pointsToDraw, distance);
      if (position) exhaustionPositions.push({ distance, position });
    }

    // Если при отдалении карты крестики сблизились, объединяем их.
    const exhaustionClusters = getExhaustionMarkerClusters(
      exhaustionPositions,
      28
    );

    exhaustionClusters.forEach(cluster => {
      const exhaustionIsPreview =
        previewIsActive &&
        cluster.distances.some(distance => distance > committedLength + 0.001);

      const exhaustionAnimationCandidates = cluster.distances
        .map(distance => ({
          distance,
          delay: getRouteMarkerAnimationDelay(distance)
        }))
        .filter(item => item.delay !== null)
        .sort((a, b) => a.delay - b.delay);
      const exhaustionAnimationDelay = exhaustionAnimationCandidates.length
        ? exhaustionAnimationCandidates[0].delay
        : null;
      const exhaustionShouldAnimate = exhaustionAnimationDelay !== null;

      const countBadge = cluster.count > 1
        ? `<span class="route-exhaustion-count">${cluster.count}</span>`
        : "";

      const exhaustionIcon = L.divIcon({
        className:
          "route-exhaustion-mark" +
          (exhaustionIsPreview ? " route-preview-marker" : ""),
        html: `<div class="${exhaustionShouldAnimate ? "route-token-appear" : ""}" style="--route-animation-delay:${exhaustionAnimationDelay || 0}ms;width:${cluster.count > 1 ? 56 : 28}px;height:${cluster.count > 1 ? 56 : 28}px;"><div class="route-exhaustion-cluster${cluster.count > 1 ? " route-exhaustion-clustered" : ""}"><span class="route-exhaustion-glyph">×</span>${countBadge}</div></div>`,
        iconSize: cluster.count > 1 ? [56, 56] : [28, 28],
        iconAnchor: cluster.count > 1 ? [28, 28] : [14, 14]
      });
      const marker = L.marker(cluster.position, {
        icon: exhaustionIcon,
        interactive: false,
        keyboard: false,
        zIndexOffset: 1100
      }).addTo(map);
      routeRestMarkers.push(marker);
    });
  });

  // Обычные привалы рисуем после всех линий и отметок,
  // чтобы они всегда оставались поверх маршрута.
  restDistancesToDraw.forEach(distance => {
    if (distance > totalLength + 0.01) return;

    const position = getRoutePointAtDistance(pointsToDraw, distance);
    if (!position) return;

    const restIsPreview =
      previewIsActive && distance > committedLength + 0.001;
    const restAnimationDelay = getRouteMarkerAnimationDelay(distance);
    const restShouldAnimate = restAnimationDelay !== null;

    const marker = L.circleMarker(position, {
      pane: "route-rest-pane",
      radius: 7,
      color: "#211b16",
      weight: 2,
      fillColor: "#e6c77d",
      fillOpacity: restIsPreview ? 0.72 : 1,
      opacity: restIsPreview ? 0.78 : 1,
      interactive: false,
      className:
        "route-rest-raised" +
        (restIsPreview ? " route-preview-marker" : "") +
        (restShouldAnimate ? " route-marker-appear" : "")
    }).addTo(map);

    if (restShouldAnimate) {
      const element = marker.getElement();
      if (element) {
        element.style.animationDelay = `${restAnimationDelay}ms`;
      }
    }

    // Привал находится в отдельном слое выше крестиков.
    marker.bringToFront();
    routeRestMarkers.push(marker);
  });

  // Флажок конечной точки.
  if (routeFinished && routePoints.length >= 2) {
    const endPoint = routePoints[routePoints.length - 1];
    const flagIcon = L.divIcon({
      className: "route-end-flag",
      html: `<div style="font-size:30px;line-height:30px;color:#e6c77d;text-shadow:1px 2px 4px #000;">⚑</div>`,
      iconSize: [24, 30],
      iconAnchor: [5, 28]
    });
    routeEndMarker = L.marker(endPoint, {
      pane: "route-flag-pane",
      icon: flagIcon,
      interactive: false,
      keyboard: false,
      zIndexOffset: 1200
    }).addTo(map);
  }

  // Информация в панели.
  if (routePanel) {
    document.getElementById("route-daily-limit").textContent =
      (dailyLimit * KM_PER_PIXEL).toFixed(1) + " км";
    document.getElementById("route-distance").textContent =
      (totalLength * KM_PER_PIXEL).toFixed(1) + " км";

    const completedDays = routeForcedMarch
      ? getNormalRestDistances(routeForcedMarchStartDistance, dailyLimit).length
      : getNormalRestDistances(totalLength, dailyLimit).length;
    document.getElementById("route-days").textContent = completedDays;

    routeConfirmButton.disabled = !routeFinished;

    const forcedButton = document.getElementById("route-forced-march");
    if (forcedButton) {
      forcedButton.disabled = routeFinished || window.routePendingConfirmation;
    }

    document.getElementById("route-undo").disabled = routePoints.length <= 1;
  }

  console.log("Длина маршрута:", Math.round(totalLength));
}

window.addPartyRoutePoint = function(latlng) {
  const previousLength = getRouteLength(routePoints);
  routePoints.push(latlng);

  beginRouteMarkerAnimation(
    previousLength,
    getRouteLength(routePoints)
  );

  lastCursorPosition = null;
  updateRouteLine(null, true);

  console.log("Точки маршрута:", routePoints);
};

// Завершение построения маршрута
function finishPartyRoute(latlng) {
  const previousLength = getRouteLength(routePoints);

  // Добавляем последнюю точку, если она отличается от предыдущей
  const lastPoint = routePoints[routePoints.length - 1];

  if (
    !lastPoint ||
    map.latLngToContainerPoint(lastPoint)
      .distanceTo(map.latLngToContainerPoint(latlng)) > (window.routeDestinationCityId ? 0.05 : 3)
  ) {
    routePoints.push(latlng);
  }

  // Маршрут должен содержать хотя бы одну линию
  if (routePoints.length < 2) {
    console.log("Для завершения маршрута нужна хотя бы одна точка");
    return;
  }

  beginRouteMarkerAnimation(
    previousLength,
    getRouteLength(routePoints)
  );

  routeFinished = true;
  window.routeMode = false;
  window.routePendingConfirmation = true;

  lastCursorPosition = null;

  // Возвращаем обычное приближение двойным кликом
  map.doubleClickZoom.enable();

  updateRouteLine(null, true);

  console.log("Маршрут завершён:", routePoints);
}

// Обработка одиночного и двойного клика
window.handlePartyRouteClick = function(latlng) {
  if (!window.routeMode || routeFinished) return;

  // Клик внутри невидимой области поселения автоматически завершает маршрут.
  // Конечная точка линии — ближайшая точка границы от последней точки пути.
  const destinationArea = findSettlementAt(latlng);
  if (destinationArea && routePoints.length > 0) {
    if (pendingRouteClickTimer) clearTimeout(pendingRouteClickTimer);
    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;

    const approachPoint = routePoints[routePoints.length - 1];
    const boundary = findNearestSettlementBoundaryPoint(
      approachPoint,
      destinationArea.points
    );

    if (boundary) {
      window.routeDestinationCityId = destinationArea.id;
      window.routeDestinationBoundaryPoint = boundary.point;
      finishPartyRoute(boundary.point);
      console.log("Маршрут завершён у поселения:", destinationArea.type, destinationArea.id);
      return;
    }
  }

  // Если уже ожидается одиночный клик,
  // проверяем, является ли новый клик вторым
  if (pendingRouteClickTimer) {
    const firstPoint = map.latLngToContainerPoint(
      pendingRouteClickPosition
    );

    const secondPoint = map.latLngToContainerPoint(latlng);

    const distance = firstPoint.distanceTo(secondPoint);

    // Два клика рядом друг с другом — завершаем маршрут
    if (distance <= 30) {
      clearTimeout(pendingRouteClickTimer);

      pendingRouteClickTimer = null;
      pendingRouteClickPosition = null;

      finishPartyRoute(latlng);
      return;
    }

    // Если второй клик далеко — фиксируем предыдущий
    clearTimeout(pendingRouteClickTimer);

    window.addPartyRoutePoint(pendingRouteClickPosition);

    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
  }

  // Запоминаем новый клик
  pendingRouteClickPosition = latlng;

  // Ждём 300 мс: если второго клика не будет,
  // добавляем обычную точку маршрута
  pendingRouteClickTimer = setTimeout(function() {
    window.addPartyRoutePoint(pendingRouteClickPosition);

    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
  }, 180);
};

 // =====================================
  // НЕВИДИМЫЕ ОБЛАСТИ ГОРОДОВ И ДЕРЕВЕНЬ
  // =====================================

  function pointInSettlement(point, polygon) {
    const x = point.lng;
    const y = point.lat;
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const xi = polygon[i].lng, yi = polygon[i].lat;
      const xj = polygon[j].lng, yj = polygon[j].lat;
      const intersects = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / ((yj - yi) || 0.0000001) + xi);
      if (intersects) inside = !inside;
    }
    return inside;
  }

  function findSettlementAt(point) {
    // Если области пересекаются, выбираем самую маленькую: это наиболее
    // конкретное поселение, в которое попал курсор.
    const matches = window.settlementAreas.filter(area =>
      Array.isArray(area.points) && area.points.length >= 3 &&
      pointInSettlement(point, area.points)
    );
    if (!matches.length) return null;
    return matches.sort((a, b) => polygonArea(a.points) - polygonArea(b.points))[0];
  }

  function polygonArea(points) {
    let area = 0;
    for (let i = 0; i < points.length; i++) {
      const next = points[(i + 1) % points.length];
      area += points[i].lng * next.lat - next.lng * points[i].lat;
    }
    return Math.abs(area / 2);
  }

  function findNearestSettlementBoundaryPoint(origin, polygon) {
    if (!polygon || polygon.length < 3) return null;
    const originPoint = map.latLngToLayerPoint(origin);
    let best = null;
    let bestDistance = Infinity;

    for (let i = 0; i < polygon.length; i++) {
      const a = map.latLngToLayerPoint(polygon[i]);
      const b = map.latLngToLayerPoint(polygon[(i + 1) % polygon.length]);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const lengthSquared = dx * dx + dy * dy;
      const t = lengthSquared > 0
        ? Math.max(0, Math.min(1, ((originPoint.x - a.x) * dx + (originPoint.y - a.y) * dy) / lengthSquared))
        : 0;
      const projected = L.point(a.x + t * dx, a.y + t * dy);
      const distance = originPoint.distanceTo(projected);
      if (distance < bestDistance) {
        bestDistance = distance;
        best = {
          point: map.layerPointToLatLng(projected),
          segmentIndex: i,
          segmentT: t
        };
      }
    }
    return best;
  }

  function buildSettlementTrace(area, startPoint) {
    const points = area.points;
    const nearest = findNearestSettlementBoundaryPoint(startPoint, points);
    if (!nearest) return [];

    const index = nearest.segmentIndex;
    const nextIndex = (index + 1) % points.length;
    const previousIndex = (index - 1 + points.length) % points.length;
    const approachOrigin = routePoints.length >= 2
      ? routePoints[routePoints.length - 2]
      : startPoint;
    const approach = map.latLngToLayerPoint(nearest.point)
      .subtract(map.latLngToLayerPoint(approachOrigin));
    const forward = map.latLngToLayerPoint(points[nextIndex])
      .subtract(map.latLngToLayerPoint(nearest.point));
    const backward = map.latLngToLayerPoint(points[index])
      .subtract(map.latLngToLayerPoint(nearest.point));
    const direction = approach.dot(forward) >= approach.dot(backward) ? 1 : -1;

    const result = [nearest.point];
    if (direction === 1) {
      result.push(points[nextIndex]);
      for (let step = 1; step < points.length; step++) {
        result.push(points[(nextIndex + step) % points.length]);
      }
    } else {
      result.push(points[index]);
      for (let step = 1; step < points.length; step++) {
        result.push(points[(index - step + points.length) % points.length]);
      }
    }
    result.push(nearest.point);
    return result;
  }

  function animateSettlementTrace(area) {
    const startPoint = window.routeDestinationBoundaryPoint || routePoints[routePoints.length - 1];
    const tracePoints = buildSettlementTrace(area, startPoint);
    if (tracePoints.length < 3) return;

    // Временный визуальный слой существует только во время анимации.
    // После завершения он удаляется: сохранённый контур всегда невидим.
    const traceLine = L.polyline([tracePoints[0]], {
      color: "#21170f",
      weight: 3,
      opacity: 0.95,
      lineCap: "round",
      lineJoin: "round",
      interactive: false
    }).addTo(map);

    const screenPoints = tracePoints.map(point => map.latLngToLayerPoint(point));
    const segmentLengths = [];
    let totalLength = 0;
    for (let i = 1; i < screenPoints.length; i++) {
      const length = screenPoints[i - 1].distanceTo(screenPoints[i]);
      segmentLengths.push(length);
      totalLength += length;
    }

    const duration = Math.max(1800, Math.min(9000, totalLength * 5));
    const startedAt = performance.now();
    let animationFrame = null;

    function frame(now) {
      const progress = Math.min(1, (now - startedAt) / duration);
      let remaining = totalLength * progress;
      const drawn = [tracePoints[0]];

      for (let i = 0; i < segmentLengths.length; i++) {
        const segmentLength = segmentLengths[i];
        if (remaining >= segmentLength) {
          drawn.push(tracePoints[i + 1]);
          remaining -= segmentLength;
        } else {
          if (segmentLength > 0.001 && remaining > 0) {
            const ratio = remaining / segmentLength;
            drawn.push(L.latLng(
              tracePoints[i].lat + (tracePoints[i + 1].lat - tracePoints[i].lat) * ratio,
              tracePoints[i].lng + (tracePoints[i + 1].lng - tracePoints[i].lng) * ratio
            ));
          }
          break;
        }
      }

      traceLine.setLatLngs(drawn);
      if (progress < 1) {
        animationFrame = requestAnimationFrame(frame);
      } else {
        setTimeout(function() {
          if (map.hasLayer(traceLine)) map.removeLayer(traceLine);
        }, 900);
      }
    }
    animationFrame = requestAnimationFrame(frame);
  }

  function waitForRouteRevealThenTraceSettlement(cityId) {
    const startedAt = Date.now();
    function check() {
      if (!routeMarkerAnimations.length || Date.now() - startedAt > 30000) {
        const area = window.settlementAreas.find(item => item.id === cityId);
        if (area) animateSettlementTrace(area);
        return;
      }
      setTimeout(check, 100);
    }
    check();
  }

  function createSettlementToolbar() {
    if (window.settlementToolbar || !window.dndFirebase || !window.dndFirebase.isGameMaster) return;
    const toolbar = document.createElement("div");
    toolbar.id = "settlement-tools";
    toolbar.style.cssText = `
      position:fixed;top:12px;right:12px;z-index:3500;
      display:flex;flex-direction:column;gap:7px;padding:10px;
      background:#211b16;color:#eee2c8;border:2px solid #d6b46a;
      border-radius:9px;box-shadow:0 3px 14px #0009;font:13px Georgia,serif;
      max-width:190px;
    `;
    toolbar.innerHTML = `
      <div style="font-weight:bold;text-align:center;">Области поселений</div>
      <button type="button" data-settlement-type="city">Обвести город</button>
      <button type="button" data-settlement-type="village">Обвести деревню</button>
      <button type="button" id="settlement-draw-cancel" disabled>Отменить обводку</button>
      <div id="settlement-tool-status" style="line-height:1.35;opacity:.85;">Выбери тип поселения, затем зажми кнопку мыши и обведи его.</div>
    `;
    document.body.appendChild(toolbar);
    window.settlementToolbar = toolbar;

    toolbar.querySelectorAll("[data-settlement-type]").forEach(button => {
      button.style.cssText = "padding:7px;background:#393027;color:#eee2c8;border:1px solid #756044;border-radius:5px;";
      button.addEventListener("click", function() {
        beginSettlementDrawing(this.dataset.settlementType);
      });
    });
    const cancel = toolbar.querySelector("#settlement-draw-cancel");
    cancel.style.cssText = "padding:6px;background:#4a2924;color:#fff;border:1px solid #8d5146;border-radius:5px;";
    cancel.addEventListener("click", cancelSettlementDrawing);

    map.getContainer().addEventListener("pointerdown", handleSettlementPointerDown, true);
    map.getContainer().addEventListener("pointermove", handleSettlementPointerMove, true);
    map.getContainer().addEventListener("pointerup", handleSettlementPointerUp, true);
    map.getContainer().addEventListener("pointercancel", cancelSettlementDrawing, true);
  }

  function setSettlementToolStatus(message) {
    const status = document.getElementById("settlement-tool-status");
    if (status) status.textContent = message;
    const cancel = document.getElementById("settlement-draw-cancel");
    if (cancel) cancel.disabled = !window.settlementDrawingMode;
  }

  function beginSettlementDrawing(type) {
    if (!window.dndFirebase || !window.dndFirebase.isGameMaster) return;
    cancelSettlementDrawing();
    window.settlementDrawingMode = type;
    window.settlementDrawingActive = true;
    window.settlementDraft = [];
    map.dragging.disable();
    map.doubleClickZoom.disable();
    map.getContainer().style.touchAction = "none";
    setSettlementToolStatus(type === "city"
      ? "Зажми левую кнопку и обведи весь город. Отпусти, чтобы сохранить."
      : "Зажми левую кнопку и обведи всю деревню. Отпусти, чтобы сохранить.");
  }

  function handleSettlementPointerDown(event) {
    if (!window.settlementDrawingMode || event.button !== 0) return;
    event.preventDefault();
    event.stopPropagation();
    window.settlementPointerDown = true;
    window.settlementDraft = [map.mouseEventToLatLng(event)];
    if (window.settlementDraftLine && map.hasLayer(window.settlementDraftLine)) map.removeLayer(window.settlementDraftLine);
    window.settlementDraftLine = L.polyline(window.settlementDraft, {
      color: "#f0d18a", weight: 3, opacity: 0.95,
      lineCap: "round", lineJoin: "round", interactive: false
    }).addTo(map);
    try { map.getContainer().setPointerCapture(event.pointerId); } catch (_) {}
  }

  function handleSettlementPointerMove(event) {
    if (!window.settlementDrawingMode || !window.settlementPointerDown) return;
    event.preventDefault();
    event.stopPropagation();
    const point = map.mouseEventToLatLng(event);
    const previous = window.settlementDraft[window.settlementDraft.length - 1];
    if (map.latLngToContainerPoint(previous).distanceTo(map.latLngToContainerPoint(point)) >= 4) {
      window.settlementDraft.push(point);
      window.settlementDraftLine.setLatLngs(window.settlementDraft);
    }
  }

  async function handleSettlementPointerUp(event) {
    if (!window.settlementDrawingMode || !window.settlementPointerDown) return;
    event.preventDefault();
    event.stopPropagation();
    const finalPoint = map.mouseEventToLatLng(event);
    const previous = window.settlementDraft[window.settlementDraft.length - 1];
    if (!previous || map.latLngToContainerPoint(previous).distanceTo(map.latLngToContainerPoint(finalPoint)) > 1) {
      window.settlementDraft.push(finalPoint);
    }
    window.settlementPointerDown = false;
    settlementJustDrew = true;
    setTimeout(function() { settlementJustDrew = false; }, 350);
    try { map.getContainer().releasePointerCapture(event.pointerId); } catch (_) {}

    if (window.settlementDraft.length < 8 || polygonArea(window.settlementDraft) < 100) {
      setSettlementToolStatus("Контур слишком маленький. Попробуй обвести поселение ещё раз.");
      if (window.settlementDraftLine && map.hasLayer(window.settlementDraftLine)) map.removeLayer(window.settlementDraftLine);
      window.settlementDraftLine = null;
      window.settlementDraft = [];
      return;
    }

    // Замыкаем область автоматически; после сохранения линия исчезнет.
    const type = window.settlementDrawingMode;
    const area = {
      id: "settlement_" + Date.now() + "_" + Math.floor(Math.random() * 100000),
      type: type,
      points: window.settlementDraft.map(point => ({ lat: point.lat, lng: point.lng })),
      entrancePoints: [],
      exitPoints: [],
      createdAt: Date.now()
    };

    try {
      if (!window.dndFirebase || typeof window.dndFirebase.saveSettlementAreas !== "function") {
        throw new Error("Firebase ещё не готов к сохранению поселений");
      }
      await window.dndFirebase.saveSettlementAreas(area);
      setSettlementToolStatus(type === "city"
        ? "Город сохранён. Его контур теперь невидим для всех игроков."
        : "Деревня сохранена. Её контур теперь невидим для всех игроков.");
    } catch (error) {
      console.error("Не удалось сохранить область поселения:", error);
      setSettlementToolStatus("Ошибка сохранения: " + error.message);
      alert("Не удалось сохранить поселение в Firebase: " + error.message);
    }

    if (window.settlementDraftLine && map.hasLayer(window.settlementDraftLine)) map.removeLayer(window.settlementDraftLine);
    window.settlementDraftLine = null;
    window.settlementDraft = [];
    window.settlementDrawingMode = null;
    window.settlementDrawingActive = false;
    map.dragging.enable();
    map.doubleClickZoom.enable();
    map.getContainer().style.touchAction = "";
    setSettlementToolStatus(type === "city"
      ? "Город сохранён. Можно обвести следующий город или деревню."
      : "Деревня сохранена. Можно обвести следующий город или деревню.");
  }

  function cancelSettlementDrawing() {
    window.settlementPointerDown = false;
    window.settlementDrawingMode = null;
    window.settlementDrawingActive = false;
    window.settlementDraft = [];
    if (window.settlementDraftLine && map.hasLayer(window.settlementDraftLine)) map.removeLayer(window.settlementDraftLine);
    window.settlementDraftLine = null;
    if (map.dragging) map.dragging.enable();
    if (map.doubleClickZoom) map.doubleClickZoom.enable();
    if (map.getContainer) map.getContainer().style.touchAction = "";
    setSettlementToolStatus("Обводка отменена. Выбери город или деревню.");
  }

  function initializeSettlementAreas() {
    // Храним флаг на window, чтобы он был доступен независимо от
    // области видимости, в которой оказался обработчик инициализации.
    if (window.settlementListenerStarted) return;
    window.settlementListenerStarted = true;
    const areasRef = ref(database, "settlements/areas");
    window.dndFirebase.saveSettlementAreas = async function(area) {
      if (!window.dndFirebase.ready || !window.dndFirebase.isGameMaster) {
        throw new Error("Создавать поселения может только ведущий");
      }
      await set(ref(database, "settlements/areas/" + area.id), area);
    };

    onValue(areasRef, function(snapshot) {
      const value = snapshot.val() || {};
      window.settlementAreas = Object.keys(value).map(key => ({
        ...value[key], id: value[key].id || key
      })).filter(area => Array.isArray(area.points) && area.points.length >= 3);
      console.log("Области поселений загружены:", window.settlementAreas.length);
    }, function(error) {
      console.error("Ошибка загрузки областей поселений:", error);
    });

    createSettlementToolbar();
  }

 // Тестовая проверка общей базы
  window.testFirebase = async function() {
    const testRef = ref(database, "connectionTest");

    try {
      await set(testRef, {
        message: "Связь работает!",
        updatedAt: Date.now()
      });

      const snapshot = await get(testRef);

      console.log("Проверка Firebase:", snapshot.val());
      alert("Успешно! Firebase записывает и читает данные.");
    } catch (error) {
      console.error("Ошибка Firebase:", error);
      alert("Ошибка Firebase: " + error.message);
    }
  };

  // Делаем Firebase доступным для следующих частей нашей системы.
  // Каждому UID соответствует собственный узел личных меток.
  window.dndFirebase = {
    app: app,
    auth: auth,
    database: database,
    uid: null,
    ready: false,
    isGameMaster: false,
    savePersonalMarkers: null,
    saveSettlementAreas: null
  };

  async function initializePersonalMarkers(uid) {
    const personalMarkersRef = ref(database, "players/" + uid + "/markers");

    // Метод записи доступен только после подтверждённой авторизации.
    window.dndFirebase.savePersonalMarkers = async function(markers) {
      if (!window.dndFirebase.ready || window.dndFirebase.uid !== uid) {
        throw new Error("Firebase ещё не готов для сохранения личных меток");
      }

      const data = {};
      (Array.isArray(markers) ? markers : []).forEach(function(marker) {
        if (marker && marker.id !== undefined && marker.id !== null) {
          data[String(marker.id)] = marker;
        }
      });
      await set(personalMarkersRef, data);
    };

    // Переносим локальные метки этого браузера только если у UID
    // ещё нет личного набора в Firebase. Локальную копию не удаляем.
    const remoteSnapshot = await get(personalMarkersRef);
    if (!remoteSnapshot.exists()) {
      let localMarkers = [];
      try {
        localMarkers = JSON.parse(localStorage.getItem("markers") || "[]");
      } catch (error) {
        console.warn("Локальный список меток не удалось прочитать:", error);
      }

      if (Array.isArray(localMarkers) && localMarkers.length > 0) {
        const migrated = {};
        localMarkers.forEach(function(marker) {
          if (marker && marker.id !== undefined && marker.id !== null) {
            migrated[String(marker.id)] = marker;
          }
        });
        if (Object.keys(migrated).length > 0) {
          await set(personalMarkersRef, migrated);
          console.log("Личные метки перенесены в Firebase:", Object.keys(migrated).length);
        }
      }
    }

    // Слушаем только собственный узел. Чужие метки этому клиенту недоступны.
    onValue(personalMarkersRef, function(snapshot) {
      const value = snapshot.val() || {};
      const markers = Object.keys(value).map(function(key) {
        return value[key];
      });
      if (typeof window.applyPersonalMarkers === "function") {
        window.applyPersonalMarkers(markers);
      }
    }, function(error) {
      console.error("Ошибка чтения личных меток:", error);
    });
  }

  // Индикатор подключения на экране
  const status = document.createElement("div");

  status.style.cssText = `
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 2000;
    padding: 8px 12px;
    border-radius: 6px;
    background: #222;
    color: white;
    font: 13px sans-serif;
  `;

  status.textContent = "Firebase: подключение...";
  document.body.appendChild(status);

  // Анонимная авторизация игрока
  onAuthStateChanged(auth, function(user) {
    if (user) {
      window.dndFirebase.uid = user.uid;
      window.dndFirebase.ready = true;
      window.dndFirebase.isGameMaster = user.uid === GAME_MASTER_UID;

      status.textContent = window.dndFirebase.isGameMaster
        ? "Firebase: ведущий авторизован"
        : "Firebase: игрок авторизован";
      status.style.background = "#245c32";

      console.log("Firebase готов. UID:", user.uid);
      initializePersonalMarkers(user.uid).catch(function(error) {
        console.error("Ошибка загрузки личных меток:", error);
        status.textContent = "Firebase: ошибка загрузки меток";
        status.style.background = "#8b2222";
      });
      initializeParty();
      initializeSettlementAreas();
    } else {
      window.dndFirebase.ready = false;
      window.dndFirebase.isGameMaster = false;
      status.textContent = "Firebase: выполняется вход...";

      signInAnonymously(auth).catch(function(error) {
        console.error("Ошибка авторизации Firebase:", error);

        status.textContent = "Firebase: ошибка авторизации";
        status.style.background = "#8b2222";
      });
    }
  });
</script>
