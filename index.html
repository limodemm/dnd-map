        : null,
      destinationApproachPoint: window.routeDestinationApproachPoint
        ? { lat: window.routeDestinationApproachPoint.lat, lng: window.routeDestinationApproachPoint.lng }
        : null,
      pace: routePace,
      speedReduced: routeSpeedReduced,
      forcedMarch: routeForcedMarch,
      forcedMarchStartDistance: routeForcedMarchStartDistance,
      forcedMarchStartUnits: routeForcedMarchStartUnits,
      forcedMarchEpochStartDistance: routeForcedMarchEpochStartDistance,
      forcedMarchPendingExit: routeForcedMarchPendingExit,
      forcedSegments: window.routeForcedSegments.map(segment => ({ ...segment })),
      intermediateSettlementIds: Array.isArray(window.routeIntermediateCityIds)
        ? window.routeIntermediateCityIds.slice() : [],
      startedAt: Date.now() + 500,
      confirmedBy: window.dndFirebase && window.dndFirebase.uid
        ? window.dndFirebase.uid : null
    };

    pendingRoutePlaybackResumeDistance = null;
    pendingRoutePlaybackResumeCampRequired = false;
    lastCursorPosition = null;
    createRouteLaunchPanel();
    routePanel.style.display = "none";
    routeLaunchPanel.style.display = "block";
    // После каждого подтверждения панель запуска начинается с паузы:
    // раскрытие линии не должно автоматически двигать жетон отряда.
    const pauseButton = routeLaunchPanel.querySelector("#route-party-pause");
    const playButton = routeLaunchPanel.querySelector("#route-party-play");
    renderPartyPlaybackState({
      status: "paused",
      campRequired: Boolean(routePayload.movementCampRequired),
      restResetDistances: routePayload.restResetDistances.slice()
    });
    window.confirmedPartyRoute = routePayload.points;

    if (!window.publishPartyRoute) {
      console.error("Синхронизация маршрута ещё не готова");
      alert("Не удалось подтвердить маршрут: нет соединения с Firebase.");
      window.routePendingConfirmation = true;
      if (routeLaunchPanel) routeLaunchPanel.style.display = "none";
      routePanel.style.display = isCompactRoutePanelLandscape() ? "grid" : "block";
      return;
    }

    window.publishPartyRoute(routePayload).then(function() {
      console.log("Маршрут опубликован для всех участников:", routePayload);
    }).catch(function(error) {
      console.error("Ошибка публикации маршрута:", error);
      alert("Не удалось опубликовать маршрут: " + error.message);
      window.routePendingConfirmation = true;
      if (routeLaunchPanel) routeLaunchPanel.style.display = "none";
      routePanel.style.display = isCompactRoutePanelLandscape() ? "grid" : "block";
    });
  });

  // «Вернуть» работает только с двумя типами контрольных точек:
  // обычный привал и центр уже пройденного промежуточного поселения.
  document.getElementById("route-undo").addEventListener("click", function() {
    // После возврата к стартовой точке (центру города) откатывать больше нечего.
    // Защита не даёт повторному нажатию снять саму обводку поселения.
    if (!Array.isArray(routePoints) || routePoints.length <= 1) return;
    const routeStartSettlementIds = (Array.isArray(window.routeIntermediateCityIds)
      ? window.routeIntermediateCityIds : []).filter(id => {
        const area = (window.settlementAreas || []).find(item => String(item.id) === String(id));
        return Boolean(area && routePoints[0] && window.isRouteAtSettlementCenter(routePoints[0], area));
      }).map(String);
    const intermediateIdsBeforeUndo = (Array.isArray(window.routeIntermediateCityIds)
      ? window.routeIntermediateCityIds : []).map(id => String(id));
    if (window.routeDestinationCityId) {
      if (window.clearRouteDestinationSettlementTrace) {
        window.clearRouteDestinationSettlementTrace(window.routeDestinationCityId);
      }
      window.routeDestinationCityId = null;
      window.routeDestinationBoundaryPoint = null;
      window.routeDestinationApproachPoint = null;
          if (window.clearSettlementOutline) window.clearSettlementOutline();
    }

    stopRouteMarkerAnimation();
    if (pendingRouteClickTimer) {
      clearTimeout(pendingRouteClickTimer);
      pendingRouteClickTimer = null;
      pendingRouteClickPosition = null;
      pendingRouteClickPace = null;
      pendingRouteClickSpeedReduced = null;
    }

    const totalLength = getRouteTravelLength(routePoints);
    const dailyLimit = routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);
    let targetDistance = 0;
    let targetSettlementIndex = -1;

    // Собираем все контрольные точки на текущем маршруте в одном списке.
    // Их ровно два типа: обычный привал и центр пройденного поселения.
    // Обычные клики/вершины маршрута и начало форсированного марша сюда
    // не попадают.
    const checkpoints = [];
    let rests = getNormalRestDistances(totalLength, dailyLimit, routePoints);

    // Если конец маршрута совпадает с обязательным привалом после
    // завершённого форсированного марша, этот привал не является отдельной
    // точкой возврата: «Вернуть» должно отменить весь форсированный участок
    // и вернуть маршрут к последнему обычному привалу перед разделителем.
    if (!routeForcedMarch && routeForcedSegments.length) {
      const lastForced = routeForcedSegments
        .map(segment => getForcedSegmentDistances(segment))
        .sort((a, b) => a.end - b.end)
        .slice(-1)[0];
      if (lastForced && Math.abs(lastForced.end - totalLength) <= 0.05) {
        rests = rests.filter(distance => distance < lastForced.end - 0.05);
      }
    }

    // Если маршрут завершён флажком во время активного форсированного марша,
    // обычный расчёт дневных привалов может принять разделитель в начале
    // марша и промежуточные крестики истощения за точки отмены. Для «Вернуть»
    // весь участок от начала активного марша до флажка считается единым
    // действием: оставляем только привалы ДО начала марша и сам привал,
    // с которого марш начался.
    if (routeForcedMarch && !routeForcedMarchPendingExit) {
      rests = rests.filter(distance =>
        distance <= routeForcedMarchStartDistance + 0.001
      );
    }

    function routeIndexAtDistance(distance) {
      let passed = 0;
      for (let i = 1; i < routePoints.length; i++) {
        passed += getRouteTravelLength([routePoints[i - 1], routePoints[i]]);
        if (passed >= distance - 0.001) return i;
      }
      return Math.max(0, routePoints.length - 1);
    }

    rests.forEach(distance => {
      if (distance < totalLength - 0.01) {
        checkpoints.push({
          type: "rest",
          distance,
          index: routeIndexAtDistance(distance)
        });
      }
    });

    // Центр поселения — контрольная точка, если маршрут уже продолжился
    // дальше него. Если центр является концом маршрута, возврат отменяет
    // сам вход в этот город и выбирает предыдущий привал/город.
    let passed = 0;
    for (let i = 1; i < routePoints.length; i++) {
      const point = routePoints[i];
      if (getRouteSegmentMode(point) === "settlement-zero" && point._routeSettlementId) {
        const area = (window.settlementAreas || []).find(item =>
          String(item.id) === String(point._routeSettlementId)
        );
        if (area && window.isRouteAtSettlementCenter(point, area) && i < routePoints.length - 1) {
          checkpoints.push({ type: "settlement", distance: passed, index: i });
        }
      }
      passed += getRouteTravelLength([routePoints[i - 1], point]);
    }

    // Выбираем последнюю по порядку контрольную точку на маршруте.
    checkpoints.sort((a, b) =>
      Math.abs(a.distance - b.distance) > 0.001
        ? a.distance - b.distance
        : a.index - b.index
    );
    const lastCheckpoint = checkpoints.length ? checkpoints[checkpoints.length - 1] : null;
    if (lastCheckpoint) {
      targetDistance = lastCheckpoint.distance;
      if (lastCheckpoint.type === "settlement") {
        targetSettlementIndex = lastCheckpoint.index;
      }
    }

    // Если контрольная точка — город, обрезаем маршрут по индексу,
    // чтобы гарантированно сохранить нулевой переход до его центра.
    // Для привала используем точную дистанцию по существующей геометрии.
    if (targetSettlementIndex >= 0) {
      routePoints = routePoints.slice(0, targetSettlementIndex + 1);
    } else {
      routePoints = getRoutePointsUpToDistance(routePoints, targetDistance);
    }
    const rollbackLength = getRouteTravelLength(routePoints);
    routeRestResetDistances = routeRestResetDistances.filter(distance => distance <= rollbackLength + 0.001);

    // «Вернуть» не вводит отдельную точку возобновления: оно лишь
    // ограничивает текущий маршрут. Если исходная анимация уже завершилась
    // и снимка прогресса нет, фиксируем обрезанный маршрут как достигнутый
    // префикс. Общий алгоритм возобновления затем сам ограничит его новой
    // геометрией и продолжит с последней общей точки.
    if (lastConfirmedRoutePointSnapshot.length > 0 && !pendingRouteResumeState) {
      const rollbackDistance = getRouteTravelLength(routePoints);
      pendingRouteResumeState = {
        distance: rollbackDistance,
        prefix: routePoints.map((point, index) => ({
          lat: Number(point.lat),
          lng: Number(point.lng),
          segmentMode: index > 0 ? getRouteSegmentMode(point) : "normal",
          settlementId: point._routeSettlementId || null,
          ...getRoutePointTravelSettingsSnapshot(point, index)
        })),
        routeSnapshot: routePoints.map((point, index) => ({
          lat: Number(point.lat),
          lng: Number(point.lng),
          segmentMode: index > 0 ? getRouteSegmentMode(point) : "normal",
          settlementId: point._routeSettlementId || null,
          ...getRoutePointTravelSettingsSnapshot(point, index)
        }))
      };
    }

    // Оставляем выделенными только те города, чьи центры реально остались
    // в маршруте. Более поздние поселения снимаются автоматически.
    window.routeIntermediateCityIds = Array.from(new Set([
      ...routeStartSettlementIds,
      ...(Array.isArray(window.routeIntermediateCityIds) ? window.routeIntermediateCityIds : [])
        .filter(id => {
          const area = (window.settlementAreas || []).find(item => String(item.id) === String(id));
          return !!(area && routePoints.some(point =>
            String(point._routeSettlementId || "") === String(id) &&
            getRouteSegmentMode(point) === "settlement-zero" &&
            window.isRouteAtSettlementCenter(point, area)
          ));
        }).map(String)
    ]));
    window.routeIntermediateSettlementUndoSnapshots = [];
    // Удаляем контуры только тех промежуточных городов, которые возврат
    // исключил из маршрута; сохранённые города остаются нетронутыми.
    const retainedIntermediateIds = new Set((window.routeIntermediateCityIds || []).map(id => String(id)));
    intermediateIdsBeforeUndo.forEach(id => {
      if (!retainedIntermediateIds.has(id) && !routeStartSettlementIds.includes(id) &&
          window.clearRouteDestinationSettlementTrace) {
        window.clearRouteDestinationSettlementTrace(id);
      }
    });
    refreshRouteIntermediateCityOutlines();

    if (!routeForcedMarch) {
      routeForcedMarchPendingExit = false;
      routeForcedMarchEpochStartDistance = getLastSettlementTransitEndDistance(routePoints);
    }

    const actualLength = getRouteTravelLength(routePoints);
    if (routeForcedMarch && routeForcedMarchStartDistance >= actualLength - 0.001) {
      routeForcedMarch = false;
      routeForcedMarchStartDistance = 0;
      routeForcedMarchStartUnits = 0;
      routeForcedMarchEpochStartDistance = 0;
      routeForcedMarchPendingExit = false;
      const forcedButton = document.getElementById("route-forced-march");
      if (forcedButton) {
        forcedButton.classList.remove("active");
        forcedButton.setAttribute("aria-pressed", "false");
      }
    }
    routeForcedSegments = routeForcedSegments.filter(segment => {
      const recalculated = getForcedSegmentDistances(segment);
      return recalculated.end <= targetDistance + 0.05 &&
        recalculated.end <= actualLength + 0.05;
    });

    if (routeFinished) {
      routeFinished = false;
      window.routeEditingConfirmedRoute = false;
      window.routePendingConfirmation = false;
      window.routeMode = true;
      map.doubleClickZoom.disable();
    }

    lastCursorPosition = null;
    updateRouteLine();
    console.log("Маршрут возвращён к последней контрольной точке");
  });

  // Кнопка и клавиша Escape используют одну и ту же отмену.
  document.getElementById("route-cancel").addEventListener("click", cancelPartyRoute);
  window.addEventListener("cancel-party-route", cancelPartyRoute);

}

// =====================================
// ДЛИНА МАРШРУТА
// =====================================

function getRouteLength(points) {
  let total = 0;

  for (let i = 1; i < points.length; i++) {
    const dy = points[i].lat - points[i - 1].lat;
    const dx = points[i].lng - points[i - 1].lng;

    if (getRouteSegmentMode(points[i]) === "settlement-zero") continue;
    total += Math.sqrt(dx * dx + dy * dy);
  }

  return total;
}

// =====================================
// ТРУДНОПРОХОДИМАЯ МЕСТНОСТЬ: МЕТРИКА ПУТИ
// =====================================

// Внутри зоны местности каждый пройденный отрезок считается за двойное
// расстояние для расчёта времени, дневных переходов и привалов.
// Геометрическая длина маршрута при этом остаётся прежней.
function isPointInsideTerrain(point) {
  const areas = Array.isArray(window.terrainAreas) ? window.terrainAreas : [];
  return areas.some(area => {
    const polygon = area && Array.isArray(area.points) ? area.points : [];
    if (polygon.length < 3) return false;
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const xi = Number(polygon[i].lng), yi = Number(polygon[i].lat);
      const xj = Number(polygon[j].lng), yj = Number(polygon[j].lat);
      const intersects = ((yi > point.lat) !== (yj > point.lat)) &&
        (point.lng < (xj - xi) * (point.lat - yi) / ((yj - yi) || 0.0000001) + xi);
      if (intersects) inside = !inside;
    }
    return inside;
  });
}

// Служебные метки хранят тип отрезка, который заканчивается в данной точке.
// Они сериализуются отдельно в Firebase, поэтому не зависят от внутреннего
// устройства Leaflet LatLng.
function setRouteSegmentMode(point, mode, settlementId = null) {
  if (!point) return point;
  point._routeSegmentMode = mode || "normal";
  if (settlementId !== null && settlementId !== undefined) {
    point._routeSettlementId = String(settlementId);
  }
  return point;
}
// Доступ к метаданным сегментов из обработчиков поселений вне initializeParty.
window.setRouteSegmentMode = setRouteSegmentMode;

function copyRoutePointMetadata(source, target) {
  if (!source || !target) return target;
  if (source._routeSegmentMode) target._routeSegmentMode = source._routeSegmentMode;
  if (source._routeSettlementId !== undefined) {
    target._routeSettlementId = source._routeSettlementId;
  }
  if (source._routePace !== undefined) target._routePace = source._routePace;
  if (source._routeSpeedReduced !== undefined) {
    target._routeSpeedReduced = Boolean(source._routeSpeedReduced);
  }
  return target;
}
// Эта функция нужна также обработчикам выбора промежуточного поселения,
// которые выполняются вне локальной области initializeParty().
window.copyRoutePointMetadata = copyRoutePointMetadata;

function getRouteSegmentMode(point) {
  return point && point._routeSegmentMode ? point._routeSegmentMode : "normal";
}

// Возвращает интервалы пути, на которых жетоны и маршевые механики отключены.
// Смежные входной/внутренний/выходной сегменты объединяются в один интервал.
function getRouteSettlementTransitIntervals(points) {
  const intervals = [];
  let passed = 0;
  let active = null;

  for (let i = 1; i < (points || []).length; i++) {
    const start = points[i - 1];
    const end = points[i];
    const mode = getRouteSegmentMode(end);
    const parts = getRouteSegmentTerrainParts(start, end);
    const length = parts.reduce((sum, part) => sum + part.travelLength, 0);
    const isTransit = mode === "settlement-count-only" || mode === "settlement-zero";

    if (isTransit) {
      if (!active) active = { start: passed, end: passed, settlementId: end._routeSettlementId || null };
      active.end = passed + length;
      if (end._routeSettlementId) active.settlementId = String(end._routeSettlementId);
    } else if (active) {
      intervals.push(active);
      active = null;
    }
    passed += length;
  }
  if (active) intervals.push(active);
  return intervals;
}
// Функция используется также из Firebase-модуля, поэтому явно публикуем её.
window.getRouteSettlementTransitIntervals = getRouteSettlementTransitIntervals;

function getLastSettlementTransitEndDistance(points) {
  const intervals = getRouteSettlementTransitIntervals(points || routePoints);
  return intervals.length ? intervals[intervals.length - 1].end : 0;
}
window.getLastSettlementTransitEndDistance = getLastSettlementTransitEndDistance;

function isRouteAtSettlementCenter(point, area) {
  if (!point || !area || !area.center) return false;
  return Math.hypot(Number(point.lat) - Number(area.center.lat), Number(point.lng) - Number(area.center.lng)) < 0.00002;
}
// Функция объявлена внутри initializeParty(), но также используется
// обработчиками прокладки маршрута, расположенными вне этой области видимости.
// Публикуем ту же реализацию, не создавая второй независимой копии.
window.isRouteAtSettlementCenter = isRouteAtSettlementCenter;

function getRouteSegmentTerrainParts(start, end) {
  const dx = end.lng - start.lng;
  const dy = end.lat - start.lat;
  const rawLength = Math.hypot(dx, dy);
  if (rawLength < 0.000001) return [];

  // Соединение центра поселения с фактической границей геометрически
  // существует, но не имеет длины и не участвует ни в одной механике.
  if (getRouteSegmentMode(end) === "settlement-zero") {
    return [{
      t0: 0, t1: 1, inside: false, rawLength,
      travelLength: 0, settlementTransit: true, zeroLength: true
    }];
  }

  const cuts = [0, 1];
  const areas = Array.isArray(window.terrainAreas) ? window.terrainAreas : [];

  // Находим пересечения отрезка маршрута со всеми границами зон.
  areas.forEach(area => {
    const polygon = area && Array.isArray(area.points) ? area.points : [];
    if (polygon.length < 3) return;
    for (let i = 0; i < polygon.length; i++) {
      const a = polygon[i];
      const b = polygon[(i + 1) % polygon.length];
      const ex = Number(b.lng) - Number(a.lng);
      const ey = Number(b.lat) - Number(a.lat);
      const denominator = dx * ey - dy * ex;
      if (Math.abs(denominator) < 1e-12) continue;
      const ax = Number(a.lng) - start.lng;
      const ay = Number(a.lat) - start.lat;
      const t = (ax * ey - ay * ex) / denominator;
      const u = (ax * dy - ay * dx) / denominator;
      if (t > 0.000001 && t < 0.999999 && u >= -0.000001 && u <= 1.000001) {
        cuts.push(t);
      }
    }
  });

  cuts.sort((a, b) => a - b);
  const uniqueCuts = cuts.filter((value, index) =>
    index === 0 || Math.abs(value - cuts[index - 1]) > 0.000001
  );

  const parts = [];
  for (let i = 1; i < uniqueCuts.length; i++) {
    const t0 = uniqueCuts[i - 1];
    const t1 = uniqueCuts[i];
    if (t1 - t0 < 0.000001) continue;
    const middleT = (t0 + t1) / 2;
    const middle = {
      lat: start.lat + dy * middleT,
      lng: start.lng + dx * middleT
    };
    const inside = isPointInsideTerrain(middle);
    const rawPartLength = rawLength * (t1 - t0);
    parts.push({
      t0,
      t1,
      inside,
      rawLength: rawPartLength,
      travelLength: rawPartLength * (inside ? 2 : 1)
    });
  }
  return parts;
}

function getRouteTravelLength(points) {
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    getRouteSegmentTerrainParts(points[i - 1], points[i]).forEach(part => {
      total += part.travelLength;
    });
  }
  return total;
}
// Используется также функциями выбора поселения, расположенными вне initializeParty.
window.getRouteTravelLength = getRouteTravelLength;

// Получает интервалы внутри труднопроходимых зон в шкале времени пути.
function getTerrainTravelIntervals(points) {
  const intervals = [];
  let travelPassed = 0;
  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];
    const dx = end.lng - start.lng;
    const dy = end.lat - start.lat;
    getRouteSegmentTerrainParts(start, end).forEach(part => {
      const partTravelStart = travelPassed;
      const partTravelEnd = partTravelStart + part.travelLength;
      if (part.inside && partTravelEnd > partTravelStart + 0.001) {
        intervals.push({ start: partTravelStart, end: partTravelEnd });
      }
      travelPassed = partTravelEnd;
    });
  }
  return intervals;
}

// Экранное расстояние вдоль визуальной линии. Используется только для
// равномерного по пикселям проявления штрихов, а не для расчёта пути.
function getRouteScreenDistanceAtDistance(points, targetDistance) {
  if (!points || points.length < 2) return 0;
  let travelPassed = 0;
  let screenPassed = 0;
  for (let i = 1; i < points.length; i++) {
    const previous = points[i - 1];
    const current = points[i];
    const a = map.latLngToLayerPoint(previous);
    const b = map.latLngToLayerPoint(current);
    const fullScreenLength = a.distanceTo(b);
    const parts = getRouteSegmentTerrainParts(previous, current);
    const fullRawLength = Math.hypot(current.lat - previous.lat, current.lng - previous.lng);
    for (const part of parts) {
      const partTravelLength = part.travelLength;
      const partScreenLength = part.zeroLength ? 0 : (fullRawLength > 0
        ? fullScreenLength * (part.t1 - part.t0)
        : 0);
      if (partTravelLength <= 0.000001) continue;
      if (travelPassed + partTravelLength >= targetDistance - 0.001) {
        const fraction = partTravelLength > 0
          ? Math.max(0, Math.min(1, (targetDistance - travelPassed) / partTravelLength))
          : 0;
        return screenPassed + partScreenLength * fraction;
      }
      travelPassed += partTravelLength;
      screenPassed += partScreenLength;
    }
  }
  return screenPassed;
}

// =====================================
// ВИЗУАЛЬНАЯ ОБРАБОТКА ЛИНИИ МАРШРУТА
// =====================================

function createRouteDisplayPoints(points, protectedDistances = []) {
  if (points.length < 2) return points;

  const roundedPoints = [];
  const cornerRadius = 30;

  // Скругляем углы, только если в маршруте есть хотя бы 3 точки.
  // Накопленные расстояния считаем один раз: прежний вложенный цикл
  // пересчитывал длину всех предыдущих сегментов для каждого угла (O(n²)).
  roundedPoints.push(points[0]);
  const cumulativeTravelDistances = new Array(points.length).fill(0);
  for (let i = 1; i < points.length; i++) {
    cumulativeTravelDistances[i] = cumulativeTravelDistances[i - 1] +
      getRouteTravelLength([points[i - 1], points[i]]);
  }

  if (points.length >= 3) {
    for (let i = 1; i < points.length - 1; i++) {
      const prev = points[i - 1];
      const corner = points[i];
      const next = points[i + 1];

      // Не скругляем вершину, если на ней расположен привал или другой маркер.
      const cornerDistance = cumulativeTravelDistances[i];
      // Не сглаживаем повороты рядом с привалом/маркером: иначе
      // следующий резкий изгиб может визуально утянуть линию от точки привала.
      const isSettlementTransitCorner =
        getRouteSegmentMode(corner) !== "normal" || getRouteSegmentMode(next) !== "normal";
      const isProtectedCorner = isSettlementTransitCorner || protectedDistances.some(
        distance => Math.abs(distance - cornerDistance) <= cornerRadius * 2
      );
      if (isProtectedCorner) {
        roundedPoints.push(corner);
        continue;
      }

      const dx1 = prev.lng - corner.lng;
      const dy1 = prev.lat - corner.lat;
      const dx2 = next.lng - corner.lng;
      const dy2 = next.lat - corner.lat;

      const len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
      const len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

      if (len1 < 1 || len2 < 1) {
        roundedPoints.push(corner);
        continue;
      }

      const cut1 = Math.min(cornerRadius, len1 * 0.4);
      const cut2 = Math.min(cornerRadius, len2 * 0.4);

      const before = L.latLng(
        corner.lat + dy1 / len1 * cut1,
        corner.lng + dx1 / len1 * cut1
      );

      const after = L.latLng(
        corner.lat + dy2 / len2 * cut2,
        corner.lng + dx2 / len2 * cut2
      );

      roundedPoints.push(before);

      // Плавная кривая Безье вокруг угла
      for (let j = 1; j <= 5; j++) {
        const t = j / 6;
        const oneMinusT = 1 - t;

        roundedPoints.push(L.latLng(
          oneMinusT * oneMinusT * before.lat +
          2 * oneMinusT * t * corner.lat +
          t * t * after.lat,

          oneMinusT * oneMinusT * before.lng +
          2 * oneMinusT * t * corner.lng +
          t * t * after.lng
        ));
      }

      roundedPoints.push(after);
    }
  }

  roundedPoints.push(points[points.length - 1]);

  // Добавляем небольшую хаотичную неровность
  const result = [roundedPoints[0]];

  for (let i = 1; i < roundedPoints.length; i++) {
    const start = roundedPoints[i - 1];
    const end = roundedPoints[i];

    const dx = end.lng - start.lng;
    const dy = end.lat - start.lat;
    const length = Math.sqrt(dx * dx + dy * dy);

    // Короткие участки не изменяем
    if (length < 60) {
      result.push(end);
      continue;
    }

    const steps = Math.floor(length / 20);

    for (let j = 1; j <= steps; j++) {
      const t = j / (steps + 1);

      // Детерминированное псевдослучайное отклонение
      const seed = (
        start.lat * 12.9898 +
        start.lng * 78.233 +
        end.lat * 37.719 +
        end.lng * 19.913 +
        j * 53.117
      );

      const random = Math.sin(seed) * 43758.5453;
      const noise = (random - Math.floor(random)) * 2 - 1;

      // Отклонение плавно уменьшается у концов отрезка
      const taper = Math.sin(Math.PI * t);
      const offset = noise * 8 * taper;

      result.push(copyRoutePointMetadata(end, L.latLng(
        start.lat + dy * t + (dx / length) * offset,
        start.lng + dx * t - (dy / length) * offset
      )));
    }

    result.push(end);
  }

  return result;
}

// Получение координаты на определённом расстоянии пути
function getRoutePointAtDistance(points, targetDistance) {
  let passed = 0;
  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];
    const dx = end.lng - start.lng;
    const dy = end.lat - start.lat;
    const parts = getRouteSegmentTerrainParts(start, end);
    for (const part of parts) {
      if (part.travelLength <= 0.000001) continue;
      if (passed + part.travelLength >= targetDistance - 0.000001) {
        const withinPart = Math.max(0, targetDistance - passed);
        const rawWithinPart = withinPart / (part.inside ? 2 : 1);
        const rawLength = Math.hypot(dx, dy);
        const t = rawLength > 0 ? part.t0 + rawWithinPart / rawLength : part.t0;
        return copyRoutePointMetadata(end, L.latLng(start.lat + dy * t, start.lng + dx * t));
      }
      passed += part.travelLength;
    }
  }
  return points.length ? points[points.length - 1] : null;
}

// Возвращает часть маршрута до указанного расстояния
function getRoutePointsUpToDistance(points, targetDistance) {
  if (!points.length) return [];
  if (targetDistance <= 0) return [points[0]];
  const totalLength = getRouteTravelLength(points);
  if (targetDistance >= totalLength) return [...points];

  const result = [points[0]];
  let passed = 0;
  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];
    const dx = end.lng - start.lng;
    const dy = end.lat - start.lat;
    for (const part of getRouteSegmentTerrainParts(start, end)) {
      if (passed + part.travelLength <= targetDistance + 0.001) {
        const partEnd = copyRoutePointMetadata(end, L.latLng(
          start.lat + dy * part.t1,
          start.lng + dx * part.t1
        ));
        const last = result[result.length - 1];
        if (!last || Math.hypot(last.lat - partEnd.lat, last.lng - partEnd.lng) > 0.000001) {
          result.push(partEnd);
        }
        passed += part.travelLength;
        if (passed >= targetDistance - 0.001) return result;
      } else {
        const remainingTravel = Math.max(0, targetDistance - passed);
        const rawWithin = remainingTravel / (part.inside ? 2 : 1);
        const rawLength = Math.hypot(dx, dy);
        const t = part.t0 + (rawLength > 0 ? rawWithin / rawLength : 0);
        result.push(copyRoutePointMetadata(end, L.latLng(start.lat + dy * t, start.lng + dx * t)));
        return result;
      }
    }
  }
  return result;
}

// Вставляет в геометрию точные точки на заданных расстояниях.
// Это гарантирует, что привалы, черты и крестики лежат непосредственно на линии.
function getRoutePointsWithDistanceAnchors(points, distances) {
  if (points.length < 2) return [...points];
  const entries = [];
  let passed = 0;
  points.forEach((point, index) => {
    if (index > 0) {
      passed += getRouteTravelLength([points[index - 1], point]);
    }
    entries.push({ distance: passed, point });
  });
  distances.forEach(distance => {
    if (distance < -0.001 || distance > passed + 0.001) return;
    const point = getRoutePointAtDistance(points, Math.max(0, Math.min(passed, distance)));
    if (point) entries.push({ distance: Math.max(0, Math.min(passed, distance)), point });
  });
  entries.sort((a, b) => a.distance - b.distance);
  const result = [];
  entries.forEach(entry => {
    const last = result[result.length - 1];
    if (!last || Math.hypot(entry.point.lat - last.lat, entry.point.lng - last.lng) > 0.000001) {
      result.push(entry.point);
    }
  });
  return result;
}

// Возвращает исходную геометрию маршрута между двумя расстояниями.
function getRoutePointsBetweenDistances(points, startDistance, endDistance) {
  const totalLength = getRouteTravelLength(points);
  const start = Math.max(0, Math.min(totalLength, startDistance));
  const end = Math.max(start, Math.min(totalLength, endDistance));
  const anchored = getRoutePointsWithDistanceAnchors(points, [start, end]);
  const result = [];
  let passed = 0;
  anchored.forEach((point, index) => {
    if (index > 0) passed += getRouteTravelLength([anchored[index - 1], point]);
    if (passed >= start - 0.01 && passed <= end + 0.01) result.push(point);
  });
  return result;
}

// Угол поперечной черты в экранных координатах карты.
function getPerpendicularRouteAngle(points, targetDistance) {
  let passed = 0;
  for (let i = 1; i < points.length; i++) {
    const previous = points[i - 1];
    const current = points[i];
    const routeLength = getRouteTravelLength([previous, current]);
    if (routeLength < 0.001) continue;

    if (passed + routeLength >= targetDistance - 0.001) {
      // Для направления используем экранные координаты, а для поиска
      // нужного сегмента — те же координатные единицы, что и длина маршрута.
      const a = map.latLngToLayerPoint(previous);
      const b = map.latLngToLayerPoint(current);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      return Math.atan2(dy, dx) * 180 / Math.PI + 90;
    }
    passed += routeLength;
  }
  return 90;
}

// Переводит сохранённый форсированный участок в абсолютные расстояния.
// Новые сегменты хранят start/end как неизменяемые координаты маршрута;
// старый формат startUnits/lengthUnits поддерживается для прежних публикаций.
function getForcedSegmentDistances(segment, legacyDailyLimit) {
  if (segment && segment.fixed === true) {
    return {
      start: Number(segment.start) || 0,
      end: Number(segment.end) || 0,
      startUnits: Math.max(0, Math.min(0.999999, Number(segment.startUnits) || 0))
    };
  }
  if (segment && Number.isFinite(segment.start) && Number.isFinite(segment.end) &&
      !Number.isFinite(segment.startUnits) && !Number.isFinite(segment.lengthUnits)) {
    return { start: Number(segment.start), end: Number(segment.end), startUnits: 0 };
  }
  const dailyLimit = Number(legacyDailyLimit) > 0
    ? Number(legacyDailyLimit)
    : routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);
  const base = Number.isFinite(segment.epochStartDistance)
    ? segment.epochStartDistance : 0;
  const start = Number.isFinite(segment.startUnits)
    ? base + segment.startUnits * dailyLimit
    : segment.start;
  const length = Number.isFinite(segment.lengthUnits)
    ? segment.lengthUnits * dailyLimit
    : segment.end - segment.start;
  const end = Number.isFinite(segment.fixedEndDistance)
    ? Math.max(start, segment.fixedEndDistance) : start + length;
  return { start, end, startUnits: 0 };
}

// Время прохождения отрезка измеряется в долях игрового дня.
// Для каждого отрезка берутся параметры с его конечной точки.
function getRouteTravelTimeUnitsBetweenDistances(points, startDistance, endDistance) {
  if (!Array.isArray(points) || points.length < 2) return 0;
  const start = Math.max(0, Number(startDistance) || 0);
  const end = Math.max(start, Number(endDistance) || 0);
  let passed = 0;
  let units = 0;
  for (let i = 1; i < points.length; i++) {
    const pointStart = passed;
    const segmentLength = getRouteTravelLength([points[i - 1], points[i]]);
    const pointEnd = pointStart + segmentLength;
    const overlapStart = Math.max(start, pointStart);
    const overlapEnd = Math.min(end, pointEnd);
    if (overlapEnd > overlapStart + 0.000001) {
      const dailyLimit = getRouteSegmentDailyLimit(points[i]);
      if (dailyLimit > 0) units += (overlapEnd - overlapStart) / dailyLimit;
    }
    passed = pointEnd;
    if (passed >= end - 0.000001) break;
  }
  return units;
}

// Находит расстояние, на котором от выбранной точки накопится заданная
// доля игрового дня. Возвращает maxDistance, если времени на маршруте не хватило.
function getRouteDistanceAtElapsedTime(points, startDistance, elapsedUnits, maxDistance) {
  const start = Math.max(0, Number(startDistance) || 0);
  const max = Math.max(start, Number(maxDistance));
  let remainingUnits = Math.max(0, Number(elapsedUnits) || 0);
  if (remainingUnits <= 0.000001) return start;
  let passed = 0;
  for (let i = 1; i < points.length; i++) {
    const segmentLength = getRouteTravelLength([points[i - 1], points[i]]);
    const segmentStart = passed;
    const segmentEnd = segmentStart + segmentLength;
    const overlapStart = Math.max(start, segmentStart);
    const overlapEnd = Math.min(max, segmentEnd);
    if (overlapEnd > overlapStart + 0.000001) {
      const dailyLimit = getRouteSegmentDailyLimit(points[i]);
      if (dailyLimit > 0) {
        const availableUnits = (overlapEnd - overlapStart) / dailyLimit;
        if (remainingUnits <= availableUnits + 0.000001) {
          return Math.min(overlapEnd, overlapStart + remainingUnits * dailyLimit);
        }
        remainingUnits -= availableUnits;
      }
    }
    passed = segmentEnd;
    if (passed >= max - 0.000001) break;
  }
  return max;
}

// Общее движение маркера. Один дневной переход (8 игровых часов)
// теперь проходит за 10 секунд реального времени в тестовом режиме.
window.partyPlaybackState = null;
let partyPlaybackFrame = null;
let partyPlaybackDistance = 0;
let partyPlaybackLastUiStatus = null;

function getPartyPlaybackDistance(state, now) {
  const start = Math.max(0, Number(state.startDistance) || 0);
  if (state.status !== "playing") return start;
  // Тестовая скорость: 8 игровых часов пути за 10 секунд реального времени.
  // Скрытый переход внутри поселения дополнительно ускорен в 8 раз:
  // игроку не приходится ждать, пока невидимый маркер пересечёт город.
  let remainingUnits = Math.max(0, now - Number(state.startedAt || now)) / 10000;
  const maxDistance = getRouteTravelLength(routePoints);
  let passed = 0;
  for (let i = 1; i < routePoints.length; i++) {
    const point = routePoints[i];
    const segmentLength = getRouteTravelLength([routePoints[i - 1], point]);
    const segmentStart = passed;
    const segmentEnd = segmentStart + segmentLength;
    const overlapStart = Math.max(start, segmentStart);
    const overlapEnd = Math.min(maxDistance, segmentEnd);
    if (overlapEnd > overlapStart + 0.000001) {
      const transit = getRouteSegmentMode(point) === "settlement-count-only" ||
        getRouteSegmentMode(point) === "settlement-zero";
      const dailyLimit = getRouteSegmentDailyLimit(point) * (transit ? 8 : 1);
      if (dailyLimit > 0) {
        const availableUnits = (overlapEnd - overlapStart) / dailyLimit;
        if (remainingUnits <= availableUnits + 0.000001) {
          return Math.min(overlapEnd, overlapStart + remainingUnits * dailyLimit);
        }
        remainingUnits -= availableUnits;
      }
    }
    passed = segmentEnd;
    if (passed >= maxDistance - 0.000001) break;
  }
  return maxDistance;
}

// Делаем расчётную функцию доступной обработчикам Firebase и маркера,
// которые могут выполняться из вложенных областей видимости.
window.getPartyPlaybackDistance = getPartyPlaybackDistance;

// Переводит игровую дистанцию маршрута в точку на фактически нарисованной
// линии. Скорость остаётся рассчитанной по исходному маршруту, а координата
// берётся с визуальной геометрии, чтобы маркер не срезал неровности.
function getPartyPlaybackDisplayPosition(distance) {
  if (!Array.isArray(routePoints) || routePoints.length < 2) return null;

  // Если Leaflet уже отрисовал маршрут, берём координату непосредственно
  // с его SVG path. Это не только меняет угол, но и не позволяет маркеру
  // повторять невидимые на текущем масштабе мелкие неровности исходной линии.
  const entries = getPartyRenderedRouteSegments();
  const entry = getPartyRenderedRouteSegmentAtDistance(entries, Number(distance) || 0);
  if (entry && map) {
    const progress = Math.max(0, Math.min(1,
      ((Number(distance) || 0) - entry.start) / Math.max(0.000001, entry.end - entry.start)
    ));
    const screenPoint = getPartyRenderedRouteScreenPoint(entry, progress * entry.length);
    const container = map.getContainer();
    const rect = container.getBoundingClientRect();
    if (screenPoint && rect) {
      return map.containerPointToLatLng(L.point(screenPoint.x - rect.left, screenPoint.y - rect.top));
    }
  }

  // Резерв до появления SVG-слоёв (например, сразу после загрузки маршрута).
  const sourceLength = getRouteTravelLength(routePoints);
  const displayPoints = Array.isArray(window.partyVisualRoutePoints) &&
    window.partyVisualRoutePoints.length >= 2
      ? window.partyVisualRoutePoints
      : createRouteDisplayPoints(routePoints, []);
  const displayLength = getRouteTravelLength(displayPoints);
  if (!(sourceLength > 0) || !(displayLength > 0)) {
    return getRoutePointAtDistance(routePoints, distance);
  }
  const progress = Math.max(0, Math.min(1, Number(distance) / sourceLength));
  return getRoutePointAtDistance(displayPoints, progress * displayLength);
}
window.getPartyPlaybackDisplayPosition = getPartyPlaybackDisplayPosition;

let partyBearingGeometryCache = null;

// Берём геометрию непосредственно из SVG-путей, которые Leaflet уже нарисовал.
// Это точнее повторного вызова simplify(): учитываются реальные границы частей
// маршрута, текущий smoothFactor и все экранные упрощения конкретного слоя.
function getPartyRenderedRouteSegments() {
  const layers = Array.isArray(partyPlaybackRouteLineLayers)
    ? partyPlaybackRouteLineLayers : [];
  const cacheIsCurrent = partyBearingGeometryCache &&
    partyBearingGeometryCache.layers === layers &&
    partyBearingGeometryCache.entries.every(entry =>
      entry.layer._path === entry.path &&
      (entry.path.getAttribute("d") || "") === entry.pathData
    );
  if (cacheIsCurrent) return partyBearingGeometryCache.entries;

  const entries = [];
  layers.forEach(layer => {
    const path = layer && layer._path;
    if (!path || typeof path.getTotalLength !== "function" ||
        typeof path.getPointAtLength !== "function") return;
    const start = Number(layer._partyPlaybackStartDistance);
    const end = Number(layer._partyPlaybackEndDistance);
    if (!(end > start)) return;
    const pathData = path.getAttribute("d") || "";
    if (!pathData) return;
    const length = path.getTotalLength();
    if (!(length > 0.01)) return;
    entries.push({ layer, path, start, end, length, pathData });
  });
  entries.sort((a, b) => a.start - b.start || a.end - b.end);
  partyBearingGeometryCache = { layers, entries };
  return entries;
}

function getPartyRenderedRouteSegmentAtDistance(entries, distance) {
  if (!entries.length) return null;
  let low = 0;
  let high = entries.length - 1;
  while (low < high) {
    const mid = (low + high) >> 1;
    if (entries[mid].end < distance - 0.0001) low = mid + 1;
    else high = mid;
  }
  const candidate = entries[low];
  if (distance >= candidate.start - 0.0001 && distance <= candidate.end + 0.0001) {
    return candidate;
  }
  return null;
}

function getPartyRenderedRouteScreenPoint(entry, pathDistance) {
  if (!entry || !entry.path || !entry.path.ownerSVGElement) return null;
  const localDistance = Math.max(0, Math.min(entry.length, pathDistance));
  const localPoint = entry.path.getPointAtLength(localDistance);
  const svg = entry.path.ownerSVGElement;
  const matrix = typeof entry.path.getScreenCTM === "function"
    ? entry.path.getScreenCTM() : null;
  if (matrix && typeof svg.createSVGPoint === "function") {
    const svgPoint = svg.createSVGPoint();
    svgPoint.x = localPoint.x;
    svgPoint.y = localPoint.y;
    const screenPoint = svgPoint.matrixTransform(matrix);
    return L.point(screenPoint.x, screenPoint.y);
  }
  return L.point(localPoint.x, localPoint.y);
}

let partyBearingScreenGeometryCache = null;

// Рассчитываем касательную по непрерывной геометрии всего видимого маршрута,
// а не по отдельному короткому пунктиру. На дальнем зуме увеличиваем окно
// выборки в экранных пикселях: мелкие колебания, которые визуально уже не
// различимы на линии, не должны заставлять маркер вилять.
function getPartyRenderedRouteBearing(distance) {
  const entries = getPartyRenderedRouteSegments();
  const entry = getPartyRenderedRouteSegmentAtDistance(entries, distance);
  if (!entry) return null;
  const progress = Math.max(0, Math.min(1,
    (distance - entry.start) / Math.max(0.000001, entry.end - entry.start)
  ));
  const centerLength = progress * entry.length;
  const sample = 11;
  const from = getPartyRenderedRouteScreenPoint(entry, centerLength - sample);
  const to = getPartyRenderedRouteScreenPoint(entry, centerLength + sample);
  if (!from || !to || Math.hypot(to.x - from.x, to.y - from.y) < 0.01) return null;
  return { from, to };
}

function getPartyMarkerInitialTurnAngle(now = window.getSynchronizedRouteNow()) {
  if (!partyMarker) return 0;
  const from = Number(partyMarker._partyInitialTurnFrom);
  const to = Number(partyMarker._partyInitialTurnTo);
  const startedAt = Number(partyMarker._partyInitialTurnStartedAt);
  const until = Number(partyMarker._partyInitialTurnUntil);
  if (![from, to, startedAt, until].every(Number.isFinite) || until <= startedAt) {
    return Number(partyMarker._partyBearing) || 0;
  }
  const progress = Math.max(0, Math.min(1, (now - startedAt) / (until - startedAt)));
  return from + (to - from) * progress;
}

function getPartyMarkerRenderedAngle(artwork) {
  if (!artwork) return Number(partyMarker && partyMarker._partyBearing) || 0;
  const transform = getComputedStyle(artwork).transform;
  if (transform && transform !== "none") {
    const values = transform.match(/matrix\(([^)]+)\)/);
    if (values) {
      const parts = values[1].split(",").map(Number);
      if (parts.length >= 2 && parts.slice(0, 2).every(Number.isFinite)) {
        return Math.atan2(parts[1], parts[0]) * 180 / Math.PI;
      }
    }
  }
  return Number(partyMarker && partyMarker._partyBearing) || 0;
}

function setPartyMarkerBearingForDistance(distance, initialTurn = false, preserveInitialTurn = false, immediate = false) {
  if (!partyMarker || !partyMarker._icon || !map || routePoints.length < 2) return;
  const total = getRouteTravelLength(routePoints);
  if (!(total > 0)) return;

  // Направление берём по фактически отображаемой геометрии маршрута.
  let bearing = getPartyRenderedRouteBearing(Number(distance) || 0);
  if (!bearing) {
    const displayPoints = Array.isArray(window.partyVisualRoutePoints) &&
      window.partyVisualRoutePoints.length >= 2
        ? window.partyVisualRoutePoints
        : createRouteDisplayPoints(routePoints, []);
    const displayLength = getRouteTravelLength(displayPoints);
    if (!(displayLength > 0)) return;
    const progress = Math.max(0, Math.min(1, Number(distance) / total));
    const displayDistance = progress * displayLength;
    const before = getRoutePointAtDistance(displayPoints, Math.max(0, displayDistance - 6));
    const after = getRoutePointAtDistance(displayPoints, Math.min(displayLength, displayDistance + 6));
    if (!before || !after) return;
    bearing = { from: map.latLngToContainerPoint(before), to: map.latLngToContainerPoint(after) };
  }

  const dx = bearing.to.x - bearing.from.x;
  const dy = bearing.to.y - bearing.from.y;
  if (Math.hypot(dx, dy) < 0.01) return;

  let angle = Math.atan2(dx, -dy) * 180 / Math.PI;
  const artwork = partyMarker._icon.querySelector("img");
  if (!artwork) return;
  const now = window.getSynchronizedRouteNow();
  const renderedAngle = getPartyMarkerRenderedAngle(artwork);
  const referenceAngle = initialTurn ? renderedAngle : Number(partyMarker._partyBearing);
  if (Number.isFinite(referenceAngle)) {
    while (angle - referenceAngle > 180) angle -= 360;
    while (angle - referenceAngle < -180) angle += 360;
  }

  if (initialTurn) {
    // Чистый запуск: фиксируем реальный текущий угол, затем одним CSS-переходом
    // поворачиваем жетон к касательной нового маршрута ровно за 3000 мс.
    const fromAngle = renderedAngle;
    partyMarker._partyInitialTurnStarted = true;
    partyMarker._partyInitialTurnDistance = Number(distance) || 0;
    partyMarker._partyInitialTurnFrom = fromAngle;
    partyMarker._partyInitialTurnTo = angle;
    partyMarker._partyInitialTurnStartedAt = now;
    partyMarker._partyInitialTurnUntil = now + 3000;
    artwork.style.transition = "opacity 520ms ease-in-out, transform 0ms linear";
    artwork.style.transform = `rotate(${fromAngle}deg)`;
    void artwork.getBoundingClientRect();
    artwork.style.transition = "opacity 520ms ease-in-out, transform 3000ms linear";
    artwork.style.transform = `rotate(${angle}deg)`;
  } else if (!preserveInitialTurn && Number(partyMarker._partyInitialTurnUntil) > now) {
    // Не позволяем обычным обновлениям перебивать трёхсекундный поворот.
    return;
  } else if (preserveInitialTurn && Number(partyMarker._partyInitialTurnUntil) > now) {
    const remaining = Number(partyMarker._partyInitialTurnUntil) - now;
    partyMarker._partyInitialTurnFrom = getPartyMarkerInitialTurnAngle(now);
    partyMarker._partyInitialTurnTo = angle;
    partyMarker._partyInitialTurnStartedAt = now;
    artwork.style.transition = `opacity 520ms ease-in-out, transform ${Math.max(1, remaining)}ms linear`;
    artwork.style.transform = `rotate(${angle}deg)`;
  } else {
    artwork.style.transition = `opacity 520ms ease-in-out, transform ${immediate ? 0 : 180}ms linear`;
    artwork.style.transform = `rotate(${angle}deg)`;
  }
  partyMarker._partyBearing = angle;
}
window.setPartyMarkerBearingForDistance = setPartyMarkerBearingForDistance;

window.startPartyInitialTurnAfterRouteRedraw = function() {
  if (window.routeMode || window.routePendingConfirmation || window.routeEditingConfirmedRoute ||
      !partyMarker || !partyMarker._icon || routePoints.length < 2 ||
      !window.routeAnimationPublished || !window.routePlaybackRouteStartedAt) return;
  const routeStartedAt = Number(window.routePlaybackRouteStartedAt);
  if (Number(partyMarker._partyInitialTurnRouteStartedAt) === routeStartedAt) return;
  const movement = window.partyPlaybackState;
  const movementStart = movement && Number(movement.routeStartedAt) === routeStartedAt
    ? Math.max(0, Number(movement.startDistance) || 0)
    : Math.max(0, Number(window.routePlaybackAnimationStartDistance) || 0);
  window.setPartyMarkerBearingForDistance(movementStart, true);
  partyMarker._partyInitialTurnRouteStartedAt = routeStartedAt;
};

function getTerminalDestinationSettlement() {
  if (!window.routeDestinationCityId) return null;
  const area = (Array.isArray(window.settlementAreas) ? window.settlementAreas : [])
    .find(item => String(item.id) === String(window.routeDestinationCityId));
  if (!area || !area.center) return null;
  const total = getRouteTravelLength(routePoints);
  const transit = getRouteSettlementTransitIntervals(routePoints)
    .find(interval => String(interval.settlementId || '') === String(window.routeDestinationCityId));
  if (!transit) return null;
  return { area, total, transit };
}

function isTerminalSettlementPaused(state) {
  // Не принимаем за прибытие в конечный город старое состояние паузы,
  // оставшееся от предыдущего маршрута (например, при выходе из города).
  // Завершённая пауза должна относиться именно к текущему маршруту.
  if (!state || state.status !== "paused" || !state.terminalSettlementReached) return false;
  const currentRouteStartedAt = Number(window.routePlaybackRouteStartedAt);
  if (!Number.isFinite(currentRouteStartedAt) || currentRouteStartedAt <= 0 ||
      Number(state.routeStartedAt) !== currentRouteStartedAt) return false;
  const destination = getTerminalDestinationSettlement();
  return Boolean(destination && Number(state.startDistance) >= destination.total - 0.001);
}

// Эта проверка вызывается также из type="module"-скрипта,
// где локальные объявления обычного скрипта недоступны напрямую.
window.isTerminalSettlementPaused = isTerminalSettlementPaused;

// Возвращает точное расстояние входа в конечное поселение.
// Для него используется тот же внешний узел маршрута, что и для маски
// визуальной кисти; null означает, что порог ещё не рассчитан.
function getTerminalPartyMarkerHideDistance(routeTransitIntervals = null) {
  const destinationId = window.routeDestinationCityId != null
    ? String(window.routeDestinationCityId) : null;
  if (!destinationId) return null;

  let entryDistance = null;
  for (let i = 1; i < routePoints.length; i++) {
    const point = routePoints[i];
    if (String(point._routeSettlementId || '') === destinationId &&
        (getRouteSegmentMode(point) === 'settlement-count-only' ||
         getRouteSegmentMode(point) === 'settlement-zero')) {
      entryDistance = getRouteTravelLength(routePoints.slice(0, i));
      break;
    }
  }

  const intervals = Array.isArray(routeTransitIntervals)
    ? routeTransitIntervals : getRouteSettlementTransitIntervals(routePoints);
  const matchingTransit = intervals.find(interval =>
    String(interval.settlementId || '') === destinationId
  );
  if (entryDistance === null && matchingTransit) {
    entryDistance = Number(matchingTransit.start);
  }

  const rawVisualHideDistance = window.routeTerminalMarkerHideDistance;
  const visualHideDistance = rawVisualHideDistance == null ? NaN : Number(rawVisualHideDistance);
  if (Number.isFinite(visualHideDistance) && visualHideDistance >= 0) {
    entryDistance = entryDistance === null
      ? visualHideDistance : Math.min(entryDistance, visualHideDistance);
  }
  return Number.isFinite(entryDistance) && entryDistance >= 0 ? entryDistance : null;
}

function isPartyMarkerInsideSettlementTransit(distance, terminalHideDistance = undefined, routeTransitIntervals = null) {
  const currentDistance = Math.max(0, Number(distance) || 0);
  const intervals = Array.isArray(routeTransitIntervals)
    ? routeTransitIntervals : getRouteSettlementTransitIntervals(routePoints);
  const startTransit = intervals.find(interval =>
    Number(interval.start) <= 0.001 && Number(interval.end) > 0.001 && interval.settlementId
  );
  if (startTransit && currentDistance < Number(startTransit.end) - 0.001) return true;

  if (terminalHideDistance === undefined) {
    terminalHideDistance = getTerminalPartyMarkerHideDistance(intervals);
  }
  return Number.isFinite(terminalHideDistance) &&
    currentDistance >= terminalHideDistance - 0.001;
}

function setPartyMarkerVisible(visible) {
  window.partyMarkerHiddenForSettlementExit = !visible;
  if (!partyMarker || !partyMarker._icon) return;
  partyMarker._icon.style.transition = "opacity 520ms ease-in-out";
  partyMarker._icon.style.opacity = visible ? "1" : "0";
  partyMarker._icon.style.pointerEvents = visible ? "auto" : "none";
}

// При восстановлении страницы маркер внутри поселения должен быть скрыт
// сразу, без проигрывания обычного перехода прозрачности.
function setPartyMarkerVisibleImmediately(visible) {
  window.partyMarkerHiddenForSettlementExit = !visible;
  if (!partyMarker || !partyMarker._icon) return;
  partyMarker._icon.style.transition = "none";
  partyMarker._icon.style.opacity = visible ? "1" : "0";
  partyMarker._icon.style.pointerEvents = visible ? "auto" : "none";
}

function getPartyPlaybackPositionForDistance(distance) {
  const currentDistance = Math.max(0, Number(distance) || 0);
  const intervals = getRouteSettlementTransitIntervals(routePoints);
  const startTransit = intervals.find(interval =>
    Number(interval.start) <= 0.001 && Number(interval.end) > 0.001 && interval.settlementId
  );
  const destination = getTerminalDestinationSettlement();
  const relevantTransit = [startTransit, destination && destination.transit].filter(Boolean)
    .find(interval => currentDistance >= Number(interval.start) - 0.001 &&
      currentDistance <= Number(interval.end) + 0.001);
  return relevantTransit
    ? getRoutePointAtDistance(routePoints, currentDistance)
    : getPartyPlaybackDisplayPosition(currentDistance);
}

function renderPartyPlaybackState(state) {
  if (!routeLaunchPanel) return;
  const pauseButton = routeLaunchPanel.querySelector("#route-party-pause");
  const playButton = routeLaunchPanel.querySelector("#route-party-play");
  const editButton = routeLaunchPanel.querySelector("#route-party-edit");
  const campButton = routeLaunchPanel.querySelector("#route-party-camp");
  const shortRestButton = routeLaunchPanel.querySelector("#route-party-short-rest");
  const campSafetySlider = routeLaunchPanel.querySelector("#route-party-camp-safety-slider");
  if (!pauseButton || !playButton) return;
  const playing = state && state.status === "playing";
  const paused = Boolean(state && state.status === "paused");
  const campRequired = Boolean(state && state.campRequired);
  const terminalCityPaused = isTerminalSettlementPaused(state);
  const routeTotal = Array.isArray(routePoints) && routePoints.length >= 2
    ? getRouteTravelLength(routePoints) : 0;
  const reachedRouteEnd = Boolean(state && state.status === "paused" && routeTotal > 0.001 &&
    Number(state.startDistance) >= routeTotal - 0.001);
  if (editButton) editButton.disabled = Boolean(playing || terminalCityPaused || reachedRouteEnd);
  pauseButton.classList.toggle("active", !playing);
  pauseButton.setAttribute("aria-pressed", !playing ? "true" : "false");
  playButton.classList.toggle("active", playing);
  playButton.setAttribute("aria-pressed", playing ? "true" : "false");
  pauseButton.disabled = !playing;
  const playUnavailable = playing || campRequired || terminalCityPaused || reachedRouteEnd || routeMarkerAnimations.length > 0;
  playButton.disabled = playUnavailable;
  playButton.classList.toggle("disabled", playUnavailable);
  playButton.setAttribute("aria-disabled", playUnavailable ? "true" : "false");
  const confirmationOpen = Boolean(partyActionConfirmationId || partyActionConfirmationSubmitting);
  if (campButton) {
    campButton.disabled = !paused || confirmationOpen;
    campButton.classList.toggle("active", campRequired);
    campButton.setAttribute("aria-pressed", campRequired ? "true" : "false");
    campButton.setAttribute("aria-disabled", campButton.disabled ? "true" : "false");
  }
  if (shortRestButton) {
    shortRestButton.disabled = !paused || confirmationOpen;
    shortRestButton.setAttribute("aria-disabled", shortRestButton.disabled ? "true" : "false");
  }
  if (campSafetySlider) {
    campSafetySlider.disabled = !paused;
    campSafetySlider.setAttribute("aria-disabled", campSafetySlider.disabled ? "true" : "false");
  }
  syncRouteLaunchControls();
}

function setPartyMarkerPlaybackSmoothing(enabled) {
  if (!partyMarker || !partyMarker._icon) return;
  // Leaflet по умолчанию округляет координаты маркера до целого пикселя.
  // Во время движения это особенно заметно на дальнем зуме: жетон перескакивает
  // с пикселя на пиксель. Перемещение теперь выполняется по дробным координатам,
  // без CSS-transition, который добавлял запаздывание между кадрами.
  partyMarker._icon.style.transition = "none";
  partyMarker._icon.style.willChange = enabled ? "transform" : "auto";
  partyMarker._icon.style.backfaceVisibility = "hidden";
}

function setPartyMarkerPlaybackPosition(position) {
  if (!partyMarker || !position || !map) return;
  const latlng = L.latLng(position);
  partyMarker._latlng = latlng;
  if (!partyMarker._icon) return;
  // map.latLngToLayerPoint() округляет координату. Здесь используем
  // непрерывную проекцию карты, сохраняя дробные пиксели на любом масштабе.
  const layerPoint = map.project(latlng, map.getZoom()).subtract(map.getPixelOrigin());
  L.DomUtil.setPosition(partyMarker._icon, layerPoint);
}
window.setPartyMarkerPlaybackPosition = setPartyMarkerPlaybackPosition;

function stopPartyPlaybackFrame() {
  if (partyPlaybackFrame !== null) cancelAnimationFrame(partyPlaybackFrame);
  partyPlaybackFrame = null;
}

function tickPartyPlayback() {
  const state = window.partyPlaybackState;
  if (!state || state.status !== "playing") {
    stopPartyPlaybackFrame();
    return;
  }
  if (routeMarkerAnimations.length > 0 || !Array.isArray(routePoints) || routePoints.length < 2) {
    partyPlaybackFrame = requestAnimationFrame(tickPartyPlayback);
    return;
  }
  setPartyMarkerPlaybackSmoothing(true);
  const now = window.getSynchronizedRouteNow();
  const total = getRouteTravelLength(routePoints);
  let distance = Math.min(total, window.getPartyPlaybackDistance(state, now));
  const playbackStartDistance = Math.max(0, Number(state.startDistance) || 0);
  const nextRestStop = (Array.isArray(window.routeRestMarkers) ? window.routeRestMarkers : [])
    .filter(marker => marker && marker._partyPlaybackRestStop === true)
    .map(marker => Number(marker._partyPlaybackTokenDistance))
    .filter(restDistance => Number.isFinite(restDistance) &&
      restDistance > playbackStartDistance + 0.02 && restDistance <= distance + 0.02)
    .sort((a, b) => a - b)[0];
  const reachedRestStop = Number.isFinite(nextRestStop);
  if (reachedRestStop) distance = nextRestStop;
  partyPlaybackDistance = distance;
  const destination = getTerminalDestinationSettlement();
  const transitIntervals = getRouteSettlementTransitIntervals(routePoints);
  const startCityTransit = transitIntervals.find(interval =>
    Number(interval.start) <= 0.001 && Number(interval.end) > 0.001 && interval.settlementId
  );
  if (startCityTransit && distance >= Number(startCityTransit.end) - 0.001) {
    const exitedId = String(startCityTransit.settlementId);
    if (!window.routeStartCityOutlineClearedFor ||
        String(window.routeStartCityOutlineClearedFor) !== exitedId) {
      if (typeof window.clearRouteDestinationSettlementTrace === "function") {
        window.clearRouteDestinationSettlementTrace(exitedId);
      }
      window.routeStartCityOutlineClearedFor = exitedId;
    }
  }
  const markerWasHidden = Boolean(window.partyMarkerHiddenForSettlementExit);
  const terminalHideDistance = getTerminalPartyMarkerHideDistance(transitIntervals);
  const markerShouldBeHidden = isPartyMarkerInsideSettlementTransit(
    distance, terminalHideDistance, transitIntervals
  );
  // Внутренний переход поселения ускорен в 8 раз, а прозрачность жетона
  // плавно меняется 520 мс. Если продолжать двигать жетон после начала
  // исчезновения, он успевает уехать глубоко за видимую кисть. Фиксируем
  // его на самой точке входа на всё время затухания.
  const markerPositionDistance = Number.isFinite(terminalHideDistance) &&
    distance >= terminalHideDistance - 0.001
      ? terminalHideDistance : distance;
  const position = getPartyPlaybackPositionForDistance(markerPositionDistance);
  if (position && partyMarker) window.setPartyMarkerPlaybackPosition(position);
  setPartyMarkerVisible(!markerShouldBeHidden);
  const markerJustAppeared = markerWasHidden && !markerShouldBeHidden && Boolean(partyMarker);
  if (markerJustAppeared) {
    // На выходе из города не показываем жетон с устаревшим углом,
    // оставшимся от центра: сразу направляем его по касательной новой линии.
    partyMarker._partyInitialTurnUntil = 0;
    window.setPartyMarkerBearingForDistance(distance, false, false, true);
  }
  // Обычное сопровождение направления включается после завершения
  // начального трёхсекундного разворота, не задерживая само движение.
  if (!markerJustAppeared &&
      now >= Math.max(Number(state.startedAt || 0), Number(partyMarker && partyMarker._partyInitialTurnUntil) || 0)) {
    window.setPartyMarkerBearingForDistance(distance, false);
  }
  updatePartyPlaybackRouteLine(distance);
  updatePartyPlaybackRouteTokens(distance);
  if (reachedRestStop) {
    const pausedState = {
      ...state,
      status: "paused",
      startDistance: nextRestStop,
      startedAt: null,
      routeStartedAt: Number(window.routePlaybackRouteStartedAt) || null,
      campRequired: true,
      campHoursElapsed: Math.max(0, Number(state.campHoursElapsed) || 0)
    };
    window.partyPlaybackState = pausedState;
    renderPartyPlaybackState(pausedState);
    stopPartyPlaybackFrame();
    setPartyMarkerPlaybackSmoothing(false);
    if (typeof window.publishPartyPlaybackState === "function") {
      window.publishPartyPlaybackState({
        status: "paused",
        startDistance: nextRestStop,
        startedAt: null,
        routeStartedAt: Number(window.routePlaybackRouteStartedAt) || null,
        campRequired: true,
        campHoursElapsed: Math.max(0, Number(state.campHoursElapsed) || 0),
        restResetDistances: routeRestResetDistances.slice()
      }).catch(error => console.error("Не удалось автоматически остановить отряд на привале:", error));
    }
    return;
  }
  if (distance >= total - 0.001) {
    const terminalArea = destination && destination.area;
    if (terminalArea && terminalArea.center && partyMarker) {
      if (typeof window.completeRouteSettlementOutline === "function") {
        window.completeRouteSettlementOutline(terminalArea);
      }
      window.setPartyMarkerPlaybackPosition(terminalArea.center);
      setPartyMarkerVisible(false);
      // Убираем все маршрутные артефакты, сохраняя геометрию маршрута
      // в памяти для последующего редактирования/выхода из города.
      clearRouteDrawing();
    }
    const pausedState = {
      ...state, status: "paused", startDistance: total, startedAt: null,
      campRequired: false,
      terminalSettlementReached: Boolean(terminalArea)
    };
    window.partyPlaybackState = pausedState;
    partyPlaybackDistance = total;
    renderPartyPlaybackState(pausedState);
    stopPartyPlaybackFrame();
    setPartyMarkerPlaybackSmoothing(false);
    if (typeof window.publishPartyPlaybackState === "function") {
      window.publishPartyPlaybackState({
        status: "paused", startDistance: total, startedAt: null,
        routeStartedAt: Number(window.routePlaybackRouteStartedAt) || null,
        campRequired: false,
        terminalSettlementReached: Boolean(terminalArea),
        campHoursElapsed: Math.max(0, Number(state.campHoursElapsed) || 0),
        restResetDistances: routeRestResetDistances.slice()
      }).catch(error => console.error("Не удалось сохранить прибытие в конечный город:", error));
    }
    return;
  }
  partyPlaybackFrame = requestAnimationFrame(tickPartyPlayback);
}

window.applyPartyPlaybackState = function(state) {
  if (!state || !["playing", "paused"].includes(state.status)) return;
  let restResetDistancesChanged = false;
  let forcedRouteStateChanged = false;
  if (Array.isArray(state.forcedSegments)) {
    const incomingForcedSegments = state.forcedSegments
      .map(segment => ({
        start: Number(segment && segment.start) || 0,
        end: Number(segment && segment.end) || 0,
        startUnits: Math.max(0, Math.min(0.999999, Number(segment && segment.startUnits) || 0)),
        fixed: true
      }))
      .filter(segment => segment.end > segment.start + 0.001);
    forcedRouteStateChanged = incomingForcedSegments.length !== routeForcedSegments.length ||
      incomingForcedSegments.some((segment, index) => {
        const existing = getForcedSegmentDistances(routeForcedSegments[index] || {});
        return Math.abs(segment.start - existing.start) > 0.02 ||
          Math.abs(segment.end - existing.end) > 0.02 ||
          Math.abs(segment.startUnits - existing.startUnits) > 0.001;
      });
    if (forcedRouteStateChanged) routeForcedSegments = incomingForcedSegments;
  }
  if (Number.isFinite(Number(state.forcedMarchStartDistance))) {
    const next = Math.max(0, Number(state.forcedMarchStartDistance) || 0);
    if (Math.abs(next - routeForcedMarchStartDistance) > 0.02) forcedRouteStateChanged = true;
    routeForcedMarchStartDistance = next;
  }
  if (Number.isFinite(Number(state.forcedMarchStartUnits))) {
    const next = Math.max(0, Number(state.forcedMarchStartUnits) || 0);
    if (Math.abs(next - routeForcedMarchStartUnits) > 0.001) forcedRouteStateChanged = true;
    routeForcedMarchStartUnits = next;
  }
  if (Number.isFinite(Number(state.forcedMarchEpochStartDistance))) {
    const next = Math.max(0, Number(state.forcedMarchEpochStartDistance) || 0);
    if (Math.abs(next - routeForcedMarchEpochStartDistance) > 0.02) forcedRouteStateChanged = true;
    routeForcedMarchEpochStartDistance = next;
  }
  if (Number.isFinite(Number(state.restElapsedCarryUnits))) {
    const next = Math.max(0, Math.min(0.999999, Number(state.restElapsedCarryUnits) || 0));
    if (Math.abs(next - routeRestElapsedCarryUnits) > 0.001) forcedRouteStateChanged = true;
    routeRestElapsedCarryUnits = next;
  }
  if (Array.isArray(state.restResetDistances)) {
    const incomingResets = state.restResetDistances
      .map(Number)
      .filter(distance => Number.isFinite(distance) && distance > 0.001)
      .sort((a, b) => a - b)
      .filter((distance, index, values) => index === 0 || distance - values[index - 1] > 0.02);
    restResetDistancesChanged = incomingResets.length !== routeRestResetDistances.length ||
      incomingResets.some((distance, index) => Math.abs(distance - routeRestResetDistances[index]) > 0.02);
    if (restResetDistancesChanged) routeRestResetDistances = incomingResets;
  }
  window.partyPlaybackState = state;
  partyPlaybackDistance = window.getPartyPlaybackDistance(state, window.getSynchronizedRouteNow());
  renderPartyPlaybackState(state);
  if (state.status === "playing") {
    // Если разворот уже начался при раскрытии линии, не перезапускаем его
    // повторным Firebase-снимком. Иначе запускаем как резервный вариант.
    const initialTurnStarted = Boolean(partyMarker && partyMarker._partyInitialTurnStarted);
    if (!initialTurnStarted) {
      window.setPartyMarkerBearingForDistance(partyPlaybackDistance, true);
    }
    stopPartyPlaybackFrame();
    partyPlaybackFrame = requestAnimationFrame(tickPartyPlayback);
  } else {
    stopPartyPlaybackFrame();
    setPartyMarkerPlaybackSmoothing(false);
    const terminalDestination = isTerminalSettlementPaused(state)
      ? getTerminalDestinationSettlement() : null;
    const position = terminalDestination
      ? terminalDestination.area.center
      : getPartyPlaybackPositionForDistance(partyPlaybackDistance);
    if (position && partyMarker) window.setPartyMarkerPlaybackPosition(position);
    if (terminalDestination) {
      setPartyMarkerVisible(false);
      clearRouteDrawing();
    } else {
      setPartyMarkerVisible(!isPartyMarkerInsideSettlementTransit(partyPlaybackDistance));
    }
    const initialTurnActive = Boolean(partyMarker &&
      Number(partyMarker._partyInitialTurnUntil) > window.getSynchronizedRouteNow());
    if (!initialTurnActive) {
      window.setPartyMarkerBearingForDistance(partyPlaybackDistance, false);
    }
    if (!terminalDestination) {
      updatePartyPlaybackRouteLine(partyPlaybackDistance);
      updatePartyPlaybackRouteTokens(partyPlaybackDistance);
    }
  }
  if ((restResetDistancesChanged || forcedRouteStateChanged) && routeFinished &&
      typeof window.updateRouteLine === "function") {
    window.updateRouteLine(null);
    updatePartyPlaybackRouteTokens(partyPlaybackDistance);
  }
};

// Пересчитывает привалы по накопленному времени каждого участка.
// Смена темпа не меняет уже пройденное время: новый темп действует только
// на сегменты, добавленные после следующего нажатия ЛКМ.
function getNormalRestDistances(totalLength, dailyLimit, routeGeometry = routePoints, initialElapsedUnits = routeRestElapsedCarryUnits) {
  const result = [];
  if (!(totalLength > 0)) return result;

  const transitIntervals = getRouteSettlementTransitIntervals(routeGeometry)
    .map(interval => ({
      start: Math.max(0, Math.min(totalLength, interval.start)),
      end: Math.max(0, Math.min(totalLength, interval.end))
    }))
    .filter(interval => interval.end >= interval.start - 0.001);

  // Выход из поселения начинает новый отсчёт дневного времени.
  const activeIntervals = [];
  let cursor = 0;
  transitIntervals.forEach(interval => {
    if (interval.start > cursor + 0.001) {
      activeIntervals.push({ start: cursor, end: interval.start });
    }
    cursor = Math.max(cursor, interval.end);
  });
  if (cursor < totalLength - 0.001) {
    activeIntervals.push({ start: cursor, end: totalLength });
  }
  if (!activeIntervals.length && !transitIntervals.length && totalLength > 0.001) {
    activeIntervals.push({ start: 0, end: totalLength });
  }

  const forcedSegments = routeForcedSegments
    .map(segment => getForcedSegmentDistances(segment))
    .sort((a, b) => a.start - b.start);

  function addRest(distance, intervalEnd) {
    if (distance <= 0.001 || distance > intervalEnd + 0.05) return;
    distance = Math.min(distance, intervalEnd);
    if (!result.length || Math.abs(result[result.length - 1] - distance) > 0.001) {
      result.push(distance);
    }
  }

  function addRegularRests(anchor, end, carryUnits = 0) {
    if (end <= anchor + 0.001) return;
    const carry = Math.max(0, Math.min(0.999999, Number(carryUnits) || 0));
    const totalUnits = getRouteTravelTimeUnitsBetweenDistances(routeGeometry, anchor, end);
    const completedDays = Math.floor(totalUnits + carry + 0.000001);
    for (let day = 1; day <= completedDays; day++) {
      const elapsedForThisRest = day - carry;
      if (elapsedForThisRest <= 0.000001) continue;
      const distance = getRouteDistanceAtElapsedTime(routeGeometry, anchor, elapsedForThisRest, end);
      addRest(distance, end);
    }
  }

  const dayIntervals = [];
  activeIntervals.forEach(interval => {
    const resetCuts = routeRestResetDistances
      .filter(distance => distance > interval.start + 0.001 && distance < interval.end - 0.001)
      .sort((a, b) => a - b);
    let dayStart = interval.start;
    resetCuts.forEach(resetDistance => {
      dayIntervals.push({ start: dayStart, end: resetDistance });
      dayStart = resetDistance;
    });
    dayIntervals.push({ start: dayStart, end: interval.end });
  });

  dayIntervals.forEach(interval => {
    const intervalStart = interval.start;
    const intervalEnd = interval.end;
    if (intervalEnd <= intervalStart + 0.001) return;
    // Carry-in действует только до первого нового привала; выход из поселения
    // начинает новый дневной отсчёт и обнуляет его.
    let pendingCarryUnits = intervalStart <= 0.001
      ? Math.max(0, Math.min(0.999999, Number(initialElapsedUnits) || 0)) : 0;

    let previousAnchor = intervalStart;
    const localForced = forcedSegments.filter(segment =>
      segment.end > intervalStart + 0.001 && segment.start < intervalEnd - 0.001
    );

    localForced.forEach(segment => {
      const forcedStart = Math.max(intervalStart, segment.start);
      const forcedEnd = Math.min(intervalEnd, segment.end);
      if (forcedStart > previousAnchor + 0.001) {
        addRegularRests(previousAnchor, forcedStart, pendingCarryUnits);
      }

      // Само включение форсированного марша не является привалом и не
      // обнуляет дневной прогресс. Разделительная отметка ставится там,
      // где суммарное время от предыдущего привала достигает целого дня.
      // Если сегмент начинается после выхода из поселения, прежний carry
      // уже сброшен самим выходом.
      const carryAtForcedStart = intervalStart <= 0.001 &&
        forcedStart <= segment.start + 0.001
        ? Math.max(0, Math.min(0.999999, Number(segment.startUnits) || 0))
        : 0;
      const forcedTravelUnits = getRouteTravelTimeUnitsBetweenDistances(
        routeGeometry, forcedStart, forcedEnd
      );
      const firstBoundaryUnits = 1 - carryAtForcedStart;
      if (forcedTravelUnits >= firstBoundaryUnits - 0.000001) {
        // Разделительная черта — только визуальная отметка смены режима,
        // не привал: для неё не создаём круг и не останавливаем отряд.
        pendingCarryUnits = 0;

        // Завершённый форсированный марш заканчивается обязательным привалом.
        if (segment.end <= intervalEnd + 0.05 && forcedEnd > forcedStart + 0.001) {
          addRest(forcedEnd, intervalEnd);
        }
      } else {
        // На случай старых/неполных данных: если суточная граница ещё
        // не достигнута, сохраняем остаток времени, а не создаём привал.
        pendingCarryUnits = carryAtForcedStart + forcedTravelUnits;
      }
      previousAnchor = Math.max(previousAnchor, forcedEnd);
    });

    addRegularRests(previousAnchor, intervalEnd, pendingCarryUnits);
  });

  // При входе в поселение отдельный привал на внешней границе не нужен.
  const settlementEntryDistances = transitIntervals.map(interval => interval.start);
  return result
    .filter(distance =>
      !settlementEntryDistances.some(entry => Math.abs(entry - distance) <= 0.05) &&
      !routeRestResetDistances.some(reset => Math.abs(reset - distance) <= 0.05)
    )
    .sort((a, b) => a - b);
}


// Возвращает накопленную долю игрового дня от последнего привала до позиции отряда.
// Если между последним привалом и отрядом было поселение, отсчёт начинается с его выхода.
function getRouteElapsedUnitsSinceLastRest(points, currentDistance, carryInUnits = 0) {
  const total = getRouteTravelLength(points);
  const current = Math.max(0, Math.min(total, Number(currentDistance) || 0));
  if (current <= 0.001) return Math.max(0, Math.min(0.999999, Number(carryInUnits) || 0));

  const rests = getNormalRestDistances(total, 0, points, carryInUnits)
    .filter(distance => distance <= current + 0.001);
  const lastRest = rests.length ? rests[rests.length - 1] : null;
  const lastManualReset = routeRestResetDistances
    .filter(distance => distance <= current + 0.001)
    .sort((a, b) => b - a)[0];
  const transitIntervals = getRouteSettlementTransitIntervals(points);
  const lastSettlementExit = transitIntervals
    .map(interval => Number(interval.end))
    .filter(distance => Number.isFinite(distance) && distance <= current + 0.001)
    .sort((a, b) => b - a)[0];

  let anchor = 0;
  let elapsed = Math.max(0, Math.min(0.999999, Number(carryInUnits) || 0));
  if (lastRest !== null && lastRest > anchor + 0.001) {
    anchor = lastRest;
    elapsed = 0;
  }
  if (Number.isFinite(lastManualReset) && lastManualReset > anchor + 0.001) {
    anchor = lastManualReset;
    elapsed = 0;
  }
  if (Number.isFinite(lastSettlementExit) && lastSettlementExit > anchor + 0.001) {
    anchor = lastSettlementExit;
    elapsed = 0;
  }
  elapsed += getRouteTravelTimeUnitsBetweenDistances(points, anchor, current);
  return Math.max(0, Math.min(0.999999, elapsed));
}

  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  window.routeRestMarkers.forEach(marker => {
    if (marker && marker._partyPlaybackMask && marker._partyPlaybackMask.parentNode) {
      marker._partyPlaybackMask.parentNode.removeChild(marker._partyPlaybackMask);
    }
    // При предпросмотре длинного маршрута слои пересоздаются часто. Отменяем
    // отложенное появление старых штрихов/засечек, иначе их таймеры копятся
    // после удаления слоя и продолжают просыпаться без полезной работы.
    if (marker && marker._routeDashRevealTimer) {
      clearTimeout(marker._routeDashRevealTimer);
      marker._routeDashRevealTimer = null;
    }
    if (marker && marker._routeTickRevealTimer) {
      clearTimeout(marker._routeTickRevealTimer);

    }
    map.removeLayer(marker);
  });

  window.routeRestMarkers = [];
  partyPlaybackRouteLineLayers = [];
  if (routeEndMarker) {
  map.removeLayer(routeEndMarker);
  routeEndMarker = null;
}
}

  if (terminalSnapshot && terminalSnapshot.cityId != null) {
    if (pendingRouteClickTimer) clearTimeout(pendingRouteClickTimer);
    pendingRouteClickTimer = null;

    pendingRouteClickPace = null;
    pendingRouteClickSpeedReduced = null;
    stopRouteMarkerAnimation();
    if (typeof window.cancelPendingRouteSettlementTraces === "function") {
      window.cancelPendingRouteSettlementTraces();
    }
    routeFinished = true;
    window.routeEditingConfirmedRoute = false;
    window.routePendingConfirmation = false;
    window.routeMode = false;
    window.routeAnimationPublished = true;
    pendingRouteResumeState = null;
    pendingRoutePlaybackResumeDistance = null;
    routePoints = Array.isArray(terminalSnapshot.routePoints) ? terminalSnapshot.routePoints : [];
    window.routeDestinationCityId = String(terminalSnapshot.cityId);
    window.routeDestinationBoundaryPoint = terminalSnapshot.destinationBoundaryPoint || null;
    window.routeDestinationApproachPoint = terminalSnapshot.destinationApproachPoint || null;
    window.routeIntermediateCityIds = Array.isArray(terminalSnapshot.intermediateCityIds)
      ? terminalSnapshot.intermediateCityIds.slice() : [];
    window.routePlaybackRouteStartedAt = terminalSnapshot.routeStartedAt || null;
    if (terminalSnapshot.playbackState) {
      window.partyPlaybackState = { ...terminalSnapshot.playbackState };

    }
    clearRouteIntermediateCityOutlines();
    clearRouteDrawing();
    if (window.clearSettlementOutline) window.clearSettlementOutline();
    const area = (window.settlementAreas || []).find(item =>
      String(item.id) === String(terminalSnapshot.cityId)
