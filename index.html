<html>
<head>
  <meta charset="utf-8" />
  <title>DND Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
body {
  margin: 0;

  background: url('background.jpg') no-repeat center center fixed;
  background-size: cover;
}

#map {
  height: 100%;
  width: 100%;

  background: transparent;
  position: relative;
}

#map-wrapper::after {
  content: "";
  position: absolute;

  top: -2%;
  bottom: -2%;
  left: 11%;
  right: 11%;

  border: 4px solid #0f0b07;

  box-shadow: 
    0 0 40px rgba(0,0,0,0.9),
    inset 0 0 20px rgba(0,0,0,0.5);

  pointer-events: none;
}
  .leaflet-container {
  outline: none !important;
  border: none !important;
}

.leaflet-pane img {
  border: none !important;
}

.leaflet-marker-icon:focus {
  outline: none !important;
}

#map-wrapper {
  height: 90vh;
  width: 90vw;
  margin: 5vh auto;

  position: relative;
}

#map.zoomed::after {
  content: "";
  position: absolute;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  border: 4px solid #0f0b07;

  box-shadow: 
    0 0 40px rgba(0,0,0,0.9),
    inset 0 0 20px rgba(0,0,0,0.5);

  pointer-events: none;
}

#map-wrapper.zoomed::after {
  display: none;
}

.marker-popup {
  background: #1b1b1b;
  color: #f5f5f5;
  padding: 10px;
  border-radius: 8px;
  font-family: sans-serif;
  min-width: 200px;
}

.marker-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 5px;
}

.marker-desc {
  font-size: 13px;
  opacity: 0.8;
  margin-bottom: 10px;
}

.marker-buttons {
  display: flex;
  justify-content: space-between;
}

.marker-buttons button {
  background: #333;
  border: none;
  color: white;
  padding: 5px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.marker-buttons button:hover {
  background: #555;
}

  </style>
</head>

<body>

<div id="marker-form" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
background:#1e1e1e; padding:20px; border-radius:8px; z-index:1000; color:white; width:300px;">

  <h3 id="form-title">РќРѕРІР°СЏ РјРµС‚РєР°</h3>

  <input id="marker-title" placeholder="РќР°Р·РІР°РЅРёРµ" style="width:100%; margin-bottom:10px;" />
  
  <textarea id="marker-desc" placeholder="РћРїРёСЃР°РЅРёРµ" style="width:100%; height:80px;"></textarea>

  <select id="marker-type" style="width:100%; margin-top:10px;">
  <option value="note">рџ“њ Р—Р°РјРµС‚РєР°</option>
  <option value="camp">рџЏ• Р›Р°РіРµСЂСЊ</option>
  <option value="cave">рџ•і РџРµС‰РµСЂР°</option>
  <option value="interest">вђ РРЅС‚РµСЂРµСЃРЅРѕРµ РјРµСЃС‚Рѕ</option>
  <option value="quest">вќ“ РљРІРµСЃС‚</option>
</select>
  
  <div style="margin-top:10px; display:flex; justify-content:space-between;">
    <button onclick="saveMarker()">РЎРѕС…СЂР°РЅРёС‚СЊ</button>
    <button onclick="closeForm()">РћС‚РјРµРЅР°</button>
  </div>
</div>

<div id="map-wrapper">
  <div id="map"></div>
</div>

<script>

var currentLatLng = null;
var editId = null;
var popupJustClosed = false;
var icons = {
  camp: L.icon({
    iconUrl: 'camp.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  cave: L.icon({
    iconUrl: 'cave.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  note: L.icon({
    iconUrl: 'note.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  interest: L.icon({
    iconUrl: 'interest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  }),

  quest: L.icon({
    iconUrl: 'quest.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -50]
  })
};

// СЂР°Р·РјРµСЂС‹ С‚РІРѕРµР№ РєР°СЂС‚С‹ (РїРѕРєР° РѕСЃС‚Р°РІРёРј С‚Р°Рє)
var width = 7016;
var height = 4960;

// СЃРѕР·РґР°С‘Рј РєР°СЂС‚Сѓ
var bounds = [[0,0], [height, width]];

var map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 0,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0,
  attributionControl: false,
});

// Р·Р°РіСЂСѓР¶Р°РµРј РєР°СЂС‚РёРЅРєСѓ
var imageUrl = 'map.jpg';

var bounds = [[0,0], [height, width]];
var overlay = L.imageOverlay(imageUrl, bounds).addTo(map);

map.fitBounds(bounds, {
  padding: [0, 0],
  animate: false
});

map.setMaxBounds(bounds);
map.panInsideBounds(bounds, { animate: false });

map.on('popupclose', function() {
  popupJustClosed = true;

  setTimeout(function() {
    popupJustClosed = false;
  }, 100);
});

function updateFrame() {
  var mapEl = document.getElementById('map');
  var wrapper = document.getElementById('map-wrapper');

  if (map.getZoom() === map.getMinZoom()) {
    // РјРёРЅРёРјР°Р»СЊРЅС‹Р№ Р·СѓРј
    wrapper.classList.remove("zoomed");
    mapEl.classList.remove("zoomed");

    map.dragging.disable(); // в†ђ Р±Р»РѕРєРёСЂСѓРµРј

  } else {
    // Р·СѓРј РµСЃС‚СЊ
    wrapper.classList.add("zoomed");
    mapEl.classList.add("zoomed");

    map.dragging.enable(); // в†ђ Р’РћРў РРўРћ Р’РђР–РќРћ
  }
}

updateFrame();
map.on('zoomend', updateFrame);

// --- Р—РђР“Р РЈР—РљРђ РЎРћРҐР РђРќРЃРќРќР«РҐ РњР•РўРћРљ ---
var savedMarkers = JSON.parse(localStorage.getItem("markers") || "[]");

savedMarkers.forEach(function(m) {
  addMarker(m);
});

function addMarker(data) {
  var marker = L.marker(
  [data.lat, data.lng],
  { icon: icons[data.type || "note"] }
).addTo(map);

function renderPopup() {
  return `
    <div class="marker-popup">
      <div class="marker-title">${data.title}</div>
      <div class="marker-desc">${data.description}</div>

      <div class="marker-buttons">
        <button onclick="editMarker(${data.id})">вњЏпёЏ</button>
        <button onclick="deleteMarker(${data.id})">рџ—‘</button>
      </div>
    </div>
  `;
}

  marker.bindPopup(renderPopup());

  marker._customId = data.id;
}

// --- Р”РћР‘РђР’Р›Р•РќРР• РњР•РўРљР РџРћ РљР›РРљРЈ ---
map.on('click', function(e) {
  if (popupJustClosed) return; // в†ђ Р’РћРў РРўРћ Р“Р›РђР’РќРћР•

  if (window.routeMode) {
  window.handlePartyRouteClick(e.latlng);
  return;
}
  if (window.routePendingConfirmation) return;

  currentLatLng = e.latlng;
  editId = null;

  document.getElementById("form-title").innerText = "РќРѕРІР°СЏ РјРµС‚РєР°";
  document.getElementById("marker-title").value = "";
  document.getElementById("marker-desc").value = "";

  document.getElementById("marker-form").style.display = "block";
});

function deleteMarker(id) {
  var confirmDelete = confirm("РЈРґР°Р»РёС‚СЊ РјРµС‚РєСѓ?");
  if (!confirmDelete) return;

  // СѓРґР°Р»СЏРµРј РёР· РјР°СЃСЃРёРІР°
  savedMarkers = savedMarkers.filter(m => m.id !== id);
  localStorage.setItem("markers", JSON.stringify(savedMarkers));

  // СѓРґР°Р»СЏРµРј СЃ РєР°СЂС‚С‹ Р‘Р•Р— РїРµСЂРµР·Р°РіСЂСѓР·РєРё
  map.eachLayer(function(layer) {
    if (layer instanceof L.Marker && layer._customId === id) {
      map.removeLayer(layer);
    }
  });
}

function editMarker(id) {
  var marker = savedMarkers.find(m => m.id === id);
  if (!marker) return;

  editId = id;
  currentLatLng = { lat: marker.lat, lng: marker.lng };

  document.getElementById("form-title").innerText = "Р РµРґР°РєС‚РёСЂРѕРІР°РЅРёРµ";
  document.getElementById("marker-title").value = marker.title;
  document.getElementById("marker-desc").value = marker.description;

  document.getElementById("marker-form").style.display = "block";
}

function closeForm() {
  document.getElementById("marker-form").style.display = "none";
}

function saveMarker() {
  var title = document.getElementById("marker-title").value;
  var desc = document.getElementById("marker-desc").value;
  var type = document.getElementById("marker-type").value;

  if (!title) return;

  if (editId) {
    var marker = savedMarkers.find(m => m.id === editId);
    marker.title = title;
    marker.description = desc;
    marker.type = type;

    // РѕР±РЅРѕРІР»СЏРµРј popup Р‘Р•Р— reload
    map.eachLayer(function(layer) {
      if (layer instanceof L.Marker && layer._customId === editId) {
        layer.setIcon(icons[type]);
        layer.setPopupContent(`
          <div class="marker-popup">
            <div class="marker-title">${title}</div>
            <div class="marker-desc">${desc}</div>

            <div class="marker-buttons">
              <button onclick="editMarker(${editId})">вњЏпёЏ</button>
              <button onclick="deleteMarker(${editId})">рџ—‘</button>
            </div>
          </div>
        `);
      }
    });

  } else {
    var newMarker = {
      lat: currentLatLng.lat,
      lng: currentLatLng.lng,
      title: title,
      description: desc,
      type: type,
      id: Date.now()
    };

    savedMarkers.push(newMarker);
    addMarker(newMarker);
  }

  localStorage.setItem("markers", JSON.stringify(savedMarkers));
  closeForm();
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    // Р’Рѕ РІСЂРµРјСЏ РїСЂРѕРєР»Р°РґРєРё РёР»Рё РїРѕРґС‚РІРµСЂР¶РґРµРЅРёСЏ РјР°СЂС€СЂСѓС‚Р° Escape
    // РІС‹РїРѕР»РЅСЏРµС‚ С‚Рѕ Р¶Рµ РґРµР№СЃС‚РІРёРµ, С‡С‚Рѕ Рё РєРЅРѕРїРєР° В«РћС‚РјРµРЅРёС‚СЊВ».
    if (window.routeMode || window.routePendingConfirmation) {
      e.preventDefault();
      e.stopImmediatePropagation();

      window.dispatchEvent(new Event("cancel-party-route"));

      // РЈР±РёСЂР°РµРј РєР»Р°РІРёР°С‚СѓСЂРЅС‹Р№ С„РѕРєСѓСЃ СЃ РјР°СЂРєРµСЂР° РѕС‚СЂСЏРґР°,
      // С‡С‚РѕР±С‹ Р±СЂР°СѓР·РµСЂ РЅРµ РѕСЃС‚Р°РІР»СЏР» РІРѕРєСЂСѓРі РЅРµРіРѕ СЂР°РјРєСѓ.
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      return;
    }

    map.closePopup();
    closeForm();
  }
});

</script>

<script type="module">

  // =====================================

  // РќР°С‡Р°Р»СЊРЅС‹Рµ РєРѕРѕСЂРґРёРЅР°С‚С‹ РѕС‚СЂСЏРґР°.
  // РџРѕР·Р¶Рµ Р·Р°РјРµРЅРёРј РёС… РЅР° С‚РѕС‡РЅРѕРµ РјРµСЃС‚Рѕ РЅР° РєР°СЂС‚Рµ.
  const partyStartPosition = {
    lat: 2450,
    lng: 3200
  };

let partyMarker = null;
let partyListenerStarted = false;
window.routeMode = false;

  // Р’РЅРµС€РЅРёР№ РІРёРґ РјР°СЂРєРµСЂР° РѕС‚СЂСЏРґР°
 const partyIcon = L.icon({
  iconUrl: "party.png",
  iconSize: [48, 48],
  iconAnchor: [24, 24]
});

  // РџРѕРґРєР»СЋС‡РµРЅРёРµ РѕР±С‰РµРіРѕ РїРѕР»РѕР¶РµРЅРёСЏ РѕС‚СЂСЏРґР°
  async function initializeParty() {
    if (partyListenerStarted) return;
    partyListenerStarted = true;

    const partyRef = ref(database, "party/state");

    try {
      // РџСЂРѕРІРµСЂСЏРµРј, СЃСѓС‰РµСЃС‚РІСѓРµС‚ Р»Рё СѓР¶Рµ РѕС‚СЂСЏРґ РІ Р±Р°Р·Рµ
      const snapshot = await get(partyRef);

      // Р•СЃР»Рё РѕС‚СЂСЏРґР° РµС‰С‘ РЅРµС‚ вЂ” СЃРѕР·РґР°С‘Рј РµРіРѕ
      if (!snapshot.exists()) {
        await set(partyRef, {
          lat: partyStartPosition.lat,
          lng: partyStartPosition.lng
        });
      }

      // РЎР»РµРґРёРј Р·Р° РёР·РјРµРЅРµРЅРёСЏРјРё РїРѕР»РѕР¶РµРЅРёСЏ РѕС‚СЂСЏРґР°
      onValue(partyRef, function(snapshot) {
        const position = snapshot.val();

        if (!position) return;

        const coordinates = [
          position.lat,
          position.lng
        ];

        // Р•СЃР»Рё РјР°СЂРєРµСЂР° РµС‰С‘ РЅРµС‚ вЂ” СЃРѕР·РґР°С‘Рј РµРіРѕ
        if (!partyMarker) {
          partyMarker = L.marker(coordinates, {
  icon: partyIcon,
  interactive: true,
  zIndexOffset: 1000
}).addTo(map);

partyMarker.on("click", function() {

  // Р•СЃР»Рё РјР°СЂС€СЂСѓС‚ СѓР¶Рµ РїСЂРѕРєР»Р°РґС‹РІР°РµС‚СЃСЏ, РїРѕРІС‚РѕСЂРЅС‹Р№ РєР»РёРє РЅРёС‡РµРіРѕ РЅРµ РґРµР»Р°РµС‚
  if (window.routeMode) return;

window.routeMode = true;
routeFinished = false;
// РЎР±СЂР°СЃС‹РІР°РµРј СЃРѕСЃС‚РѕСЏРЅРёРµ С„РѕСЂСЃРёСЂРѕРІР°РЅРЅРѕРіРѕ РјР°СЂС€Р°
routeForcedMarch = false;
routeForcedMarchStartDistance = 0;
routeForcedMarchStartUnits = 0;
routeForcedSegments = [];

const forcedButton = document.getElementById("route-forced-march");

if (forcedButton) {
  forcedButton.classList.remove("active");
  forcedButton.setAttribute("aria-pressed", "false");
}

// РћС‚РєР»СЋС‡Р°РµРј РґРІРѕР№РЅРѕР№ РєР»РёРє РґР»СЏ РїСЂРёР±Р»РёР¶РµРЅРёСЏ РєР°СЂС‚С‹
map.doubleClickZoom.disable();

// РќР°С‡РёРЅР°РµРј РјР°СЂС€СЂСѓС‚ РѕС‚ С‚РµРєСѓС‰РµРіРѕ РїРѕР»РѕР¶РµРЅРёСЏ РѕС‚СЂСЏРґР°
routePoints = [partyMarker.getLatLng()];

  lastCursorPosition = null;

  // РџРѕРєР°Р·С‹РІР°РµРј РїР°РЅРµР»СЊ СѓРїСЂР°РІР»РµРЅРёСЏ
  createRoutePanel();
  routePanel.style.display = "block";

  // РћС‚РѕР±СЂР°Р¶Р°РµРј РЅР°С‡Р°Р»СЊРЅС‹Рµ Р·РЅР°С‡РµРЅРёСЏ
  updateRouteLine();

  console.log("Р РµР¶РёРј РїСЂРѕРєР»Р°РґРєРё РјР°СЂС€СЂСѓС‚Р° РІРєР»СЋС‡С‘РЅ");
});
// =====================================
// РџРћРЎРўР РћР•РќРР• РњРђР РЁР РЈРўРђ
// =====================================

let routePoints = [];
let routeLine = null;
let routeRestMarkers = [];
let routeEndMarker = null;

// РЎРѕСЃС‚РѕСЏРЅРёРµ Р·Р°РІРµСЂС€РµРЅРёСЏ РјР°СЂС€СЂСѓС‚Р°
let routeFinished = false;

// РћР±СЂР°Р±РѕС‚РєР° РѕРґРёРЅРѕС‡РЅРѕРіРѕ Рё РґРІРѕР№РЅРѕРіРѕ РєР»РёРєР°
let pendingRouteClickTimer = null;
let pendingRouteClickPosition = null;

let routePace = "normal";
let routeSpeedReduced = false;
let routeForcedMarch = false;

// Р—Р°РІРµСЂС€С‘РЅРЅС‹Рµ СѓС‡Р°СЃС‚РєРё С„РѕСЂСЃРёСЂРѕРІР°РЅРЅРѕРіРѕ РјР°СЂС€Р°: Р°Р±СЃРѕР»СЋС‚РЅС‹Рµ СЂР°СЃСЃС‚РѕСЏРЅРёСЏ РґР»СЏ РѕС‚РѕР±СЂР°Р¶РµРЅРёСЏ

// РђРЅРёРјР°С†РёРё РЅРѕРІС‹С… Р¶РµС‚РѕРЅРѕРІ С…СЂР°РЅСЏС‚СЃСЏ РЅРµР·Р°РІРёСЃРёРјРѕ РґСЂСѓРі РѕС‚ РґСЂСѓРіР°.
// РџРµСЂРµСЂРёСЃРѕРІРєР° РјР°СЂС€СЂСѓС‚Р° РЅРµ СЃР±СЂР°СЃС‹РІР°РµС‚ РёС… С…РѕРґ.

const routeMarkerAnimationDuration = 420;

function stopRouteMarkerAnimation() {
  routeMarkerAnimations.forEach(animation => {
    if (animation.timer) clearTimeout(animation.timer);
  });

  routeMarkerAnimations = [];
}

function beginRouteMarkerAnimation(startDistance, endDistance) {
  if (endDistance - startDistance < 0.001) return;

  const animation = {
    start: startDistance,
    end: endDistance,
    startedAt: Date.now(),
    timer: null
  };

  routeMarkerAnimations.push(animation);

  // РЈР±РёСЂР°РµРј Р·Р°РІРµСЂС€РёРІС€СѓСЋСЃСЏ Р°РЅРёРјР°С†РёСЋ РїРѕСЃР»Рµ РµС‘ РїРѕР»РЅРѕРіРѕ РїСЂРѕРёРіСЂС‹РІР°РЅРёСЏ.
  animation.timer = setTimeout(function() {
    routeMarkerAnimations = routeMarkerAnimations.filter(
      item => item !== animation
    );

    updateRouteLine(lastCursorPosition);
  }, routeMarkerAnimationDuration + 100);
}

function getRouteMarkerAnimation(distance) {
  const now = Date.now();

  // Р•СЃР»Рё РЅРµСЃРєРѕР»СЊРєРѕ Р°РЅРёРјР°С†РёР№ РїРµСЂРµСЃРµРєР°СЋС‚СЃСЏ, РёСЃРїРѕР»СЊР·СѓРµРј СЃР°РјСѓСЋ РЅРѕРІСѓСЋ.
  let matchingAnimation = null;

  routeMarkerAnimations.forEach(animation => {
    const elapsed = now - animation.startedAt;

    // РќР°С‡Р°Р»СЊРЅС‹Р№ РїСЂРёРІР°Р» РЅРµ Р°РЅРёРјРёСЂСѓРµРј: Р°РЅРёРјР°С†РёСЏ РѕС‚РЅРѕСЃРёС‚СЃСЏ С‚РѕР»СЊРєРѕ
    // Рє Р¶РµС‚РѕРЅР°Рј, РїРѕСЏРІРёРІС€РёРјСЃСЏ РџРћРЎР›Р• С‚РѕС‡РєРё СЃС‚Р°СЂС‚Р° РЅРѕРІРѕРіРѕ СѓС‡Р°СЃС‚РєР°.
    const isInsideRange =
      distance > animation.start + 0.05 &&
      distance <= animation.end + 0.01;

    if (
      isInsideRange &&
      elapsed < routeMarkerAnimationDuration &&
      (!matchingAnimation || animation.startedAt > matchingAnimation.startedAt)
    ) {
      matchingAnimation = animation;
    }
  });

  return matchingAnimation;
}

function shouldAnimateRouteMarker(distance) {
  return Boolean(getRouteMarkerAnimation(distance));
}

function getRouteMarkerAnimationDelay(distance) {
  const animation = getRouteMarkerAnimation(distance);
  if (!animation) return null;

  return Math.max(0, Date.now() - animation.startedAt);
}

  // РџРѕСЃР»Рµ СѓСЃС‚Р°РЅРѕРІРєРё С„Р»Р°Р¶РєР° РїРµСЂРµРєР»СЋС‡Р°С‚РµР»СЊ РЅРµРґРѕСЃС‚СѓРїРµРЅ.
  if (routeFinished || window.routePendingConfirmation) return;

  const fixedLength = getRouteLength(routePoints);
  const dailyLimit =
    routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);

  lastCursorPosition = null;

  if (!routeForcedMarch) {
    // РќР°С‡РёРЅР°РµРј С„РѕСЂСЃРёСЂРѕРІР°РЅРЅС‹Р№ РјР°СЂС€ РѕС‚ РїРѕСЃР»РµРґРЅРµРіРѕ РѕР±С‹С‡РЅРѕРіРѕ РїСЂРёРІР°Р»Р°.
    const previousRests = getNormalRestDistances(fixedLength, dailyLimit);
    const lastRestDistance = previousRests.length
      ? previousRests[previousRests.length - 1]
      : 0;

    // Р—РґРµСЃСЊ РјР°СЂС€СЂСѓС‚ РґРµР№СЃС‚РІРёС‚РµР»СЊРЅРѕ РѕС‚РєР°С‚С‹РІР°РµС‚СЃСЏ Рє РїРѕСЃР»РµРґРЅРµРјСѓ РїСЂРёРІР°Р»Сѓ.
    routePoints = getRoutePointsUpToDistance(routePoints, lastRestDistance);
    routeForcedSegments = routeForcedSegments.filter(segment => {
      const recalculated = getForcedSegmentDistances(segment, dailyLimit);
      return recalculated.end <= lastRestDistance + 0.001;
    });

    routeForcedMarchStartDistance = lastRestDistance;
    routeForcedMarchStartUnits = dailyLimit > 0

    console.log("Р¤РѕСЂСЃРёСЂРѕРІР°РЅРЅС‹Р№ РјР°СЂС€ РІРєР»СЋС‡С‘РЅ");

    const forcedDistance = fixedLength - routeForcedMarchStartDistance;

      // Р’РµСЃСЊ С„РѕСЂСЃРёСЂРѕРІР°РЅРЅС‹Р№ СѓС‡Р°СЃС‚РѕРє СЃС‡РёС‚Р°РµС‚СЃСЏ РѕРґРЅРёРј РґРЅС‘Рј,

        startUnits: dailyLimit > 0

    } else {

      routePoints = getRoutePointsUpToDistance(
        routePoints,

// =====================================
// Р”Р›РРќРђ РњРђР РЁР РЈРўРђ
// =====================================

function getRouteLength(points) {
  let total = 0;

  for (let i = 1; i < points.length; i++) {
    const dy = points[i].lat - points[i - 1].lat;
    const dx = points[i].lng - points[i - 1].lng;

    total += Math.sqrt(dx * dx + dy * dy);
  }

  return total;
}

// =====================================
// Р’РР—РЈРђР›Р¬РќРђРЇ РћР‘Р РђР‘РћРўРљРђ Р›РРќРР РњРђР РЁР РЈРўРђ
// =====================================

function createRouteDisplayPoints(points, protectedDistances = []) {
  if (points.length < 2) return points;

  const roundedPoints = [];
  const cornerRadius = 30;

  // РЎРєСЂСѓРіР»СЏРµРј СѓРіР»С‹, С‚РѕР»СЊРєРѕ РµСЃР»Рё РІ РјР°СЂС€СЂСѓС‚Рµ РµСЃС‚СЊ С…РѕС‚СЏ Р±С‹ 3 С‚РѕС‡РєРё
  roundedPoints.push(points[0]);

  if (points.length >= 3) {
    for (let i = 1; i < points.length - 1; i++) {
      const prev = points[i - 1];
      const corner = points[i];
      const next = points[i + 1];

      // РќРµ СЃРєСЂСѓРіР»СЏРµРј РІРµСЂС€РёРЅСѓ, РµСЃР»Рё РЅР° РЅРµР№ СЂР°СЃРїРѕР»РѕР¶РµРЅ РїСЂРёРІР°Р» РёР»Рё РґСЂСѓРіРѕР№ РјР°СЂРєРµСЂ.
      let cornerDistance = 0;
      for (let k = 1; k <= i; k++) {
        const dy = points[k].lat - points[k - 1].lat;
        const dx = points[k].lng - points[k - 1].lng;
        cornerDistance += Math.sqrt(dx * dx + dy * dy);
      }
      // РќРµ СЃРіР»Р°Р¶РёРІР°РµРј РїРѕРІРѕСЂРѕС‚С‹ СЂСЏРґРѕРј СЃ РїСЂРёРІР°Р»РѕРј/РјР°СЂРєРµСЂРѕРј: РёРЅР°С‡Рµ
      // СЃР»РµРґСѓСЋС‰РёР№ СЂРµР·РєРёР№ РёР·РіРёР± РјРѕР¶РµС‚ РІРёР·СѓР°Р»СЊРЅРѕ СѓС‚СЏРЅСѓС‚СЊ Р»РёРЅРёСЋ РѕС‚ С‚РѕС‡РєРё РїСЂРёРІР°Р»Р°.
      const isProtectedCorner = protectedDistances.some(
        distance => Math.abs(distance - cornerDistance) <= cornerRadius * 2
      );
      if (isProtectedCorner) {
        roundedPoints.push(corner);
        continue;
      }

      const dx1 = prev.lng - corner.lng;
      const dy1 = prev.lat - corner.lat;
      const dx2 = next.lng - corner.lng;
      const dy2 = next.lat - corner.lat;

      const len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
      const len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

      if (len1 < 1 || len2 < 1) {
        roundedPoints.push(corner);
        continue;
      }

      const cut1 = Math.min(cornerRadius, len1 * 0.4);
      const cut2 = Math.min(cornerRadius, len2 * 0.4);

      const before = L.latLng(
        corner.lat + dy1 / len1 * cut1,
        corner.lng + dx1 / len1 * cut1
      );

      const after = L.latLng(
        corner.lat + dy2 / len2 * cut2,
        corner.lng + dx2 / len2 * cut2
      );

      roundedPoints.push(before);

      // РџР»Р°РІРЅР°СЏ РєСЂРёРІР°СЏ Р‘РµР·СЊРµ РІРѕРєСЂСѓРі СѓРіР»Р°
      for (let j = 1; j <= 5; j++) {
        const t = j / 6;
        const oneMinusT = 1 - t;

        roundedPoints.push(L.latLng(
          oneMinusT * oneMinusT * before.lat +
          2 * oneMinusT * t * corner.lat +
          t * t * after.lat,

          oneMinusT * oneMinusT * before.lng +
          2 * oneMinusT * t * corner.lng +
          t * t * after.lng
        ));
      }

      roundedPoints.push(after);
    }
  }

  roundedPoints.push(points[points.length - 1]);

  // Р”РѕР±Р°РІР»СЏРµРј РЅРµР±РѕР»СЊС€СѓСЋ С…Р°РѕС‚РёС‡РЅСѓСЋ РЅРµСЂРѕРІРЅРѕСЃС‚СЊ
  const result = [roundedPoints[0]];

  for (let i = 1; i < roundedPoints.length; i++) {
    const start = roundedPoints[i - 1];
    const end = roundedPoints[i];

    const dx = end.lng - start.lng;
    const dy = end.lat - start.lat;
    const length = Math.sqrt(dx * dx + dy * dy);

    // РљРѕСЂРѕС‚РєРёРµ СѓС‡Р°СЃС‚РєРё РЅРµ РёР·РјРµРЅСЏРµРј
    if (length < 60) {
      result.push(end);
      continue;
    }

    const steps = Math.floor(length / 20);

    for (let j = 1; j <= steps; j++) {
      const t = j / (steps + 1);

      // Р”РµС‚РµСЂРјРёРЅРёСЂРѕРІР°РЅРЅРѕРµ РїСЃРµРІРґРѕСЃР»СѓС‡Р°Р№РЅРѕРµ РѕС‚РєР»РѕРЅРµРЅРёРµ
      const seed = (
        start.lat * 12.9898 +
        start.lng * 78.233 +
        end.lat * 37.719 +
        end.lng * 19.913 +
        j * 53.117
      );

      const random = Math.sin(seed) * 43758.5453;
      const noise = (random - Math.floor(random)) * 2 - 1;

      // РћС‚РєР»РѕРЅРµРЅРёРµ РїР»Р°РІРЅРѕ СѓРјРµРЅСЊС€Р°РµС‚СЃСЏ Сѓ РєРѕРЅС†РѕРІ РѕС‚СЂРµР·РєР°
      const taper = Math.sin(Math.PI * t);
      const offset = noise * 8 * taper;

      result.push(L.latLng(
        start.lat + dy * t + (dx / length) * offset,
        start.lng + dx * t - (dy / length) * offset
      ));
    }

    result.push(end);
  }

  return result;
}

// РџРѕР»СѓС‡РµРЅРёРµ РєРѕРѕСЂРґРёРЅР°С‚С‹ РЅР° РѕРїСЂРµРґРµР»С‘РЅРЅРѕРј СЂР°СЃСЃС‚РѕСЏРЅРёРё РїСѓС‚Рё
function getRoutePointAtDistance(points, targetDistance) {
  let passed = 0;

  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];

    const dy = end.lat - start.lat;
    const dx = end.lng - start.lng;

    const segmentLength = Math.sqrt(dx * dx + dy * dy);

    // РџСЂРѕРїСѓСЃРєР°РµРј РЅСѓР»РµРІС‹Рµ РѕС‚СЂРµР·РєРё, С‡С‚РѕР±С‹ РЅРµ РїРѕР»СѓС‡РёС‚СЊ РґРµР»РµРЅРёРµ РЅР° РЅРѕР»СЊ.
    if (segmentLength < 0.001) continue;

    if (passed + segmentLength >= targetDistance) {
      const part = (targetDistance - passed) / segmentLength;

      return L.latLng(
        start.lat + dy * part,
        start.lng + dx * part
      );
    }

    passed += segmentLength;
  }

  return null;
}

// Р’РѕР·РІСЂР°С‰Р°РµС‚ С‡Р°СЃС‚СЊ РјР°СЂС€СЂСѓС‚Р° РґРѕ СѓРєР°Р·Р°РЅРЅРѕРіРѕ СЂР°СЃСЃС‚РѕСЏРЅРёСЏ
function getRoutePointsUpToDistance(points, targetDistance) {
  if (!points.length) return [];

  if (targetDistance <= 0) {
    return [points[0]];
  }

  const totalLength = getRouteLength(points);

  if (targetDistance >= totalLength) {
    return [...points];
  }

  const result = [points[0]];
  let passed = 0;

  for (let i = 1; i < points.length; i++) {
    const start = points[i - 1];
    const end = points[i];

    const dy = end.lat - start.lat;
    const dx = end.lng - start.lng;
    const segmentLength = Math.sqrt(dx * dx + dy * dy);

    if (passed + segmentLength <= targetDistance + 0.001) {
      result.push(end);
      passed += segmentLength;

      if (passed >= targetDistance - 0.001) {
        break;
      }
    } else {
      const remaining = targetDistance - passed;

      if (segmentLength > 0) {
        const part = remaining / segmentLength;

        result.push(L.latLng(
          start.lat + dy * part,
          start.lng + dx * part
        ));
      }

      break;
    }
  }

  return result;
}

// Р’СЃС‚Р°РІР»СЏРµС‚ РІ РіРµРѕРјРµС‚СЂРёСЋ С‚РѕС‡РЅС‹Рµ С‚РѕС‡РєРё РЅР° Р·Р°РґР°РЅРЅС‹С… СЂР°СЃСЃС‚РѕСЏРЅРёСЏС….
// РС‚Рѕ РіР°СЂР°РЅС‚РёСЂСѓРµС‚, С‡С‚Рѕ РїСЂРёРІР°Р»С‹, С‡РµСЂС‚С‹ Рё РєСЂРµСЃС‚РёРєРё Р»РµР¶Р°С‚ РЅРµРїРѕСЃСЂРµРґСЃС‚РІРµРЅРЅРѕ РЅР° Р»РёРЅРёРё.
function getRoutePointsWithDistanceAnchors(points, distances) {
  if (points.length < 2) return [...points];

  const totalLength = getRouteLength(points);
  const entries = [];
  let passed = 0;

  points.forEach((point, index) => {
    if (index > 0) {
      const previous = points[index - 1];
      passed += Math.hypot(point.lat - previous.lat, point.lng - previous.lng);
    }
    entries.push({ distance: passed, point: point });
  });

  distances.forEach(distance => {
    if (distance < -0.001 || distance > totalLength + 0.001) return;
    const point = getRoutePointAtDistance(points, Math.max(0, Math.min(totalLength, distance)));
    if (point) entries.push({ distance: Math.max(0, Math.min(totalLength, distance)), point });
  });

  entries.sort((a, b) => a.distance - b.distance);
  const result = [];
  entries.forEach(entry => {
    const last = result[result.length - 1];
    if (!last || Math.hypot(entry.point.lat - last.lat, entry.point.lng - last.lng) > 0.001) {
      result.push(entry.point);
    }
  });
  return result;
}

// Р’РѕР·РІСЂР°С‰Р°РµС‚ РёСЃС…РѕРґРЅСѓСЋ РіРµРѕРјРµС‚СЂРёСЋ РјР°СЂС€СЂСѓС‚Р° РјРµР¶РґСѓ РґРІСѓРјСЏ СЂР°СЃСЃС‚РѕСЏРЅРёСЏРјРё.
function getRoutePointsBetweenDistances(points, startDistance, endDistance) {
  const totalLength = getRouteLength(points);
  const start = Math.max(0, Math.min(totalLength, startDistance));
  const end = Math.max(start, Math.min(totalLength, endDistance));
  const anchored = getRoutePointsWithDistanceAnchors(points, [start, end]);
  const result = [];
  let passed = 0;

  anchored.forEach((point, index) => {
    if (index > 0) {
      const previous = anchored[index - 1];
      passed += Math.hypot(point.lat - previous.lat, point.lng - previous.lng);
    }
    if (passed >= start - 0.01 && passed <= end + 0.01) result.push(point);
  });
  return result;
}

// РЈРіРѕР» РїРѕРїРµСЂРµС‡РЅРѕР№ С‡РµСЂС‚С‹ РІ СЌРєСЂР°РЅРЅС‹С… РєРѕРѕСЂРґРёРЅР°С‚Р°С… РєР°СЂС‚С‹.
function getPerpendicularRouteAngle(points, targetDistance) {
  let passed = 0;
  for (let i = 1; i < points.length; i++) {
    const previous = points[i - 1];
    const current = points[i];
    const routeLength = Math.hypot(
      current.lat - previous.lat,
      current.lng - previous.lng
    );
    if (routeLength < 0.001) continue;

    if (passed + routeLength >= targetDistance - 0.001) {
      // Р”Р»СЏ РЅР°РїСЂР°РІР»РµРЅРёСЏ РёСЃРїРѕР»СЊР·СѓРµРј СЌРєСЂР°РЅРЅС‹Рµ РєРѕРѕСЂРґРёРЅР°С‚С‹, Р° РґР»СЏ РїРѕРёСЃРєР°
      // РЅСѓР¶РЅРѕРіРѕ СЃРµРіРјРµРЅС‚Р° вЂ” С‚Рµ Р¶Рµ РєРѕРѕСЂРґРёРЅР°С‚РЅС‹Рµ РµРґРёРЅРёС†С‹, С‡С‚Рѕ Рё РґР»РёРЅР° РјР°СЂС€СЂСѓС‚Р°.
      const a = map.latLngToLayerPoint(previous);
      const b = map.latLngToLayerPoint(current);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      return Math.atan2(dy, dx) * 180 / Math.PI + 90;
    }
    passed += routeLength;
  }
  return 90;
}

// РџРµСЂРµРІРѕРґРёС‚ СЃРѕС…СЂР°РЅС‘РЅРЅС‹Р№ С„РѕСЂСЃРёСЂРѕРІР°РЅРЅС‹Р№ СѓС‡Р°СЃС‚РѕРє РІ СЂР°СЃСЃС‚РѕСЏРЅРёСЏ
// РґР»СЏ С‚РµРєСѓС‰РµР№ РґРЅРµРІРЅРѕР№ РЅРѕСЂРјС‹. startUnits Рё lengthUnits вЂ” РґРѕР»Рё РґРЅРµРІРЅРѕРіРѕ РїСѓС‚Рё.
function getForcedSegmentDistances(segment, dailyLimit) {
  const start = Number.isFinite(segment.startUnits)
    ? segment.startUnits * dailyLimit
    : segment.start;
  const length = Number.isFinite(segment.lengthUnits)
    ? segment.lengthUnits * dailyLimit
    : segment.end - segment.start;

  return {
    start,
    end: start + length
  };
}

// РџРµСЂРµСЃС‡РёС‚С‹РІР°РµС‚ РІСЃРµ РїСЂРёРІР°Р»С‹ РґР»СЏ С‚РµРєСѓС‰РµР№ РґРЅРµРІРЅРѕР№ РЅРѕСЂРјС‹.
// Р—Р°РІРµСЂС€С‘РЅРЅС‹Р№ С„РѕСЂСЃРёСЂРѕРІР°РЅРЅС‹Р№ СѓС‡Р°СЃС‚РѕРє СЃС‡РёС‚Р°РµС‚СЃСЏ СЂРѕРІРЅРѕ РѕРґРЅРёРј РґРЅС‘Рј.
function getNormalRestDistances(totalLength, dailyLimit) {
  const result = [];
  const segments = routeForcedSegments
    .map(segment => getForcedSegmentDistances(segment, dailyLimit))
    .filter(segment => segment.start < totalLength + 0.01)
    .sort((a, b) => a.start - b.start);

  let previousAnchor = 0;

  function addRest(distance) {
  if (distance <= 0.001) return;

  // Р•СЃР»Рё РїСЂРёРІР°Р» РїСЂР°РєС‚РёС‡РµСЃРєРё СЃРѕРІРїР°РґР°РµС‚ СЃ РєРѕРЅС†РѕРј РјР°СЂС€СЂСѓС‚Р°,
  // РїСЂРёРІСЏР·С‹РІР°РµРј РµРіРѕ РЅРµРїРѕСЃСЂРµРґСЃС‚РІРµРЅРЅРѕ Рє РєРѕРЅС†Сѓ.
  if (distance > totalLength && distance - totalLength <= 0.05) {
    distance = totalLength;
  }

  if (!result.length || Math.abs(result[result.length - 1] - distance) > 0.001) {
    result.push(distance);
  }
}

  segments.forEach(segment => {
    // РћР±С‹С‡РЅС‹Рµ РґРЅРµРІРЅС‹Рµ РїСЂРёРІР°Р»С‹ РґРѕ РЅР°С‡Р°Р»Р° С„РѕСЂСЃРёСЂРѕРІР°РЅРЅРѕРіРѕ СѓС‡Р°СЃС‚РєР°.
    let nextRest = previousAnchor + dailyLimit;
    while (nextRest < segment.start - 0.001) {
      addRest(nextRest);
      nextRest += dailyLimit;
    }

    // РўРѕС‡РєР° РЅР°С‡Р°Р»Р° РјР°СЂС€Р° вЂ” РїСЂРёРІР°Р», РѕС‚ РєРѕС‚РѕСЂРѕРіРѕ РѕРЅ Р±С‹Р» РЅР°С‡Р°С‚.
    if (segment.start > previousAnchor + 0.001) {
      addRest(segment.start);
    }

    // РљРѕРЅРµС† С„РѕСЂСЃРёСЂРѕРІР°РЅРЅРѕРіРѕ СѓС‡Р°СЃС‚РєР° вЂ” СЃР»РµРґСѓСЋС‰РёР№ РїСЂРёРІР°Р», РµСЃР»Рё РѕРЅ
    // РµС‰С‘ РЅР°С…РѕРґРёС‚СЃСЏ РІ РїСЂРµРґРµР»Р°С… РїСЂРѕР»РѕР¶РµРЅРЅРѕРіРѕ РјР°СЂС€СЂСѓС‚Р°.
    if (segment.end <= totalLength + 0.05) {
      addRest(segment.end);
    }
    previousAnchor = segment.end;
  });

  // РћР±С‹С‡РЅС‹Рµ РґРЅРё РїРѕСЃР»Рµ РїРѕСЃР»РµРґРЅРµРіРѕ Р·Р°РІРµСЂС€С‘РЅРЅРѕРіРѕ С„РѕСЂСЃРёСЂРѕРІР°РЅРЅРѕРіРѕ СѓС‡Р°СЃС‚РєР°.
  let nextRest = previousAnchor + dailyLimit;
  while (nextRest <= totalLength + 0.05) {
    addRest(nextRest);
    nextRest += dailyLimit;
  }

  return result;
}

function clearRouteDrawing() {
  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  routeRestMarkers.forEach(marker => {
    map.removeLayer(marker);
  });

  routeRestMarkers = [];
  if (routeEndMarker) {
  map.removeLayer(routeEndMarker);
  routeEndMarker = null;
}
}

// Р•РґРёРЅР°СЏ РѕС‚РјРµРЅР° РјР°СЂС€СЂСѓС‚Р°: РІС‹Р·С‹РІР°РµС‚СЃСЏ РєРЅРѕРїРєРѕР№ Рё РєР»Р°РІРёС€РµР№ Escape.
function cancelPartyRoute() {
  if (pendingRouteClickTimer) {
    clearTimeout(pendingRouteClickTimer);
  }
  pendingRouteClickTimer = null;
  pendingRouteClickPosition = null;

  routeFinished = false;
  window.routePendingConfirmation = false;
  window.routeMode = false;
  map.doubleClickZoom.enable();

  routeForcedMarch = false;
  routeForcedMarchStartDistance = 0;
  routeForcedMarchStartUnits = 0;
  routeForcedSegments = [];
  routePoints = [];
  lastCursorPosition = null;

  stopRouteMarkerAnimation();
  clearRouteDrawing();

  const forcedButton = document.getElementById("route-forced-march");
  if (forcedButton) {
    forcedButton.classList.remove("active");
    forcedButton.setAttribute("aria-pressed", "false");
    forcedButton.disabled = false;
  }

  if (routePanel) {
    routePanel.style.display = "none";
  }

  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  console.log("РџСЂРѕРєР»Р°РґРєР° РјР°СЂС€СЂСѓС‚Р° РѕС‚РјРµРЅРµРЅР°");
}

// =====================================
// РћР‘РќРћР’Р›Р•РќРР• Р РћРўР РРЎРћР’РљРђ РњРђР РЁР РЈРўРђ
// =====================================

// РЎР»РѕРё Р·Р°РґР°СЋС‚ СЃС‚СЂРѕРіРёР№ РїРѕСЂСЏРґРѕРє: Р»РёРЅРёРё < РєСЂРµСЃС‚РёРєРё < РїСЂРёРІР°Р»С‹ < С„Р»Р°Р¶РѕРє.
function ensureRouteMarkerPanes() {
  let restPane = map.getPane("route-rest-pane");
  if (!restPane) restPane = map.createPane("route-rest-pane");
  restPane.style.zIndex = "650";

  let flagPane = map.getPane("route-flag-pane");
  if (!flagPane) flagPane = map.createPane("route-flag-pane");
  flagPane.style.zIndex = "700";
}

// РћР±СЉРµРґРёРЅСЏРµРј РєСЂРµСЃС‚РёРєРё, РєРѕС‚РѕСЂС‹Рµ РЅР° С‚РµРєСѓС‰РµРј РјР°СЃС€С‚Р°Р±Рµ РѕРєР°Р·Р°Р»РёСЃСЊ СЃР»РёС€РєРѕРј Р±Р»РёР·РєРѕ.
// РќР° РєР°СЂС‚Рµ РѕСЃС‚Р°С‘С‚СЃСЏ РѕРґРёРЅ С‡РёС‚Р°РµРјС‹Р№ Р·РЅР°Рє СЃ С‡РёСЃР»РѕРј РѕР±СЉРµРґРёРЅС‘РЅРЅС‹С… РѕС‚РјРµС‚РѕРє.
function getExhaustionMarkerClusters(markers, minSpacing = 18) {
  const clusters = [];

  markers.forEach(item => {
    const screenPoint = map.latLngToContainerPoint(item.position);

    let targetCluster = null;
    for (const cluster of clusters) {
      if (screenPoint.distanceTo(cluster.center) < minSpacing) {
        targetCluster = cluster;
        break;
      }
    }

    if (!targetCluster) {
      clusters.push({
        items: [item],
        screenPoints: [screenPoint],
        center: screenPoint
      });
      return;
    }

    targetCluster.items.push(item);
    targetCluster.screenPoints.push(screenPoint);

    const total = targetCluster.screenPoints.length;
    const sumX = targetCluster.screenPoints.reduce((sum, point) => sum + point.x, 0);
    const sumY = targetCluster.screenPoints.reduce((sum, point) => sum + point.y, 0);

    targetCluster.center = L.point(sumX / total, sumY / total);
  });

  return clusters.map(cluster => {
    const middleItem = cluster.items[Math.floor(cluster.items.length / 2)];

    return {
      position: middleItem.position,
      count: cluster.items.length,
      distances: cluster.items.map(item => item.distance)
    };
  });
}

function updateRouteLine(cursorPosition = null) {
  // РџРµСЂРµСЂРёСЃРѕРІРєР° РєР°СЂС‚С‹ РЅРµ РѕС‚РјРµРЅСЏРµС‚ Рё РЅРµ РїРµСЂРµР·Р°РїСѓСЃРєР°РµС‚ Р°РЅРёРјР°С†РёСЋ Р¶РµС‚РѕРЅРѕРІ.
  // Р’СЂРµРјСЏ Р°РЅРёРјР°С†РёРё СѓС‡РёС‚С‹РІР°РµС‚СЃСЏ РїСЂРё СЃРѕР·РґР°РЅРёРё РєР°Р¶РґРѕРіРѕ РЅРѕРІРѕРіРѕ DOM-СЌР»РµРјРµРЅС‚Р°.
  ensureRouteMarkerPanes();

  // Р”Р»СЏ preview РёСЃРїРѕР»СЊР·СѓРµРј С‚Рµ Р¶Рµ СЂР°СЃС‡С‘С‚С‹, С‡С‚Рѕ Рё РґР»СЏ Р·Р°С„РёРєСЃРёСЂРѕРІР°РЅРЅРѕРіРѕ РјР°СЂС€СЂСѓС‚Р°,
  // РЅРѕ РЅРёС‡РµРіРѕ РЅРµ Р·Р°РїРёСЃС‹РІР°РµРј РІ СЃРѕСЃС‚РѕСЏРЅРёРµ РґРѕ РєР»РёРєР°.
  const pointsToDraw = [...routePoints];
  if (cursorPosition && hasMouse && window.routeMode) {
    pointsToDraw.push(cursorPosition);
  }

  clearRouteDrawing();

  const totalLength = getRouteLength(pointsToDraw);
  const dailyLimit =
    routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);

  // РђРєС‚РёРІРЅС‹Р№ РјР°СЂС€ С‚Р°РєР¶Рµ РїСЂРёРІСЏР·Р°РЅ Рє С‚РµРєСѓС‰РµР№ РґРЅРµРІРЅРѕР№ РЅРѕСЂРјРµ.
  // Р•СЃР»Рё РЅРѕРІР°СЏ С‚РѕС‡РєР° РЅР°С‡Р°Р»Р° РїРѕРєР° РґР°Р»СЊС€Рµ РїСЂРѕР»РѕР¶РµРЅРЅРѕРіРѕ РїСѓС‚Рё, РѕРЅР° РїСЂРѕСЏРІРёС‚СЃСЏ
  // РїРѕ РјРµСЂРµ РґР°Р»СЊРЅРµР№С€РµРіРѕ РїРѕСЃС‚СЂРѕРµРЅРёСЏ РјР°СЂС€СЂСѓС‚Р°.
  if (routeForcedMarch) {
    routeForcedMarchStartDistance = routeForcedMarchStartUnits * dailyLimit;
  }

  const restCalculationLength = routeForcedMarch
    ? routeForcedMarchStartDistance
    : totalLength;
  const restDistancesToDraw = getNormalRestDistances(
    restCalculationLength,
    dailyLimit
  );

  // РџРѕРґРіРѕС‚РѕРІРёРј РёСЃС‚РѕСЂРёСЋ Р·Р°РІРµСЂС€С‘РЅРЅС‹С… РјР°СЂС€РµР№ Рё С‚РµРєСѓС‰РёР№ Р°РєС‚РёРІРЅС‹Р№ РјР°СЂС€.
  const forcedVisualSegments = routeForcedSegments
    .map(segment => getForcedSegmentDistances(segment, dailyLimit))
    .filter(segment => segment.start < totalLength + 0.01)
    .map(segment => ({
      start: segment.start,
      end: Math.min(segment.end, totalLength),
      // Р§РµСЂС‚Р° Рё РёРЅС‚РµСЂРІР°Р»С‹ РєСЂРµСЃС‚РёРєРѕРІ РІСЃРµРіРґР° РїРµСЂРµСЃС‡РёС‚С‹РІР°СЋС‚СЃСЏ
      // РїРѕ С‚РµРєСѓС‰РµРјСѓ С‚РµРјРїСѓ, Р° РЅРµ РїРѕ С‚РµРјРїСѓ РІ РјРѕРјРµРЅС‚ РІС‹РєР»СЋС‡РµРЅРёСЏ РјР°СЂС€Р°.
      dailyLimit: dailyLimit
    }));

  if (routeForcedMarch) {
    forcedVisualSegments.push({
      start: routeForcedMarchStartDistance,
      end: totalLength,
      dailyLimit: dailyLimit,
      active: true
    });
  }

  const protectedDistances = [...restDistancesToDraw];
  forcedVisualSegments.forEach(segment => {
    const boundary = segment.start + segment.dailyLimit;
    if (boundary <= segment.end + 0.01) protectedDistances.push(boundary);
    const interval = segment.dailyLimit / 8;
    for (let d = boundary + interval; d <= segment.end + 0.01; d += interval) {
      protectedDistances.push(d);
    }
    protectedDistances.push(segment.end);
  });

  // Р’СЃС‚Р°РІР»СЏРµРј СЂРµР°Р»СЊРЅС‹Рµ С‚РѕС‡РєРё РїСЂРёРІР°Р»РѕРІ Рё РѕС‚РјРµС‚РѕРє РІ РёСЃС…РѕРґРЅСѓСЋ РіРµРѕРјРµС‚СЂРёСЋ.
  const anchoredPoints = getRoutePointsWithDistanceAnchors(
    pointsToDraw,
    protectedDistances
  );

  // РћСЃРЅРѕРІРЅР°СЏ Р»РёРЅРёСЏ РјР°СЂС€СЂСѓС‚Р°.
  // Р Р°Р·РґРµР»СЏРµРј РјР°СЂС€СЂСѓС‚ РЅР° Р·РѕР»РѕС‚С‹Рµ Рё С‡С‘СЂРЅС‹Рµ СѓС‡Р°СЃС‚РєРё.
  // Р—РѕР»РѕС‚Р°СЏ Р»РёРЅРёСЏ РЅРµ СЂРёСЃСѓРµС‚СЃСЏ С‚Р°Рј, РіРґРµ РґРѕР»Р¶РµРЅ РёРґС‚Рё С„РѕСЂСЃРёСЂРѕРІР°РЅРЅС‹Р№ РјР°СЂС€.

  const blackIntervals = forcedVisualSegments
    .map(segment => ({
      start: segment.start + segment.dailyLimit,
      end: segment.end
    }))
    .filter(interval => interval.end > interval.start + 0.001)
    .sort((a, b) => a.start - b.start);

  // РћР±СЉРµРґРёРЅСЏРµРј РїРµСЂРµСЃРµРєР°СЋС‰РёРµСЃСЏ С‡С‘СЂРЅС‹Рµ СѓС‡Р°СЃС‚РєРё.
  const mergedBlackIntervals = [];

  blackIntervals.forEach(interval => {
    const previous = mergedBlackIntervals[mergedBlackIntervals.length - 1];

    if (previous && interval.start <= previous.end + 0.001) {
      previous.end = Math.max(previous.end, interval.end);
    } else {
      mergedBlackIntervals.push({
        start: interval.start,
        end: interval.end
      });
    }
  });

  // РџСЂРё РґРІРёР¶РµРЅРёРё РјС‹С€Рё РѕС‚РґРµР»СЏРµРј СѓР¶Рµ Р·Р°С„РёРєСЃРёСЂРѕРІР°РЅРЅС‹Р№ РјР°СЂС€СЂСѓС‚
  // РѕС‚ РїРѕР»СѓРїСЂРѕР·СЂР°С‡РЅРѕРіРѕ РїСЂРµРґРїСЂРѕСЃРјРѕС‚СЂР°.
  const previewIsActive =
    Boolean(cursorPosition && hasMouse && window.routeMode);

  const committedLength = getRouteLength(routePoints);

  // РЈРЅРёРІРµСЂСЃР°Р»СЊРЅРѕРµ СЃРѕР·РґР°РЅРёРµ РѕС‚СЂРµР·РєР° РјР°СЂС€СЂСѓС‚Р°.
  function drawRoutePiece(
    startDistance,
    endDistance,
    color,
    committedOpacity,
    previewOpacity
  ) {
    if (endDistance - startDistance < 0.001) return;

    function addPiece(from, to, opacity) {
      if (to - from < 0.001) return;

      const sectionPoints = getRoutePointsBetweenDistances(
        pointsToDraw,
        from,
        to
      );

      if (sectionPoints.length < 2) return;

      const localProtectedDistances = protectedDistances
        .filter(distance =>
          distance >= from - 0.01 &&
          distance <= to + 0.01
        )
        .map(distance => distance - from);

      const line = L.polyline(
        createRouteDisplayPoints(
          sectionPoints,
          localProtectedDistances
        ),
        {
          color: color,
          weight: 4.5,
          dashArray: "8, 10",
          opacity: opacity,
          lineCap: "round",
          lineJoin: "round",
          className: "route-line-raised"
        }
      ).addTo(map);

      routeRestMarkers.push(line);
    }

    if (!previewIsActive) {
      addPiece(startDistance, endDistance, committedOpacity);
      return;
    }

    // Р’РµСЃСЊ РѕС‚СЂРµР·РѕРє СѓР¶Рµ Р·Р°С„РёРєСЃРёСЂРѕРІР°РЅ.
    if (endDistance <= committedLength + 0.001) {
      addPiece(startDistance, endDistance, committedOpacity);
      return;
    }

    // Р’РµСЃСЊ РѕС‚СЂРµР·РѕРє РѕС‚РЅРѕСЃРёС‚СЃСЏ Рє РїСЂРµРґРїСЂРѕСЃРјРѕС‚СЂСѓ.
    if (startDistance >= committedLength - 0.001) {
      addPiece(startDistance, endDistance, previewOpacity);
      return;
    }

    // РћС‚СЂРµР·РѕРє РїРµСЂРµСЃРµРєР°РµС‚ РіСЂР°РЅРёС†Сѓ РјРµР¶РґСѓ РјР°СЂС€СЂСѓС‚РѕРј Рё РїСЂРµРґРїСЂРѕСЃРјРѕС‚СЂРѕРј.
    addPiece(startDistance, committedLength, committedOpacity);
    addPiece(committedLength, endDistance, previewOpacity);
  }

  // Р РёСЃСѓРµРј Р·РѕР»РѕС‚С‹Рµ СѓС‡Р°СЃС‚РєРё, РїСЂРѕРїСѓСЃРєР°СЏ РІСЃРµ С‡С‘СЂРЅС‹Рµ РёРЅС‚РµСЂРІР°Р»С‹.
  let goldStart = 0;

  mergedBlackIntervals.forEach(interval => {
    if (interval.start > goldStart + 0.001) {
      drawRoutePiece(
        goldStart,
        interval.start,
        "#e2b95f",
        1.0,
        0.22
      );
    }

    goldStart = Math.max(goldStart, interval.end);
  });

  // РџРѕСЃР»РµРґРЅРёР№ Р·РѕР»РѕС‚РѕР№ СѓС‡Р°СЃС‚РѕРє РїРѕСЃР»Рµ РІСЃРµС… С„РѕСЂСЃРёСЂРѕРІР°РЅРЅС‹С… РјР°СЂС€РµР№.
  if (goldStart < totalLength - 0.001) {
    drawRoutePiece(
      goldStart,
      totalLength,
      "#e2b95f",
      1.0,
      0.22
    );
  }

  // Р’РёР·СѓР°Р» С„РѕСЂСЃРёСЂРѕРІР°РЅРЅС‹С… РјР°СЂС€РµР№ РѕСЃС‚Р°С‘С‚СЃСЏ РЅР° РєР°СЂС‚Рµ Рё РїРѕСЃР»Рµ РёС… Р·Р°РІРµСЂС€РµРЅРёСЏ.
  forcedVisualSegments.forEach(segment => {
    const boundaryDistance = segment.start + segment.dailyLimit;
    if (boundaryDistance > segment.end + 0.01) return;

    const boundaryPosition = getRoutePointAtDistance(pointsToDraw, boundaryDistance);
    if (!boundaryPosition) return;

    // Р§С‘СЂРЅР°СЏ Р»РёРЅРёСЏ РїРѕСЃР»Рµ СЂР°Р·РґРµР»РёС‚РµР»СЊРЅРѕР№ С‡РµСЂС‚С‹ вЂ”
    // РґРѕ РїСЂРёРІР°Р»Р°, РєРѕС‚РѕСЂС‹Рј Р·Р°РІРµСЂС€РёР»СЃСЏ С„РѕСЂСЃРёСЂРѕРІР°РЅРЅС‹Р№ РјР°СЂС€.
    drawRoutePiece(
      boundaryDistance,
      segment.end,
      "#171717",
      1.0,
      0.26
    );

    // РќР°РїСЂР°РІР»РµРЅРёРµ С‡РµСЂС‚С‹ РІСЃРµРіРґР° РїРµСЂРїРµРЅРґРёРєСѓР»СЏСЂРЅРѕ РєР°СЃР°С‚РµР»СЊРЅРѕР№ РјР°СЂС€СЂСѓС‚Р°.
    const angle = getPerpendicularRouteAngle(pointsToDraw, boundaryDistance);
    const boundaryIsPreview =
      previewIsActive && boundaryDistance > committedLength + 0.001;
    const boundaryAnimationDelay =
      getRouteMarkerAnimationDelay(boundaryDistance);
    const boundaryShouldAnimate = boundaryAnimationDelay !== null;

    const boundaryIcon = L.divIcon({
      className:
        "route-march-boundary" +
        (boundaryIsPreview ? " route-preview-marker" : ""),
      html: `<div class="${boundaryShouldAnimate ? "route-token-drop" : ""}" style="--route-animation-delay:-${boundaryAnimationDelay || 0}ms;width:30px;height:4px;"><div style="width:30px;height:4px;background:#e6c77d;border:1px solid #211b16;border-radius:1px;transform:rotate(${angle}deg);box-shadow:1px 2px 4px #000;"></div></div>`,
      iconSize: [32, 6],
      iconAnchor: [16, 3]
    });
    const boundaryMarker = L.marker(boundaryPosition, {
      icon: boundaryIcon,
      interactive: false,
      keyboard: false,
      zIndexOffset: 1100
    }).addTo(map);
    routeRestMarkers.push(boundaryMarker);

    // РљСЂРµСЃС‚РёРєРё РёСЃС‚РѕС‰РµРЅРёСЏ вЂ” РєР°Р¶РґС‹Рµ 1/8 РґРЅРµРІРЅРѕР№ РЅРѕСЂРјС‹ РїРѕСЃР»Рµ С‡РµСЂС‚С‹.
    const interval = segment.dailyLimit / 8;
    const exhaustionPositions = [];

    for (let distance = boundaryDistance + interval;
         distance <= segment.end + 0.01;
         distance += interval) {
      const position = getRoutePointAtDistance(pointsToDraw, distance);
      if (position) exhaustionPositions.push({ distance, position });
    }

    // Р•СЃР»Рё РїСЂРё РѕС‚РґР°Р»РµРЅРёРё РєР°СЂС‚С‹ РєСЂРµСЃС‚РёРєРё СЃР±Р»РёР·РёР»РёСЃСЊ, РѕР±СЉРµРґРёРЅСЏРµРј РёС….
    const exhaustionClusters = getExhaustionMarkerClusters(
      exhaustionPositions,
      18
    );

    exhaustionClusters.forEach(cluster => {
      const exhaustionIsPreview =
        previewIsActive &&
        cluster.distances.some(distance => distance > committedLength + 0.001);

      const animationDistance = cluster.distances.find(
        distance => getRouteMarkerAnimationDelay(distance) !== null
      );
      const exhaustionAnimationDelay =
        animationDistance === undefined
          ? null
          : getRouteMarkerAnimationDelay(animationDistance);
      const exhaustionShouldAnimate = exhaustionAnimationDelay !== null;

      const countBadge = cluster.count > 1
        ? `<span class="route-exhaustion-count">${cluster.count}</span>`
        : "";

      const exhaustionIcon = L.divIcon({
        className:
          "route-exhaustion-mark" +
          (exhaustionIsPreview ? " route-preview-marker" : ""),
        html: `<div class="${exhaustionShouldAnimate ? "route-token-drop" : ""}" style="--route-animation-delay:-${exhaustionAnimationDelay || 0}ms;width:28px;height:28px;"><div class="route-exhaustion-cluster"><span class="route-exhaustion-glyph">Г—</span>${countBadge}</div></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
      const marker = L.marker(cluster.position, {
        icon: exhaustionIcon,
        interactive: false,
        keyboard: false,
        zIndexOffset: 1100
      }).addTo(map);
      routeRestMarkers.push(marker);
    });
  });

  // РћР±С‹С‡РЅС‹Рµ РїСЂРёРІР°Р»С‹ СЂРёСЃСѓРµРј РїРѕСЃР»Рµ РІСЃРµС… Р»РёРЅРёР№ Рё РѕС‚РјРµС‚РѕРє,
  // С‡С‚РѕР±С‹ РѕРЅРё РІСЃРµРіРґР° РѕСЃС‚Р°РІР°Р»РёСЃСЊ РїРѕРІРµСЂС… РјР°СЂС€СЂСѓС‚Р°.
  restDistancesToDraw.forEach(distance => {
    if (distance > totalLength + 0.01) return;

    const position = getRoutePointAtDistance(pointsToDraw, distance);
    if (!position) return;

    const restIsPreview =
      previewIsActive && distance > committedLength + 0.001;
    const restAnimationDelay = getRouteMarkerAnimationDelay(distance);
    const restShouldAnimate = restAnimationDelay !== null;

    const marker = L.circleMarker(position, {
      pane: "route-rest-pane",
      radius: 7,
      color: "#211b16",
      weight: 2,
      fillColor: "#e6c77d",
      fillOpacity: restIsPreview ? 0.72 : 1,
      opacity: restIsPreview ? 0.78 : 1,
      interactive: false,
      className:
        "route-rest-raised" +
        (restIsPreview ? " route-preview-marker" : "") +
        (restShouldAnimate ? " route-marker-appear" : "")
    }).addTo(map);

    if (restShouldAnimate) {
      const element = marker.getElement();
      if (element) {
        element.style.animationDelay = `-${restAnimationDelay}ms`;
      }
    }

    // РџСЂРёРІР°Р» РЅР°С…РѕРґРёС‚СЃСЏ РІ РѕС‚РґРµР»СЊРЅРѕРј СЃР»РѕРµ РІС‹С€Рµ РєСЂРµСЃС‚РёРєРѕРІ.
    marker.bringToFront();
    routeRestMarkers.push(marker);
  });

  // Р¤Р»Р°Р¶РѕРє РєРѕРЅРµС‡РЅРѕР№ С‚РѕС‡РєРё.
  if (routeFinished && routePoints.length >= 2) {
    const endPoint = routePoints[routePoints.length - 1];
    const flagIcon = L.divIcon({
      className: "route-end-flag",
      html: `<div style="font-size:30px;line-height:30px;color:#e6c77d;text-shadow:1px 2px 4px #000;">вљ‘</div>`,
      iconSize: [24, 30],
      iconAnchor: [5, 28]
    });
    routeEndMarker = L.marker(endPoint, {
      pane: "route-flag-pane",
      icon: flagIcon,
      interactive: false,
      keyboard: false,
      zIndexOffset: 1200
    }).addTo(map);
  }

  // РРЅС„РѕСЂРјР°С†РёСЏ РІ РїР°РЅРµР»Рё.
  if (routePanel) {
    document.getElementById("route-daily-limit").textContent =
      (dailyLimit * KM_PER_PIXEL).toFixed(1) + " РєРј";
    document.getElementById("route-distance").textContent =
      (totalLength * KM_PER_PIXEL).toFixed(1) + " РєРј";

    const completedDays = routeForcedMarch
      ? getNormalRestDistances(routeForcedMarchStartDistance, dailyLimit).length
      : getNormalRestDistances(totalLength, dailyLimit).length;
    document.getElementById("route-days").textContent = completedDays;

    routeConfirmButton.disabled = !routeFinished;

    const forcedButton = document.getElementById("route-forced-march");
    if (forcedButton) {
      forcedButton.disabled = routeFinished || window.routePendingConfirmation;
    }

    document.getElementById("route-undo").disabled = routePoints.length <= 1;
  }

  console.log("Р”Р»РёРЅР° РјР°СЂС€СЂСѓС‚Р°:", Math.round(totalLength));
}

// =====================================
// Р”РћР‘РђР’Р›Р•РќРР• РўРћР§РљР РњРђР РЁР РЈРўРђ
// =====================================

window.addPartyRoutePoint = function(latlng) {
  const previousLength = getRouteLength(routePoints);
  routePoints.push(latlng);

  beginRouteMarkerAnimation(
    previousLength,
    getRouteLength(routePoints)
  );

  lastCursorPosition = null;
  updateRouteLine(null, true);

  console.log("РўРѕС‡РєРё РјР°СЂС€СЂСѓС‚Р°:", routePoints);
};

// =====================================
// РћР‘Р РђР‘РћРўРљРђ РљР›РРљРћР’ Р Р—РђР’Р•Р РЁР•РќРР• РњРђР РЁР РЈРўРђ
// =====================================

// Р—Р°РІРµСЂС€РµРЅРёРµ РїРѕСЃС‚СЂРѕРµРЅРёСЏ РјР°СЂС€СЂСѓС‚Р°
function finishPartyRoute(latlng) {
  const previousLength = getRouteLength(routePoints);

  // Р”РѕР±Р°РІР»СЏРµРј РїРѕСЃР»РµРґРЅСЋСЋ С‚РѕС‡РєСѓ, РµСЃР»Рё РѕРЅР° РѕС‚Р»РёС‡Р°РµС‚СЃСЏ РѕС‚ РїСЂРµРґС‹РґСѓС‰РµР№
  const lastPoint = routePoints[routePoints.length - 1];

  if (
    !lastPoint ||
    map.latLngToContainerPoint(lastPoint)
      .distanceTo(map.latLngToContainerPoint(latlng)) > 3
  ) {
    routePoints.push(latlng);
  }

  // РњР°СЂС€СЂСѓС‚ РґРѕР»Р¶РµРЅ СЃРѕРґРµСЂР¶Р°С‚СЊ С…РѕС‚СЏ Р±С‹ РѕРґРЅСѓ Р»РёРЅРёСЋ
  if (routePoints.length < 2) {
    console.log("Р”Р»СЏ Р·Р°РІРµСЂС€РµРЅРёСЏ РјР°СЂС€СЂСѓС‚Р° РЅСѓР¶РЅР° С…РѕС‚СЏ Р±С‹ РѕРґРЅР° С‚РѕС‡РєР°");
    return;
  }

  beginRouteMarkerAnimation(
    previousLength,
    getRouteLength(routePoints)
  );

  routeFinished = true;
  window.routeMode = false;
  window.routePendingConfirmation = true;

  lastCursorPosition = null;

  // Р’РѕР·РІСЂР°С‰Р°РµРј РѕР±С‹С‡РЅРѕРµ РїСЂРёР±Р»РёР¶РµРЅРёРµ РґРІРѕР№РЅС‹Рј РєР»РёРєРѕРј
  map.doubleClickZoom.enable();

  updateRouteLine(null, true);

  console.log("РњР°СЂС€СЂСѓС‚ Р·Р°РІРµСЂС€С‘РЅ:", routePoints);
}

// РћР±СЂР°Р±РѕС‚РєР° РѕРґРёРЅРѕС‡РЅРѕРіРѕ Рё РґРІРѕР№РЅРѕРіРѕ РєР»РёРєР°
window.handlePartyRouteClick = function(latlng) {
  if (!window.routeMode || routeFinished) return;

  // Р•СЃР»Рё СѓР¶Рµ РѕР¶РёРґР°РµС‚СЃСЏ РѕРґРёРЅРѕС‡РЅС‹Р№ РєР»РёРє,
  // РїСЂРѕРІРµСЂСЏРµРј, СЏРІР»СЏРµС‚СЃСЏ Р»Рё РЅРѕРІС‹Р№ РєР»РёРє РІС‚РѕСЂС‹Рј
  if (pendingRouteClickTimer) {
    const firstPoint = map.latLngToContainerPoint(
      pendingRouteClickPosition
    );

    const secondPoint = map.latLngToContainerPoint(latlng);

    const distance = firstPoint.distanceTo(secondPoint);

    // Р”РІР° РєР»РёРєР° СЂСЏРґРѕРј РґСЂСѓРі СЃ РґСЂСѓРіРѕРј вЂ” Р·Р°РІРµСЂС€Р°РµРј РјР°СЂС€СЂСѓС‚
    if (distance <= 30) {
      clearTimeout(pendingRouteClickTimer);

      pendingRouteClickTimer = null;
      pendingRouteClickPosition = null;

      finishPartyRoute(latlng);
      return;
    }

    // Р•СЃР»Рё РІС‚РѕСЂРѕР№ РєР»РёРє РґР°Р»РµРєРѕ вЂ” С„РёРєСЃРёСЂСѓРµРј РїСЂРµРґС‹РґСѓС‰РёР№
    clearTimeout(pendingRouteClickTimer);

    window.addPartyRoutePoint(pendingRouteClickPosition);

    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
  }

  // Р—Р°РїРѕРјРёРЅР°РµРј РЅРѕРІС‹Р№ РєР»РёРє
  pendingRouteClickPosition = latlng;

  // Р–РґС‘Рј 300 РјСЃ: РµСЃР»Рё РІС‚РѕСЂРѕРіРѕ РєР»РёРєР° РЅРµ Р±СѓРґРµС‚,
  // РґРѕР±Р°РІР»СЏРµРј РѕР±С‹С‡РЅСѓСЋ С‚РѕС‡РєСѓ РјР°СЂС€СЂСѓС‚Р°
  pendingRouteClickTimer = setTimeout(function() {
    window.addPartyRoutePoint(pendingRouteClickPosition);

    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
  }, 180);
};

// Р”РІРёР¶РµРЅРёРµ РєСѓСЂСЃРѕСЂР° РЅР° РџРљ
map.on("mousemove", function(e) {
  if (!window.routeMode || !hasMouse) return;

  lastCursorPosition = e.latlng;

  updateRouteLine(e.latlng);
});

// РџСЂРё РёР·РјРµРЅРµРЅРёРё РјР°СЃС€С‚Р°Р±Р° РїРµСЂРµСЃРѕР±РёСЂР°РµРј РіСЂСѓРїРїС‹ РєСЂРµСЃС‚РёРєРѕРІ,
// С‡С‚РѕР±С‹ РѕРЅРё РЅРµ РЅР°РєР»Р°РґС‹РІР°Р»РёСЃСЊ РґСЂСѓРі РЅР° РґСЂСѓРіР°.
map.on("zoomend", function() {
  if (routePoints.length >= 2 || window.routeMode) {
    updateRouteLine(lastCursorPosition);
  }
});

        } else {
          // Р•СЃР»Рё РјР°СЂРєРµСЂ СѓР¶Рµ РµСЃС‚СЊ вЂ” РјРµРЅСЏРµРј РµРіРѕ РїРѕР»РѕР¶РµРЅРёРµ
          partyMarker.setLatLng(coordinates);
        }

        console.log("РџРѕР»РѕР¶РµРЅРёРµ РѕС‚СЂСЏРґР°:", coordinates);
      });

    } catch (error) {
      console.error("РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё РѕС‚СЂСЏРґР°:", error);
    }
  }

 // РўРµСЃС‚РѕРІР°СЏ РїСЂРѕРІРµСЂРєР° РѕР±С‰РµР№ Р±Р°Р·С‹
  window.testFirebase = async function() {
    const testRef = ref(database, "connectionTest");

    try {
      await set(testRef, {
        message: "РЎРІСЏР·СЊ СЂР°Р±РѕС‚Р°РµС‚!",
        updatedAt: Date.now()
      });

      const snapshot = await get(testRef);

      console.log("РџСЂРѕРІРµСЂРєР° Firebase:", snapshot.val());
      alert("РЈСЃРїРµС€РЅРѕ! Firebase Р·Р°РїРёСЃС‹РІР°РµС‚ Рё С‡РёС‚Р°РµС‚ РґР°РЅРЅС‹Рµ.");
    } catch (error) {
      console.error("РћС€РёР±РєР° Firebase:", error);
      alert("РћС€РёР±РєР° Firebase: " + error.message);
    }
  };

  // Р”РµР»Р°РµРј Firebase РґРѕСЃС‚СѓРїРЅС‹Рј РґР»СЏ СЃР»РµРґСѓСЋС‰РёС… С‡Р°СЃС‚РµР№ РЅР°С€РµР№ СЃРёСЃС‚РµРјС‹
  window.dndFirebase = {
    app: app,
    auth: auth,
    database: database,
    uid: null,
    ready: false
  };

  // РРЅРґРёРєР°С‚РѕСЂ РїРѕРґРєР»СЋС‡РµРЅРёСЏ РЅР° СЌРєСЂР°РЅРµ
  const status = document.createElement("div");

  status.style.cssText = `
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 2000;
    padding: 8px 12px;
    border-radius: 6px;
    background: #222;
    color: white;
    font: 13px sans-serif;
  `;

  status.textContent = "Firebase: РїРѕРґРєР»СЋС‡РµРЅРёРµ...";
  document.body.appendChild(status);

  // РђРЅРѕРЅРёРјРЅР°СЏ Р°РІС‚РѕСЂРёР·Р°С†РёСЏ РёРіСЂРѕРєР°
  onAuthStateChanged(auth, function(user) {
    if (user) {
      window.dndFirebase.uid = user.uid;
      window.dndFirebase.ready = true;

      status.textContent = "Firebase: Р°РІС‚РѕСЂРёР·Р°С†РёСЏ РІС‹РїРѕР»РЅРµРЅР°";
      status.style.background = "#245c32";

      console.log("Firebase РіРѕС‚РѕРІ. UID:", user.uid);
      initializeParty();
    } else {
      window.dndFirebase.ready = false;
      status.textContent = "Firebase: РІС‹РїРѕР»РЅСЏРµС‚СЃСЏ РІС…РѕРґ...";

      signInAnonymously(auth).catch(function(error) {
        console.error("РћС€РёР±РєР° Р°РІС‚РѕСЂРёР·Р°С†РёРё Firebase:", error);

        status.textContent = "Firebase: РѕС€РёР±РєР° Р°РІС‚РѕСЂРёР·Р°С†РёРё";
        status.style.background = "#8b2222";
      });
    }
  });
</script>
