    if (area) {
      if (partyMarker) window.setPartyMarkerPlaybackPosition(area.center);
      if (typeof window.completeRouteSettlementOutline === "function") {
        window.completeRouteSettlementOutline(area);
      }
    }
    setPartyMarkerVisible(false);
    if (routePanel) routePanel.style.display = "none";
    if (routeLaunchPanel) routeLaunchPanel.style.display = "none";
    map.doubleClickZoom.enable();
    window.routeEditorOriginTerminalSnapshot = null;
    window.routeStartCityOutlineClearedFor = null;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    console.log("Редактирование выхода отменено: восстановлено состояние города");
    return;
  }
  if (pendingRouteClickTimer) {
    clearTimeout(pendingRouteClickTimer);
  }
  pendingRouteClickTimer = null;
  pendingRouteClickPosition = null;
  pendingRouteClickPace = null;
  pendingRouteClickSpeedReduced = null;

  routeFinished = false;
  window.routeEditingConfirmedRoute = false;
  window.routePendingConfirmation = false;
  window.routeMode = false;
  window.routeAnimationPublished = false;
  pendingRouteResumeState = null;
  pendingRoutePlaybackResumeDistance = null;
  // Накопленное время от последнего привала сохраняется при отмене
  // черновика маршрута: отмена прокладки не является самим привалом.
  map.doubleClickZoom.enable();

  routeForcedMarch = false;
  routeForcedMarchStartDistance = 0;
  routeForcedMarchStartUnits = 0;
  routeForcedMarchEpochStartDistance = 0;
  routeForcedMarchPendingExit = false;
  routeForcedSegments = [];
  routeRestResetDistances = [];
  routePoints = [];
  lastCursorPosition = null;
  if (window.clearRouteDestinationSettlementTrace) {
    const traceIds = new Set([
      ...(Array.isArray(window.routeIntermediateCityIds) ? window.routeIntermediateCityIds : []).map(id => String(id)),
      ...(window.routeDestinationCityId != null ? [String(window.routeDestinationCityId)] : [])
    ]);
    traceIds.forEach(id => window.clearRouteDestinationSettlementTrace(id));
  }
  window.routeDestinationCityId = null;
  window.routeDestinationBoundaryPoint = null;
  window.routeDestinationApproachPoint = null;
  window.routeIntermediateCityIds = [];
  window.routeIntermediateSettlementUndoSnapshots = [];
  clearRouteIntermediateCityOutlines();

  stopRouteMarkerAnimation();
  clearRouteDrawing();
  setPartyMarkerVisible(true);
  if (window.clearSettlementOutline) window.clearSettlementOutline();

  const forcedButton = document.getElementById("route-forced-march");
  if (forcedButton) {
    forcedButton.classList.remove("active");
    forcedButton.setAttribute("aria-pressed", "false");
    forcedButton.disabled = false;
  }

  if (routePanel) {
    routePanel.style.display = "none";
  }
  if (routeLaunchPanel) {
    routeLaunchPanel.style.display = "none";
  }

  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  console.log("Прокладка маршрута отменена");
}

// Слои задают строгий порядок: линии < крестики < привалы < флажок.
function ensureRouteMarkerPanes() {
  let restPane = map.getPane("route-rest-pane");
  if (!restPane) restPane = map.createPane("route-rest-pane");
  restPane.style.zIndex = "650";

  let flagPane = map.getPane("route-flag-pane");
  if (!flagPane) flagPane = map.createPane("route-flag-pane");
  flagPane.style.zIndex = "700";
}

// Объединяем крестики только тогда, когда их экранные области 28x28 px
// действительно пересекаются. Если пересекаются соседние группы, они тоже
// объединяются: A-B и B-C превращаются в одну группу A-B-C.
function getExhaustionMarkerClusters(markers, markerSize = 28, routeGeometry = routePoints) {
  const points = markers.map(item => ({
    item,
    point: map.latLngToContainerPoint(item.position)
  }));
  const parents = points.map((_, index) => index);

  function find(index) {
    while (parents[index] !== index) {
      parents[index] = parents[parents[index]];
      index = parents[index];
    }
    return index;
  }

  function unite(a, b) {
    const rootA = find(a);
    const rootB = find(b);
    if (rootA !== rootB) parents[rootB] = rootA;
  }

  // Для одинаковых квадратных значков пересечение есть, пока разница
  // по каждой оси меньше размера значка. Касание по краю не объединяем.
  for (let i = 0; i < points.length; i++) {
    for (let j = i + 1; j < points.length; j++) {
      const dx = Math.abs(points[i].point.x - points[j].point.x);
      const dy = Math.abs(points[i].point.y - points[j].point.y);
      if (dx < markerSize && dy < markerSize) unite(i, j);
    }
  }

  const groups = new Map();
  points.forEach((entry, index) => {
    const root = find(index);
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(entry);
  });

  return Array.from(groups.values()).map(group => {
    const items = group.map(entry => entry.item);

    if (items.length === 1) {
      return {
        position: items[0].position,
        count: 1,
        distances: [items[0].distance]
      };
    }

    // Общий крестик ставим в середину группы ПО ДЛИНЕ МАРШРУТА,
    // а не в центр экранного прямоугольника. Центр прямоугольника
    // может оказаться за пределами дуги или изгиба маршрута.
    const centerDistance = items.reduce((sum, item) => sum + item.distance, 0) / items.length;
    const centerPosition = getRoutePointAtDistance(routeGeometry, centerDistance);

    return {
      position: centerPosition || items[Math.floor(items.length / 2)].position,
      count: items.length,
      distances: items.map(item => item.distance)
    };
  });
}

function getExhaustionClusterDisplaySize() {
  const zoom = map && typeof map.getZoom === "function" ? map.getZoom() : -1;
  // На минимальном масштабе объединённый крестик чуть компактнее;
  // остальные размеры сохраняют прежний вид.
  if (zoom <= -1.5) return 36;
  if (zoom <= -0.5) return 46;
  return 56;
}

function getRouteActiveIntervals(points, totalLength) {
  const transit = getRouteSettlementTransitIntervals(points);
  const result = [];
  let cursor = 0;
  transit.forEach(interval => {
    if (interval.start > cursor + 0.001) result.push({ start: cursor, end: interval.start });
    cursor = Math.max(cursor, interval.end);
  });
  if (cursor < totalLength - 0.001) result.push({ start: cursor, end: totalLength });
  if (!result.length && !transit.length && totalLength > 0.001) {
    result.push({ start: 0, end: totalLength });
  }
  return result;
}

function clipIntervalToActiveRoute(start, end, activeIntervals) {
  const pieces = [];
  activeIntervals.forEach(interval => {
    const a = Math.max(start, interval.start);
    const b = Math.min(end, interval.end);
    if (b > a + 0.001) pieces.push({ start: a, end: b });
  });
  return pieces;
}

function getLastPointAtSettlementCenter(points) {
  if (!points || !points.length) return null;
  const last = points[points.length - 1];
  const ids = Array.isArray(window.routeIntermediateCityIds) ? window.routeIntermediateCityIds : [];
  const areas = Array.isArray(window.settlementAreas) ? window.settlementAreas : [];
  for (const id of ids) {
    const area = areas.find(item => String(item.id) === String(id));
    if (area && String(last._routeSettlementId || "") === String(id) &&
        getRouteSegmentMode(last) === "settlement-zero" &&
        window.isRouteAtSettlementCenter(last, area)) return area;
  }
  return null;
}

// Контрольная точка «Вернуть» в момент выбора промежуточного поселения.
// Возвращает накопленную длину маршрута на центральной точке последнего
// выбранного поселения, даже если после неё уже построены новые отрезки.
function getLastSettlementCenterCheckpointDistance(points) {
  if (!Array.isArray(points) || points.length < 2) return null;
  let passed = 0;
  let checkpoint = null;
  for (let i = 1; i < points.length; i++) {
    const end = points[i];
    if (getRouteSegmentMode(end) === "settlement-zero" && end._routeSettlementId) {
      const area = (window.settlementAreas || []).find(item =>
        String(item.id) === String(end._routeSettlementId)
      );
      if (area && window.isRouteAtSettlementCenter(end, area)) checkpoint = passed;
    }
    getRouteSegmentTerrainParts(points[i - 1], end).forEach(part => {
      passed += part.travelLength;
    });
  }
  return checkpoint;
}

// Вспомогательные функции используются обработчиком промежуточных поселений,
// который находится за пределами initializeParty().
window.getRoutePointsUpToDistance = getRoutePointsUpToDistance;
window.getNormalRestDistances = getNormalRestDistances;
window.getLastSettlementCenterCheckpointDistance = getLastSettlementCenterCheckpointDistance;
window.getRouteSegmentMode = getRouteSegmentMode;
window.getForcedSegmentDistances = getForcedSegmentDistances;

function terminateForcedMarchAtSettlement(outerBoundaryDistance) {
  routeForcedSegments = routeForcedSegments.filter(segment => {
    const recalculated = getForcedSegmentDistances(segment);
    return recalculated.end <= outerBoundaryDistance + 0.001;
  });
  if (!routeForcedMarch) return;
  const forcedTime = getRouteTravelTimeUnitsBetweenDistances(
    routePoints, routeForcedMarchStartDistance, outerBoundaryDistance
  );
  if (routeForcedMarchStartUnits + forcedTime >= 1 - 0.001) {
    routeForcedSegments.push({
      start: routeForcedMarchStartDistance,
      end: outerBoundaryDistance,
      startUnits: routeForcedMarchStartUnits,
      fixed: true
    });
  }
  routeForcedMarch = false;
  routeForcedMarchPendingExit = false;
  routeForcedMarchStartDistance = 0;
  routeForcedMarchStartUnits = 0;
  routeForcedMarchEpochStartDistance = 0;
  const button = document.getElementById("route-forced-march");
  if (button) {
    button.classList.remove("active");
    button.setAttribute("aria-pressed", "false");
  }
}
window.terminateForcedMarchAtSettlement = terminateForcedMarchAtSettlement;

// Строит временный предпросмотр автоматического прохождения через города.
// Для точного совпадения с подтверждением повторно использует тот же обработчик
// добавления точки, но на временной копии маршрута и без побочных обновлений UI.
function getAutomaticSettlementPreview(cursorPosition) {
  if (!cursorPosition || !window.routeMode || !routePoints.length ||
      window.routeDestinationCityId || typeof window.addPartyRoutePoint !== "function") {
    return { points: null, addedIds: [] };
  }

  const originalPoints = routePoints;
  const originalIds = Array.isArray(window.routeIntermediateCityIds)
    ? window.routeIntermediateCityIds.slice() : [];
  const originalLastCursor = lastCursorPosition;
  const originalUpdate = window.updateRouteLine;
  const originalTerminate = window.terminateForcedMarchAtSettlement;
  const originalForcedState = {
    active: routeForcedMarch,
    pendingExit: routeForcedMarchPendingExit,
    startDistance: routeForcedMarchStartDistance,
    startUnits: routeForcedMarchStartUnits,
    epochStartDistance: routeForcedMarchEpochStartDistance,
    segments: routeForcedSegments.slice()
  };

  try {
    routePoints = originalPoints.slice();
    window.routeIntermediateCityIds = originalIds.slice();
    window.updateRouteLine = function() {};
    window.terminateForcedMarchAtSettlement = function() {};
    window.addPartyRoutePoint(cursorPosition);

    const simulatedPoints = routePoints.slice();
    const simulatedIds = window.routeIntermediateCityIds.slice();
    return {
      points: simulatedPoints.length > originalPoints.length
        ? simulatedPoints.slice(originalPoints.length - 1) : null,
      addedIds: simulatedIds.filter(id => !originalIds.some(old => String(old) === String(id)))
    };
  } catch (error) {
    console.warn("Не удалось построить предварительный маршрут через поселение:", error);
    return { points: null, addedIds: [] };
  } finally {
    routePoints = originalPoints;
    window.routeIntermediateCityIds = originalIds;
    routeForcedMarch = originalForcedState.active;
    routeForcedMarchPendingExit = originalForcedState.pendingExit;
    routeForcedMarchStartDistance = originalForcedState.startDistance;
    routeForcedMarchStartUnits = originalForcedState.startUnits;
    routeForcedMarchEpochStartDistance = originalForcedState.epochStartDistance;
    routeForcedSegments = originalForcedState.segments;
    lastCursorPosition = originalLastCursor;
    window.updateRouteLine = originalUpdate;
    window.terminateForcedMarchAtSettlement = originalTerminate;
    if (typeof refreshRouteIntermediateCityOutlines === "function") {
      refreshRouteIntermediateCityOutlines();
    }
  }
}

let routeAutoPreviewBrushLayers = [];

  routeAutoPreviewBrushLayers = removeSettlementBrushLayers(routeAutoPreviewBrushLayers);

let partyPlaybackRouteLineLayers = [];
let partyPlaybackMaskSequence = 0;

function registerPartyPlaybackRouteLine(layer, startDistance, endDistance) {
  if (!layer || !(endDistance > startDistance)) return;
  layer._partyPlaybackStartDistance = startDistance;
  layer._partyPlaybackEndDistance = endDistance;
  layer._partyPlaybackBaseOpacity = Number(layer.options && layer.options.opacity);
  if (!Number.isFinite(layer._partyPlaybackBaseOpacity)) layer._partyPlaybackBaseOpacity = 1;
  partyPlaybackRouteLineLayers.push(layer);
}

function getPartyPlaybackMarkerScreenCenter() {
  const icon = partyMarker && partyMarker._icon;
  if (!icon || typeof icon.getBoundingClientRect !== "function") return null;
  const rect = icon.getBoundingClientRect();
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

// Находим точку SVG-пути, которая в текущем кадре находится ближе всего
// к центру маркера. Это устраняет рассинхронизацию маски и жетона при pan:
// cut больше не зависит от условной доли длины пунктирного штриха.
function getPartyPathDistanceAtScreenPoint(path, screenPoint) {
  if (!path || !screenPoint || typeof path.getTotalLength !== "function" ||
      typeof path.getPointAtLength !== "function" || typeof path.getScreenCTM !== "function") return null;
  const length = path.getTotalLength();
  const svg = path.ownerSVGElement;
  const matrix = path.getScreenCTM();
  if (!(length > 0.01) || !svg || !matrix || typeof matrix.inverse !== "function") return null;
  let localTarget;
  try {
    const svgPoint = svg.createSVGPoint();
    svgPoint.x = screenPoint.x;
    svgPoint.y = screenPoint.y;
    localTarget = svgPoint.matrixTransform(matrix.inverse());
  } catch (_) {
    return null;
  }
  const distanceSquaredAt = value => {
    const point = path.getPointAtLength(value);
    const dx = point.x - localTarget.x;
    const dy = point.y - localTarget.y;
    return dx * dx + dy * dy;
  };
  const steps = Math.max(8, Math.ceil(length / 1.25));
  let bestIndex = 0;
  let bestSquared = Infinity;
  for (let i = 0; i <= steps; i++) {
    const value = length * i / steps;
    const squared = distanceSquaredAt(value);
    if (squared < bestSquared) {
      bestSquared = squared;
      bestIndex = i;
    }
  }
  let left = length * Math.max(0, bestIndex - 1) / steps;
  let right = length * Math.min(steps, bestIndex + 1) / steps;
  for (let i = 0; i < 8; i++) {
    const oneThird = left + (right - left) / 3;
    const twoThirds = right - (right - left) / 3;
    if (distanceSquaredAt(oneThird) <= distanceSquaredAt(twoThirds)) right = twoThirds;
    else left = oneThird;
  }
  const result = (left + right) / 2;
  const nearestSquared = distanceSquaredAt(result);
  // При сильном расхождении оставляем прежнюю дистанционную оценку как fallback.
  if (nearestSquared > 60 * 60) return null;
  return Math.max(0, Math.min(length, result));
}

function updatePartyPlaybackRouteTokens(distance) {
  if (isTerminalSettlementPaused(window.partyPlaybackState)) {
    clearRouteDrawing();
    return;
  }
  const passedDistance = Number(distance) || 0;
  const layers = Array.isArray(window.routeRestMarkers)
    ? [...window.routeRestMarkers] : [];
  if (routeEndMarker) layers.push(routeEndMarker);
  layers.forEach(layer => {
    const tokenDistance = Number(layer && layer._partyPlaybackTokenDistance);
    if (!Number.isFinite(tokenDistance) || !layer || !map.hasLayer(layer)) return;
    if (passedDistance + 0.02 >= tokenDistance) {
      map.removeLayer(layer);
      layer._partyPlaybackTokenRemoved = true;
    }
  });
}

function updatePartyPlaybackRouteLine(distance) {
  if (isTerminalSettlementPaused(window.partyPlaybackState)) {
    clearRouteDrawing();
    return;
  }
  // Пока строится маршрут, его прозрачные штрихи принадлежат анимации
  // появления. Маска движения не должна менять их opacity или скрывать их.
  // После завершения построения updateRouteLine создаст обычные слои, и тогда
  // можно безопасно применять обрезание пройденной части.
  if (routeMarkerAnimations.length > 0) return;
  if (!Array.isArray(partyPlaybackRouteLineLayers)) return;
  const markerScreenCenter = getPartyPlaybackMarkerScreenCenter();
  partyPlaybackRouteLineLayers.forEach(layer => {
    const path = layer && layer._path;
    if (!path || !path.ownerSVGElement) return;
    const start = Number(layer._partyPlaybackStartDistance);
    const end = Number(layer._partyPlaybackEndDistance);
    if (!(end > start)) return;

    const progress = Math.max(0, Math.min(1, (distance - start) / (end - start)));
    if (progress <= 0) {
      path.removeAttribute("mask");
      path.style.opacity = String(layer._partyPlaybackBaseOpacity);
      if (layer._partyPlaybackMask && layer._partyPlaybackMask.parentNode) {
        layer._partyPlaybackMask.parentNode.removeChild(layer._partyPlaybackMask);
      }
      layer._partyPlaybackMask = null;
      layer._partyPlaybackMaskBasePath = null;
      layer._partyPlaybackMaskHiddenPath = null;
      layer._partyPlaybackMaskSvg = null;
      layer._partyPlaybackPathData = null;
      return;
    }
    if (progress >= 1) {
      path.removeAttribute("mask");
      path.style.opacity = "0";
      if (layer._partyPlaybackMask && layer._partyPlaybackMask.parentNode) {
        layer._partyPlaybackMask.parentNode.removeChild(layer._partyPlaybackMask);
      }
      layer._partyPlaybackMask = null;
      layer._partyPlaybackMaskBasePath = null;
      layer._partyPlaybackMaskHiddenPath = null;
      layer._partyPlaybackMaskSvg = null;
      layer._partyPlaybackPathData = null;
      return;
    }

    const svg = path.ownerSVGElement;
    let mask = layer._partyPlaybackMask;
    let basePath = layer._partyPlaybackMaskBasePath;
    let hiddenPath = layer._partyPlaybackMaskHiddenPath;
    // Leaflet может заменить SVG renderer при перестройке/перемещении слоёв.
    // Старый mask при этом всё ещё имеет parentNode, но уже находится в другом
    // SVG и ссылка url(#id) на новом path не работает — пройденная линия всплывает.
    if (mask && layer._partyPlaybackMaskSvg !== svg) {
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      mask = null;
      basePath = null;
      hiddenPath = null;
      layer._partyPlaybackMask = null;
      layer._partyPlaybackMaskBasePath = null;
      layer._partyPlaybackMaskHiddenPath = null;
      layer._partyPlaybackMaskSvg = null;
    }
    if (!mask || !mask.parentNode || !basePath || !hiddenPath) {
      let defs = svg.querySelector("defs");
      if (!defs) {
        defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
        svg.insertBefore(defs, svg.firstChild);
      }
      mask = document.createElementNS("http://www.w3.org/2000/svg", "mask");
      const maskId = "party-playback-mask-" + (++partyPlaybackMaskSequence);
      mask.setAttribute("id", maskId);
      mask.setAttribute("maskUnits", "userSpaceOnUse");
      mask.setAttribute("maskContentUnits", "userSpaceOnUse");
      mask.setAttribute("mask-type", "luminance");
      mask.setAttribute("x", "-100000");
      mask.setAttribute("y", "-100000");
      mask.setAttribute("width", "200000");
      mask.setAttribute("height", "200000");

      // Белая линия сохраняет исходный пунктир видимым. Чёрный отрезок
      // поверх неё скрывает только пройденный префикс, от начала к финишу.
      // Это не переопределяет dashArray самого маршрута и не может «стирать»
      // линию навстречу жетону с противоположного конца.
      basePath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      basePath.setAttribute("fill", "none");
      basePath.setAttribute("stroke", "white");
      basePath.setAttribute("stroke-width", "40");
      basePath.setAttribute("stroke-linecap", "round");
      basePath.setAttribute("stroke-linejoin", "round");

      hiddenPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      hiddenPath.setAttribute("fill", "none");
      hiddenPath.setAttribute("stroke", "black");
      hiddenPath.setAttribute("stroke-width", "40");
      hiddenPath.setAttribute("stroke-linecap", "butt");
      hiddenPath.setAttribute("stroke-linejoin", "round");

      mask.appendChild(basePath);
      mask.appendChild(hiddenPath);
      defs.appendChild(mask);
      path.setAttribute("mask", "url(#" + maskId + ")");
      layer._partyPlaybackMask = mask;
      layer._partyPlaybackMaskBasePath = basePath;
      layer._partyPlaybackMaskHiddenPath = hiddenPath;
      layer._partyPlaybackMaskSvg = svg;
    }
    // Повторно назначаем ссылку на каждом кадре: после перемещения карты
    // Leaflet может перестроить SVG path, сохранив сам объект слоя.
    path.setAttribute("mask", "url(#" + mask.id + ")");

    const pathData = path.getAttribute("d") || "";
    if (layer._partyPlaybackPathData !== pathData) {
      layer._partyPlaybackPathData = pathData;
      layer._partyPlaybackPathLength = typeof path.getTotalLength === "function"
        ? path.getTotalLength() : 0;
    }
    const pathLength = Number(layer._partyPlaybackPathLength) || 0;
    if (!(pathLength > 0.01)) return;

    let hiddenLength = Math.max(0, Math.min(pathLength, pathLength * progress));
    if (markerScreenCenter) {
      const markerAlignedLength = getPartyPathDistanceAtScreenPoint(path, markerScreenCenter);
      if (Number.isFinite(markerAlignedLength)) hiddenLength = markerAlignedLength;
    }
    basePath.setAttribute("d", pathData);
    hiddenPath.setAttribute("d", pathData);
    // Чёрный штрих начинается строго с начала SVG-пути. По мере движения
    // увеличивается только его длина; оставшаяся часть не меняет прозрачность.
    hiddenPath.setAttribute("stroke-dasharray",
      hiddenLength.toFixed(3) + " " + Math.max(0.001, pathLength - hiddenLength).toFixed(3));
    hiddenPath.setAttribute("stroke-dashoffset", "0");
    path.style.opacity = String(layer._partyPlaybackBaseOpacity);
  });
}

function updateRouteLine(cursorPosition = null) {
  if (isTerminalSettlementPaused(window.partyPlaybackState) && !window.routeMode &&
      !window.routePendingConfirmation && !window.routeEditingConfirmedRoute) {
    clearRouteDrawing();
    return;
  }
  // Перерисовка карты не отменяет и не перезапускает анимацию жетонов.
  // Время анимации учитывается при создании каждого нового DOM-элемента.
  ensureRouteMarkerPanes();

  // Для preview используем те же расчёты, что и для зафиксированного маршрута,
  // но ничего не записываем в состояние до клика.
  const pointsToDraw = [...routePoints];
  let automaticPreviewIds = [];
  if (cursorPosition && hasMouse && window.routeMode && routePoints.length > 0) {
    const automaticPreview = getAutomaticSettlementPreview(cursorPosition);
    const previewPath = automaticPreview.points || getRouteSegmentAroundIntermediateCities(
      routePoints[routePoints.length - 1], cursorPosition
    );
    automaticPreviewIds = automaticPreview.addedIds || [];
    if (previewPath && previewPath.length > 1) {
      const previewSegment = previewPath.slice(1);
      previewSegment.forEach(point => window.applyRouteTravelSettings(point));
      pointsToDraw.push(...previewSegment);
    }
  }

  clearRouteDrawing();
  // Все скрытые слои предыдущей отрисовки уже удалены clearRouteDrawing;
  // сбрасываем только их служебные ссылки без лишнего восстановления геометрии.
  if (window.discardRouteLayersForSettlement) {
    window.discardRouteLayersForSettlement();
  }

  // Длины исходных сегментов маршрута считаем один раз. Этот индекс далее
  // используется и для границ темпа, и для определения параметров участка.
  const routePointCumulativeDistances = [0];
  for (let i = 1; i < pointsToDraw.length; i++) {
    routePointCumulativeDistances.push(
      routePointCumulativeDistances[i - 1] +
      getRouteTravelLength([pointsToDraw[i - 1], pointsToDraw[i]])
    );
  }
  const totalLength = routePointCumulativeDistances[routePointCumulativeDistances.length - 1] || 0;

  function findRoutePointIndexAtDistance(distance) {
    let low = 1;
    let high = routePointCumulativeDistances.length - 1;
    while (low < high) {
      const mid = (low + high) >> 1;
      if (routePointCumulativeDistances[mid] < distance - 0.000001) low = mid + 1;
      else high = mid;
    }
    while (low < pointsToDraw.length &&
           routePointCumulativeDistances[low] - routePointCumulativeDistances[low - 1] <= 0.000001) {
      low++;
    }
    return Math.min(low, pointsToDraw.length - 1);
  }

  const dailyLimit =
    routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);

  // При включении марша внутри поселения его начало фиксируется на внешнем
  // конце транзитного участка; последующая смена темпа его не перемещает.
  if (routeForcedMarch) {
    if (routeForcedMarchPendingExit) {
      const transitIntervals = getRouteSettlementTransitIntervals(pointsToDraw);
      routeForcedMarchStartDistance = transitIntervals.length
        ? transitIntervals[transitIntervals.length - 1].end
        : totalLength;
      routeForcedMarchEpochStartDistance = routeForcedMarchStartDistance;
      routeForcedMarchStartUnits = 0;
    }
  }

  const restCalculationLength = routeForcedMarch
    ? routeForcedMarchStartDistance
    : totalLength;
  // Маркеры не должны появляться внутри визуальной кисти ни одного
  // выбранного промежуточного города, конечного города или города под курсором.
  const settlementMaskAreas = [];
  const allSettlementAreas = Array.isArray(window.settlementAreas)
    ? window.settlementAreas : [];

  (Array.isArray(window.routeIntermediateCityIds)
    ? window.routeIntermediateCityIds : []).forEach(id => {
      const area = allSettlementAreas.find(item => String(item.id) === String(id));
      if (area && !settlementMaskAreas.some(item => String(item.id) === String(area.id))) {
        settlementMaskAreas.push(area);
      }
    });

  if (window.routeDestinationCityId) {
    const destinationArea = allSettlementAreas.find(
      area => String(area.id) === String(window.routeDestinationCityId)
    );
    if (destinationArea && !settlementMaskAreas.some(
      item => String(item.id) === String(destinationArea.id)
    )) settlementMaskAreas.push(destinationArea);
  } else if (window.routeMode && cursorPosition) {
    const hoveredArea = findSettlementAt(cursorPosition);
    if (hoveredArea && !settlementMaskAreas.some(
      item => String(item.id) === String(hoveredArea.id)
    )) settlementMaskAreas.push(hoveredArea);
  }

  // Города, которые маршрут только предварительно пересекает, получают
  // ту же маску, что и уже выбранные промежуточные поселения. Поэтому
  // предварительная линия не видна внутри внешней визуальной кисти.
  automaticPreviewIds.forEach(id => {
    const area = allSettlementAreas.find(item => String(item.id) === String(id));
    if (area && !settlementMaskAreas.some(
      item => String(item.id) === String(area.id)
    )) settlementMaskAreas.push(area);
  });

  const isMarkerInsideSettlementMask = (position, extraPixels = 0) =>
    !!(window.isRouteMarkerMaskedBySettlement &&
      settlementMaskAreas.some(area =>
        window.isRouteMarkerMaskedBySettlement(position, area, extraPixels)
      ));

  const restGeometry = routeForcedMarch
    ? getRoutePointsUpToDistance(pointsToDraw, restCalculationLength)
    : pointsToDraw;
  let restDistancesToDraw = getNormalRestDistances(
    restCalculationLength,
    dailyLimit,
    restGeometry
  ).filter(distance => {
    const position = getRoutePointAtDistance(pointsToDraw, distance);
    return !position || !isMarkerInsideSettlementMask(position);
  });

  // Подготовим историю завершённых маршей и текущий активный марш.
  const activeRouteIntervals = getRouteActiveIntervals(pointsToDraw, totalLength);
  const forcedVisualSegments = [];
  function addForcedVisualSegment(start, end, active = false, initialElapsedUnits = 0) {
    const safeStart = Math.max(0, start);
    const safeEnd = Math.min(totalLength, end);
    if (safeEnd <= safeStart + 0.001) return;
    const carry = Math.max(0, Math.min(0.999999, Number(initialElapsedUnits) || 0));
    const travelledUnits = getRouteTravelTimeUnitsBetweenDistances(
      pointsToDraw, safeStart, safeEnd
    );
    const elapsedUnits = carry + travelledUnits;
    if (elapsedUnits < 1 - 0.001) return;
    const boundaryDistance = getRouteDistanceAtElapsedTime(
      pointsToDraw, safeStart, 1 - carry, safeEnd
    );
    const exhaustionDistances = [];
    for (let unit = 1.125; unit <= elapsedUnits + 0.000001; unit += 0.125) {
      const unitsAfterStart = unit - carry;
      if (unitsAfterStart <= 0.000001) continue;
      exhaustionDistances.push(getRouteDistanceAtElapsedTime(
        pointsToDraw, safeStart, unitsAfterStart, safeEnd
      ));
    }
    forcedVisualSegments.push({
      start: safeStart,
      end: safeEnd,
      boundaryDistance,
      exhaustionDistances,
      active
    });
  }

  function addForcedVisualSegmentWithRestResets(start, end, active, initialElapsedUnits) {
    const resetCuts = routeRestResetDistances
      .filter(distance => distance > start + 0.001 && distance < end - 0.001)
      .sort((a, b) => a - b);
    let pieceStart = start;
    let carry = initialElapsedUnits;
    resetCuts.forEach(resetDistance => {
      addForcedVisualSegment(pieceStart, resetDistance, active, carry);
      pieceStart = resetDistance;
      carry = 0;
    });
    addForcedVisualSegment(pieceStart, end, active, carry);
  }

  routeForcedSegments
    .map(segment => getForcedSegmentDistances(segment))
    .filter(segment => segment.start < totalLength + 0.01)
    .forEach(segment => {
      clipIntervalToActiveRoute(segment.start, Math.min(segment.end, totalLength), activeRouteIntervals)
        .forEach(piece => addForcedVisualSegmentWithRestResets(
          piece.start,
          piece.end,
          false,
          piece.start <= segment.start + 0.001 ? segment.startUnits : 0
        ));
    });

  if (routeForcedMarch) {
    let carryPending = true;
    clipIntervalToActiveRoute(routeForcedMarchStartDistance, totalLength, activeRouteIntervals)
      .forEach(piece => {
        addForcedVisualSegmentWithRestResets(
          piece.start,
          piece.end,
          true,
          carryPending ? routeForcedMarchStartUnits : 0
        );
        carryPending = false;
      });
  }

  // Разделительная черта обозначает суточную границу форсированного марша,
  // но не является самостоятельным привалом: не рисуем на ней круг и не
  // создаём playback-rest-stop, который автоматически ставил бы отряд на паузу.
  const forcedDividerDistances = forcedVisualSegments.map(segment => segment.boundaryDistance);
  restDistancesToDraw = restDistancesToDraw.filter(distance =>
    !forcedDividerDistances.some(boundary => Math.abs(distance - boundary) <= 0.05)
  );

  const terrainIntervals = getTerrainTravelIntervals(pointsToDraw);
  const protectedDistances = [...restDistancesToDraw];
  terrainIntervals.forEach(interval => {
    protectedDistances.push(interval.start, interval.end);
  });
  forcedVisualSegments.forEach(segment => {
    protectedDistances.push(segment.boundaryDistance, ...segment.exhaustionDistances, segment.end);
  });

  // Вставляем реальные точки привалов и отметок в исходную геометрию.
  const anchoredPoints = getRoutePointsWithDistanceAnchors(
    pointsToDraw,
    protectedDistances
  );

  // ВАЖНО: сначала формируем одну общую сглаженную геометрию всего маршрута,
  // и только затем нарезаем её на анимируемые фрагменты. Иначе каждый короткий
  // фрагмент сглаживается отдельно и на время проявления превращается в прямую.
  const displayRoutePoints = createRouteDisplayPoints(
    pointsToDraw,
    protectedDistances
  );
  // Движение маркера использует ту же геометрию, что и видимая линия:
  // включая скругления, неровности и защищённые точки привалов/рельефа.
  window.partyVisualRoutePoints = displayRoutePoints;

  // Один проход по сглаженной геометрии заранее рассчитывает длину пути и
  // экранное расстояние. Раньше каждый отдельный фрагмент маршрута повторно
  // проходил весь массив точек и заново проверял пересечения с рельефом.
  const displayRouteCumulative = [0];
  const displayScreenSegments = [];
  let displayScreenPassed = 0;
  for (let i = 1; i < displayRoutePoints.length; i++) {
    const startPoint = displayRoutePoints[i - 1];
    const endPoint = displayRoutePoints[i];
    const parts = getRouteSegmentTerrainParts(startPoint, endPoint);
    const rawLength = Math.hypot(endPoint.lat - startPoint.lat, endPoint.lng - startPoint.lng);
    const screenLength = map.latLngToLayerPoint(startPoint).distanceTo(
      map.latLngToLayerPoint(endPoint)
    );
    let segmentTravelLength = 0;
    parts.forEach(part => {
      if (part.travelLength <= 0.000001) return;
      const partScreenLength = part.zeroLength || rawLength <= 0.000001
        ? 0
        : screenLength * (part.t1 - part.t0);
      displayScreenSegments.push({
        travelStart: displayRouteCumulative[i - 1] + segmentTravelLength,
        travelEnd: displayRouteCumulative[i - 1] + segmentTravelLength + part.travelLength,
        screenStart: displayScreenPassed,
        screenEnd: displayScreenPassed + partScreenLength
      });
      segmentTravelLength += part.travelLength;
      displayScreenPassed += partScreenLength;
    });
    displayRouteCumulative.push(displayRouteCumulative[i - 1] + segmentTravelLength);
  }
  const displayRouteLength = displayRouteCumulative[displayRouteCumulative.length - 1] || 0;

  function findCumulativeSegment(cumulative, distance) {
    let low = 1;
    let high = cumulative.length - 1;
    while (low < high) {
      const mid = (low + high) >> 1;
      if (cumulative[mid] < distance - 0.000001) low = mid + 1;
      else high = mid;
    }
    return low;
  }

  function getDisplayPointAtDistance(distance) {
    if (displayRoutePoints.length < 2) return displayRoutePoints[0] || null;
    if (distance >= displayRouteLength) return displayRoutePoints[displayRoutePoints.length - 1];
    let index = Math.max(1, findCumulativeSegment(displayRouteCumulative, Math.max(0, distance)));
    // Пропускаем нулевые соединители поселений так же, как это делает
    // getRoutePointAtDistance: координата берётся с первого реального сегмента.
    while (index < displayRoutePoints.length &&
           displayRouteCumulative[index] - displayRouteCumulative[index - 1] <= 0.000001) {
      index++;
    }
    if (index >= displayRoutePoints.length) return displayRoutePoints[displayRoutePoints.length - 1];
    const segmentStart = displayRouteCumulative[index - 1];
    if (Math.abs(displayRouteCumulative[index] - distance) < 0.000001) {
      return displayRoutePoints[index];
    }
    return getRoutePointAtDistance(
      [displayRoutePoints[index - 1], displayRoutePoints[index]],
      Math.max(0, distance - segmentStart)
    );
  }

  function getDisplayPointsBetweenDistances(startDistance, endDistance) {
    const start = Math.max(0, Math.min(displayRouteLength, startDistance));
    const end = Math.max(start, Math.min(displayRouteLength, endDistance));
    const entries = [];
    let low = 0;
    let high = displayRouteCumulative.length - 1;
    const lowerBound = Math.max(0, start - 0.01);
    while (low < high) {
      const mid = (low + high) >> 1;
      if (displayRouteCumulative[mid] < lowerBound) low = mid + 1;
      else high = mid;
    }
    for (let index = low; index < displayRoutePoints.length &&
         displayRouteCumulative[index] <= end + 0.01; index++) {
      if (displayRouteCumulative[index] >= lowerBound) {
        entries.push({ distance: displayRouteCumulative[index], point: displayRoutePoints[index], order: index });
      }
    }
    entries.push({ distance: start, point: getDisplayPointAtDistance(start), order: displayRoutePoints.length });
    entries.push({ distance: end, point: getDisplayPointAtDistance(end), order: displayRoutePoints.length + 1 });
    entries.sort((a, b) => a.distance - b.distance || a.order - b.order);
    const result = [];
    entries.forEach(entry => {
      if (!entry.point) return;
      const last = result[result.length - 1];
      if (!last || Math.hypot(entry.point.lat - last.lat, entry.point.lng - last.lng) > 0.000001) {
        result.push(entry.point);
      }
    });
    return result;
  }

  function getDisplayScreenDistanceAtDistance(distance) {
    if (!displayScreenSegments.length || distance <= 0) return 0;
    if (distance >= displayRouteLength) return displayScreenPassed;
    let low = 0;
    let high = displayScreenSegments.length - 1;
    while (low < high) {
      const mid = (low + high) >> 1;
      if (displayScreenSegments[mid].travelEnd < distance - 0.000001) low = mid + 1;
      else high = mid;
    }
    const segment = displayScreenSegments[low];
    const span = segment.travelEnd - segment.travelStart;
    const t = span > 0.000001
      ? Math.max(0, Math.min(1, (distance - segment.travelStart) / span))
      : 0;
    return segment.screenStart + (segment.screenEnd - segment.screenStart) * t;
  }

  // В подтверждённом маршруте шкала жетонов и городских пауз должна
  // использовать ровно ту же сглаженную геометрию, что и рисуемая линия.
  // В режиме предпросмотра геометрию общей анимации не переопределяем.
  if (!cursorPosition && pointsToDraw.length === routePoints.length) {
    syncRouteAnimationGeometry(displayRoutePoints, totalLength, displayRouteLength);
  }

  // Основная линия маршрута.
  // Разделяем маршрут на золотые и чёрные участки.
  // Золотая линия не рисуется там, где должен идти форсированный марш.

  const blackIntervals = forcedVisualSegments
    .map(segment => ({
      start: segment.boundaryDistance,
      end: segment.end
    }))
    .filter(interval => interval.end > interval.start + 0.001)
    .sort((a, b) => a.start - b.start);

  // Объединяем пересекающиеся чёрные участки.
  const mergedBlackIntervals = [];

  blackIntervals.forEach(interval => {
    const previous = mergedBlackIntervals[mergedBlackIntervals.length - 1];

    if (previous && interval.start <= previous.end + 0.001) {
      previous.end = Math.max(previous.end, interval.end);
    } else {
      mergedBlackIntervals.push({
        start: interval.start,
        end: interval.end
      });
    }
  });

  // Интервалы труднопроходимой местности в шкале пути.
  const mergedTerrainIntervals = [];
  terrainIntervals.forEach(interval => {
    const previous = mergedTerrainIntervals[mergedTerrainIntervals.length - 1];
    if (previous && interval.start <= previous.end + 0.001) {
      previous.end = Math.max(previous.end, interval.end);
    } else {
      mergedTerrainIntervals.push({ start: interval.start, end: interval.end });
    }
  });

  // Красная линия не строится на участках форсированного марша вообще.
  // Не полагаемся на визуальное перекрытие чёрной линией: исключаем
  // пересекающиеся интервалы ещё до создания красных полилиний.
  const terrainRedIntervals = [];
  mergedTerrainIntervals.forEach(terrainInterval => {
    let remaining = [{ start: terrainInterval.start, end: terrainInterval.end }];

    mergedBlackIntervals.forEach(blackInterval => {
      const nextRemaining = [];
      remaining.forEach(part => {
        if (blackInterval.end <= part.start + 0.001 ||
            blackInterval.start >= part.end - 0.001) {
          nextRemaining.push(part);
          return;
        }

        if (blackInterval.start > part.start + 0.001) {
          nextRemaining.push({ start: part.start, end: Math.min(part.end, blackInterval.start) });
        }
        if (blackInterval.end < part.end - 0.001) {
          nextRemaining.push({ start: Math.max(part.start, blackInterval.end), end: part.end });
        }
      });
      remaining = nextRemaining;
    });

    terrainRedIntervals.push(...remaining.filter(part => part.end > part.start + 0.001));
  });

  // Золотая линия прерывается и на форсированном марше, и на труднопроходимой местности.
  const allNonGoldIntervals = [...mergedBlackIntervals, ...mergedTerrainIntervals]
    .sort((a, b) => a.start - b.start);
  const mergedNonGoldIntervals = [];
  allNonGoldIntervals.forEach(interval => {
    const previous = mergedNonGoldIntervals[mergedNonGoldIntervals.length - 1];
    if (previous && interval.start <= previous.end + 0.001) {
      previous.end = Math.max(previous.end, interval.end);
    } else {
      mergedNonGoldIntervals.push({ start: interval.start, end: interval.end });
    }
  });

  // При движении мыши отделяем уже зафиксированный маршрут
  // от полупрозрачного предпросмотра.
  const previewIsActive =
    Boolean(cursorPosition && hasMouse && window.routeMode);

  const committedLength = getRouteTravelLength(routePoints);

  // Цвет линии зависит от темпа конкретного зафиксированного участка.
  // Быстрый темп остаётся в золотисто-охристой гамме, чтобы не сливаться
  // с зелёными областями карты.
  function getRoutePaceLineColor(pace) {
    if (pace === "slow") return "#d3a05f";
    if (pace === "fast") return "#c3b879";
    return "#e2b95f";
  }

  // Универсальное создание отрезка маршрута.
  function drawRoutePiece(
    startDistance,
    endDistance,
    color,
    committedOpacity,
    previewOpacity
  ) {
    if (endDistance - startDistance < 0.001) return;

    function addPiece(from, to, opacity) {
      if (to - from < 0.001) return;

      // Делим участок по границам темпа и анимаций. Сами штрихи линии
      // проявляются последовательно от начала каждого отрезка к его концу.
      const boundaries = [from, to];
      // Границы участков с разными темпами обязательны для визуального
      // разделения линии: смена темпа не должна перекрашивать соседние отрезки.
      let pointIndex = findRoutePointIndexAtDistance(from + 0.001);
      for (; pointIndex < pointsToDraw.length; pointIndex++) {
        const paceBoundaryDistance = routePointCumulativeDistances[pointIndex];
        if (paceBoundaryDistance >= to - 0.001) break;
        if (paceBoundaryDistance > from + 0.001) boundaries.push(paceBoundaryDistance);
      }
      routeMarkerAnimations.forEach(animation => {
        if (animation.start > from && animation.start < to) boundaries.push(animation.start);
        if (animation.end > from && animation.end < to) boundaries.push(animation.end);
      });
      boundaries.sort((a, b) => a - b);

      for (let part = 0; part < boundaries.length - 1; part++) {
        const partStart = boundaries[part];
        const partEnd = boundaries[part + 1];
        if (partEnd - partStart < 0.001) continue;

        const midpoint = (partStart + partEnd) / 2;
        const activeAnimation = getRouteMarkerAnimation(midpoint);
        const segmentSettingsPoint = pointsToDraw[findRoutePointIndexAtDistance(midpoint)];
        const segmentPace = getRouteSegmentPace(segmentSettingsPoint);
        const segmentSpeedReduced = getRouteSegmentSpeedReduced(segmentSettingsPoint);
        const segmentColor = color === "#e2b95f"
          ? getRoutePaceLineColor(segmentPace)
          : color;

        // Отдельно рассчитываем экранную геометрию участка. Активная линия
        // будет рисоваться не крупными отрывками, а короткими штрихами.
        const partDisplayStart = totalLength > 0.001
          ? partStart / totalLength * displayRouteLength
          : 0;
        const partDisplayEnd = totalLength > 0.001
          ? partEnd / totalLength * displayRouteLength
          : displayRouteLength;
        const sectionPoints = getDisplayPointsBetweenDistances(
          partDisplayStart,
          partDisplayEnd
        );
        if (sectionPoints.length < 2) continue;

        // sectionPoints уже являются частью общей сглаженной геометрии маршрута.
        // Не сглаживаем их повторно: иначе длина реально рисуемой линии начинает
        // отличаться от геометрии, по которой рассчитываются штрихи и жетоны.
        const partDisplayPoints = sectionPoints;

        const screenEntries = [];
        let partScreenLength = 0;
        partDisplayPoints.forEach((point, index) => {
          const layerPoint = map.latLngToLayerPoint(point);
          if (index > 0 && getRouteSegmentMode(point) !== "settlement-zero") {
            partScreenLength += layerPoint.distanceTo(screenEntries[index - 1].layerPoint);
          }
          screenEntries.push({ point, layerPoint, distance: partScreenLength });
        });

        // Быстрый поиск точки на экранной геометрии. Бинарный поиск важен для
        // длинных кривых: засечки и короткие штрихи больше не сканируют весь путь.
        function getScreenPointAtDistance(targetDistance) {
          if (targetDistance <= 0) return screenEntries[0].layerPoint;
          if (targetDistance >= partScreenLength) return screenEntries[screenEntries.length - 1].layerPoint;
          let low = 1;
          let high = screenEntries.length - 1;
          while (low < high) {
            const mid = (low + high) >> 1;
            if (screenEntries[mid].distance < targetDistance) low = mid + 1;
            else high = mid;
          }
          const previous = screenEntries[low - 1];
          const current = screenEntries[low];
          const segmentLength = current.distance - previous.distance;
          const t = segmentLength > 0.001
            ? (targetDistance - previous.distance) / segmentLength
            : 0;
          return L.point(
            previous.layerPoint.x + (current.layerPoint.x - previous.layerPoint.x) * t,
            previous.layerPoint.y + (current.layerPoint.y - previous.layerPoint.y) * t
          );
        }

        function getScreenLinePoints(startPx, endPx) {
          const points = [getScreenPointAtDistance(startPx)];
          let low = 1;
          let high = screenEntries.length - 1;
          while (low < high) {
            const mid = (low + high) >> 1;
            if (screenEntries[mid].distance <= startPx + 0.01) low = mid + 1;
            else high = mid;
          }
          for (let i = low; i < screenEntries.length && screenEntries[i].distance < endPx - 0.01; i++) {
            points.push(screenEntries[i].layerPoint);
          }
          points.push(getScreenPointAtDistance(endPx));
          return points.map(point => map.layerPointToLatLng(point));
        }

        // Засечки рассчитываются индивидуально в экранных координатах:
        // каждая стоит на самой линии и перпендикулярна её локальной касательной.
        // Слои создаются после соответствующего штриха, поэтому остаются поверх него.
        const tickSpecs = [];
        if (segmentSpeedReduced && partScreenLength > 72) {
          const tickSpacing = 64;
          const tickHalfLength = 4.2;

          for (let tickDistance = tickSpacing / 2;
               tickDistance < partScreenLength - 4;
               tickDistance += tickSpacing) {
            const center = getScreenPointAtDistance(tickDistance);
            const before = getScreenPointAtDistance(Math.max(0, tickDistance - 4));
            const after = getScreenPointAtDistance(Math.min(partScreenLength, tickDistance + 4));
            const dx = after.x - before.x;
            const dy = after.y - before.y;
            const tangentLength = Math.hypot(dx, dy);
            if (tangentLength < 0.001) continue;

            const normalX = -dy / tangentLength;
            const normalY = dx / tangentLength;
            const firstEnd = map.layerPointToLatLng(L.point(
              center.x - normalX * tickHalfLength,
              center.y - normalY * tickHalfLength
            ));
            const secondEnd = map.layerPointToLatLng(L.point(
              center.x + normalX * tickHalfLength,
              center.y + normalY * tickHalfLength
            ));
            const tickPosition = map.layerPointToLatLng(center);
            if (isMarkerInsideSettlementMask(tickPosition, 1)) continue;

            tickSpecs.push({
              points: [firstEnd, secondEnd],
              screenDistance: tickDistance
            });
          }
        }

        function addIndividualSpeedTicks(revealDelayForTick = null) {
          tickSpecs.forEach(spec => {
            const tickLayer = L.polyline(spec.points, {
              color: "#60452f",
              weight: 2.8,
              opacity: revealDelayForTick ? 0 : opacity,
              lineCap: "round",
              lineJoin: "round",
              className: "route-speed-tick",
              interactive: false
            }).addTo(map);
            tickLayer._partyPlaybackTokenDistance = partStart +
              (partEnd - partStart) * (spec.screenDistance / Math.max(0.001, partScreenLength));
            window.routeRestMarkers.push(tickLayer);

            if (revealDelayForTick) {
              const tickDelay = revealDelayForTick(spec);
              const revealTick = function() {
                if (map.hasLayer(tickLayer)) tickLayer.setStyle({ opacity });
              };
              if (tickDelay === null || tickDelay <= 0) revealTick();
              else tickLayer._routeTickRevealTimer = setTimeout(revealTick, tickDelay);
            }
          });
        }

        if (!activeAnimation) {
          const line = L.polyline(partDisplayPoints, {
            color: segmentColor,
            weight: 4.5,
            dashArray: "8, 10",
            opacity: opacity,
            lineCap: "round",
            lineJoin: "round",
            className: "route-line-raised"
          }).addTo(map);
          window.routeRestMarkers.push(line);
          registerPartyPlaybackRouteLine(line, partStart, partEnd);
          addIndividualSpeedTicks();
          continue;
        }

        const globalScreenStart = getDisplayScreenDistanceAtDistance(partDisplayStart);
        const elapsed = window.getSynchronizedRouteNow() - activeAnimation.startedAtEpoch;

        // Экранные штрихи могут отличаться числом при разном зуме, но время
        // каждого штриха определяется его долей от всей длины маршрута.
        const firstDashIndex = Math.max(
          0,
          Math.floor((globalScreenStart - activeAnimation.lineStartScreen) / routeLineDashStep)
        );
        const partGlobalScreenEnd = globalScreenStart + partScreenLength;

        for (let dashIndex = firstDashIndex; ; dashIndex++) {
          const dashGlobalStart = activeAnimation.lineStartScreen + dashIndex * routeLineDashStep;
          if (dashGlobalStart >= partGlobalScreenEnd - 0.01) break;

          const dashGlobalEnd = dashGlobalStart + routeLineDashLength;
          const dashStart = Math.max(0, dashGlobalStart - globalScreenStart);
          const dashEnd = Math.min(partScreenLength, dashGlobalEnd - globalScreenStart);
          if (dashEnd - dashStart < 0.5) continue;

          const dashProgress = Math.max(0, Math.min(1,
            (dashGlobalStart - activeAnimation.lineStartScreen) /
            Math.max(1, activeAnimation.lineEndScreen - activeAnimation.lineStartScreen)
          ));
          // После каждого города время штрихов начинается заново,
          // но геометрия и глобальное положение линии остаются прежними.
          const delay = getRouteAnimationRevealTime(activeAnimation, dashProgress) - elapsed;
          const dashPoints = getScreenLinePoints(dashStart, dashEnd);
          if (dashPoints.length < 2) continue;

          const line = L.polyline(dashPoints, {
            color: segmentColor,
            weight: 4.5,
            opacity: 0,
            lineCap: "round",
            lineJoin: "round",
            // Сначала добавляем путь без класса анимации. Класс будет
            // назначен только после установки индивидуальной задержки.
            className: "route-line-raised"
          }).addTo(map);

          // Каждый SVG-штрих раскрывается индивидуально по общей временной шкале.
          const revealDash = function() {
            if (!map.hasLayer(line)) return;
            line.setStyle({ opacity: opacity });
          };

          if (delay <= 0) {
            revealDash();
          } else {
            const revealTimer = setTimeout(revealDash, delay);
            line._routeDashRevealTimer = revealTimer;
          }
          window.routeRestMarkers.push(line);
          const dashRouteStart = partStart + (partEnd - partStart) * (dashStart / Math.max(0.001, partScreenLength));
          const dashRouteEnd = partStart + (partEnd - partStart) * (dashEnd / Math.max(0.001, partScreenLength));
          registerPartyPlaybackRouteLine(line, dashRouteStart, dashRouteEnd);
        }

        if (tickSpecs.length) {
          addIndividualSpeedTicks(spec => {
            const tickGlobalScreen = globalScreenStart + spec.screenDistance;
            const tickDashIndex = Math.max(0, Math.floor(
              (tickGlobalScreen - activeAnimation.lineStartScreen) / routeLineDashStep
            ));
            const tickDashStart = activeAnimation.lineStartScreen + tickDashIndex * routeLineDashStep;
            const tickDashProgress = Math.max(0, Math.min(1,
              (tickDashStart - activeAnimation.lineStartScreen) /
              Math.max(1, activeAnimation.lineEndScreen - activeAnimation.lineStartScreen)
            ));
            return getRouteAnimationRevealTime(activeAnimation, tickDashProgress) - elapsed;
          });
        }
      }
    }

    if (!previewIsActive) {
      addPiece(startDistance, endDistance, committedOpacity);
      return;
    }

    // Весь отрезок уже зафиксирован.
    if (endDistance <= committedLength + 0.001) {
      addPiece(startDistance, endDistance, committedOpacity);
      return;
    }

    // Весь отрезок относится к предпросмотру.
    if (startDistance >= committedLength - 0.001) {
      addPiece(startDistance, endDistance, previewOpacity);
      return;
    }

    // Отрезок пересекает границу между маршрутом и предпросмотром.
    addPiece(startDistance, committedLength, committedOpacity);
    addPiece(committedLength, endDistance, previewOpacity);
  }

  // Рисуем золотые участки, пропуская все чёрные интервалы.
  let goldStart = 0;

  mergedNonGoldIntervals.forEach(interval => {
    if (interval.start > goldStart + 0.001) {
      drawRoutePiece(
        goldStart,
        interval.start,
        "#e2b95f",
        1.0,
        0.22
      );
    }

    goldStart = Math.max(goldStart, interval.end);
  });

  // Последний золотой участок после всех форсированных маршей.
  if (goldStart < totalLength - 0.001) {
    drawRoutePiece(
      goldStart,
      totalLength,
      "#e2b95f",
      1.0,
      0.22
    );
  }

  // Красная линия внутри труднопроходимой местности, кроме форсированного марша.
  terrainRedIntervals.forEach(interval => {
    drawRoutePiece(
      interval.start,
      interval.end,
      "#b4514b",
      1.0,
      0.22
    );
  });

  // Визуал форсированных маршей остаётся на карте и после их завершения.
  forcedVisualSegments.forEach(segment => {
    const boundaryDistance = segment.boundaryDistance;
    if (boundaryDistance > segment.end + 0.01) return;

    const boundaryPosition = getRoutePointAtDistance(pointsToDraw, boundaryDistance);
    if (!boundaryPosition) return;

    // Чёрная линия после разделительной черты —
    // до привала, которым завершился форсированный марш.
    drawRoutePiece(
      boundaryDistance,
      segment.end,
      "#171717",
      1.0,
      0.26
    );

    // Саму отметку границы не создаём, если она попала в маску города.
    // Чёрная линия марша при этом сохраняется и отдельно обрезается визуально.
    if (isMarkerInsideSettlementMask(boundaryPosition, 16)) return;

    // Направление черты всегда перпендикулярно касательной маршрута.
    const angle = getPerpendicularRouteAngle(pointsToDraw, boundaryDistance);
    const boundaryIsPreview =
      previewIsActive && boundaryDistance > committedLength + 0.001;
    const boundaryAnimationDelay =
      getRouteMarkerAnimationDelay(boundaryDistance);
    const boundaryShouldAnimate = boundaryAnimationDelay !== null;

    // Разделительная отметка компактнее на среднем и минимальном зуме;
    // на максимальном сохраняет исходный размер.
    const boundaryZoomScale = 0.72 + 0.28 * getRouteZoomProgress();
    const boundaryWidth = 30 * boundaryZoomScale;
    const boundaryHeight = 4 * boundaryZoomScale;
    const boundaryIconWidth = boundaryWidth + 2;
    const boundaryIconHeight = boundaryHeight + 2;
    const boundaryIcon = L.divIcon({
      className:
        "route-march-boundary" +
        (boundaryIsPreview ? " route-preview-marker" : ""),
      html: `<div class="route-token-appear" style="width:${boundaryWidth}px;height:${boundaryHeight}px;"><div style="width:${boundaryWidth}px;height:${boundaryHeight}px;background:#e6c77d;border:1px solid #211b16;border-radius:1px;transform:rotate(${angle}deg);box-shadow:1px 2px 4px #000;"></div></div>`,
      iconSize: [boundaryIconWidth, boundaryIconHeight],
      iconAnchor: [boundaryIconWidth / 2, boundaryIconHeight / 2]
    });
    const boundaryMarker = L.marker(boundaryPosition, {
      icon: boundaryIcon,
      interactive: false,
      keyboard: false,
      zIndexOffset: 1100
    }).addTo(map);
    if (boundaryShouldAnimate) animateRouteToken(boundaryMarker, boundaryAnimationDelay, ".route-token-appear");
    boundaryMarker._partyPlaybackTokenDistance = boundaryDistance;
    window.routeRestMarkers.push(boundaryMarker);

    // Крестики истощения — каждые 1/8 игрового дня после первой суточной
    // границы форсированного марша, с учётом темпа каждого участка.
    const exhaustionPositions = segment.exhaustionDistances
      .map(distance => ({
        distance,
        position: getRoutePointAtDistance(pointsToDraw, distance)
      }))
      .filter(item => item.position && !isMarkerInsideSettlementMask(item.position, 28));

    // Если при отдалении карты крестики сблизились, объединяем их.
    const exhaustionClusters = getExhaustionMarkerClusters(
      exhaustionPositions,
      28,
      pointsToDraw
    );

    exhaustionClusters.forEach(cluster => {
      const exhaustionIsPreview =
        previewIsActive &&
        cluster.distances.some(distance => distance > committedLength + 0.001);

      const exhaustionAnimationCandidates = cluster.distances
        .map(distance => ({
          distance,
          delay: getRouteMarkerAnimationDelay(distance)
        }))
        .filter(item => item.delay !== null)
        .sort((a, b) => a.delay - b.delay);
      // Сгруппированный крестик представляет сразу несколько точек.
      // Ждём самую позднюю из них, иначе значок может появиться раньше,
      // чем линия дойдёт до фактического положения всей группы.
      const exhaustionAnimationDelay = exhaustionAnimationCandidates.length
        ? exhaustionAnimationCandidates[exhaustionAnimationCandidates.length - 1].delay
        : null;
      const exhaustionShouldAnimate = exhaustionAnimationDelay !== null;

      const countBadge = cluster.count > 1
        ? `<span class="route-exhaustion-count" style="position:absolute;left:50%;top:50%;min-width:${map.getZoom() <= -1.5 ? 13 : 14}px;height:${map.getZoom() <= -1.5 ? 13 : 14}px;padding:0 ${map.getZoom() <= -1.5 ? 1 : 2}px;box-sizing:border-box;border:1px solid #211b16;border-radius:8px;background:#e6c77d;color:#211b16;font:900 ${map.getZoom() <= -1.5 ? 8 : 9}px/${map.getZoom() <= -1.5 ? 11 : 12}px Arial,sans-serif;text-align:center;white-space:nowrap;box-shadow:0 1px 3px #000;transform:translate(-50%,-50%);">${cluster.count}</span>`
        : "";

      const clusterDisplaySize = cluster.count > 1
        ? getExhaustionClusterDisplaySize()
        : 28;
      const exhaustionIcon = L.divIcon({
        className:
          "route-exhaustion-mark" +
          (exhaustionIsPreview ? " route-preview-marker" : ""),
        html: `<div class="route-token-appear" style="width:${clusterDisplaySize}px;height:${clusterDisplaySize}px;"><div class="route-exhaustion-cluster${cluster.count > 1 ? " route-exhaustion-clustered" : ""}" style="position:relative;display:flex;align-items:center;justify-content:center;width:${clusterDisplaySize}px;height:${clusterDisplaySize}px;"><span class="route-exhaustion-glyph" style="display:inline-block;color:#e18a67;font-size:${cluster.count > 1 ? clusterDisplaySize : 28}px;font-weight:900;line-height:${cluster.count > 1 ? clusterDisplaySize : 28}px;-webkit-text-stroke:1.4px #211b16;paint-order:stroke fill;text-shadow:0px 1px 1px #000,1px 2px 3px #000;">×</span>${countBadge}</div></div>`, 
        iconSize: [clusterDisplaySize, clusterDisplaySize],
        iconAnchor: [clusterDisplaySize / 2, clusterDisplaySize / 2]
      });
      const marker = L.marker(cluster.position, {
        icon: exhaustionIcon,
        interactive: false,
        keyboard: false,
        zIndexOffset: 1100
      }).addTo(map);
      if (exhaustionShouldAnimate) animateRouteToken(marker, exhaustionAnimationDelay, ".route-token-appear");
      marker._partyPlaybackTokenDistance = Math.max(...cluster.distances);
      window.routeRestMarkers.push(marker);
    });
  });

  // Обычные привалы рисуем после всех линий и отметок,
  // чтобы они всегда оставались поверх маршрута.
  restDistancesToDraw.forEach(distance => {
    if (distance > totalLength + 0.01) return;

    const position = getRoutePointAtDistance(pointsToDraw, distance);
    if (!position) return;

    const restIsPreview =
      previewIsActive && distance > committedLength + 0.001;
    const restAnimationDelay = getRouteMarkerAnimationDelay(distance);
    const restShouldAnimate = restAnimationDelay !== null;

    // Жетон немного крупнее при максимальном приближении и компактнее
    // при максимальном отдалении; изменение плавное между крайними зумами.
    const restZoomProgress = getRouteZoomProgress();
    const restMarkerRadius = 7 * (0.92 + 0.14 * restZoomProgress);
    const marker = L.circleMarker(position, {
      pane: "route-rest-pane",
      radius: restMarkerRadius,
      color: "#211b16",
      weight: 2,
      fillColor: isPointInsideTerrain(position) ? "#b4514b" : "#e6c77d",
      fillOpacity: restIsPreview ? 0.72 : 1,
      opacity: restIsPreview ? 0.78 : 1,
      interactive: false,
      className:
        "route-rest-raised" +
        (restIsPreview ? " route-preview-marker" : "")
    }).addTo(map);

    if (restShouldAnimate) animateRouteToken(marker, restAnimationDelay);

    // Привал находится в отдельном слое выше крестиков.
    marker.bringToFront();
    marker._partyPlaybackTokenDistance = distance;
    marker._partyPlaybackRestStop = true;
    window.routeRestMarkers.push(marker);
  });

    const flagAnimation = getRouteMarkerAnimation(routeEndDistance);
    const flagAnimationDelay = flagAnimation
      ? getRouteMarkerAnimationDelay(routeEndDistance)
      : null;
    const flagAnimationElapsed = flagAnimation
      ? performance.now() - flagAnimation.startedAt
      : Infinity;
    const flagAnimationDuration = 520;
    const flagShouldAnimate = Boolean(
      flagAnimation &&
      flagAnimationDelay > -flagAnimationDuration
    );
    // При отдалении карты флаг сохраняет почти максимальный размер
    // (от 95% до 100%), чтобы не теряться среди остальных элементов.

    const flagHeight = 55 * flagScale;
