      area => String(area.id) === String(window.routeDestinationCityId)
    );
    if (destinationArea && window.hideRouteDashesInsideSettlement) {
      window.hideRouteDashesInsideSettlement(destinationArea);
    }
  } else if (window.routeMode && cursorPosition && window.previewSettlementAt) {
    window.previewSettlementAt(cursorPosition);
  }

  // Дополнительно подсвечиваем города, через которые маршрут пройдёт
  // автоматически. Эти контуры существуют только в предпросмотре и исчезают
  // либо пересчитываются при следующем движении курсора.
  clearRouteAutoPreviewBrushes();
  if (automaticPreviewIds.length) {
    automaticPreviewIds.forEach(id => {
      const area = allSettlementAreas.find(item => String(item.id) === String(id));
      if (!area) return;
      routeAutoPreviewBrushLayers.push(...createSettlementDryBrushLayers(area, 0.76));
    });
  }

  // Затем накладываем маски выбранных поселений и городов,
  // которые маршрут только предварительно пересекает.
  // Линия физически проходит через них, но не отображается внутри
  // визуальной кисти; жетоны отфильтрованы по тем же областям выше.
  if (window.hideRouteDashesInsideSettlement) {
    const maskedAreas = settlementMaskAreas;
    maskedAreas.forEach(area => {
      window.hideRouteDashesInsideSettlement(area, true);
    });
  }

  // После перестроения подтверждённого маршрута восстанавливаем уже
  // пройденную часть линии, если отряд находится на паузе или в пути.
  if (!window.routeMode && !window.routePendingConfirmation &&
      window.partyPlaybackState && window.partyPlaybackState.routeStartedAt &&
      Number(window.partyPlaybackState.routeStartedAt) === Number(window.routePlaybackRouteStartedAt)) {
    updatePartyPlaybackRouteLine(
      window.getPartyPlaybackDistance(window.partyPlaybackState, window.getSynchronizedRouteNow())
    );
  }
  // Геометрия текущего маршрута и SVG-штрихи уже созданы — теперь касательная
  // вычисляется по правильной линии и запускается единственный начальный поворот.
  window.startPartyInitialTurnAfterRouteRedraw();

  console.log("Длина маршрута:", Math.round(totalLength));
}

// Доступ к перерисовке из обработчиков, находящихся во вложенной области.
window.updateRouteLine = updateRouteLine;

// Применение подтверждённого маршрута, полученного из Firebase.
// Эта функция вызывается одинаково на всех подключённых клиентах.
window.applySynchronizedPartyRoute = function(data) {
  if (!data || !Array.isArray(data.points) || data.points.length < 2) return;
  stopRouteMarkerAnimation();
  routePace = data.pace || "normal";
  routeSpeedReduced = Boolean(data.speedReduced);
  routePoints = data.points.map((point, index) => {
    const routePoint = L.latLng(Number(point.lat), Number(point.lng));
    if (index > 0 && point.segmentMode) {
      setRouteSegmentMode(routePoint, point.segmentMode, point.settlementId || null);
    }
    if (index > 0) {
      window.applyRouteTravelSettings(
        routePoint,
        point.segmentPace || routePace,
        point.segmentSpeedReduced !== undefined ? point.segmentSpeedReduced : routeSpeedReduced
      );
    }
    return routePoint;
  });
  routeRestElapsedCarryUnits = Math.max(0, Math.min(0.999999, Number(data.restElapsedCarryUnits) || 0));
  routeRestResetDistances = Array.isArray(data.restResetDistances)
    ? data.restResetDistances.map(Number).filter(distance => Number.isFinite(distance) && distance > 0.001).sort((a, b) => a - b)
    : [];
  routeForcedMarch = Boolean(data.forcedMarch);
  routeForcedMarchStartDistance = Number(data.forcedMarchStartDistance) || 0;
  routeForcedMarchStartUnits = Number(data.forcedMarchStartUnits) || 0;
  routeForcedMarchEpochStartDistance = Number(data.forcedMarchEpochStartDistance) || 0;
  routeForcedMarchPendingExit = Boolean(data.forcedMarchPendingExit);
  const legacyDailyLimit = routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);
  routeForcedSegments = (Array.isArray(data.forcedSegments) ? data.forcedSegments : [])
    .map(segment => {
      const distances = getForcedSegmentDistances(segment, legacyDailyLimit);
      return {
        start: distances.start,
        end: distances.end,
        startUnits: distances.startUnits,
        fixed: true
      };
    });
  routeFinished = true;
  window.routeMode = false;
  window.routeEditingConfirmedRoute = false;
  window.routeAnimationPublished = true;
  window.routePlaybackRouteStartedAt = Number(data.startedAt) || null;
  window.routePlaybackAnimationStartDistance = 0;
  window.routePendingConfirmation = false;
  window.routeDestinationCityId = data.destinationSettlementId || null;
  // Сбрасываем порог прошлого маршрута; новый точный порог будет рассчитан
  // ниже по фактической точке контакта с видимой кистью.
  window.routeTerminalMarkerHideDistance = null;
  window.routeDestinationBoundaryPoint = data.destinationBoundaryPoint
    ? L.latLng(data.destinationBoundaryPoint.lat, data.destinationBoundaryPoint.lng) : null;
  window.routeDestinationApproachPoint = data.destinationApproachPoint
    ? L.latLng(data.destinationApproachPoint.lat, data.destinationApproachPoint.lng) : null;
  window.routeIntermediateCityIds = Array.isArray(data.intermediateSettlementIds)
    ? data.intermediateSettlementIds.map(id => String(id)) : [];
  window.routeEditorOriginTerminalSnapshot = null;
  window.routeStartCityOutlineClearedFor = null;
  if (partyMarker) setPartyMarkerVisible(!isPartyMarkerInsideSettlementTransit(0));
  // Убираем статичные обводки выбранных промежуточных городов.
  // Они должны появляться только как анимация, когда линия маршрута
  // действительно доходит до соответствующей точки входа.
  clearRouteIntermediateCityOutlines();
  lastCursorPosition = null;

  if (routePanel) routePanel.style.display = "none";
  createRouteLaunchPanel();
  routeLaunchPanel.style.display = "block";
  map.doubleClickZoom.enable();
  // Не доводим обводку конечного города до статичного состояния здесь:
  // она должна запускаться из waitForRouteRevealThenTraceSettlements,
  // когда анимация линии маршрута действительно достигает видимой границы.
  if (window.clearSettlementOutline) window.clearSettlementOutline();

  const total = getRouteTravelLength(routePoints);
  const rawAnimationStartIndex = Number(data.animationStartIndex);
  const animationStartIndex = Number.isFinite(rawAnimationStartIndex)
    ? Math.max(0, Math.min(routePoints.length, Math.floor(rawAnimationStartIndex))) : 0;
  const fallbackAnimationStartDistance = animationStartIndex >= routePoints.length
    ? total
    : getRouteTravelLength(routePoints.slice(0, Math.max(1, animationStartIndex + 1)));
  const suppliedAnimationStartDistance = Number(data.animationStartDistance);
  const animationStartDistance = Number.isFinite(suppliedAnimationStartDistance)
    ? Math.max(0, Math.min(total, suppliedAnimationStartDistance))
    : fallbackAnimationStartDistance;
  if (total - animationStartDistance > 0.001) {
    beginRouteMarkerAnimation(
      animationStartDistance,
      total,
      Number(data.startedAt) > 0 ? Number(data.startedAt) : null,
      Number(data.durationMs) > 0 ? Number(data.durationMs) : null
    );
  }
  // Начальный разворот запускается после updateRouteLine(): только тогда
  // экранная геометрия уже принадлежит новому маршруту, а не предыдущему.
  window.routePlaybackAnimationStartDistance = animationStartDistance;
  lastConfirmedRoutePointSnapshot = routePoints.map((point, index) => ({
    lat: Number(point.lat),
    lng: Number(point.lng),
    segmentMode: index > 0 ? getRouteSegmentMode(point) : "normal",
    settlementId: point._routeSettlementId || null,
    ...getRoutePointTravelSettingsSnapshot(point, index)
  }));
  // Перерисовка выполняется вызывающей стороной после подготовки
  // остановок на обводку промежуточных городов.
  console.log("Получен общий маршрут:", data);
};

// Если Firebase успел прислать маршрут до объявления этой функции,
// забираем его из общего window-хранилища. Локальные переменные ES-модуля
// недоступны из этого обычного скрипта.
if (window.pendingSharedRouteData) {
  const pendingData = window.pendingSharedRouteData;
  delete window.pendingSharedRouteData;
  window.applySynchronizedPartyRoute(pendingData);
  if ((Array.isArray(pendingData.intermediateSettlementIds) && pendingData.intermediateSettlementIds.length) || pendingData.destinationSettlementId) {
    waitForRouteRevealThenTraceSettlements(pendingData);
  }
  window.updateRouteLine(null);
  const movementToRestore = pendingData.movement ||
    window.pendingSharedPartyMovement || window.partyPlaybackState;
  if (movementToRestore && typeof window.applyPartyPlaybackState === "function" &&
      Number(movementToRestore.routeStartedAt) === Number(window.routePlaybackRouteStartedAt)) {
    window.applyPartyPlaybackState(movementToRestore);
    window.pendingSharedPartyMovement = null;
  }
  if (pendingData.restoreStaticSettlementOutlines) {
    requestAnimationFrame(() => {
      if (typeof window.restoreStaticSettlementOutlinesAfterReload === "function") {
        window.restoreStaticSettlementOutlinesAfterReload(movementToRestore);
      }
    });
  }
}

// =====================================
// ДОБАВЛЕНИЕ ТОЧКИ МАРШРУТА
// =====================================

// Находит первое пересечение строящегося участка с фактической границей
// ещё не выбранного поселения. Проверяем именно area.points, а не внешнюю
// сухую кисть: она остаётся только визуальной обводкой.
function findFirstAutomaticSettlementCrossing(path, excludedSettlementId = null) {
  if (!Array.isArray(path) || path.length < 2) return null;
  const selectedIds = new Set((Array.isArray(window.routeIntermediateCityIds)
    ? window.routeIntermediateCityIds : []).map(id => String(id)));
  const areas = (Array.isArray(window.settlementAreas) ? window.settlementAreas : [])
    .filter(area => area && area.id != null && !selectedIds.has(String(area.id)) &&
      (excludedSettlementId == null || String(area.id) !== String(excludedSettlementId)) &&
      Array.isArray(area.points) && area.points.length >= 3);

  let best = null;
  for (let segmentIndex = 1; segmentIndex < path.length; segmentIndex++) {
    const start = path[segmentIndex - 1];
    const end = path[segmentIndex];
    if (!start || !end) continue;
    const a = map.latLngToLayerPoint(start);
    const b = map.latLngToLayerPoint(end);
    const rx = b.x - a.x;
    const ry = b.y - a.y;
    if (rx * rx + ry * ry < 0.0001) continue;

    for (const area of areas) {
      if (pointInSettlement(start, area.points)) continue;
      let firstT = Infinity;
      let firstPoint = null;
      for (let edge = 0; edge < area.points.length; edge++) {
        const p1 = map.latLngToLayerPoint(area.points[edge]);
        const p2 = map.latLngToLayerPoint(area.points[(edge + 1) % area.points.length]);
        const sx = p2.x - p1.x;
        const sy = p2.y - p1.y;
        const denominator = rx * sy - ry * sx;
        if (Math.abs(denominator) < 0.000001) continue;
        const qx = p1.x - a.x;
        const qy = p1.y - a.y;
        const t = (qx * sy - qy * sx) / denominator;
        const u = (qx * ry - qy * rx) / denominator;
        if (t <= 0.00001 || t > 1.000001 || u < -0.000001 || u > 1.000001 || t >= firstT) continue;
        firstT = t;
        firstPoint = map.layerPointToLatLng(L.point(a.x + rx * t, a.y + ry * t));
      }
      if (!firstPoint) continue;
      if (!best || segmentIndex < best.segmentIndex ||
          (segmentIndex === best.segmentIndex && firstT < best.t) ||
          (segmentIndex === best.segmentIndex && Math.abs(firstT - best.t) < 0.000001 &&
            polygonArea(area.points) < polygonArea(best.area.points))) {
        best = { area, point: firstPoint, segmentIndex, t: firstT };
      }
    }
    // Первый сегмент пути, на котором есть поселение, всегда ближе
    // последующих сегментов; дальше искать нужно только для выбора между ними.
    if (best && best.segmentIndex === segmentIndex) break;
  }
  return best;
}

window.addPartyRoutePoint = function(
  latlng,
  automaticDepth = 0,
  segmentPace = routePace,
  segmentSpeedReduced = routeSpeedReduced
) {
  if (window.routeEditingConfirmedRoute) {
    routeFinished = false;
    window.routeEditingConfirmedRoute = false;
    window.routePendingConfirmation = false;
    if (window.routeDestinationCityId) {
      window.routeDestinationCityId = null;
      window.routeDestinationBoundaryPoint = null;
      window.routeDestinationApproachPoint = null;
      if (window.clearSettlementOutline) window.clearSettlementOutline();
    }
  }
  if (automaticDepth > 20) {
    console.warn("Автоматическое добавление поселений остановлено: слишком много пересечений.");
    return false;
  }
  const previousPoint = routePoints[routePoints.length - 1];
  const segment = previousPoint
    ? getRouteSegmentAroundIntermediateCities(previousPoint, latlng)
    : [latlng];

  if (!segment || segment.length < 2) {
    console.warn("Не удалось построить обход промежуточного города.");
    return false;
  }

  // Если прямая или обходной участок пересекает фактическую границу
  // нового поселения, автоматически выполняем ту же операцию, что и
  // одиночный клик по его обводке: подводим маршрут к центру и продолжаем.
  const crossing = findFirstAutomaticSettlementCrossing(segment);
  if (crossing) {
    const id = String(crossing.area.id);
    const wasSelected = (window.routeIntermediateCityIds || [])
      .some(existingId => String(existingId) === id);
    activateIntermediateRouteCity(crossing.area, crossing.point, segmentPace, segmentSpeedReduced);
    const isSelected = (window.routeIntermediateCityIds || [])
      .some(existingId => String(existingId) === id);
    if (!wasSelected && isSelected) {
      return window.addPartyRoutePoint(
        latlng, automaticDepth + 1, segmentPace, segmentSpeedReduced
      );
    }
    // Если центр поселения не задан или добавить его не удалось,
    // не прокладываем маршрут сквозь город молча.
    return false;
  }

  // Нажатие ЛКМ фиксирует весь новый путь до выбранной точки с текущими
  // настройками. Все ранее добавленные точки сохраняют свои параметры.
  const committedSegment = segment.slice(1);
  committedSegment.forEach(point => window.applyRouteTravelSettings(
    point, segmentPace, segmentSpeedReduced
  ));
  routePoints.push(...committedSegment);

  if (routeForcedMarch && routeForcedMarchPendingExit && !getLastPointAtSettlementCenter(routePoints)) {
    routeForcedMarchPendingExit = false;
    routeForcedMarchEpochStartDistance = getLastSettlementTransitEndDistance(routePoints);
    window.routeForcedMarchStartDistance = window.routeForcedMarchEpochStartDistance;
    routeForcedMarchStartUnits = 0;
  }

  lastCursorPosition = null;
  updateRouteLine(null, true);
  console.log("Точки маршрута:", routePoints);
  return true;
};

// =====================================
// ОБРАБОТКА КЛИКОВ И ЗАВЕРШЕНИЕ МАРШРУТА
// =====================================

// Завершение построения маршрута
function finishPartyRoute(latlng) {
  const previousLength = getRouteLength(routePoints);

  // Финальный участок также прокладывается в обход уже выбранных
  // промежуточных городов. Сам конечный город в этот список не входит.
  const lastPoint = routePoints[routePoints.length - 1];
  if (
    !lastPoint ||
    map.latLngToContainerPoint(lastPoint)
      .distanceTo(map.latLngToContainerPoint(latlng)) > (window.routeDestinationCityId ? 0.05 : 3)
  ) {
    if (!window.routeDestinationCityId) {
      if (!window.addPartyRoutePoint(latlng)) return;
    } else {
      const finalSegment = lastPoint
        ? getRouteSegmentAroundIntermediateCities(lastPoint, latlng)
        : [latlng];
      if (!finalSegment || finalSegment.length < 2) {
        console.warn("Не удалось построить финальный участок маршрута.");
        return;
      }
      const committedFinalSegment = finalSegment.slice(1);
      committedFinalSegment.forEach(point => window.applyRouteTravelSettings(point));
      routePoints.push(...committedFinalSegment);
      if (routeForcedMarch && routeForcedMarchPendingExit && !getLastPointAtSettlementCenter(routePoints)) {
        routeForcedMarchPendingExit = false;
        routeForcedMarchEpochStartDistance = getLastSettlementTransitEndDistance(routePoints);
        routeForcedMarchStartDistance = routeForcedMarchEpochStartDistance;
        routeForcedMarchStartUnits = 0;
      }
    }
  }

  // Маршрут должен содержать хотя бы одну линию
  if (routePoints.length < 2) {
    console.log("Для завершения маршрута нужна хотя бы одна точка");
    return;
  }

  // До подтверждения маршрут остаётся статичным предпросмотром.
  routeFinished = true;
  window.routeEditingConfirmedRoute = false;
  window.routeMode = false;
  window.routePendingConfirmation = true;

  lastCursorPosition = null;

  // Не включаем двойной клик для приближения до подтверждения или отмены.
  // Иначе завершающий двойной клик сам же успевает приблизить карту.
  map.doubleClickZoom.disable();

  updateRouteLine(null, true);

  // Завершение у города повторно обрезает только конечное поселение,
  // сохраняя маски промежуточных городов, уже применённые updateRouteLine.
  // Без preserveExisting=false функция восстанавливала исходную геометрию
  // всех линий и тем самым показывала их внутри предыдущих поселений.
  if (window.routeDestinationCityId) {
    const destinationArea = (Array.isArray(window.settlementAreas) ? window.settlementAreas : [])
      .find(area => String(area.id) === String(window.routeDestinationCityId));
    if (destinationArea) hideRouteDashesInsideSettlement(destinationArea, true);
  }

  console.log("Маршрут завершён:", routePoints);
}

// Перед выбором конечного поселения последовательно добавляем все
// ещё не выбранные поселения, которые маршрут пересечёт по пути к нему.
// Само целевое поселение исключаем: оно будет обработано отдельно как
// промежуточное (одиночный клик) или конечное (двойной клик).
function addInterveningSettlementsBeforeTarget(
  targetArea, targetPoint, segmentPace = routePace,
  segmentSpeedReduced = routeSpeedReduced
) {
  if (!targetArea || !targetPoint) return;
  for (let pass = 0; pass < 20; pass++) {
    const lastPoint = routePoints[routePoints.length - 1];
    if (!lastPoint) return;
    const candidatePath = getRouteSegmentAroundIntermediateCities(lastPoint, targetPoint);
    if (!candidatePath || candidatePath.length < 2) return;
    const crossing = findFirstAutomaticSettlementCrossing(candidatePath, targetArea.id);
    if (!crossing) return;
    const beforeCount = routePoints.length;
    activateIntermediateRouteCity(
      crossing.area, crossing.point, segmentPace, segmentSpeedReduced
    );
    if (routePoints.length <= beforeCount) return;
  }
}

// Обработка одиночного и двойного клика
window.handlePartyRouteClick = function(latlng) {
  if (!window.routeMode || (routeFinished && !window.routeEditingConfirmedRoute)) return;
  const clickPace = routePace;
  const clickSpeedReduced = routeSpeedReduced;
  if (window.routeEditingConfirmedRoute) {
    routeFinished = false;
    window.routeEditingConfirmedRoute = false;
    window.routePendingConfirmation = false;
    if (window.routeDestinationCityId) {
      window.routeDestinationCityId = null;
      window.routeDestinationBoundaryPoint = null;
      window.routeDestinationApproachPoint = null;
      if (window.clearSettlementOutline) window.clearSettlementOutline();
    }
  }

  const clickedArea = findSettlementAt(latlng);

  // Если ожидается одиночный клик, второй клик рядом завершает маршрут.
  if (pendingRouteClickTimer) {
    const firstPoint = map.latLngToContainerPoint(pendingRouteClickPosition);
    const secondPoint = map.latLngToContainerPoint(latlng);
    const distance = firstPoint.distanceTo(secondPoint);

    if (distance <= 30) {
      clearTimeout(pendingRouteClickTimer);
      pendingRouteClickTimer = null;
      pendingRouteClickPosition = null;
      pendingRouteClickPace = null;
      pendingRouteClickSpeedReduced = null;

      // Двойной клик по городу — прежний способ завершить маршрут у города.
      if (clickedArea && routePoints.length > 0) {
        addInterveningSettlementsBeforeTarget(
          clickedArea, latlng, clickPace, clickSpeedReduced
        );
        const approachPoint = routePoints[routePoints.length - 1];
        const boundary = findNearestSettlementBoundaryPoint(
          approachPoint,
          clickedArea.points
        );

        if (boundary) {
          // Если город уже был отмечен промежуточным, теперь он становится
          // конечным: его больше нельзя обходить как препятствие.
          window.routeIntermediateCityIds = (
            Array.isArray(window.routeIntermediateCityIds)
              ? window.routeIntermediateCityIds : []
          ).filter(id => String(id) !== String(clickedArea.id));
          refreshRouteIntermediateCityOutlines();

          window.routeDestinationCityId = clickedArea.id;
          window.routeDestinationBoundaryPoint = boundary.point;
          window.routeDestinationApproachPoint = approachPoint;

          // Конечный город получает тот же трёхэтапный хвост, что и
          // промежуточный: подход до внешней кисти, скрытый переход до
          // фактической границы и нулевая контрольная точка в центре.
          const visualContact = getVisualBrushContact(clickedArea, approachPoint, boundary.point);
          const visualEntryPoint = visualContact
            ? visualContact.routePoint
            : findNearestRoutePointOnSettlementBrush(approachPoint, clickedArea);
          if (visualEntryPoint && clickedArea.center &&
              Number.isFinite(Number(clickedArea.center.lat)) &&
              Number.isFinite(Number(clickedArea.center.lng))) {
            const approachPath = getRouteSegmentAroundIntermediateCities(
              routePoints[routePoints.length - 1], visualEntryPoint
            );
            if (approachPath && approachPath.length >= 2) {
              approachPath.slice(1).forEach(point => {
                routePoints.push(window.applyRouteTravelSettings(point, clickPace, clickSpeedReduced));
              });
              const outerEntry = routePoints[routePoints.length - 1];
              const transitStart = window.copyRoutePointMetadata(
                outerEntry, L.latLng(outerEntry.lat, outerEntry.lng)
              );
              window.setRouteSegmentMode(transitStart, "settlement-count-only", clickedArea.id);
              routePoints.push(window.applyRouteTravelSettings(transitStart, clickPace, clickSpeedReduced));
              routePoints.push(window.applyRouteTravelSettings(window.setRouteSegmentMode(
                L.latLng(boundary.point.lat, boundary.point.lng),
                "settlement-count-only", clickedArea.id
              ), clickPace, clickSpeedReduced));
              routePoints.push(window.applyRouteTravelSettings(window.setRouteSegmentMode(
                L.latLng(Number(clickedArea.center.lat), Number(clickedArea.center.lng)),
                "settlement-zero", clickedArea.id
              ), clickPace, clickSpeedReduced));
            }
          }

          try {
            if (window.showSettlementOutline) {
              window.showSettlementOutline(clickedArea, 1);
            }
          } catch (outlineError) {
            console.error("Ошибка отображения обводки поселения:", outlineError);
          }

          const finalRoutePoint = routePoints[routePoints.length - 1];
          finishPartyRoute(finalRoutePoint || boundary.point);
          console.log("Маршрут завершён у поселения:", clickedArea.type, clickedArea.id);
          return;
        }
      }

      // Двойной клик вне города завершает маршрут в указанной точке.
      finishPartyRoute(latlng);
      return;
    }

    // Второй клик далеко от первого: сначала фиксируем первый.
    clearTimeout(pendingRouteClickTimer);
    const previousPosition = pendingRouteClickPosition;
    const previousPace = pendingRouteClickPace || routePace;
    const previousSpeedReduced = pendingRouteClickSpeedReduced !== null
      ? pendingRouteClickSpeedReduced : routeSpeedReduced;
    const previousArea = findSettlementAt(previousPosition);
    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
    pendingRouteClickPace = null;
    pendingRouteClickSpeedReduced = null;

    if (previousArea) {
      activateIntermediateRouteCity(
        previousArea, previousPosition, previousPace, previousSpeedReduced
      );
    } else {
      window.addPartyRoutePoint(previousPosition, 0, previousPace, previousSpeedReduced);
    }
  }

  // Ожидаем второй клик ровно 180 мс.
  pendingRouteClickPosition = latlng;
  pendingRouteClickPace = clickPace;
  pendingRouteClickSpeedReduced = clickSpeedReduced;
  pendingRouteClickTimer = setTimeout(function() {
    const position = pendingRouteClickPosition;
    const segmentPace = pendingRouteClickPace || routePace;
    const segmentSpeedReduced = pendingRouteClickSpeedReduced !== null
      ? pendingRouteClickSpeedReduced : routeSpeedReduced;
    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
    pendingRouteClickPace = null;
    pendingRouteClickSpeedReduced = null;

    if (!position || !window.routeMode || routeFinished) return;

    const area = findSettlementAt(position);
    if (area) {
      // Сначала обрабатываем другие поселения, которые маршрут пересечёт
      // раньше выбранного города, затем добавляем сам выбранный город.
      addInterveningSettlementsBeforeTarget(
        area, position, segmentPace, segmentSpeedReduced
      );
      // Одиночный клик по городу делает его промежуточным препятствием,
      // но не завершает маршрут и не добавляет фиктивную точку внутрь города.
      activateIntermediateRouteCity(area, position, segmentPace, segmentSpeedReduced);
    } else {
      window.addPartyRoutePoint(position, 0, segmentPace, segmentSpeedReduced);
    }
  }, 180);
};

// Движение курсора на ПК.
// Схлопываем частые mousemove-события в один рендер на кадр браузера:

let routePreviewFramePending = false;
map.on("mousemove", function(e) {

 // =====================================
  // НЕВИДИМЫЕ ОБЛАСТИ ГОРОДОВ И ДЕРЕВЕНЬ

  function pointInSettlement(point, polygon) {
    const x = point.lng;
    const y = point.lat;
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const xi = polygon[i].lng, yi = polygon[i].lat;
      const xj = polygon[j].lng, yj = polygon[j].lat;
      const intersects = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / ((yj - yi) || 0.0000001) + xi);
      if (intersects) inside = !inside;
    }
    return inside;
  }

  function findSettlementAt(point) {
    // Поиск области не должен ломаться, если Firebase ещё не загрузил список.
    const areas = Array.isArray(window.settlementAreas) ? window.settlementAreas : [];
    // Если области пересекаются, выбираем самую маленькую: это наиболее
    // конкретное поселение, в которое попал курсор.
    const matches = areas.filter(area =>
      Array.isArray(area.points) && area.points.length >= 3 &&
      pointInSettlement(point, area.points)
    );
    if (!matches.length) return null;
    return matches.sort((a, b) => polygonArea(a.points) - polygonArea(b.points))[0];
  }

  function polygonArea(points) {
    let area = 0;
    for (let i = 0; i < points.length; i++) {
      const next = points[(i + 1) % points.length];
      area += points[i].lng * next.lat - next.lng * points[i].lat;
    }
    return Math.abs(area / 2);
  }

  function findNearestSettlementBoundaryPoint(origin, polygon) {
    if (!polygon || polygon.length < 3) return null;
    const originPoint = map.latLngToLayerPoint(origin);
    let best = null;
    let bestDistance = Infinity;

    for (let i = 0; i < polygon.length; i++) {
      const a = map.latLngToLayerPoint(polygon[i]);
      const b = map.latLngToLayerPoint(polygon[(i + 1) % polygon.length]);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const lengthSquared = dx * dx + dy * dy;
      const t = lengthSquared > 0
        ? Math.max(0, Math.min(1, ((originPoint.x - a.x) * dx + (originPoint.y - a.y) * dy) / lengthSquared))
        : 0;
      const projected = L.point(a.x + t * dx, a.y + t * dy);
      const distance = originPoint.distanceTo(projected);
      if (distance < bestDistance) {
        bestDistance = distance;
        best = {
          point: map.layerPointToLatLng(projected),
          segmentIndex: i,
          segmentT: t
        };
      }
    }
    return best;
  }

  // Единый расчёт открытого контура поселения. Не зависит от внешних
  // диагностических функций: начинает с ближайшей точки границы и обходит
  // исходный полигон в направлении движения к границе.
  function getOpenSettlementContour(area, startPoint, approachPoint) {
    if (!area || !Array.isArray(area.points) || area.points.length < 3 || !startPoint) return [];
    const boundary = findNearestSettlementBoundaryPoint(startPoint, area.points);
    if (!boundary || !boundary.point) return [];

    const points = area.points;
    const count = points.length;
    const segment = boundary.segmentIndex;
    const start = boundary.point;
    const startPx = map.latLngToLayerPoint(start);
    // Для финального построения направление берём из последнего участка маршрута,
    // а не из нулевого вектора от граничной точки к самой себе.
    const approach = map.latLngToLayerPoint(approachPoint || startPoint);
    const incoming = L.point(startPx.x - approach.x, startPx.y - approach.y);
    const a = map.latLngToLayerPoint(points[segment]);
    const b = map.latLngToLayerPoint(points[(segment + 1) % count]);
    const tangent = L.point(b.x - a.x, b.y - a.y);
    const direction = incoming.x * tangent.x + incoming.y * tangent.y >= 0 ? 1 : -1;

    const contour = [start];
    if (direction > 0) {
      for (let step = 1; step <= count; step++) contour.push(points[(segment + step) % count]);
    } else {
      for (let step = 0; step < count; step++) contour.push(points[(segment - step + count) % count]);
    }

    const layerPoints = contour.map(point => map.latLngToLayerPoint(point));
    const lengths = [];
    let total = 0;
    for (let i = 1; i < layerPoints.length; i++) {
      const len = layerPoints[i - 1].distanceTo(layerPoints[i]);
      lengths.push(len);
      total += len;
    }
    if (total < 1) return [];

    // Оставляем небольшой разрыв: росчерк не замыкает окружность.
    const target = total * 0.88;
    let used = 0;
    const result = [contour[0]];
    for (let i = 0; i < lengths.length; i++) {
      const len = lengths[i];
      if (used + len <= target) {
        result.push(contour[i + 1]);
        used += len;
      } else {
        const t = Math.max(0, Math.min(1, (target - used) / Math.max(len, 0.0001)));
        const a = layerPoints[i], b = layerPoints[i + 1];
        result.push(map.layerPointToLatLng(L.point(a.x + (b.x-a.x)*t, a.y + (b.y-a.y)*t)));
        break;
      }
    }
    return result;
  }

  // Контур теперь детерминированный: один и тот же отступ для каждого
  // поселения, без случайных профилей и повторной генерации при движении мыши.
  const SETTLEMENT_OUTWARD_OFFSET = 18; // CSS-пиксели
  let settlementContourVariant = null;

  function makeRandomizedSettlementContour(area, startPoint, approachPoint) {
    const base = getOpenSettlementContour(area, startPoint, approachPoint);
    if (!base || base.length < 2) return [];

    let signedArea = 0;
    const polygon = area.points;
    for (let i = 0; i < polygon.length; i++) {
      const a = map.latLngToLayerPoint(polygon[i]);
      const b = map.latLngToLayerPoint(polygon[(i + 1) % polygon.length]);
      signedArea += a.x * b.y - b.x * a.y;
    }
    const outwardSign = signedArea >= 0 ? 1 : -1;
    let travelled = 0;
    return base.map((point, i) => {
      const pixel = map.latLngToLayerPoint(point);
      if (i > 0) travelled += pixel.distanceTo(map.latLngToLayerPoint(base[i - 1]));
      const prev = map.latLngToLayerPoint(base[Math.max(0, i - 1)]);
      const next = map.latLngToLayerPoint(base[Math.min(base.length - 1, i + 1)]);
      const dx = next.x - prev.x, dy = next.y - prev.y;
      const magnitude = Math.sqrt(dx*dx + dy*dy) || 1;
      const nx = (dy / magnitude) * outwardSign;
      const ny = (-dx / magnitude) * outwardSign;
      // Начальная точка остаётся точно в месте касания маршрута;
      // далее контур плавно выходит на постоянный экранный отступ.
      const ramp = Math.min(1, travelled / 22);
      const offset = SETTLEMENT_OUTWARD_OFFSET * ramp;
      return map.layerPointToLatLng(L.point(pixel.x + nx*offset, pixel.y + ny*offset));
    });
  }

  function getSettlementContourVariant(area, startPoint, approachPoint, forceNew) {
    if (!area) return [];
    const needsNew = forceNew || !settlementContourVariant ||
      String(settlementContourVariant.areaId) !== String(area.id);
    if (needsNew) {
      const path = makeRandomizedSettlementContour(area, startPoint, approachPoint);
      settlementContourVariant = { areaId: area.id, path, startPoint, approachPoint };
    }
    return settlementContourVariant.path || [];
  }

  // Толщина совпадает с обычной пунктирной линией маршрута (4.5 CSS px).
  // Геометрия ленты строится в экранных координатах, поэтому ширина
  // остаётся визуально постоянной при любом масштабе карты.
  const SETTLEMENT_TRACE_BASE_WIDTH = 4.5;

  function makeTaperedSettlementPolygon(latlngs, maxWidth, opacity) {
    if (!latlngs || latlngs.length < 2) return null;
    const pts = latlngs.map(ll => map.latLngToLayerPoint(ll));
    const left = [], right = [];
    const baseWidth = Number.isFinite(maxWidth) ? maxWidth : SETTLEMENT_TRACE_BASE_WIDTH;
    for (let i = 0; i < pts.length; i++) {
      const prev = pts[Math.max(0, i - 1)];
      const next = pts[Math.min(pts.length - 1, i + 1)];
      let dx = next.x - prev.x, dy = next.y - prev.y;
      const mag = Math.sqrt(dx*dx + dy*dy) || 1;
      const nx = -dy / mag, ny = dx / mag;
      const t = i / Math.max(1, pts.length - 1);

      // До середины сохраняем почти полную толщину. После середины
      // сужение сначала едва заметно, а ближе к концу резко усиливается.
      const taperProgress = Math.max(0, Math.min(1, (t - 0.5) / 0.5));
      const taper = Math.pow(taperProgress, 2.8);
      const width = baseWidth * (1 - 0.96 * taper);
      left.push(map.layerPointToLatLng(L.point(pts[i].x + nx*width/2, pts[i].y + ny*width/2)));
      right.push(map.layerPointToLatLng(L.point(pts[i].x - nx*width/2, pts[i].y - ny*width/2)));
    }
    return L.polygon(left.concat(right.reverse()), {

      fill: true,
      fillColor: "#171512",
      fillOpacity: opacity,
      interactive: false,
      smoothFactor: 1
    });
  }

  let settlementHoverOutline = null;
  let settlementSelectedOutline = null;
  let settlementHoverPath = null;
  let settlementSelectedPath = null;
  let settlementSelectedArea = null;
  let settlementHoverAreaId = null;
  let settlementHoverArea = null;
  let hiddenRouteLayers = [];
  const settlementTraceLayers = new Map();
  const settlementTracePaths = new Map();
  let activeSettlementTrace = null;

  // Отдельное хранилище для завершённых и анимируемых контуров сухой кисти.
  // Оно нужно, чтобы сохранять обводку при смене масштаба.
  const settlementBrushTraceLayers = new Map();

  const activeSettlementBrushTraces = new Map();

  const pausedSettlementBrushTraces = new Map();

  // Изолированный тестовый рендерер сухой кисти А.
  // Он использует уже сохранённую геометрию area.points и не меняет
  // маршруты, Firebase, выбор поселения или существующую анимацию.
  let settlementBrushTestEnabled = false;
  let settlementBrushPreviewLayers = [];
  let settlementBrushSelectedLayers = [];
  let settlementBrushPreviewArea = null;
  let settlementBrushSelectedArea = null;
  let settlementBrushSelectedAreaId = null;

  function ensureSettlementDryBrushPane() {
    let pane = map.getPane("settlement-dry-brush-pane");
    if (!pane) pane = map.createPane("settlement-dry-brush-pane");
    // Выше обычных маршрутных линий и привалов, но ниже флажков маршрута.

    pane.style.pointerEvents = "none";

  }

  function removeSettlementBrushLayers(layers) {
    (layers || []).forEach(layer => {
      if (layer && map.hasLayer(layer)) map.removeLayer(layer);

  }

  // Постоянный замкнутый контур со смещением в экранных пикселях.
  // Он не меняет форму при наведении/клике и пересчитывается после zoomend.
  function getSettlementDryBrushPath(area) {
    if (!area) return [];
    // brushPoints — отдельная геометрия только для видимой кисти.
    // area.points по-прежнему отвечает за обнаружение поселения и маршруты.
    const contourPoints = Array.isArray(area.brushPoints) && area.brushPoints.length >= 3
      ? area.brushPoints
      : area.points;
    if (!Array.isArray(contourPoints) || contourPoints.length < 3) return [];
    const points = contourPoints.map(point => map.latLngToLayerPoint(point));
    let signedArea = 0;
    for (let i = 0; i < points.length; i++) {
      const a = points[i], b = points[(i + 1) % points.length];
      signedArea += a.x * b.y - b.x * a.y;
    }
    const outwardSign = signedArea >= 0 ? 1 : -1;
    // Наружное смещение постепенно уменьшается при отдалении карты.
    const zoomScale = map.getZoomScale(map.getZoom(), 0);
    const offset = 4.5 * Math.pow(zoomScale, 0.55);
    const result = points.map((point, i) => {
      const previous = points[(i - 1 + points.length) % points.length];
      const next = points[(i + 1) % points.length];
      const dx = next.x - previous.x, dy = next.y - previous.y;
      const length = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = (dy / length) * outwardSign;
      const ny = (-dx / length) * outwardSign;
      return L.point(point.x + nx * offset, point.y + ny * offset);
    });
    result.push(result[0]);
    return result;
  }

  function sampleSettlementBrushPath(points, distance) {
    const sampled = [];
    let travelled = 0;
    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1], b = points[i];
      const length = a.distanceTo(b);
      if (length < 0.01) continue;
      const steps = Math.max(1, Math.ceil(length / distance));
      for (let j = 0; j < steps; j++) {
        const t = j / steps;
        sampled.push({
          point: L.point(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t),
          distance: travelled + length * t
        });
      }
      travelled += length;
    }
    sampled.push({ point: points[points.length - 1], distance: travelled });
    return { samples: sampled, total: travelled };
  }

  // Возвращает долю временной шкалы, к которой последний мазок кисти
  // уже полностью проявился. Это позволяет не заставлять маршрут ждать
  // оставшуюся невидимую часть расчётного периметра.
  function getSettlementDryBrushCompletionProgress(area, revealStartPoint = null, dashStep = 18) {
    const path = getSettlementDryBrushPath(area);
    if (path.length < 4) return 1;
    const zoomScale = map.getZoomScale(map.getZoom(), 0);
    const brushScale = Math.pow(zoomScale, 0.43);
    const sampledData = sampleSettlementBrushPath(path, 2.4 * brushScale);
    const samples = sampledData.samples;
    const total = sampledData.total;
    if (total < 12) return 1;

    let revealStartDistance = 0;
    if (revealStartPoint) {
      const target = map.latLngToLayerPoint(revealStartPoint);
      let nearestDistance = Infinity;
      samples.forEach(sample => {
        const distance = sample.point.distanceTo(target);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          revealStartDistance = sample.distance;
        }
      });
    }

    let cursor = 0;
    let strokeIndex = 0;
    let maxRevealAt = 0;
    while (cursor < total) {
      const seed = strokeIndex + 1;
      const strokeLength = (27 + (Math.sin(seed * 12.9898) * 0.5 + 0.5) * 25) * brushScale;
      const gap = (1.5 + (Math.sin(seed * 7.233) * 0.5 + 0.5) * 4.5) * brushScale;
      const end = Math.min(total, cursor + strokeLength);
      const strokeCenter = (cursor + end) / 2;
      const containsRevealStart = revealStartDistance >= cursor && revealStartDistance <= end;
      const clockwiseDistance = (strokeCenter - revealStartDistance + total) % total;
      const counterClockwiseDistance = (revealStartDistance - strokeCenter + total) % total;
      const nearestDirectionDistance = Math.min(clockwiseDistance, counterClockwiseDistance);
      const revealAt = containsRevealStart
        ? 0
        : Math.max(0, Math.min(1, nearestDirectionDistance / (total / 2)));
      maxRevealAt = Math.max(maxRevealAt, revealAt);
      cursor = end + gap;
      strokeIndex++;
    }

    const halfContourLength = total / 2;
    const revealWindow = Math.min(1, (dashStep * 1.5) / Math.max(1, halfContourLength));
    return Math.max(0.05, Math.min(1, maxRevealAt + revealWindow));
  }

  function createSettlementDryBrushLayers(area, opacity, revealStartPoint = null) {
    const path = getSettlementDryBrushPath(area);
    if (path.length < 4) return [];
    const pane = ensureSettlementDryBrushPane();
    const screenPoints = path.slice(0, -1);
    let contourArea = 0;
    for (let i = 0; i < screenPoints.length; i++) {
      const a = screenPoints[i], b = screenPoints[(i + 1) % screenPoints.length];
      contourArea += a.x * b.y - b.x * a.y;
    }
    const outwardSign = contourArea >= 0 ? 1 : -1;
    // Толщина, длина мазков и промежутки плавно уменьшаются при отдалении.
    const zoomScale = map.getZoomScale(map.getZoom(), 0);
    const brushScale = Math.pow(zoomScale, 0.43);
    const sampledData = sampleSettlementBrushPath(path, 2.4 * brushScale);
    const samples = sampledData.samples;
    const total = sampledData.total;
    if (total < 12) return [];

    // Если обводка запускается после прибытия в город, первым проявляется
    // участок кисти рядом с точкой касания маршрута.
    let revealStartDistance = 0;
    if (revealStartPoint) {
      const target = map.latLngToLayerPoint(revealStartPoint);
      let nearestDistance = Infinity;
      samples.forEach(sample => {
        const distance = sample.point.distanceTo(target);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          revealStartDistance = sample.distance;
        }
      });
    }

    const alpha = Number.isFinite(opacity) ? opacity : 1;
    const layers = [];
    const toLatLngs = pts => pts.map(pt => map.layerPointToLatLng(pt));

    // Короткие перекрывающиеся мазки с тонкими концами вместо сплошной толстой полосы.
    let cursor = 0;
    let strokeIndex = 0;
    while (cursor < total) {
      const seed = strokeIndex + 1;
      const strokeLength = (27 + (Math.sin(seed * 12.9898) * 0.5 + 0.5) * 25) * brushScale;
      const gap = (1.5 + (Math.sin(seed * 7.233) * 0.5 + 0.5) * 4.5) * brushScale;
      const end = Math.min(total, cursor + strokeLength);
      const section = samples.filter(sample => sample.distance >= cursor && sample.distance <= end);
      if (section.length >= 2) {
        const left = [], right = [];
        const baseWidth = (3.7 + (Math.sin(seed * 3.17) * 0.5 + 0.5) * 0.95) * brushScale;
        section.forEach((sample, index) => {
          const prev = section[Math.max(0, index - 1)].point;
          const next = section[Math.min(section.length - 1, index + 1)].point;
          const dx = next.x - prev.x, dy = next.y - prev.y;
          const mag = Math.sqrt(dx * dx + dy * dy) || 1;
          const nx = -dy / mag, ny = dx / mag;
          const t = index / Math.max(1, section.length - 1);
          // Сужение на обоих концах — характерный след сухой кисти.
          const taper = Math.pow(Math.sin(Math.PI * t), 0.72);
          const grain = 0.86 + 0.14 * Math.sin((index + seed) * 1.71);
          const half = Math.max(0.18, baseWidth * taper * grain / 2);
          const rough = Math.sin((index + seed * 2) * 2.37) * 0.28;
          left.push(L.point(sample.point.x + nx * (half + rough), sample.point.y + ny * (half + rough)));
          right.push(L.point(sample.point.x - nx * (half - rough), sample.point.y - ny * (half - rough)));
        });
        const stroke = L.polygon(toLatLngs(left.concat(right.reverse())), {
          pane: "settlement-dry-brush-pane", stroke: false, fill: true,
          fillColor: "#17130f", fillOpacity: alpha * (0.72 + (Math.sin(seed * 5.41) * 0.5 + 0.5) * 0.22),
          interactive: false, bubblingMouseEvents: false, smoothFactor: 0
        });
        const strokeCenter = (cursor + end) / 2;
        const containsRevealStart = revealStartDistance >= cursor && revealStartDistance <= end;
        // Контур раскрывается от точки прибытия сразу в обе стороны.
        // Для каждого мазка берём ближайшее расстояние по часовой или
        // против часовой стрелки, поэтому обе половины идут синхронно.
        const clockwiseDistance = (strokeCenter - revealStartDistance + total) % total;
        const counterClockwiseDistance = (revealStartDistance - strokeCenter + total) % total;
        const nearestDirectionDistance = Math.min(clockwiseDistance, counterClockwiseDistance);
        stroke._settlementBrushRevealAt = containsRevealStart
          ? 0
          : Math.max(0, Math.min(1, nearestDirectionDistance / (total / 2)));
        layers.push(stroke);
      }
      cursor = end + gap;
      strokeIndex++;
    }

    // Тонкие внешние следы щетины: короткие прочерки снаружи основного мазка.
    const bristles = [];
    for (let i = 0; i < samples.length; i += 3) {
      const sample = samples[i];
      const prev = samples[Math.max(0, i - 1)].point;
      const next = samples[Math.min(samples.length - 1, i + 1)].point;
      const dx = next.x - prev.x, dy = next.y - prev.y;
      const mag = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = (dy / mag) * outwardSign;
      const ny = (-dx / mag) * outwardSign;
      const seed = i + 3;
      const reach = (2.2 + (Math.sin(seed * 8.31) * 0.5 + 0.5) * 3.8) * brushScale;
      const tangent = (Math.sin(seed * 4.73) * 0.5) * 3.2 * brushScale;
      const length = (3.5 + (Math.sin(seed * 6.17) * 0.5 + 0.5) * 7.5) * brushScale;
      const start = L.point(sample.point.x + nx * reach, sample.point.y + ny * reach);
      const finish = L.point(start.x + nx * length * 0.45 - dy / mag * tangent, start.y + ny * length * 0.45 + dx / mag * tangent);
      bristles.push([map.layerPointToLatLng(start), map.layerPointToLatLng(finish)]);
    }
    if (bristles.length) {
      const bristleLayer = L.polyline(bristles, {
        pane: "settlement-dry-brush-pane", color: "#17130f", weight: 0.85 * brushScale,
        opacity: alpha * 0.58, lineCap: "butt", lineJoin: "round",
        interactive: false, bubblingMouseEvents: false, smoothFactor: 0
      });
      bristleLayer._settlementBrushRevealAt = 0.72;
      layers.push(bristleLayer);
    }

    // Редкие тонкие внутренние просветы разбивают мазок и добавляют сухую фактуру.
    const dryMarks = [];
    for (let i = 2; i < samples.length; i += 7) {
      const sample = samples[i];
      const prev = samples[Math.max(0, i - 1)].point;
      const next = samples[Math.min(samples.length - 1, i + 1)].point;
      const dx = next.x - prev.x, dy = next.y - prev.y;
      const mag = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = -dy / mag, ny = dx / mag;
      const seed = i + 17;
      const shift = ((Math.sin(seed * 2.91) * 0.5 + 0.5) * 1.7 - 0.85) * brushScale;
      const length = (3 + (Math.sin(seed * 7.13) * 0.5 + 0.5) * 5) * brushScale;
      const a = L.point(sample.point.x + nx * shift, sample.point.y + ny * shift);
      const b = L.point(a.x + dx / mag * length, a.y + dy / mag * length);
      dryMarks.push([map.layerPointToLatLng(a), map.layerPointToLatLng(b)]);
    }
    if (dryMarks.length) {
      const dryMarkLayer = L.polyline(dryMarks, {
        pane: "settlement-dry-brush-pane", color: "#eee2c8", weight: 0.65 * brushScale,
        opacity: alpha * 0.26, lineCap: "butt", interactive: false,
        bubblingMouseEvents: false, smoothFactor: 0
      });
      dryMarkLayer._settlementBrushRevealAt = 0.88;
      layers.push(dryMarkLayer);
    }

    layers.forEach(layer => layer.addTo(map));
    return layers;
  }

  function drawSettlementBrushPreview(area) {
    settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
    settlementBrushPreviewArea = area || null;
    if (area) settlementBrushPreviewLayers = createSettlementDryBrushLayers(area, 0.76);
  }

  function drawSettlementBrushSelected(area, opacity) {
    settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
    settlementBrushPreviewArea = null;
    settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
    settlementBrushSelectedArea = area || null;
    settlementBrushSelectedAreaId = area ? String(area.id) : null;
    if (area) settlementBrushSelectedLayers = createSettlementDryBrushLayers(area, Number.isFinite(opacity) ? opacity : 0.96);
  }

  // Новая постоянная форма включается только для тех поселений,
  // которым ведущий уже сохранил отдельный brushPoints в редакторе.
  // Остальные поселения продолжают использовать прежнюю обводку.
  function shouldUseSettlementDryBrush(area) {
    return !!area && (
      (Array.isArray(area.brushPoints) && area.brushPoints.length >= 3) ||
      settlementBrushTestEnabled
    );
  }

  function removeSettlementLayer(layer) {
    if (layer && map.hasLayer(layer)) map.removeLayer(layer);
  }

  function restoreRouteLayersForSettlement() {
    hiddenRouteLayers.forEach(function(item) {
      if (!item.layer || !map.hasLayer(item.layer)) return;
      if (item.latlngs && typeof item.layer.setLatLngs === "function") {
        item.layer.setLatLngs(item.latlngs);
      }
      if (item.markerOpacity !== undefined && typeof item.layer.setOpacity === "function") {
        item.layer.setOpacity(item.markerOpacity);
      }
      if (item.style && typeof item.layer.setStyle === "function") {
        item.layer.setStyle(item.style);
      }
    });
    hiddenRouteLayers = [];
  }
  window.restoreRouteLayersForSettlement = restoreRouteLayersForSettlement;
  window.discardRouteLayersForSettlement = function() {
    hiddenRouteLayers = [];
  };

  // Для стирания маршрута используем не невидимую область поселения,
  // а фактическую внешнюю геометрию кисти. Так маршрут исчезает и в
  // пространстве между границей города и увеличенной визуальной обводкой.
  function getSettlementBrushErasePolygon(area, extraPixels) {
    const path = getSettlementDryBrushPath(area);
    if (path.length < 4) return [];
    const points = path.slice(0, -1).map(point => L.point(point.x, point.y));
    let signedArea = 0;
    for (let i = 0; i < points.length; i++) {
      const a = points[i], b = points[(i + 1) % points.length];
      signedArea += a.x * b.y - b.x * a.y;
    }
    const outwardSign = signedArea >= 0 ? 1 : -1;
    const padding = Math.max(0, Number(extraPixels) || 0);
    return points.map((point, i) => {
      const previous = points[(i - 1 + points.length) % points.length];
      const next = points[(i + 1) % points.length];
      const dx = next.x - previous.x, dy = next.y - previous.y;
      const length = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = (dy / length) * outwardSign;
      const ny = (-dx / length) * outwardSign;
      return map.layerPointToLatLng(L.point(point.x + nx * padding, point.y + ny * padding));
    });
  }


  // Возвращает кратчайший участок между двумя точками, обходящий внешнюю
  // границу визуальной кисти. В отличие от невидимой области area.points,
  // здесь используется brushPoints и тот же экранный контур, что рисуется игроку.
  function getShortestPathAroundSettlementBrush(start, end, area) {
    if (!start || !end || !area) return null;

    const polygon = getSettlementBrushErasePolygon(area, 4);
    if (!Array.isArray(polygon) || polygon.length < 3) return [start, end];

    const startPx = map.latLngToLayerPoint(start);
    const endPx = map.latLngToLayerPoint(end);

    function segmentIsClear(a, b) {
      const aPx = map.latLngToLayerPoint(a);
      const bPx = map.latLngToLayerPoint(b);
      const length = aPx.distanceTo(bPx);
      const steps = Math.max(2, Math.ceil(length / 4));

      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const sample = map.layerPointToLatLng(L.point(
          aPx.x + (bPx.x - aPx.x) * t,
          aPx.y + (bPx.y - aPx.y) * t
        ));
        if (pointInSettlement(sample, polygon)) return false;
      }
      return true;
    }

    // Если прямая не заходит в визуальную кисть, обход не нужен.
    if (segmentIsClear(start, end)) return [start, end];

    // Нельзя строить выход из города, пока курсор остаётся внутри его кисти.
    if (pointInSettlement(start, polygon) || pointInSettlement(end, polygon)) {
      return null;
    }

    // Уплотнённый контур может содержать сотни точек. Для поиска касательных
    // берём равномерные узлы, но дуги между ними сохраняем по исходному контуру.
    const maxNodes = 120;
    const stride = Math.max(1, Math.ceil(polygon.length / maxNodes));
    const indices = [];
    for (let i = 0; i < polygon.length; i += stride) indices.push(i);
    if (indices.length < 3) return null;

    const nodes = indices.map(index => polygon[index]);
    const count = nodes.length;
    const startIndex = count;
    const endIndex = count + 1;
    const graph = Array.from({ length: count + 2 }, () => []);

    function distance(a, b) {
      return map.latLngToLayerPoint(a).distanceTo(map.latLngToLayerPoint(b));
    }

    function addEdge(from, to, weight, points) {
      graph[from].push({ to, weight, points });
    }

    // Касательные от начала и конца маршрута к видимым точкам контура.
    for (let i = 0; i < count; i++) {
      if (segmentIsClear(start, nodes[i])) {
        addEdge(startIndex, i, distance(start, nodes[i]), [start, nodes[i]]);
        addEdge(i, startIndex, distance(start, nodes[i]), [nodes[i], start]);
      }
      if (segmentIsClear(end, nodes[i])) {
        addEdge(i, endIndex, distance(nodes[i], end), [nodes[i], end]);
        addEdge(endIndex, i, distance(nodes[i], end), [end, nodes[i]]);
      }
    }

    // Соседние узлы соединяем именно дугой исходного контура, а не хордой:
    // так путь гарантированно не срезает угол через внутренность города.
    function collectForwardArc(fromIndex, toIndex) {
      const result = [nodes[fromIndex]];
      let index = indices[fromIndex];
      const target = indices[toIndex];
      let guard = 0;

      while (index !== target && guard <= polygon.length) {
        index = (index + 1) % polygon.length;
        result.push(polygon[index]);
        guard++;
      }
      return result;
    }

    for (let i = 0; i < count; i++) {
      const next = (i + 1) % count;
      const forward = collectForwardArc(i, next);
      let forwardLength = 0;
      for (let j = 1; j < forward.length; j++) {
        forwardLength += distance(forward[j - 1], forward[j]);
      }
      addEdge(i, next, forwardLength, forward);

      const backward = forward.slice().reverse();
      addEdge(next, i, forwardLength, backward);
    }

    // Дейкстра по двум касательным и двум направлениям обхода контура.
    const totalNodes = count + 2;
    const distances = Array(totalNodes).fill(Infinity);
    const previous = Array(totalNodes).fill(null);
    const visited = Array(totalNodes).fill(false);
    distances[startIndex] = 0;

    for (let step = 0; step < totalNodes; step++) {
      let current = -1;
      let best = Infinity;
      for (let i = 0; i < totalNodes; i++) {
        if (!visited[i] && distances[i] < best) {
          best = distances[i];
          current = i;
        }
      }
      if (current < 0 || current === endIndex) break;
      visited[current] = true;

      graph[current].forEach(edge => {
        const candidate = distances[current] + edge.weight;
        if (candidate < distances[edge.to]) {
          distances[edge.to] = candidate;
          previous[edge.to] = { from: current, points: edge.points };
        }
      });
    }

    if (!Number.isFinite(distances[endIndex])) return null;

    const edges = [];
    let cursor = endIndex;
    while (cursor !== startIndex) {
      const entry = previous[cursor];
      if (!entry) return null;
      edges.push(entry.points);
      cursor = entry.from;
    }
    edges.reverse();

    const result = [start];
    edges.forEach(edgePoints => {
      edgePoints.forEach(point => {
        const last = result[result.length - 1];
        if (!last || distance(last, point) > 0.05) result.push(point);
      });
    });
    if (distance(result[result.length - 1], end) > 0.05) result.push(end);
    return result;
  }

  // Применяем препятствия по очереди к каждому пересекающему их сегменту.
  // Благодаря этому несколько выбранных городов не зависят от того,
  // в каком порядке игрок кликнул по ним.
  function getRouteSegmentAroundIntermediateCities(start, end, skipSettlementExit = false) {
    if (!start || !end) return null;

    if (!skipSettlementExit) {
      const exitPath = getRouteSegmentFromSettlementCenter(start, end);
      if (exitPath) return exitPath;
    }

    let path = [start, end];
    const ids = Array.isArray(window.routeIntermediateCityIds)
      ? window.routeIntermediateCityIds : [];
    const areas = Array.isArray(window.settlementAreas)
      ? window.settlementAreas : [];
    const obstacles = ids
      .map(id => areas.find(item => String(item.id) === String(id)))
      .filter(Boolean);

    // Повторные проходы нужны, если обход одного города создал новый
    // пересекающийся участок рядом с другим уже выбранным городом.
    for (let pass = 0; pass <= obstacles.length; pass++) {
      let changed = false;

      for (const area of obstacles) {
        const polygon = getSettlementBrushErasePolygon(area, 4);
        if (polygon.length < 3) continue;

        // Если участок начинается на границе выбранного города или внутри
        // его визуальной кисти, это именно выход из города, а не попытка
        // пересечь его как препятствие. Разрешаем построение через кисть:
        // ниже маршрутная линия и жетоны будут скрыты внутри её контура.
        const startPx = map.latLngToLayerPoint(start);
        let distanceToStartBoundary = Infinity;
        for (let edge = 0; edge < polygon.length; edge++) {
          const a = map.latLngToLayerPoint(polygon[edge]);
          const b = map.latLngToLayerPoint(polygon[(edge + 1) % polygon.length]);
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const lengthSquared = dx * dx + dy * dy;
          const t = lengthSquared > 0
            ? Math.max(0, Math.min(1,
                ((startPx.x - a.x) * dx + (startPx.y - a.y) * dy) / lengthSquared
              ))
            : 0;
          const projected = L.point(a.x + dx * t, a.y + dy * t);
          distanceToStartBoundary = Math.min(
            distanceToStartBoundary,
            startPx.distanceTo(projected)
          );
        }
        if (pointInSettlement(start, polygon) || distanceToStartBoundary <= 12) {
          continue;
        }

        const nextPath = [path[0]];
        for (let i = 1; i < path.length; i++) {
          const a = path[i - 1];
          const b = path[i];
          const aPx = map.latLngToLayerPoint(a);
          const bPx = map.latLngToLayerPoint(b);
          const steps = Math.max(2, Math.ceil(aPx.distanceTo(bPx) / 4));
          let intersects = false;

          for (let step = 1; step < steps; step++) {
            const t = step / steps;
            const sample = map.layerPointToLatLng(L.point(
              aPx.x + (bPx.x - aPx.x) * t,
              aPx.y + (bPx.y - aPx.y) * t
            ));
            if (pointInSettlement(sample, polygon)) {
              intersects = true;
              break;
            }
          }

          if (!intersects) {
            nextPath.push(b);
            continue;
          }

          const detour = getShortestPathAroundSettlementBrush(a, b, area);
          if (!detour || detour.length < 2) return null;
          nextPath.push(...detour.slice(1));
          changed = true;
        }
        path = nextPath;
      }

      if (!changed) break;
    }

    return path;
  }

  // Промежуточные обводки хранятся отдельно от обводки конечного города:
  // можно выбрать несколько городов, не стирая предыдущие.
  let routeIntermediateBrushLayers = [];

  function clearRouteIntermediateCityOutlines() {
    routeIntermediateBrushLayers = removeSettlementBrushLayers(routeIntermediateBrushLayers);
  }

  function refreshRouteIntermediateCityOutlines() {
    clearRouteIntermediateCityOutlines();
    // После публикации маршрута промежуточные города больше не должны
    // получать статичную обводку при поздней загрузке данных или зуме.
    // Их контур появится только через animateSettlementTrace по прибытии.
    if (window.routeAnimationPublished) return;
    const ids = Array.isArray(window.routeIntermediateCityIds)
      ? window.routeIntermediateCityIds : [];
    const areas = Array.isArray(window.settlementAreas)
      ? window.settlementAreas : [];

    ids.forEach(id => {
      const key = String(id);
      // Частичная и завершённая анимация — уже корректное представление
      // контура. Статичная промежуточная кисть поверх неё не нужна.
      if (settlementTraceLayers.has(key) || settlementBrushTraceLayers.has(key)) return;
      const area = areas.find(item => String(item.id) === key);
      if (!area) return;
      const layers = createSettlementDryBrushLayers(area, 0.96);
      // Помечаем статические слои ID поселения, чтобы убрать только его
      // непосредственно перед запуском анимации, не затрагивая следующие города.
      layers.forEach(layer => {
        layer._routeIntermediateSettlementId = String(id);
      });
      routeIntermediateBrushLayers.push(...layers);
    });
  }

  function removeRouteIntermediateCityOutline(id) {
    const targetId = String(id);
    const remaining = [];
    routeIntermediateBrushLayers.forEach(layer => {
      if (String(layer._routeIntermediateSettlementId || '') === targetId) {
        removeSettlementLayer(layer);
      } else {
        remaining.push(layer);
      }
    });
    routeIntermediateBrushLayers = remaining;
  }

  function findNearestRoutePointOnSettlementBrush(origin, area) {
    if (!origin || !area) return null;

    // Точка подхода ставится на фактическую внешнюю границу кисти.
    // Сам маршрут затем может пройти под кистью: этот участок будет скрыт маской.
    const polygon = getSettlementBrushErasePolygon(area, 0);
    if (!Array.isArray(polygon) || polygon.length < 3) return null;

    const originPx = map.latLngToLayerPoint(origin);
    const screenPolygon = polygon.map(point => map.latLngToLayerPoint(point));
    let signedArea = 0;
    for (let i = 0; i < screenPolygon.length; i++) {
      const a = screenPolygon[i];
      const b = screenPolygon[(i + 1) % screenPolygon.length];
      signedArea += a.x * b.y - b.x * a.y;
    }
    const outwardSign = signedArea >= 0 ? 1 : -1;

    let bestPoint = null;
    let bestDistance = Infinity;
    let bestNormal = null;

    for (let i = 0; i < screenPolygon.length; i++) {
      const a = screenPolygon[i];
      const b = screenPolygon[(i + 1) % screenPolygon.length];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const lengthSquared = dx * dx + dy * dy;
      const t = lengthSquared > 0
        ? Math.max(0, Math.min(1,
            ((originPx.x - a.x) * dx + (originPx.y - a.y) * dy) / lengthSquared
          ))
        : 0;
      const projected = L.point(a.x + dx * t, a.y + dy * t);
      const distance = originPx.distanceTo(projected);

      if (distance < bestDistance) {
        const length = Math.sqrt(lengthSquared) || 1;
        bestDistance = distance;
        bestPoint = projected;
        bestNormal = L.point(
          (dy / length) * outwardSign,
          (-dx / length) * outwardSign
        );
      }
    }

    if (!bestPoint || !bestNormal) return null;

    // Небольшой отступ наружу не даёт новой опорной точке оказаться
    // внутри маски кисти из-за погрешности округления координат.
    const safePoint = L.point(
      bestPoint.x + bestNormal.x * 2.5,
      bestPoint.y + bestNormal.y * 2.5
    );
    return map.layerPointToLatLng(safePoint);
  }

  // Если маршрут начинается в центре уже выбранного поселения, сначала
  // выводим его к фактической границе (нулевая длина), затем к внешней
  // границе кисти (длина учитывается, но механики выключены).
  function getRouteSegmentFromSettlementCenter(start, end) {
    const ids = Array.isArray(window.routeIntermediateCityIds)
      ? window.routeIntermediateCityIds : [];
    const areas = Array.isArray(window.settlementAreas) ? window.settlementAreas : [];
    const area = ids.map(id => areas.find(item => String(item.id) === String(id)))
      .filter(Boolean).find(item => window.isRouteAtSettlementCenter(start, item));
    if (!area) return null;

    const visualPolygon = getSettlementBrushErasePolygon(area, 0);
    // Пока курсор остаётся внутри визуальной кисти, не создаём маршрутных
    // механик. При этом направление выхода определяется именно лучом от центра.
    if (pointInSettlement(end, visualPolygon)) return [start];

    // Ищем первое пересечение луча «центр -> курсор» с полигоном.
    // Поиск ближайшей к курсору точки границы давал скачки на другую сторону
    // поселения, особенно при вращении курсора вокруг центра.
    function firstRayIntersection(polygon) {
      if (!Array.isArray(polygon) || polygon.length < 3) return null;
      const origin = map.latLngToLayerPoint(start);
      const target = map.latLngToLayerPoint(end);
      const rx = target.x - origin.x;
      const ry = target.y - origin.y;
      const rayLengthSquared = rx * rx + ry * ry;
      if (rayLengthSquared < 0.0001) return null;
      let bestT = Infinity;

      for (let i = 0; i < polygon.length; i++) {
        const a = map.latLngToLayerPoint(polygon[i]);
        const b = map.latLngToLayerPoint(polygon[(i + 1) % polygon.length]);
        const sx = b.x - a.x;
        const sy = b.y - a.y;
        const qpx = a.x - origin.x;
        const qpy = a.y - origin.y;
        const denominator = rx * sy - ry * sx;
        if (Math.abs(denominator) < 0.000001) continue;
        const t = (qpx * sy - qpy * sx) / denominator;
        const u = (qpx * ry - qpy * rx) / denominator;
        if (t > 0.000001 && t <= 1.000001 && u >= -0.000001 && u <= 1.000001 && t < bestT) {
          bestT = t;
        }
      }
      if (!Number.isFinite(bestT)) return null;
      return map.layerPointToLatLng(L.point(
        origin.x + rx * bestT,
        origin.y + ry * bestT
      ));
    }

    const actualPointRaw = firstRayIntersection(area.points || []);
    const outerPointRaw = firstRayIntersection(visualPolygon);
    if (!actualPointRaw || !outerPointRaw) return null;

    const actualPoint = setRouteSegmentMode(
      L.latLng(actualPointRaw.lat, actualPointRaw.lng),
      "settlement-zero",
      area.id
    );
    const outerPoint = setRouteSegmentMode(
      L.latLng(outerPointRaw.lat, outerPointRaw.lng),
      "settlement-count-only",
      area.id
    );
    const outsidePath = getRouteSegmentAroundIntermediateCities(outerPoint, end, true);
    if (!outsidePath || outsidePath.length < 2) return null;
    return [start, actualPoint, outerPoint, ...outsidePath.slice(1)];
  }

  function findLastRouteEntryIntoSettlementBrush(points, area) {
    if (!Array.isArray(points) || points.length < 2 || !area) return null;
    const polygon = getSettlementBrushErasePolygon(area, 0);
    if (!Array.isArray(polygon) || polygon.length < 3) return null;
    if (!pointInSettlement(points[points.length - 1], polygon)) return null;

    let latestEntry = null;
    for (let i = 1; i < points.length; i++) {
      const start = points[i - 1];
      const end = points[i];
      const a = map.latLngToLayerPoint(start);
      const b = map.latLngToLayerPoint(end);
      const screenLength = a.distanceTo(b);
      const steps = Math.max(2, Math.ceil(screenLength / 2));
      let previousT = 0;
      let previousInside = pointInSettlement(start, polygon);

      for (let step = 1; step <= steps; step++) {
        const currentT = step / steps;
        const sample = map.layerPointToLatLng(L.point(
          a.x + (b.x - a.x) * currentT,
          a.y + (b.y - a.y) * currentT
        ));
        const currentInside = pointInSettlement(sample, polygon);

        if (!previousInside && currentInside) {
          let low = previousT;
          let high = currentT;
          for (let iteration = 0; iteration < 14; iteration++) {
            const middleT = (low + high) / 2;
            const middle = map.layerPointToLatLng(L.point(
              a.x + (b.x - a.x) * middleT,
              a.y + (b.y - a.y) * middleT
            ));
            if (pointInSettlement(middle, polygon)) high = middleT;
            else low = middleT;
          }
          const crossing = map.layerPointToLatLng(L.point(
            a.x + (b.x - a.x) * ((low + high) / 2),
            a.y + (b.y - a.y) * ((low + high) / 2)
          ));
          latestEntry = {
            segmentIndex: i,
            point: window.copyRoutePointMetadata(end, crossing)
          };
        }

        previousInside = currentInside;
        previousT = currentT;
      }
    }
    return latestEntry;
  }

  // Кнопка подтверждения может завершить маршрут прямо в последнем
  // выбранном одиночным кликом городе. В этом случае превращаем его из
  // промежуточного в конечный, не требуя отмены или двойного клика.
  window.canConfirmRouteAtLastSettlement = function() {
    // Этот обработчик вызывается из обновления предпросмотра. Состояние
    // завершения читаем через window-флаг: локальная переменная routeFinished
    // в этой функции недоступна из её области видимости.
    if (window.routePendingConfirmation || !Array.isArray(window.routeIntermediateCityIds) ||
        !window.routeIntermediateCityIds.length || !Array.isArray(window.routePoints) ||
        window.routePoints.length < 3) return false;
    const lastPoint = window.routePoints[window.routePoints.length - 1];
    const id = lastPoint && lastPoint._routeSettlementId != null
      ? String(lastPoint._routeSettlementId) : "";
    return Boolean(id && getRouteSegmentMode(lastPoint) === "settlement-zero" &&
      window.routeIntermediateCityIds.some(existingId => String(existingId) === id));
  };

  window.finishRouteAtLastSelectedSettlement = function() {
    if (!window.canConfirmRouteAtLastSettlement()) return false;
    const centerPoint = window.routePoints[window.routePoints.length - 1];
    const id = String(centerPoint._routeSettlementId);
    const area = (Array.isArray(window.settlementAreas) ? window.settlementAreas : [])
      .find(item => String(item.id) === id);
    if (!area) return false;

    let boundaryIndex = -1;
    for (let i = window.routePoints.length - 2; i >= 1; i--) {
      if (String(window.routePoints[i]._routeSettlementId || "") === id &&
          getRouteSegmentMode(window.routePoints[i]) === "settlement-count-only") {
        boundaryIndex = i;
        break;
      }
    }
    if (boundaryIndex < 1) return false;

    const approachPoint = window.routePoints[boundaryIndex - 1];
    const boundaryPoint = L.latLng(
      Number(window.routePoints[boundaryIndex].lat),
      Number(window.routePoints[boundaryIndex].lng)
    );

    // Сохраняем именно ту границу, к которой уже был проложен маршрут
    // при одиночном клике. Финальный участок будет построен заново до неё.
    window.routePoints.splice(boundaryIndex);
    window.routeIntermediateCityIds = window.routeIntermediateCityIds
      .filter(existingId => String(existingId) !== id);
    refreshRouteIntermediateCityOutlines();

    window.routeDestinationCityId = id;
    window.routeDestinationBoundaryPoint = boundaryPoint;
    window.routeDestinationApproachPoint = approachPoint;
    try {
      if (window.showSettlementOutline) window.showSettlementOutline(area, 1);
    } catch (outlineError) {
      console.error("Ошибка отображения обводки поселения:", outlineError);
    }

    finishPartyRoute(boundaryPoint);
    return Boolean(window.routePendingConfirmation);
  };

  function activateIntermediateRouteCity(
    area, clickedPoint = null, segmentPace = routePace,
    segmentSpeedReduced = routeSpeedReduced
  ) {
    if (!area || !area.id) return;
    if (!Array.isArray(window.routeIntermediateCityIds)) window.routeIntermediateCityIds = [];
    if (window.routeIntermediateCityIds.some(id => String(id) === String(area.id))) return;

    if (!area.center || !Number.isFinite(Number(area.center.lat)) ||
        !Number.isFinite(Number(area.center.lng)) ||
        !pointInSettlement(area.center, area.points || [])) {
      alert("У этого поселения ещё не установлен корректный центр. Попроси ведущего указать его в редакторе поселений.");
      return;
    }

    const currentRoutePoints = window.routePoints;
    const originalLastPoint = currentRoutePoints[currentRoutePoints.length - 1];
    if (!originalLastPoint) return;

    const approachTarget = clickedPoint || originalLastPoint;
    const visualPolygon = getSettlementBrushErasePolygon(area, 0);
    const lastPointInsideBrush = pointInSettlement(originalLastPoint, visualPolygon);
    let outerApproach = null;

    if (lastPointInsideBrush) {
      // Если до фактической границы уже успели добавить обычные точки
      // внутри визуальной кисти, удаляем этот участок целиком: все его
      // жетоны/дни перестают учитываться после выбора поселения.
      const entry = findLastRouteEntryIntoSettlementBrush(currentRoutePoints, area);
      if (entry) {
        const prefix = currentRoutePoints.slice(0, entry.segmentIndex);
        const lastPrefixPoint = prefix[prefix.length - 1];
        if (!lastPrefixPoint || lastPrefixPoint.distanceTo(entry.point) > 0.01) {
          prefix.push(entry.point);
        }
        currentRoutePoints.splice(0, currentRoutePoints.length, ...prefix);
        outerApproach = currentRoutePoints[currentRoutePoints.length - 1];
      } else {
        // Редкий случай: сам маршрут начался внутри визуальной кисти.
        // Считаем путь от старта до выхода транзитным, без игровых механик.
        const routeStart = currentRoutePoints[0];
        outerApproach = findNearestRoutePointOnSettlementBrush(routeStart, area);
        if (!outerApproach) return;
        currentRoutePoints.splice(1, currentRoutePoints.length - 1);
        currentRoutePoints.push(window.applyRouteTravelSettings(window.setRouteSegmentMode(
          L.latLng(outerApproach.lat, outerApproach.lng),
          "settlement-count-only",
          area.id
        ), segmentPace, segmentSpeedReduced));
        outerApproach = currentRoutePoints[currentRoutePoints.length - 1];
      }
    } else {
      // Если маршрут ещё не заходил в кисть, прокладываем его до внешней
      // границы обычным способом, сохраняя уже построенную геометрию.
      outerApproach = findNearestRoutePointOnSettlementBrush(originalLastPoint, area);
      if (!outerApproach) {
        console.warn("Не удалось определить внешнюю границу кисти поселения.");
        return;
      }
      const approachSegment = getRouteSegmentAroundIntermediateCities(originalLastPoint, outerApproach);
      if (!approachSegment || approachSegment.length < 2) {
        console.warn("Не удалось зафиксировать путь до промежуточного поселения.");
        return;
      }
      const committedApproachSegment = approachSegment.slice(1);
      committedApproachSegment.forEach(point => window.applyRouteTravelSettings(
        point, segmentPace, segmentSpeedReduced
      ));
      currentRoutePoints.push(...committedApproachSegment);
    }

    // Если марш был включён внутри предыдущего поселения, он начинает
    // действовать только после выхода за его внешнюю границу.
    if (window.routeForcedMarch && window.routeForcedMarchPendingExit) {
      window.routeForcedMarchPendingExit = false;
      window.routeForcedMarchEpochStartDistance = window.getLastSettlementTransitEndDistance(currentRoutePoints);
      window.routeForcedMarchStartDistance = window.routeForcedMarchEpochStartDistance;
      window.routeForcedMarchStartUnits = 0;
    }

    // Форсированный марш заканчивается у внешней границы нового поселения.
    // Его остаток не переносится внутрь и не возобновляется после выхода.
    const outerBoundaryDistance = window.getRouteTravelLength(currentRoutePoints);
    window.terminateForcedMarchAtSettlement(outerBoundaryDistance);

    const actualBoundary = findNearestSettlementBoundaryPoint(approachTarget, area.points);
    if (!actualBoundary || !actualBoundary.point) {
      console.warn("Не удалось определить фактическую границу поселения.");
      return;
    }

    currentRoutePoints.push(window.applyRouteTravelSettings(window.setRouteSegmentMode(
      L.latLng(actualBoundary.point.lat, actualBoundary.point.lng),
      "settlement-count-only",
      area.id
    ), segmentPace, segmentSpeedReduced));
    currentRoutePoints.push(window.applyRouteTravelSettings(window.setRouteSegmentMode(
      L.latLng(Number(area.center.lat), Number(area.center.lng)),
      "settlement-zero",
      area.id
    ), segmentPace, segmentSpeedReduced));

    window.routeIntermediateCityIds.push(String(area.id));
    window.lastCursorPosition = null;
    refreshRouteIntermediateCityOutlines();
    window.updateRouteLine(null, true);
    console.log("Поселение добавлено как промежуточное; маршрут продолжен из центра:", area.id);
  }
  // Стабильная маска жетонов не должна зависеть от экранной толщины сухой
  // кисти: та намеренно меняется при zoom. Для жетонов используем исходный
  // контур brushPoints (или points, если отдельного контура нет).
  function getSettlementMarkerMaskPolygon(area) {
    if (!area) return [];
    const source = Array.isArray(area.brushPoints) && area.brushPoints.length >= 3
      ? area.brushPoints
      : area.points;
    if (!Array.isArray(source) || source.length < 3) return [];
    return source.map(point => L.latLng(Number(point.lat), Number(point.lng)));
  }

  // Используется updateRouteLine для проверки самих игровых жетонов.
  // Маска стабильна при любом масштабе: маркер не исчезает из-за изменения
  // внешнего экранного отступа визуальной кисти.
  window.isRouteMarkerMaskedBySettlement = function(position, area) {
    if (!position || !area) return false;
    // Проверяем положение центра маркера только по стабильной геометрии.
    // Экранное расширение на 16/28 px меняет охват в координатах мира при
    // zoom и из-за этого ошибочно прячет маркеры рядом с поселением.
    const polygon = getSettlementMarkerMaskPolygon(area);
    return polygon.length >= 3 && pointInSettlement(position, polygon);
  };

  function splitRoutePathOutsideSettlement(path, polygon) {
    if (!Array.isArray(path) || path.length < 2) return [];
    const result = [];
    let current = [];
    let hadInsidePoint = false;
    const pushCurrent = () => {
      if (current.length >= 2) result.push(current);
      current = [];
    };

    for (let i = 1; i < path.length; i++) {
      const a = map.latLngToLayerPoint(path[i - 1]);
      const b = map.latLngToLayerPoint(path[i]);
      const distance = a.distanceTo(b);
      const steps = Math.max(1, Math.ceil(distance / 2));
      for (let step = 0; step <= steps; step++) {
        if (i > 1 && step === 0) continue;
        const t = step / steps;
        const sample = map.layerPointToLatLng(L.point(
          a.x + (b.x - a.x) * t,
          a.y + (b.y - a.y) * t
        ));
