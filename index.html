        const inside = pointInSettlement(sample, polygon);
        if (inside) {
          hadInsidePoint = true;
          pushCurrent();
        } else {
          if (!current.length || current[current.length - 1].distanceTo(sample) > 0.05) {
            current.push(sample);
          }
        }
      }
    }
    pushCurrent();
    return { paths: result, changed: hadInsidePoint };
  }

  function hideRouteDashesInsideSettlement(area, preserveExisting = false) {
    if (!preserveExisting) restoreRouteLayersForSettlement();
    if (!area || !Array.isArray(area.points)) return;

    // Линия обрезается по внешнему краю кисти. Для круглых жетонов
    // добавляем запас по радиусу, чтобы их края тоже не заходили внутрь.
    const lineErasePolygon = getSettlementBrushErasePolygon(area, 1.5);
    const markerErasePolygon = getSettlementMarkerMaskPolygon(area);
    if (lineErasePolygon.length < 3 || markerErasePolygon.length < 3) return;

    const routeLayers = Array.isArray(window.routeRestMarkers) ? window.routeRestMarkers : [];
    routeLayers.forEach(function(layer) {
      if (!layer || !map.hasLayer(layer)) return;

      // Крестики и жетоны-привалы — отдельные маркеры, у них нет getLatLngs.
      if (typeof layer.getLatLng === "function") {
        const position = layer.getLatLng();
        if (!position || !pointInSettlement(position, markerErasePolygon)) return;
        if (typeof layer.setOpacity === "function") {
          if (!hiddenRouteLayers.some(item => item.layer === layer)) {
            const markerOpacity = typeof layer.options.opacity === "number" ? layer.options.opacity : 1;
            hiddenRouteLayers.push({ layer, markerOpacity });
          }
          layer.setOpacity(0);
        } else if (typeof layer.setStyle === "function") {
          if (!hiddenRouteLayers.some(item => item.layer === layer)) {
            const style = {
              opacity: typeof layer.options.opacity === "number" ? layer.options.opacity : 1,
              fillOpacity: typeof layer.options.fillOpacity === "number" ? layer.options.fillOpacity : 1
            };
            hiddenRouteLayers.push({ layer, style });
          }
          layer.setStyle({ opacity: 0, fillOpacity: 0 });
        }
        return;
      }

      if (typeof layer.getLatLngs !== "function" || typeof layer.setLatLngs !== "function") return;
      const original = layer.getLatLngs();
      const paths = [];
      const collectPaths = value => {
        if (!Array.isArray(value) || !value.length) return;
        if (value[0] && Number.isFinite(value[0].lat) && Number.isFinite(value[0].lng)) {
          paths.push(value);
        } else {
          value.forEach(collectPaths);
        }
      };
      collectPaths(original);
      if (!paths.length) return;

      let changed = false;
      const visiblePaths = [];
      paths.forEach(path => {
        const clipped = splitRoutePathOutsideSettlement(path, lineErasePolygon);
        if (clipped.changed) changed = true;
        visiblePaths.push(...clipped.paths);
      });
      if (!changed) return;

      if (!hiddenRouteLayers.some(item => item.layer === layer)) {
        hiddenRouteLayers.push({ layer, latlngs: original });
      }
      layer.setLatLngs(visiblePaths);
    });
  }
  window.hideRouteDashesInsideSettlement = hideRouteDashesInsideSettlement;

  function showSettlementOutline(area, opacity) {
    try {
      if (!area || !Array.isArray(area.points) || area.points.length < 3) return;
      // Если для города уже существует начатая или завершённая трасса,
      // не накладываем поверх неё статичную выбранную кисть при возврате
      // в редактор: она закрывает частичный прогресс анимации.
      const areaId = String(area.id);
      if (settlementTraceLayers.has(areaId) || settlementBrushTraceLayers.has(areaId)) return;

      if (shouldUseSettlementDryBrush(area)) {
        // Для отредактированного поселения клик лишь переводит
        // предварительную кисть в выбранное состояние. Геометрия
        // берётся из тех же brushPoints и не пересчитывается.
        removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
        removeSettlementLayer(settlementSelectedOutline); settlementSelectedOutline = null;
        settlementHoverPath = null;
        settlementSelectedPath = null;
        settlementHoverAreaId = null;
        settlementHoverArea = null;
        settlementSelectedArea = area;
        hideRouteDashesInsideSettlement(area);
        drawSettlementBrushSelected(area, Number.isFinite(opacity) ? opacity : 0.96);
        return;
      }

      // Старый способ остаётся для поселений, которые ещё не редактировали.
      const start = window.routeDestinationBoundaryPoint || area.points[0];
      const approach = window.routeDestinationApproachPoint || start;
      const path = settlementHoverPath && String(settlementHoverAreaId) === String(area.id)
        ? settlementHoverPath.slice()
        : getSettlementContourVariant(area, start, approach, false);
      if (path.length < 2) return;
      let pane = map.getPane("settlement-preview-pane");
      if (!pane) pane = map.createPane("settlement-preview-pane");
      pane.style.zIndex = "675";
      removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
      removeSettlementLayer(settlementSelectedOutline);
      settlementSelectedPath = path.slice();
      settlementSelectedArea = area;
      hideRouteDashesInsideSettlement(area);
      settlementSelectedOutline = makeTaperedSettlementPolygon(path, SETTLEMENT_TRACE_BASE_WIDTH, Number.isFinite(opacity) ? opacity : 0.95);
      if (settlementSelectedOutline) settlementSelectedOutline.addTo(map);
    } catch (error) { console.error("Ошибка выбранной обводки поселения:", error); }
  }
  window.showSettlementOutline = showSettlementOutline;

  function clearSettlementOutline() {
    settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
    settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
    settlementBrushPreviewArea = null;
    settlementBrushSelectedArea = null;
    settlementBrushSelectedAreaId = null;
    removeSettlementLayer(settlementHoverOutline);
    removeSettlementLayer(settlementSelectedOutline);
    settlementHoverOutline = null;
    settlementSelectedOutline = null;
    settlementHoverPath = null;
    settlementSelectedPath = null;
    settlementSelectedArea = null;
    settlementHoverAreaId = null;
    settlementHoverArea = null;
    restoreRouteLayersForSettlement();
  }
  window.clearSettlementOutline = clearSettlementOutline;

  // Удаляет только уже нарисованную/анимируемую трассу указанного города.
  // В отличие от clearSettlementOutline, не трогает выбранные и промежуточные города.
  window.clearRouteDestinationSettlementTrace = function(id) {
    if (id == null) return;
    const key = String(id);

    const brushState = activeSettlementBrushTraces.get(key);
    if (brushState) {
      activeSettlementBrushTraces.delete(key);
      if (brushState.layers) removeSettlementBrushLayers(brushState.layers);
    }
    pausedSettlementBrushTraces.delete(key);
    const brushLayers = settlementBrushTraceLayers.get(key);
    if (brushLayers) removeSettlementBrushLayers(brushLayers);
    settlementBrushTraceLayers.delete(key);

    const traceLayer = settlementTraceLayers.get(id) || settlementTraceLayers.get(key);
    removeSettlementLayer(traceLayer);
    settlementTraceLayers.delete(id);
    settlementTraceLayers.delete(key);
    settlementTracePaths.delete(id);
    settlementTracePaths.delete(key);
    if (activeSettlementTrace && String(activeSettlementTrace.areaId) === key) {
      removeSettlementLayer(activeSettlementTrace.layer);
      activeSettlementTrace = null;
    }

    // Маски маршрута восстанавливаются общим clearSettlementOutline()
    // при подтверждении, возврате или отмене редактора. Здесь не трогаем
    // остальные города, чтобы не раскрыть их маршрутные участки преждевременно.
  };

  window.previewSettlementAt = function(point) {
    try {
      if (!window.routeMode) {
        settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
        settlementBrushPreviewArea = null;
        removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
        settlementHoverPath = null;
        settlementHoverAreaId = null;
        settlementHoverArea = null;
        // Если поселение уже выбрано для назначения маршрута, не показываем
        // пунктир поверх него и не восстанавливаем скрытые штрихи до очистки.
        if (!settlementBrushSelectedAreaId && !settlementSelectedOutline) restoreRouteLayersForSettlement();
        return;
      }

      const area = findSettlementAt(point);

      if (!area) {
        settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
        settlementBrushPreviewArea = null;
        removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
        settlementHoverPath = null;
        settlementHoverAreaId = null;
        settlementHoverArea = null;
        if (!settlementBrushSelectedAreaId && !settlementSelectedOutline) {
          restoreRouteLayersForSettlement();
          settlementContourVariant = null;
        }
        return;
      }

      // После выбора места назначения не переключаем обводку при движении
      // курсора: выбранная кисть остаётся на месте до завершения маршрута.
      if (settlementBrushSelectedAreaId || settlementSelectedOutline) return;

      if (shouldUseSettlementDryBrush(area)) {
        removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
        settlementHoverPath = null;
        settlementHoverAreaId = null;
        settlementHoverArea = null;
        // updateRouteLine пересоздаёт маршрутные слои при каждом движении мыши.
        // Поэтому обрезку нужно применять повторно к свежим слоям даже тогда,
        // когда курсор остаётся над тем же самым городом.
        hideRouteDashesInsideSettlement(area);
        if (!settlementBrushPreviewArea ||
            String(settlementBrushPreviewArea.id) !== String(area.id)) {
          drawSettlementBrushPreview(area);
        }
        return;
      }

      // При переходе с нового рендерера на старый сначала убираем кисть
      // и возвращаем стили маршрута, затем рисуем прежний контур.
      if (settlementBrushPreviewArea) {
        settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
        settlementBrushPreviewArea = null;
        restoreRouteLayersForSettlement();
      }

      const path = getSettlementContourVariant(area, point, point, false);
      if (path.length < 2) return;
      hideRouteDashesInsideSettlement(area);
      removeSettlementLayer(settlementHoverOutline);
      settlementHoverPath = path.slice();
      settlementHoverAreaId = area.id;
      settlementHoverArea = area;
      settlementHoverOutline = makeTaperedSettlementPolygon(path, SETTLEMENT_TRACE_BASE_WIDTH, 0.68);
      if (settlementHoverOutline) settlementHoverOutline.addTo(map);
    } catch (error) {
      console.error("Ошибка предварительной обводки поселения:", error);
      settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
      settlementBrushPreviewArea = null;
      removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
    }
  };

  function applySettlementBrushTraceProgress(state, progress) {
    if (!state || !Array.isArray(state.layers)) return;
    state.progress = Math.max(0, Math.min(1, progress));

    state.layers.forEach(layer => {
      if (!layer || !map.hasLayer(layer)) return;
      const revealAt = Number.isFinite(layer._settlementBrushRevealAt)
        ? layer._settlementBrushRevealAt
        : 0;
      const revealWindow = Number.isFinite(state.revealWindow) && state.revealWindow > 0
        ? state.revealWindow
        : 0.055;
      const local = Math.max(0, Math.min(1, (state.progress - revealAt) / revealWindow));
      const eased = local * local * (3 - 2 * local);
      const baseOpacity = Number.isFinite(layer._settlementBrushBaseOpacity)
        ? layer._settlementBrushBaseOpacity
        : (Number.isFinite(layer.options.opacity) ? layer.options.opacity : 1);
      const baseFillOpacity = Number.isFinite(layer._settlementBrushBaseFillOpacity)
        ? layer._settlementBrushBaseFillOpacity
        : (Number.isFinite(layer.options.fillOpacity) ? layer.options.fillOpacity : 1);

      layer._settlementBrushBaseOpacity = baseOpacity;
      layer._settlementBrushBaseFillOpacity = baseFillOpacity;
      layer.setStyle({
        opacity: baseOpacity * eased,
        fillOpacity: baseFillOpacity * eased
      });
    });
  }

  function animateSettlementDryBrushTrace(area, revealStartPoint = null) {
    pausedSettlementBrushTraces.delete(String(area.id));
    // Анимации разных поселений независимы: маршрут может дойти до
    // следующего города до того, как закончится росчерк предыдущего.
    const previousLayers = settlementBrushTraceLayers.get(String(area.id));
    if (previousLayers) removeSettlementBrushLayers(previousLayers);

    if (settlementBrushSelectedAreaId && String(settlementBrushSelectedAreaId) === String(area.id)) {
      settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
      settlementBrushSelectedArea = null;
      settlementBrushSelectedAreaId = null;
    }

    revealStartPoint = revealStartPoint || null;
    const layers = createSettlementDryBrushLayers(area, 0.96, revealStartPoint);
    if (!layers.length) return;
    layers._settlementBrushRevealStartPoint = revealStartPoint;

    const path = getSettlementDryBrushPath(area);
    const screenLength = path.reduce((sum, point, index) => {
      return index ? sum + point.distanceTo(path[index - 1]) : sum;
    }, 0);
    // Скорость продолжает темп последнего участка маршрута:
    // один шаг пунктира (штрих + промежуток = 18 px) за текущий интервал.
    // Обводка проходит половину периметра одновременно в двух направлениях.
    const halfContourLength = screenLength / 2;
    const dashStep = Number(window.routeLineDashStep) || 18;
    const revealFadeDuration = Number(window.routeLineRevealFadeDuration) || 220;
    const minimumDashDelay = Number(window.routeLineMinimumDashDelay) || 95;
    const routeDashInterval = Math.max(
      minimumDashDelay,
      Number(window.settlementTraceDashInterval) || minimumDashDelay
    );
    // Обводка примерно на 22% быстрее последнего интервала маршрута.
    // Скорость нормализуется по той же средней точке зума, что и маршрут.
    const zoomSpeedMultiplier = typeof window.getRouteZoomSpeedMultiplier === "function"
      ? window.getRouteZoomSpeedMultiplier()
      : 1;
    const dashInterval = routeDashInterval * 0.65 * zoomSpeedMultiplier;
    const duration = Math.max(
      revealFadeDuration,
      (halfContourLength / dashStep) * dashInterval + revealFadeDuration
    );
    const state = {
      area,
      layers,
      startedAt: performance.now(),
      duration,
      progress: 0,
      revealWindow: Math.min(1, (dashStep * 1.5) / Math.max(1, halfContourLength)),
      completionProgress: getSettlementDryBrushCompletionProgress(area, revealStartPoint, dashStep)
    };

    layers.forEach(layer => {
      layer._settlementBrushBaseOpacity =
        Number.isFinite(layer.options.opacity) ? layer.options.opacity : 1;
      layer._settlementBrushBaseFillOpacity =
        Number.isFinite(layer.options.fillOpacity) ? layer.options.fillOpacity : 1;
    });

    settlementBrushTraceLayers.set(String(area.id), layers);
    activeSettlementBrushTraces.set(String(area.id), state);
    applySettlementBrushTraceProgress(state, 0);

    function frame(now) {
      if (activeSettlementBrushTraces.get(String(area.id)) !== state) return;
      // Линейное раскрытие сохраняет постоянную скорость последнего штриха маршрута.
      const progress = Math.max(0, Math.min(1, (now - state.startedAt) / state.duration));
      const completed = progress >= state.completionProgress;
      const visibleProgress = completed ? state.completionProgress : progress;
      applySettlementBrushTraceProgress(state, visibleProgress);

      if (!completed) {
        requestAnimationFrame(frame);
      } else {
        activeSettlementBrushTraces.delete(String(area.id));
        console.log("Обводка поселения: анимация сухой кисти завершена", area.id);
      }
    }

    requestAnimationFrame(frame);
    console.log("Обводка поселения: анимация сухой кисти началась", area.id);
  }

  function animateSettlementTrace(area, boundaryPoint = null, approachPoint = null) {
    try {
      // Для каждого поселения передаём собственную точку входа: у каждого
      // города на маршруте она своя, а не только у конечного поселения.
      boundaryPoint = boundaryPoint || window.routeDestinationBoundaryPoint || null;
      approachPoint = approachPoint || boundaryPoint;
      if (shouldUseSettlementDryBrush(area)) {
        animateSettlementDryBrushTrace(area, boundaryPoint);
        return;
      }
      // Статичная выбранная кисть нужна для этапа наведения/клика.
      // При старте пока ещё старой анимации убираем её, чтобы не перекрывать росчерк.
      if (settlementBrushSelectedAreaId && String(settlementBrushSelectedAreaId) === String(area.id)) {
        settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
        settlementBrushSelectedArea = null;
        settlementBrushSelectedAreaId = null;
      }
      const startPoint = boundaryPoint;
      if (!startPoint) return;
      const contour = getSettlementContourVariant(
        area,
        startPoint,
        approachPoint || startPoint,
        true
      );
      if (contour.length < 2) return;
      const previousTrace = settlementTraceLayers.get(area.id);
      removeSettlementLayer(previousTrace);
      removeSettlementLayer(settlementSelectedOutline);
      settlementSelectedOutline = null;

      let trace = makeTaperedSettlementPolygon([contour[0], contour[0], contour[1]], SETTLEMENT_TRACE_BASE_WIDTH, 1);
      if (!trace) return;
      trace.addTo(map);
      settlementTraceLayers.set(area.id, trace);
      settlementTracePaths.set(area.id, [contour[0], contour[0], contour[1]]);
      activeSettlementTrace = {
        areaId: area.id,
        layer: trace,
        area,
        contour: contour.slice()
      };

      let layerPoints = contour.map(point => map.latLngToLayerPoint(point));
      const lengths = [];
      let totalLength = 0;
      for (let i = 1; i < layerPoints.length; i++) {
        const len = layerPoints[i - 1].distanceTo(layerPoints[i]);
        lengths.push(len); totalLength += len;
      }
      if (totalLength < 1) return;
      const traceZoomSpeedMultiplier = typeof window.getRouteZoomSpeedMultiplier === "function"
        ? window.getRouteZoomSpeedMultiplier() : 1;
      const duration = Math.max(1200, Math.min(6000, totalLength * 2.8 * traceZoomSpeedMultiplier));
      const startedAt = performance.now();

      // Четыре темповых участка по пройденному расстоянию:
      // 1) первая треть — обычная скорость;
      // 2) короткое, но более заметное замедление;
      // 3) небольшой участок примерно в 1.5 раза быстрее начального;
      // 4) сильное плавное ускорение до самого острого конца.
      // Доли времени подобраны отдельно от долей расстояния, чтобы
      // скорость действительно ощущалась разной, а не просто менялась формально.
      function getTraceDistanceProgress(timeProgress) {
        const t1 = 0.35, t2 = 0.57, t3 = 0.68;
        const d1 = 0.33, d2 = 0.39, d3 = 0.54;
        if (timeProgress <= t1) return (timeProgress / t1) * d1;
        if (timeProgress <= t2) return d1 + ((timeProgress - t1) / (t2 - t1)) * (d2 - d1);
        if (timeProgress <= t3) return d2 + ((timeProgress - t2) / (t3 - t2)) * (d3 - d2);
        const fast = (timeProgress - t3) / (1 - t3);
        return d3 + (1 - d3) * (1 - Math.pow(1 - fast, 3));
      }

      function frame(now) {
        if (!activeSettlementTrace || String(activeSettlementTrace.areaId) !== String(area.id)) return;
        trace = activeSettlementTrace.layer;
        if (!trace || !map.hasLayer(trace)) return;
        // Перепроецируем линию на каждом кадре: её толщина остаётся
        // равной толщине маршрутной линии даже после смены масштаба.
        layerPoints = contour.map(point => map.latLngToLayerPoint(point));
        const timeProgress = Math.min(1, (now - startedAt) / duration);
        const progress = getTraceDistanceProgress(timeProgress);
        let remaining = totalLength * progress;
        const drawn = [contour[0]];
        for (let i = 0; i < lengths.length; i++) {
          if (remaining >= lengths[i]) { drawn.push(contour[i + 1]); remaining -= lengths[i]; }
          else {
            if (remaining > 0 && lengths[i] > 0.001) {
              const t = remaining / lengths[i], a = layerPoints[i], b = layerPoints[i+1];
              drawn.push(map.layerPointToLatLng(L.point(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t)));
            }
            break;
          }
        }
        const next = makeTaperedSettlementPolygon(drawn, SETTLEMENT_TRACE_BASE_WIDTH, 1);
        if (next) {
          const latlngs = next.getLatLngs();
          trace.setLatLngs(latlngs);
          trace.setStyle({stroke:false, fill:true, fillColor:"#171512", fillOpacity:1});
          settlementTracePaths.set(area.id, drawn.slice());
        }
        if (progress < 1) requestAnimationFrame(frame);
        else {
          activeSettlementTrace = null;
          console.log("Обводка поселения: анимация росчерка завершена", area.id);
        }
      }
      requestAnimationFrame(frame);
      console.log("Обводка поселения: анимация чёрного сужающегося росчерка началась", area.id);
    } catch (error) {
      console.error("Диагностика: ошибка анимации контура поселения", error);
    }
  }

  // Пересобираем контуры при смене масштаба. Все ширины заданы в экранных
  // пикселях, как у маршрутного штриха, поэтому геометрия ленты должна
  // пересчитываться после zoomend, а не масштабироваться вместе с картой.
  map.on("zoomend", function() {
    if (window.settlementContourEditorActive) drawSettlementContourEditorPreview();
    if (settlementBrushPreviewArea) drawSettlementBrushPreview(settlementBrushPreviewArea);
    if (settlementBrushSelectedArea) {
      const selectedArea = settlementBrushSelectedArea;
      settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
      settlementBrushSelectedLayers = createSettlementDryBrushLayers(selectedArea, 0.96);
    }
    if (settlementHoverPath && settlementHoverOutline && settlementHoverArea && settlementContourVariant) {
      settlementHoverPath = makeRandomizedSettlementContour(
        settlementHoverArea, settlementContourVariant.startPoint, settlementContourVariant.approachPoint
      );
      settlementContourVariant.path = settlementHoverPath.slice();
      removeSettlementLayer(settlementHoverOutline);
      settlementHoverOutline = makeTaperedSettlementPolygon(settlementHoverPath, SETTLEMENT_TRACE_BASE_WIDTH, 0.68);
      if (settlementHoverOutline) settlementHoverOutline.addTo(map);
    }
    if (settlementSelectedPath && settlementSelectedOutline) {
      if (settlementSelectedArea && settlementContourVariant && String(settlementContourVariant.areaId) === String(settlementSelectedArea.id)) {
        settlementSelectedPath = makeRandomizedSettlementContour(
          settlementSelectedArea, settlementContourVariant.startPoint, settlementContourVariant.approachPoint
        );
        settlementContourVariant.path = settlementSelectedPath.slice();
      }
      removeSettlementLayer(settlementSelectedOutline);
      settlementSelectedOutline = makeTaperedSettlementPolygon(settlementSelectedPath, SETTLEMENT_TRACE_BASE_WIDTH, 0.95);
      if (settlementSelectedOutline) settlementSelectedOutline.addTo(map);
    }
    // Пересобираем кистевые обводки в новом масштабе, сохраняя текущий
    // прогресс анимации. Завершённые обводки остаются полностью видимыми.
    settlementBrushTraceLayers.forEach(function(oldLayers, id) {
      const area = (window.settlementAreas || []).find(item => String(item.id) === String(id));
      if (!area) return;
      const revealStartPoint = oldLayers._settlementBrushRevealStartPoint || null;
      removeSettlementBrushLayers(oldLayers);
      const newLayers = createSettlementDryBrushLayers(area, 0.96, revealStartPoint);
      newLayers._settlementBrushRevealStartPoint = revealStartPoint;
      settlementBrushTraceLayers.set(String(id), newLayers);

      const activeBrushTrace = activeSettlementBrushTraces.get(String(id));
      const pausedBrushTrace = pausedSettlementBrushTraces.get(String(id));
      if (activeBrushTrace) {
        activeBrushTrace.layers = newLayers;
        applySettlementBrushTraceProgress(activeBrushTrace, activeBrushTrace.progress);
      } else if (pausedBrushTrace) {
        pausedBrushTrace.layers = newLayers;
        applySettlementBrushTraceProgress(pausedBrushTrace, pausedBrushTrace.progress);
      } else {
        newLayers.forEach(layer => {
          const opacity = Number.isFinite(layer.options.opacity) ? layer.options.opacity : 1;
          const fillOpacity = Number.isFinite(layer.options.fillOpacity) ? layer.options.fillOpacity : 1;
          layer.setStyle({ opacity, fillOpacity });
        });
      }
    });

    settlementTracePaths.forEach(function(path, id) {
      const oldLayer = settlementTraceLayers.get(id);
      removeSettlementLayer(oldLayer);
      const newLayer = makeTaperedSettlementPolygon(path, SETTLEMENT_TRACE_BASE_WIDTH, 1);
      if (newLayer) {
        newLayer.addTo(map);
        settlementTraceLayers.set(id, newLayer);
        if (activeSettlementTrace && String(activeSettlementTrace.areaId) === String(id)) {
          activeSettlementTrace.layer = newLayer;
        }
      }
    });
  });

  // Находим ближайшую точку ВИДИМОГО контура сухой кисти к последнему
  // участку подхода маршрута. Геометрическая граница area.points и
  // визуальная brushPoints могут отличаться на несколько экранных пикселей.
  function getVisualBrushContact(area, approachPoint, boundaryPoint) {
    if (!area || !approachPoint || !boundaryPoint || !shouldUseSettlementDryBrush(area)) return null;
    const zoomScale = map.getZoomScale(map.getZoom(), 0);
    const brushScale = Math.pow(zoomScale, 0.43);
    // getSettlementDryBrushPath — это ось мазков, а не их внешний край.
    // Основной мазок имеет ширину до 4.65 * brushScale px, поэтому для
    // контакта берём его внешнюю кромку, а не заставляем жетон доходить
    // до середины уже нарисованной кисти.
    const path = getSettlementBrushErasePolygon(area, 2.4 * brushScale)
      .map(point => map.latLngToLayerPoint(point));
    if (path.length < 3) return null;
    path.push(path[0]);
    const a = map.latLngToLayerPoint(approachPoint);
    const b = map.latLngToLayerPoint(boundaryPoint);
    const dx = b.x - a.x, dy = b.y - a.y;
    const routeLengthSq = dx * dx + dy * dy;
    if (routeLengthSq < 0.0001) return null;
    let best = null;
    const clamp01 = value => Math.max(0, Math.min(1, value));
    const consider = (routeT, contourPoint) => {
      const t = clamp01(routeT);
      const routePoint = L.point(a.x + dx * t, a.y + dy * t);
      const gap = routePoint.distanceTo(contourPoint);
      if (!best || gap < best.gap - 0.001 ||
          (Math.abs(gap - best.gap) <= 0.001 && t < best.routeT)) {
        best = { gap, routeT: t, routePoint, contourPoint };
      }
    };
    for (let i = 1; i < path.length; i++) {
      const c = path[i - 1], d = path[i];
      const ex = d.x - c.x, ey = d.y - c.y;
      const denom = dx * ey - dy * ex;
      const acx = c.x - a.x, acy = c.y - a.y;
      if (Math.abs(denom) > 0.000001) {
        const t = (acx * ey - acy * ex) / denom;
        const u = (acx * dy - acy * dx) / denom;
        if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
          const intersection = L.point(c.x + ex * u, c.y + ey * u);
          consider(t, intersection);
          continue;
        }
      }
      // Проекции обоих концов сегмента контура на маршрут.
      [c, d].forEach(point => {
        const t = clamp01(((point.x - a.x) * dx + (point.y - a.y) * dy) / routeLengthSq);
        consider(t, point);
      });
      // Проекции концов маршрута на сегмент контура.
      const contourLengthSq = ex * ex + ey * ey;
      if (contourLengthSq > 0.0001) {
        [a, b].forEach((point, index) => {
          const u = clamp01(((point.x - c.x) * ex + (point.y - c.y) * ey) / contourLengthSq);
          const projected = L.point(c.x + ex * u, c.y + ey * u);
          consider(index, projected);
        });
      }
    }
    // Если контур оказался далеко от подходящего отрезка, не подменяем
    // исходную точку случайной ближайшей частью города.
    if (!best || best.gap > 24) return null;
    return {
      boundaryPoint: map.layerPointToLatLng(best.contourPoint),
      routePoint: map.layerPointToLatLng(best.routePoint),
      gap: best.gap
    };
  }

  // Каждое поселение на подтверждённом маршруте начинает обводиться
  // отдельно — в момент касания видимой границы, а не условной точки
  // исходного полигона поселения.
  let settlementTraceWaitTimers = [];
  let settlementTraceWaitToken = 0;
  // Поселения, чья обводка была прервана открытием редактора.
  // При следующем подтверждении их анимация запускается заново,
  // даже если маршрутная линия уже прошла соответствующую границу.
  const interruptedSettlementTraceIds = new Set();
  window.cancelPendingRouteSettlementTraces = function() {
    settlementTraceWaitTimers.forEach(timer => clearTimeout(timer));
    settlementTraceWaitTimers = [];
    settlementTraceWaitToken++;
  };
  window.cancelActiveRouteSettlementAnimations = function() {
    // При открытии редактора завершаем только ВИЗУАЛЬНО текущие обводки:
    // на время редактирования город должен оставаться полностью обведённым.
    // ID сохраняем, чтобы после повторного подтверждения обводка заново
    // стартовала с начала, если этот город всё ещё присутствует в маршруте.
    activeSettlementBrushTraces.forEach((state, id) => {
      interruptedSettlementTraceIds.add(String(id));
      applySettlementBrushTraceProgress(state, state.completionProgress || 1);
      activeSettlementBrushTraces.delete(id);
      pausedSettlementBrushTraces.delete(String(id));
    });
    if (activeSettlementTrace) {
      const interrupted = activeSettlementTrace;
      interruptedSettlementTraceIds.add(String(interrupted.areaId));
      if (interrupted.area && Array.isArray(interrupted.contour) && interrupted.contour.length >= 2) {
        const completeLayer = makeTaperedSettlementPolygon(
          interrupted.contour, SETTLEMENT_TRACE_BASE_WIDTH, 1
        );
        if (completeLayer) {
          removeSettlementLayer(interrupted.layer);
          completeLayer.addTo(map);
          settlementTraceLayers.set(interrupted.areaId, completeLayer);
          settlementTracePaths.set(interrupted.areaId, interrupted.contour.slice());
        }
      }
      activeSettlementTrace = null;
    }
  };

  // При фактическом прибытии в конечный город гарантируем, что пауза
  // оставит на карте полностью завершённую обводку, даже если её анимация
  // ещё не успела закончиться во время короткого скрытого перехода.
  window.completeRouteSettlementOutline = function(area) {
    if (!area || area.id == null) return;
    const key = String(area.id);
    const brushState = activeSettlementBrushTraces.get(key);
    if (brushState) {
      applySettlementBrushTraceProgress(brushState, brushState.completionProgress || 1);
      activeSettlementBrushTraces.delete(key);
      pausedSettlementBrushTraces.delete(key);
      return;
    }
    if (activeSettlementTrace && String(activeSettlementTrace.areaId) === key) {
      const active = activeSettlementTrace;
      if (active.area && Array.isArray(active.contour) && active.contour.length >= 2) {
        const completeLayer = makeTaperedSettlementPolygon(
          active.contour, SETTLEMENT_TRACE_BASE_WIDTH, 1
        );
        if (completeLayer) {
          removeSettlementLayer(active.layer);
          completeLayer.addTo(map);
          settlementTraceLayers.set(key, completeLayer);
          settlementTracePaths.set(key, active.contour.slice());
        }
      }
      activeSettlementTrace = null;
      return;
    }
    if (settlementBrushSelectedAreaId && String(settlementBrushSelectedAreaId) === key &&
        settlementBrushSelectedLayers.length) {
      const completedLayers = settlementBrushSelectedLayers;
      settlementBrushTraceLayers.set(key, completedLayers);
      settlementBrushSelectedLayers = [];
      settlementBrushSelectedArea = null;
      settlementBrushSelectedAreaId = null;
      return;
    }
    if (settlementSelectedArea && String(settlementSelectedArea.id) === key &&
        Array.isArray(settlementSelectedPath) && settlementSelectedPath.length >= 2) {
      const completedLayer = makeTaperedSettlementPolygon(
        settlementSelectedPath, SETTLEMENT_TRACE_BASE_WIDTH, 1
      );
      if (completedLayer) {
        removeSettlementLayer(settlementSelectedOutline);
        completedLayer.addTo(map);
        settlementTraceLayers.set(key, completedLayer);
        settlementTracePaths.set(key, settlementSelectedPath.slice());
      }
      settlementSelectedOutline = null;
      settlementSelectedPath = null;
      settlementSelectedArea = null;
      return;
    }
    if (!settlementBrushTraceLayers.has(key) && !settlementTraceLayers.has(key)) {
      if (shouldUseSettlementDryBrush(area)) {
        const completedLayers = createSettlementDryBrushLayers(area, 0.96);
        if (completedLayers.length) settlementBrushTraceLayers.set(key, completedLayers);
      } else {
        const start = window.routeDestinationBoundaryPoint || area.points[0];
        const approach = window.routeDestinationApproachPoint || start;
        const contour = getSettlementContourVariant(area, start, approach, false);
        const completedLayer = makeTaperedSettlementPolygon(contour, SETTLEMENT_TRACE_BASE_WIDTH, 1);
        if (completedLayer) {
          completedLayer.addTo(map);
          settlementTraceLayers.set(key, completedLayer);
          settlementTracePaths.set(key, contour.slice());
        }
      }
    }
  };

  // После перезагрузки восстанавливаем только обводку поселения,
  // внутри которого отряд находится в данный момент. Ранее пройденные
  // поселения повторно не создаём.
  window.restoreStaticSettlementOutlinesAfterReload = function(state = null) {
    if (!Array.isArray(routePoints) || routePoints.length < 2) return;
    const movement = state || window.partyPlaybackState;
    const distance = movement && typeof window.getPartyPlaybackDistance === "function"
      ? window.getPartyPlaybackDistance(movement, window.getSynchronizedRouteNow())
      : Math.max(0, Number(partyPlaybackDistance) || 0);
    const intervals = getRouteSettlementTransitIntervals(routePoints);
    let currentInterval = intervals.find(interval => {
      const start = Math.max(0, Number(interval.start) || 0);
      const end = Math.max(start, Number(interval.end) || start);
      return distance >= start - 0.001 && distance <= end + 0.001;
    }) || null;

    // При терминальной паузе считаем текущим именно конечное поселение,
    // даже если округление расстояния вывело его за край интервала.
    const terminalPaused = movement && typeof window.isTerminalSettlementPaused === "function" &&
      window.isTerminalSettlementPaused(movement);
    if (terminalPaused && window.routeDestinationCityId != null) {
      const destinationId = String(window.routeDestinationCityId);
      const destinationTransit = intervals.find(interval =>
        String(interval.settlementId || '') === destinationId
      );
      if (destinationTransit) currentInterval = destinationTransit;
    }

    let markerInsideSettlement = false;
    let missingCurrentArea = false;
    const currentId = currentInterval && currentInterval.settlementId != null
      ? String(currentInterval.settlementId) : null;

    if (currentId) {
      const area = (window.settlementAreas || []).find(item => String(item.id) === currentId);
      if (area && typeof window.completeRouteSettlementOutline === "function") {
        window.completeRouteSettlementOutline(area);
      } else {
        missingCurrentArea = true;
      }
      markerInsideSettlement = true;
    }

    if (terminalPaused) markerInsideSettlement = true;
    if (markerInsideSettlement) {
      // Не вызываем локальный helper: восстановление должно быть устойчиво
      // к порядку и области объявления функций внутри модуля.
      window.partyMarkerHiddenForSettlementExit = true;
      if (partyMarker && partyMarker._icon) {
        partyMarker._icon.style.transition = "none";
        partyMarker._icon.style.opacity = "0";
        partyMarker._icon.style.pointerEvents = "none";
      }
    }
    window._restoreStaticSettlementOutlinesPending = missingCurrentArea;
  };

  // Рассчитывает порог скрытия жетона отдельно от анимации обводки.
  // Повторный расчёт нужен после асинхронной загрузки областей и при восстановлении маршрута.
  window.updateTerminalMarkerHideDistance = function(routeData = null) {
    const data = routeData || window._pendingTerminalMarkerRouteData || {};
    const route = Array.isArray(window.routePoints) ? window.routePoints : [];
    const destinationId = data.destinationSettlementId != null
      ? String(data.destinationSettlementId)
      : (window.routeDestinationCityId != null ? String(window.routeDestinationCityId) : null);
    if (!destinationId || route.length < 2) return false;

    let boundaryIndex = -1;
    let boundaryPoint = null;
    let approachPoint = null;
    for (let i = 1; i < route.length; i++) {
      if (String(route[i]._routeSettlementId || '') === destinationId &&
          (getRouteSegmentMode(route[i]) === 'settlement-count-only' ||
           getRouteSegmentMode(route[i]) === 'settlement-zero')) {
        boundaryIndex = i;
        boundaryPoint = route[i];
        approachPoint = route[i - 1];
        break;
      }
    }
    if (boundaryIndex < 1 && data.destinationBoundaryPoint) {
      const target = L.latLng(Number(data.destinationBoundaryPoint.lat), Number(data.destinationBoundaryPoint.lng));
      let nearest = Infinity;
      for (let i = 1; i < route.length; i++) {
        const d = map.latLngToLayerPoint(route[i]).distanceTo(map.latLngToLayerPoint(target));
        if (d < nearest) {
          nearest = d;
          boundaryIndex = i;
          boundaryPoint = target;
          approachPoint = route[i - 1];
        }
      }
    }
    if (boundaryIndex < 1 || !boundaryPoint || !approachPoint) return false;

    let contactSegmentEndIndex = boundaryIndex;
    // При конечном городе внешняя точка кисти и начало скрытого перехода
    // сохранены двумя одинаковыми соседними узлами. Для повторного расчёта
    // берём реальный входящий отрезок перед этой парой, а не нулевой отрезок.
    if (boundaryIndex >= 2 &&
        map.latLngToLayerPoint(route[boundaryIndex - 1]).distanceTo(
          map.latLngToLayerPoint(route[boundaryIndex])
        ) < 0.01) {
      approachPoint = route[boundaryIndex - 2];
      boundaryPoint = route[boundaryIndex - 1];
      contactSegmentEndIndex = boundaryIndex - 1;
    }

    const area = (window.settlementAreas || []).find(item => String(item.id) === destinationId);
    if (!area) return false;

    let distance = window.getRouteTravelLength(route.slice(0, boundaryIndex + 1));
    const visualContact = getVisualBrushContact(area, approachPoint, boundaryPoint);
    if (visualContact) {
      distance = window.getRouteTravelLength(route.slice(0, contactSegmentEndIndex)) +
        window.getRouteTravelLength([approachPoint, visualContact.routePoint]);
    }
    if (!Number.isFinite(distance) || distance < 0) return false;

    window.routeTerminalMarkerHideDistance = distance;
    // Здесь только рассчитываем порог. Не вызываем локальные функции
    // управления маркером: эта функция может запускаться из обработчика
    // восстановления маршрута, находящегося в другой области видимости.
    // Текущая видимость будет обновлена штатным обработчиком состояния/тика.
    return true;
  };

  function waitForRouteRevealThenTraceSettlements(routeData) {
    settlementTraceWaitTimers.forEach(timer => clearTimeout(timer));
    settlementTraceWaitTimers = [];
    const waitToken = ++settlementTraceWaitToken;
    const route = Array.isArray(window.routePoints) ? window.routePoints.slice() : [];
    window._pendingTerminalMarkerRouteData = routeData || {};
    if (route.length < 2) return;
    window.updateTerminalMarkerHideDistance(routeData);
    const rawChangedFromIndex = Number(routeData.animationStartIndex);
    const changedFromIndex = Number.isFinite(rawChangedFromIndex)
      ? Math.max(0, Math.floor(rawChangedFromIndex)) : 0;

    const targets = [];
    const seenIds = new Set();
    const intermediateIds = Array.isArray(routeData.intermediateSettlementIds)
      ? routeData.intermediateSettlementIds.map(String) : [];
    const destinationId = routeData.destinationSettlementId != null
      ? String(routeData.destinationSettlementId) : null;
    const orderedIds = [...intermediateIds, ...(destinationId ? [destinationId] : [])];

    const startCityTransitIds = new Set(window.getRouteSettlementTransitIntervals(route)
      .filter(interval => Number(interval.start) <= 0.001 && interval.settlementId)
      .map(interval => String(interval.settlementId)));
    orderedIds.forEach(id => {
      if (!id || seenIds.has(id)) return;
      seenIds.add(id);
      const isStartCity = startCityTransitIds.has(String(id));
      // Стартовый город уже обведён до открытия редактора. При выходе
      // из него сохраняем этот завершённый контур статичным: не добавляем
      // город в очередь анимаций и не удаляем его слой. Сам слой снимет
      // tickPartyPlayback только после пересечения внешней границы.
      if (isStartCity) return;
      let boundaryIndex = -1;
      let boundaryPoint = null;
      let approachPoint = null;

      // У промежуточных поселений входная точка помечена специальным
      // сегментом settlement-count-only и несёт ID своего поселения.
      for (let i = 1; i < route.length; i++) {
        if (String(route[i]._routeSettlementId || '') === id &&
            route[i]._routeSegmentMode === 'settlement-count-only') {
          boundaryIndex = i;
          boundaryPoint = route[i];
          approachPoint = route[i - 1];
          break;
        }
      }

      // Для конечного города запускаем обводку на ВНЕШНЕМ входе
      // визуальной кисти. В маршруте этот узел явно помечен как
      // settlement-count-only и расположен перед скрытым переходом
      // к внутренней границе area.points. Если искать ближайший узел
      // к destinationBoundaryPoint, мы получим внутреннюю границу:
      // линия там уже скрыта маской, поэтому визуальный запуск опаздывает.
      if (id === destinationId) {
        let outerEntryIndex = -1;
        for (let i = 1; i < route.length; i++) {
          if (String(route[i]._routeSettlementId || '') === id &&
              route[i]._routeSegmentMode === 'settlement-count-only') {
            outerEntryIndex = i;
            break;
          }
        }

        if (outerEntryIndex >= 1) {
          boundaryIndex = outerEntryIndex;
          boundaryPoint = route[outerEntryIndex];
          approachPoint = route[outerEntryIndex - 1];
        } else if (routeData.destinationBoundaryPoint) {
          // Совместимость со старыми маршрутами, в которых внешний вход
          // ещё не был отдельно размечен.
          const targetPoint = L.latLng(
            Number(routeData.destinationBoundaryPoint.lat),
            Number(routeData.destinationBoundaryPoint.lng)
          );
          let nearestDistance = Infinity;
          let nearestIndex = -1;
          for (let i = 1; i < route.length; i++) {
            const distance = map.latLngToLayerPoint(route[i]).distanceTo(
              map.latLngToLayerPoint(targetPoint)
            );
            if (distance < nearestDistance) {
              nearestDistance = distance;
              nearestIndex = i;
            }
          }
          if (nearestIndex >= 1) {
            boundaryIndex = nearestIndex;
            boundaryPoint = targetPoint;
            approachPoint = route[nearestIndex - 1] || (routeData.destinationApproachPoint
              ? L.latLng(Number(routeData.destinationApproachPoint.lat), Number(routeData.destinationApproachPoint.lng))
              : null);
          }
        }
      }

      let contactSegmentEndIndex = boundaryIndex;
      if (id === destinationId && boundaryIndex >= 2 &&
          map.latLngToLayerPoint(route[boundaryIndex - 1]).distanceTo(
            map.latLngToLayerPoint(route[boundaryIndex])
          ) < 0.01) {
        approachPoint = route[boundaryIndex - 2];
        boundaryPoint = route[boundaryIndex - 1];
        contactSegmentEndIndex = boundaryIndex - 1;
      }

      if (boundaryIndex < 1 || !boundaryPoint) {
        console.warn('Анимация поселения: не найдена точка входа на маршруте', id);
        return;
      }
      // Обычно поселения до начала изменённого участка остаются статичными.
      // Исключение — обводка, прерванная открытием редактора: если город
      // сохранился в маршруте, после подтверждения её нужно проиграть заново.
      if (boundaryIndex <= changedFromIndex &&
          !interruptedSettlementTraceIds.has(String(id))) return;

      let distance = window.getRouteTravelLength(route.slice(0, boundaryIndex + 1));
      const area = (window.settlementAreas || []).find(item => String(item.id) === id);
      if (!area) {
        console.warn('Анимация поселения: область пока не загружена', id);
        return;
      }
      const visualContact = getVisualBrushContact(area, approachPoint, boundaryPoint);
      if (visualContact) {
        // Время остановки линии рассчитывается по месту, где она касается
        // видимого мазка; сама обводка также стартует именно с этой точки.
        distance = window.getRouteTravelLength(route.slice(0, contactSegmentEndIndex)) +
          window.getRouteTravelLength([approachPoint, visualContact.routePoint]);
        boundaryPoint = visualContact.boundaryPoint;
      }
      if (id === destinationId) {
        // Маркер должен исчезнуть в той же точке визуального контакта,
        // а не позже — на внутренней геометрической границе города.
        window.routeTerminalMarkerHideDistance = distance;
      }
      // Для промежуточного поселения находим выходную внешнюю границу.
      // Внутренний путь между входом и выходом проходит по транзитным
      // сегментам и должен анимироваться параллельно сухой кисти.
      let pauseDistance = distance;
      if (id !== destinationId) {
        for (let i = boundaryIndex + 1; i < route.length; i++) {
          if (String(route[i]._routeSettlementId || '') === id &&
              route[i]._routeSegmentMode === 'settlement-count-only') {
            pauseDistance = window.getRouteTravelLength(route.slice(0, i + 1));
            break;
          }
        }
      }
      targets.push({ id, area, distance, pauseDistance, boundaryPoint, approachPoint });
    });

    targets.sort((a, b) => a.distance - b.distance);
    if (!targets.length) return;

    // Темп росчерка кисти синхронизирован с последним интервалом пунктира.
    const displayPoints = typeof window.createRouteDisplayPoints === 'function'
      ? window.createRouteDisplayPoints(route, []) : route;
    let screenLength = 0;
    for (let i = 1; i < displayPoints.length; i++) {
      screenLength += map.latLngToLayerPoint(displayPoints[i - 1]).distanceTo(
        map.latLngToLayerPoint(displayPoints[i])
      );
    }
    const dashStep = Number(window.routeLineDashStep) || 18;
    const minimumDashDelay = Number(window.routeLineMinimumDashDelay) || 95;
    const firstDashDelay = Number(window.routeLineFirstDashDelay) || 240;
    const dashAcceleration = Number(window.routeLineDashAcceleration) || 2;
    const zoomSpeedMultiplier = typeof window.getRouteZoomSpeedMultiplier === 'function'
      ? window.getRouteZoomSpeedMultiplier() : 1;
    const referenceLength = screenLength * zoomSpeedMultiplier;
    const finalDashIndex = Math.max(0, Math.floor((referenceLength - 2) / dashStep));
    window.settlementTraceDashInterval = Math.max(
      minimumDashDelay, firstDashDelay - finalDashIndex * dashAcceleration
    );

    // Рассчитываем длительность каждой городской обводки заранее.
    // Для промежуточных поселений часть этого времени будет перекрыта
    // прохождением скрытых транзитных сегментов внутри поселения.
    targets.forEach(target => {
      if (shouldUseSettlementDryBrush(target.area)) {
        const brushPath = getSettlementDryBrushPath(target.area);
        let contourLength = 0;
        for (let i = 1; i < brushPath.length; i++) {
          contourLength += brushPath[i - 1].distanceTo(brushPath[i]);
        }
        const halfContourLength = contourLength / 2;
        const dashStep = Number(window.routeLineDashStep) || 18;
        const revealFadeDuration = Number(window.routeLineRevealFadeDuration) || 220;
        const routeDashInterval = Math.max(
          Number(window.routeLineMinimumDashDelay) || 120,
          Number(window.settlementTraceDashInterval) || 120
        );
        const zoomSpeedMultiplier = typeof window.getRouteZoomSpeedMultiplier === 'function'
          ? window.getRouteZoomSpeedMultiplier() : 1;
        const dashInterval = routeDashInterval * 0.65 * zoomSpeedMultiplier;
        const baseTraceDuration = Math.max(
          revealFadeDuration,
          (halfContourLength / dashStep) * dashInterval + revealFadeDuration
        );
        const completionProgress = getSettlementDryBrushCompletionProgress(
          target.area, target.boundaryPoint, dashStep
        );
        target.traceDuration = baseTraceDuration * completionProgress;
      } else {
        const contour = getSettlementContourVariant(
          target.area, target.boundaryPoint, target.approachPoint, true
        );
        let contourLength = 0;
        for (let i = 1; i < contour.length; i++) {
          contourLength += map.latLngToLayerPoint(contour[i - 1]).distanceTo(
            map.latLngToLayerPoint(contour[i])
          );
        }
        target.traceDuration = Math.max(1200, Math.min(6000,
          contourLength * 2.8 * zoomSpeedMultiplier));
      }
    });

    if (typeof window.setRouteSettlementAnimationPauses === 'function') {
      window.setRouteSettlementAnimationPauses(targets
        // Конечный город не создаёт паузу: после него нет следующего
        // участка маршрута. Его контур только ожидает фактического прибытия
        // линии, поэтому скорость последнего участка остаётся обычной.
        .filter(target => target.id !== destinationId)
        .map(target => ({
          areaId: target.id,
          // Для промежуточных городов точка паузы — выходная граница.
          // Саму обводку запускаем по прежней входной точке.
          distance: target.pauseDistance,
          startDistance: target.distance,
          // Следующий участок начинается только после полного завершения
          // визуальной обводки, как и в уже исправленном сценарии.
          duration: Math.max(0, Number(target.traceDuration) || 0)
        })));
    }

    targets.forEach(target => {
      function check() {
        if (waitToken !== settlementTraceWaitToken) return;
        if (target.id === destinationId &&
            typeof window.isTerminalSettlementPaused === 'function' &&
            window.isTerminalSettlementPaused(window.partyPlaybackState)) {
          window.completeRouteSettlementOutline(target.area);
          return;
        }
        const restartInterruptedTrace = interruptedSettlementTraceIds.has(String(target.id));
        const delay = restartInterruptedTrace
          ? null
          : (typeof window.getRouteBoundaryArrivalDelay === 'function'
            ? window.getRouteBoundaryArrivalDelay(target.distance) : null);
        if (delay !== null && delay > 0) {
          const timer = setTimeout(check, Math.min(40, Math.max(12, delay)));
          settlementTraceWaitTimers.push(timer);
          return;
        }

        // Точка входа передаётся непосредственно анимации этого города;
        // глобальные координаты конечного поселения не подменяются.
        console.log('Обводка поселения: маршрут дошёл до границы, запускаем анимацию', {
          cityId: target.id,
          distance: target.distance,
          delayUntilBoundary: delay
        });
        // До этого момента промежуточный город показывается статичной кистью.
        // Убираем только его статичный слой, чтобы анимация была видна ровно
        // тогда, когда маршрут дошёл до его границы.
        removeRouteIntermediateCityOutline(target.id);
        // Убираем отметку до запуска: новая анимация уже отвечает за город.
        interruptedSettlementTraceIds.delete(String(target.id));
        animateSettlementTrace(target.area, target.boundaryPoint, target.approachPoint);
      }

      const timer = setTimeout(check, 20);
      settlementTraceWaitTimers.push(timer);
    });
  }

  // ============================================================
  // РЕДАКТОР ПОСТОЯННОЙ ГЕОМЕТРИИ СУХОЙ КИСТИ
  // Изменяет только area.brushPoints. area.points и механика игры
  // остаются нетронутыми.
  // ============================================================
  let settlementContourEditorAreaId = null;
  let settlementContourEditorPoints = [];
  let settlementContourEditorSelectedIndex = -1;
  let settlementContourEditorAddMode = false;
  let settlementContourEditorHandles = [];
  let settlementContourEditorBrushLayers = [];
  let settlementCenterEditMode = false;
  let settlementCenterMarker = null;

  function getSettlementEditorAreaLabel(area) {
    const customName = area.name || area.title || area.label;
    if (customName) return String(customName);
    if (area.type === "terrain") return "Труднопроходимая местность · " + String(area.id).slice(-6);
    const kind = area.type === "city" ? "Город" : area.type === "village" ? "Деревня" : "Поселение";
    return kind + " · " + String(area.id).slice(-6);
  }

  function refreshSettlementContourEditorOptions() {
    const select = document.getElementById("settlement-contour-area-select");
    if (!select) return;
    const previous = settlementContourEditorAreaId || select.value;
    const settlements = Array.isArray(window.settlementAreas) ? window.settlementAreas : [];
    const terrain = Array.isArray(window.terrainAreas) ? window.terrainAreas : [];
    const areas = [...settlements, ...terrain];
    select.innerHTML = "";
    areas.forEach(area => {
      const option = document.createElement("option");
      option.value = String(area.id);
      option.textContent = getSettlementEditorAreaLabel(area);
      select.appendChild(option);
    });
    if (areas.some(area => String(area.id) === String(previous))) select.value = String(previous);
    else if (areas.length) select.value = String(areas[0].id);
    select.disabled = areas.length === 0;
    const startButton = document.getElementById("settlement-contour-editor-start");
    if (startButton) startButton.disabled = areas.length === 0;
  }

  function simplifySettlementEditorPoints(points, tolerance = 8) {
    if (!Array.isArray(points) || points.length < 3) return [];
    const screenPoints = points.map(point => map.latLngToLayerPoint(point));
    let simplified = typeof L.LineUtil.simplify === "function"
      ? L.LineUtil.simplify(screenPoints, tolerance)
      : screenPoints;
    if (!Array.isArray(simplified) || simplified.length < 3) simplified = screenPoints;
    if (simplified.length > 3 && simplified[0].distanceTo(simplified[simplified.length - 1]) < 2) simplified = simplified.slice(0, -1);
    // На всякий случай убираем соседние почти совпадающие вершины.
    const cleaned = [];
    simplified.forEach(point => {
      if (!cleaned.length || cleaned[cleaned.length - 1].distanceTo(point) >= 2) cleaned.push(point);
    });
    if (cleaned.length > 3 && cleaned[0].distanceTo(cleaned[cleaned.length - 1]) < 2) cleaned.pop();
    return cleaned.map(point => {
      const latlng = map.layerPointToLatLng(point);
      return { lat: latlng.lat, lng: latlng.lng };
    });
  }

  function getSelectedSettlementContourEditorArea() {
    const id = String(settlementContourEditorAreaId);
    const settlement = (window.settlementAreas || []).find(area => String(area.id) === id);
    if (settlement) return settlement;
    return (window.terrainAreas || []).find(area => String(area.id) === id) || null;
  }

  function ensureSettlementContourEditorPane() {
    let pane = map.getPane("settlement-contour-editor-pane");
    if (!pane) pane = map.createPane("settlement-contour-editor-pane");
    pane.style.zIndex = "690";
    pane.style.pointerEvents = "auto";
    return pane;
  }

  function removeSettlementContourEditorVisuals() {
    settlementContourEditorHandles.forEach(marker => {
      if (marker && map.hasLayer(marker)) map.removeLayer(marker);
    });
    settlementContourEditorHandles = [];
    settlementContourEditorBrushLayers = removeSettlementBrushLayers(settlementContourEditorBrushLayers);
  }

  function drawSettlementContourEditorPreview() {
    settlementContourEditorBrushLayers = removeSettlementBrushLayers(settlementContourEditorBrushLayers);
    const area = getSelectedSettlementContourEditorArea();
    if (!area || settlementContourEditorPoints.length < 3) return;
    if (area.type === "terrain") {
      const polygon = L.polygon(settlementContourEditorPoints, {
        color: "#e5bd70",
        weight: 2,
        opacity: 0.95,
        fillColor: "#b18a4d",
        fillOpacity: 0.12,
        dashArray: "6 5",
        interactive: false
      }).addTo(map);
      settlementContourEditorBrushLayers.push(polygon);
      return;
    }
    const previewArea = { ...area, brushPoints: settlementContourEditorPoints };
    settlementContourEditorBrushLayers = createSettlementDryBrushLayers(previewArea, 0.98);
  }

  function setSettlementContourEditorStatus(message) {
    const status = document.getElementById("settlement-contour-editor-status");
    if (status) status.textContent = message;
    const removeButton = document.getElementById("settlement-contour-editor-remove");
    if (removeButton) removeButton.disabled = settlementContourEditorSelectedIndex < 0 || settlementContourEditorPoints.length <= 3;
    const saveButton = document.getElementById("settlement-contour-editor-save");
    if (saveButton) saveButton.disabled = settlementContourEditorPoints.length < 3;
    const addButton = document.getElementById("settlement-contour-editor-add");
    if (addButton) {
      addButton.textContent = settlementContourEditorAddMode ? "Добавление точек: включено" : "Добавить точки на карте";
      addButton.style.background = settlementContourEditorAddMode ? "#526044" : "#393027";
    }
  }

  function renderSettlementContourEditorHandles() {
    settlementContourEditorHandles.forEach(marker => {
      if (marker && map.hasLayer(marker)) map.removeLayer(marker);
    });
    settlementContourEditorHandles = [];
    settlementContourEditorPoints.forEach((point, index) => {
      const selected = index === settlementContourEditorSelectedIndex;
      ensureSettlementContourEditorPane();
      const marker = L.marker([point.lat, point.lng], {
        pane: "settlement-contour-editor-pane",
        draggable: true,
        keyboard: false,
        zIndexOffset: 1000,
        icon: L.divIcon({
          className: "settlement-contour-editor-handle-wrap",
          html: `<div style="width:${selected ? 18 : 14}px;height:${selected ? 18 : 14}px;border-radius:50%;background:${selected ? "#f0c76a" : "#f5eee0"};border:2px solid #211b16;box-shadow:0 1px 5px #000b;"></div>`,
          iconSize: [selected ? 22 : 18, selected ? 22 : 18],
          iconAnchor: [selected ? 11 : 9, selected ? 11 : 9]
        })
      });
      marker.on("click", event => {
        if (event.originalEvent) L.DomEvent.stopPropagation(event.originalEvent);
        settlementContourEditorSelectedIndex = index;
        renderSettlementContourEditorHandles();
        setSettlementContourEditorStatus("Выбрана точка " + (index + 1) + " из " + settlementContourEditorPoints.length + ". Её можно перетащить или удалить.");
      });
      marker.on("drag", event => {
        const latlng = event.target.getLatLng();
        settlementContourEditorPoints[index] = { lat: latlng.lat, lng: latlng.lng };
      });
      marker.on("dragend", () => {
        const latlng = marker.getLatLng();
        settlementContourEditorPoints[index] = { lat: latlng.lat, lng: latlng.lng };
        drawSettlementContourEditorPreview();
        setSettlementContourEditorStatus("Точка " + (index + 1) + " перемещена. Не забудь сохранить контур.");
      });
      marker.addTo(map);
      settlementContourEditorHandles.push(marker);
    });
  }

  function refreshSettlementContourEditor() {
    drawSettlementContourEditorPreview();
    renderSettlementContourEditorHandles();
    setSettlementContourEditorStatus("Точек: " + settlementContourEditorPoints.length + ". Перетаскивай точки или включи добавление новых.");
  }

  function removeSettlementCenterMarker() {
    if (settlementCenterMarker && map.hasLayer(settlementCenterMarker)) map.removeLayer(settlementCenterMarker);
    settlementCenterMarker = null;
  }

  function renderSettlementCenterMarker() {
    removeSettlementCenterMarker();
    const area = getSelectedSettlementContourEditorArea();
    if (!area || area.type === "terrain" || !area.center || !Number.isFinite(Number(area.center.lat)) || !Number.isFinite(Number(area.center.lng))) return;
    const marker = L.marker([Number(area.center.lat), Number(area.center.lng)], {
      draggable: true,
      zIndexOffset: 1800,
      icon: L.divIcon({
        className: "settlement-center-editor-marker",
        html: '<div style="width:22px;height:22px;border-radius:50%;background:#e5b94f;border:3px solid #211b16;box-shadow:0 0 0 3px #f5e7bd99,0 2px 7px #000b;display:flex;align-items:center;justify-content:center;color:#211b16;font:bold 15px Georgia;">✦</div>',
        iconSize: [28, 28], iconAnchor: [14, 14]
      })
    }).addTo(map);
    marker.on("dragend", async function(event) {
      const p = event.target.getLatLng();
      const selected = getSelectedSettlementContourEditorArea();
      if (!selected || !pointInSettlement({ lat: p.lat, lng: p.lng }, selected.points || [])) {
        renderSettlementCenterMarker();
        setSettlementContourEditorStatus("Центр должен находиться внутри невидимой границы поселения.");
        return;
      }
      await saveSettlementCenter(selected, p);
    });
    settlementCenterMarker = marker;
  }

  async function saveSettlementCenter(area, latlng) {
    if (!area || area.type === "terrain") return;
    const center = { lat: Number(Number(latlng.lat).toFixed(7)), lng: Number(Number(latlng.lng).toFixed(7)) };
    if (!pointInSettlement(center, area.points || [])) {
      setSettlementContourEditorStatus("Нельзя поставить центр за пределами невидимой границы поселения.");
      return;
    }
    try {
      if (!window.dndFirebase || typeof window.dndFirebase.saveSettlementCenter !== "function") throw new Error("Firebase ещё не готов к сохранению центра");
      await window.dndFirebase.saveSettlementCenter(area.id, center);
      area.center = center;
      renderSettlementCenterMarker();
      setSettlementContourEditorStatus("Центр поселения сохранён. Координаты: " + center.lat + ", " + center.lng + ".");
    } catch (error) {
      console.error("Не удалось сохранить центр поселения:", error);
      setSettlementContourEditorStatus("Ошибка сохранения центра: " + error.message);
      alert("Не удалось сохранить центр поселения в Firebase: " + error.message);
    }
  }

  function toggleSettlementCenterEditMode() {
    const area = getSelectedSettlementContourEditorArea();
    if (!area || area.type === "terrain") {
      setSettlementContourEditorStatus("Центр можно задавать только для города или деревни.");
      return;
    }
    settlementCenterEditMode = !settlementCenterEditMode;
    const button = document.getElementById("settlement-center-edit-toggle");
    if (button) {
      button.textContent = settlementCenterEditMode ? "Завершить установку центра" : "Указать центр поселения";
      button.style.background = settlementCenterEditMode ? "#526044" : "#393027";
    }
    settlementContourEditorAddMode = false;
    setSettlementContourEditorStatus(settlementCenterEditMode
      ? "Режим установки центра включён. Нажми внутри невидимой границы поселения. Существующий центр можно перетащить."
      : "Режим установки центра выключен.");
  }

  function closeSettlementContourEditor() {
    window.settlementContourEditorActive = false;
    window.handleSettlementContourEditorMapClick = null;
    settlementContourEditorAddMode = false;
    settlementCenterEditMode = false;
    removeSettlementCenterMarker();
    settlementContourEditorSelectedIndex = -1;
    removeSettlementContourEditorVisuals();
    const panel = document.getElementById("settlement-contour-editor-controls");
    if (panel) panel.style.display = "none";
    const startButton = document.getElementById("settlement-contour-editor-start");
    if (startButton) startButton.textContent = "Открыть редактор контура";
    const status = document.getElementById("settlement-contour-editor-status");
    if (status) status.textContent = "Редактор закрыт.";
  }

  function openSettlementContourEditor() {
    if (!window.dndFirebase || !window.dndFirebase.isGameMaster) return;
    if (window.routeMode || window.routePendingConfirmation || window.settlementDrawingActive) {
      setSettlementContourEditorStatus("Сначала заверши или отмени прокладку маршрута/обводку области.");
      return;
    }
    const select = document.getElementById("settlement-contour-area-select");
    const areaId = select ? select.value : null;
    const area = [...(window.settlementAreas || []), ...(window.terrainAreas || [])]
      .find(item => String(item.id) === String(areaId));
    if (!area) {
      setSettlementContourEditorStatus("Сначала выбери область в списке.");
      return;
    }
    closeSettlementContourEditor();
    settlementContourEditorAreaId = String(area.id);
    if (area.type === "terrain") {
      // У зон местности храним только значимые вершины контура:
      // частые точки, полученные при обводке мышью, не дают заметной
      // визуальной точности, но сильно замедляют пересчёт маршрута.
      settlementContourEditorPoints = simplifySettlementEditorPoints(area.points || [], 8);
    } else {
      settlementContourEditorPoints = Array.isArray(area.brushPoints) && area.brushPoints.length >= 3
        ? area.brushPoints.map(point => ({ lat: Number(point.lat), lng: Number(point.lng) }))
        : simplifySettlementEditorPoints(area.points, 8);
    }
    settlementContourEditorSelectedIndex = -1;
    settlementContourEditorAddMode = false;
    window.settlementContourEditorActive = true;
    window.handleSettlementContourEditorMapClick = function(latlng) {
      if (!window.settlementContourEditorActive) return;
      const selectedArea = getSelectedSettlementContourEditorArea();
      if (settlementCenterEditMode) {
        if (!selectedArea || selectedArea.type === "terrain") return;
        if (!pointInSettlement({ lat: latlng.lat, lng: latlng.lng }, selectedArea.points || [])) {
          setSettlementContourEditorStatus("Точка находится за пределами поселения. Выбери место внутри невидимой границы.");
          return;
        }
        saveSettlementCenter(selectedArea, latlng);
        return;
      }
      if (!settlementContourEditorAddMode) return;
      const clickPoint = map.latLngToLayerPoint(latlng);
      let insertIndex = settlementContourEditorPoints.length;
      let nearestDistance = Infinity;
      if (settlementContourEditorPoints.length >= 2) {
        for (let i = 0; i < settlementContourEditorPoints.length; i++) {
          const nextIndex = (i + 1) % settlementContourEditorPoints.length;
          const a = map.latLngToLayerPoint(settlementContourEditorPoints[i]);
          const b = map.latLngToLayerPoint(settlementContourEditorPoints[nextIndex]);
          const dx = b.x - a.x, dy = b.y - a.y;
          const lengthSquared = dx * dx + dy * dy || 1;
          const t = Math.max(0, Math.min(1, ((clickPoint.x - a.x) * dx + (clickPoint.y - a.y) * dy) / lengthSquared));
          const projected = L.point(a.x + dx * t, a.y + dy * t);
          const distance = clickPoint.distanceTo(projected);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            insertIndex = nextIndex === 0 ? settlementContourEditorPoints.length : nextIndex;
          }
        }
      }
      settlementContourEditorPoints.splice(insertIndex, 0, { lat: latlng.lat, lng: latlng.lng });
      settlementContourEditorSelectedIndex = insertIndex;
      refreshSettlementContourEditor();
      setSettlementContourEditorStatus("Добавлена точка " + (insertIndex + 1) + " на ближайшем участке контура. Не забудь сохранить изменения.");
    };
    const panel = document.getElementById("settlement-contour-editor-controls");
    if (panel) panel.style.display = "flex";
    const startButton = document.getElementById("settlement-contour-editor-start");
    if (startButton) startButton.textContent = "Редактор открыт";
    refreshSettlementContourEditor();
    renderSettlementCenterMarker();
    const centerButton = document.getElementById("settlement-center-edit-toggle");
    if (centerButton) {
      centerButton.disabled = area.type === "terrain";
      centerButton.textContent = "Указать центр поселения";
      centerButton.style.background = "#393027";
    }
    setSettlementContourEditorStatus("Редактируется: " + getSettlementEditorAreaLabel(area) + ". Перетаскивай вершины; для новых включи добавление точек и нажимай на карту.");
  }

  async function saveSettlementContourEditor() {
    const area = getSelectedSettlementContourEditorArea();
    if (!area || settlementContourEditorPoints.length < 3) {
      setSettlementContourEditorStatus("Для сохранения нужно не меньше трёх точек.");
      return;
    }
    try {
      const cleanPoints = settlementContourEditorPoints.map(point => ({
        lat: Number(Number(point.lat).toFixed(7)),
        lng: Number(Number(point.lng).toFixed(7))
      }));
      if (area.type === "terrain") {
        if (typeof window.dndFirebase.saveTerrainPoints !== "function") {
          throw new Error("Firebase ещё не готов к сохранению местности");
        }
        await window.dndFirebase.saveTerrainPoints(area.id, cleanPoints);
        area.points = cleanPoints;
      } else {
        if (typeof window.dndFirebase.saveSettlementBrushPoints !== "function") {
          throw new Error("Firebase ещё не готов к сохранению контура");
        }
        await window.dndFirebase.saveSettlementBrushPoints(area.id, cleanPoints);
      }
      settlementContourEditorPoints = cleanPoints;
      drawSettlementContourEditorPreview();
      setSettlementContourEditorStatus(area.type === "terrain"
        ? "Контур местности сохранён."
        : "Контур сохранён. Он записан отдельно от невидимой области поселения.");
    } catch (error) {
      console.error("Не удалось сохранить геометрию кисти:", error);
      setSettlementContourEditorStatus("Ошибка сохранения: " + error.message);
      alert("Не удалось сохранить контур кисти в Firebase: " + error.message);
    }
  }

  function createSettlementToolbar() {
    if (window.settlementToolbar || !window.dndFirebase || !window.dndFirebase.isGameMaster) return;
    const toolbar = document.createElement("div");
    toolbar.id = "settlement-tools";
    toolbar.style.cssText = `
      position:fixed;top:12px;right:12px;z-index:3500;
      display:flex;flex-direction:column;gap:7px;padding:10px;
      background:#211b16;color:#eee2c8;border:2px solid #d6b46a;
      border-radius:9px;box-shadow:0 3px 14px #0009;font:13px Georgia,serif;
      max-width:250px;max-height:82vh;overflow-y:auto;
    `;
    toolbar.innerHTML = `
      <div style="font-weight:bold;text-align:center;">Области поселений</div>
      <button type="button" data-settlement-type="city">Обвести город</button>
      <button type="button" data-settlement-type="village">Обвести деревню</button>
      <button type="button" data-settlement-type="terrain">Обвести труднопроходимую местность</button>
      <button type="button" id="settlement-draw-cancel" disabled>Отменить обводку</button>
      <button type="button" id="settlement-brush-test-toggle">Тест кисти А: выключен</button>
      <div style="border-top:1px solid #756044;padding-top:7px;margin-top:2px;font-weight:bold;">Форма кисти</div>
      <select id="settlement-contour-area-select" style="width:100%;padding:6px;background:#eee2c8;color:#211b16;border:1px solid #756044;border-radius:4px;"></select>

    `;
    document.body.appendChild(toolbar);
    window.settlementToolbar = toolbar;

    toolbar.querySelectorAll("[data-settlement-type]").forEach(button => {
      button.style.cssText = "padding:7px;background:#393027;color:#eee2c8;border:1px solid #756044;border-radius:5px;";

        beginSettlementDrawing(this.dataset.settlementType);

    const cancel = toolbar.querySelector("#settlement-draw-cancel");
    cancel.style.cssText = "padding:6px;background:#4a2924;color:#fff;border:1px solid #8d5146;border-radius:5px;";
    cancel.addEventListener("click", cancelSettlementDrawing);

    const brushToggle = toolbar.querySelector("#settlement-brush-test-toggle");
    brushToggle.style.cssText = "padding:7px;background:#393027;color:#eee2c8;border:1px solid #756044;border-radius:5px;";
    brushToggle.addEventListener("click", function() {
      settlementBrushTestEnabled = !settlementBrushTestEnabled;
      this.textContent = settlementBrushTestEnabled ? "Тест кисти А: включён" : "Тест кисти А: выключен";
      this.style.background = settlementBrushTestEnabled ? "#526044" : "#393027";
      // Убираем только графические слои теста; маршрутная механика остаётся нетронутой.
      settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
      settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
      settlementBrushPreviewArea = null;
      settlementBrushSelectedArea = null;
      settlementBrushSelectedAreaId = null;
      restoreRouteLayersForSettlement();
      removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
      removeSettlementLayer(settlementSelectedOutline); settlementSelectedOutline = null;
      if (settlementBrushTestEnabled) {
        setSettlementToolStatus("Тест сухой кисти А включён. Начни прокладку маршрута и наведи курсор на поселение.");
      } else {
        setSettlementToolStatus("Тест кисти выключен. Возвращён прежний способ отображения обводки.");
        if (window.routeMode && !routeFinished && lastCursorPosition && window.previewSettlementAt) {
          window.previewSettlementAt(lastCursorPosition);
        }
      }
    });

    const contourSelect = toolbar.querySelector("#settlement-contour-area-select");
    const editorStart = toolbar.querySelector("#settlement-contour-editor-start");
    const editorAdd = toolbar.querySelector("#settlement-contour-editor-add");
    const editorRemove = toolbar.querySelector("#settlement-contour-editor-remove");
    const editorReset = toolbar.querySelector("#settlement-contour-editor-reset");
    const editorSave = toolbar.querySelector("#settlement-contour-editor-save");
    const editorClose = toolbar.querySelector("#settlement-contour-editor-close");
    const centerToggle = toolbar.querySelector("#settlement-center-edit-toggle");
    [editorStart, editorAdd, editorRemove, editorReset, editorSave, editorClose, centerToggle].forEach(button => {
      button.style.cssText = "padding:7px;background:#393027;color:#eee2c8;border:1px solid #756044;border-radius:5px;";
    });
    editorStart.addEventListener("click", function() {
      if (window.settlementContourEditorActive) {
        closeSettlementContourEditor();
        return;
      }
      openSettlementContourEditor();
    });
    contourSelect.addEventListener("change", function() {
      if (window.settlementContourEditorActive) {
        closeSettlementContourEditor();
        openSettlementContourEditor();
      }
    });
    editorAdd.addEventListener("click", function() {
      if (!window.settlementContourEditorActive) return;
      settlementContourEditorAddMode = !settlementContourEditorAddMode;
      setSettlementContourEditorStatus(settlementContourEditorAddMode
        ? "Режим добавления включён: нажимай на карту, чтобы ставить новые точки."
        : "Режим добавления выключен. Теперь можно спокойно перетаскивать существующие точки.");
    });
    editorRemove.addEventListener("click", function() {
      if (settlementContourEditorSelectedIndex < 0 || settlementContourEditorPoints.length <= 3) return;
      const removedIndex = settlementContourEditorSelectedIndex;
      settlementContourEditorPoints.splice(removedIndex, 1);
      settlementContourEditorSelectedIndex = -1;
      refreshSettlementContourEditor();
      setSettlementContourEditorStatus("Точка " + (removedIndex + 1) + " удалена. Не забудь сохранить контур.");
    });
    editorReset.addEventListener("click", function() {
      const area = getSelectedSettlementContourEditorArea();
      if (!area) return;
      if (!confirm("Вернуть форму кисти к границе невидимой области поселения? Несохранённые изменения редактора будут потеряны.")) return;
      settlementContourEditorPoints = area.type === "terrain"
        ? (area.points || []).map(point => ({ lat: Number(point.lat), lng: Number(point.lng) }))
        : simplifySettlementEditorPoints(area.points, 8);
      settlementContourEditorSelectedIndex = -1;
      settlementContourEditorAddMode = false;
      refreshSettlementContourEditor();
      setSettlementContourEditorStatus("Форма восстановлена по исходной границе. Сохрани её, если результат подходит.");
    });
    editorSave.addEventListener("click", saveSettlementContourEditor);
    editorClose.addEventListener("click", closeSettlementContourEditor);
    centerToggle.addEventListener("click", toggleSettlementCenterEditMode);
    refreshSettlementContourEditorOptions();

    map.getContainer().addEventListener("pointerdown", handleSettlementPointerDown, true);
    map.getContainer().addEventListener("pointermove", handleSettlementPointerMove, true);
    map.getContainer().addEventListener("pointerup", handleSettlementPointerUp, true);
    map.getContainer().addEventListener("pointercancel", cancelSettlementDrawing, true);
