// =====================================
// ОБНОВЛЕНИЕ И ОТРИСОВКА МАРШРУТА
// =====================================

// Слои задают строгий порядок: линии < крестики < привалы < флажок.
function ensureRouteMarkerPanes() {
  let restPane = map.getPane("route-rest-pane");
  if (!restPane) restPane = map.createPane("route-rest-pane");
  restPane.style.zIndex = "650";

  let flagPane = map.getPane("route-flag-pane");
  if (!flagPane) flagPane = map.createPane("route-flag-pane");
  flagPane.style.zIndex = "700";
}

// Объединяем крестики только тогда, когда их экранные области 28x28 px
// действительно пересекаются. Если пересекаются соседние группы, они тоже
// объединяются: A-B и B-C превращаются в одну группу A-B-C.
function getExhaustionMarkerClusters(markers, markerSize = 28, routeGeometry = routePoints) {
  const points = markers.map(item => ({
    item,
    point: map.latLngToContainerPoint(item.position)
  }));
  const parents = points.map((_, index) => index);

  function find(index) {
    while (parents[index] !== index) {
      parents[index] = parents[parents[index]];
      index = parents[index];
    }
    return index;
  }

  function unite(a, b) {
    const rootA = find(a);
    const rootB = find(b);
    if (rootA !== rootB) parents[rootB] = rootA;
  }

  // Для одинаковых квадратных значков пересечение есть, пока разница
  // по каждой оси меньше размера значка. Касание по краю не объединяем.
  for (let i = 0; i < points.length; i++) {
    for (let j = i + 1; j < points.length; j++) {
      const dx = Math.abs(points[i].point.x - points[j].point.x);
      const dy = Math.abs(points[i].point.y - points[j].point.y);
      if (dx < markerSize && dy < markerSize) unite(i, j);
    }
  }

  const groups = new Map();
  points.forEach((entry, index) => {
    const root = find(index);
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(entry);
  });

  return Array.from(groups.values()).map(group => {
    const items = group.map(entry => entry.item);

    if (items.length === 1) {
      return {
        position: items[0].position,
        count: 1,
        distances: [items[0].distance]
      };
    }

    // Общий крестик ставим в середину группы ПО ДЛИНЕ МАРШРУТА,
    // а не в центр экранного прямоугольника. Центр прямоугольника
    // может оказаться за пределами дуги или изгиба маршрута.
    const centerDistance = items.reduce((sum, item) => sum + item.distance, 0) / items.length;
    const centerPosition = getRoutePointAtDistance(routeGeometry, centerDistance);

    return {
      position: centerPosition || items[Math.floor(items.length / 2)].position,
      count: items.length,
      distances: items.map(item => item.distance)
    };
  });
}

function updateRouteLine(cursorPosition = null) {
  // Перерисовка карты не отменяет и не перезапускает анимацию жетонов.
  // Время анимации учитывается при создании каждого нового DOM-элемента.
  ensureRouteMarkerPanes();

  // Для preview используем те же расчёты, что и для зафиксированного маршрута,
  // но ничего не записываем в состояние до клика.
  const pointsToDraw = [...routePoints];
  if (cursorPosition && hasMouse && window.routeMode) {
    pointsToDraw.push(cursorPosition);
  }

  clearRouteDrawing();

  const totalLength = getRouteLength(pointsToDraw);
  const dailyLimit =
    routePaceLimits[routePace] * (routeSpeedReduced ? 0.5 : 1);

  // Активный марш также привязан к текущей дневной норме.
  // Если новая точка начала пока дальше проложенного пути, она проявится
  // по мере дальнейшего построения маршрута.
  if (routeForcedMarch) {
    routeForcedMarchStartDistance = routeForcedMarchStartUnits * dailyLimit;
  }

  const restCalculationLength = routeForcedMarch
    ? routeForcedMarchStartDistance
    : totalLength;
  const restDistancesToDraw = getNormalRestDistances(
    restCalculationLength,
    dailyLimit
  );

  // Подготовим историю завершённых маршей и текущий активный марш.
  const forcedVisualSegments = routeForcedSegments
    .map(segment => getForcedSegmentDistances(segment, dailyLimit))
    .filter(segment => segment.start < totalLength + 0.01)
    .map(segment => ({
      start: segment.start,
      end: Math.min(segment.end, totalLength),
      // Черта и интервалы крестиков всегда пересчитываются
      // по текущему темпу, а не по темпу в момент выключения марша.
      dailyLimit: dailyLimit
    }));

  if (routeForcedMarch) {
    forcedVisualSegments.push({
      start: routeForcedMarchStartDistance,
      end: totalLength,
      dailyLimit: dailyLimit,
      active: true
    });
  }

  const protectedDistances = [...restDistancesToDraw];
  forcedVisualSegments.forEach(segment => {
    const boundary = segment.start + segment.dailyLimit;
    if (boundary <= segment.end + 0.01) protectedDistances.push(boundary);
    const interval = segment.dailyLimit / 8;
    for (let d = boundary + interval; d <= segment.end + 0.01; d += interval) {
      protectedDistances.push(d);
    }
    protectedDistances.push(segment.end);
  });

  // Вставляем реальные точки привалов и отметок в исходную геометрию.
  const anchoredPoints = getRoutePointsWithDistanceAnchors(
    pointsToDraw,
    protectedDistances
  );

  // ВАЖНО: сначала формируем одну общую сглаженную геометрию всего маршрута,
  // и только затем нарезаем её на анимируемые фрагменты. Иначе каждый короткий
  // фрагмент сглаживается отдельно и на время проявления превращается в прямую.
  const displayRoutePoints = createRouteDisplayPoints(
    pointsToDraw,
    protectedDistances
  );
  const displayRouteLength = getRouteLength(displayRoutePoints);

  // Основная линия маршрута.
  // Разделяем маршрут на золотые и чёрные участки.
  // Золотая линия не рисуется там, где должен идти форсированный марш.

  const blackIntervals = forcedVisualSegments
    .map(segment => ({
      start: segment.start + segment.dailyLimit,
      end: segment.end
    }))
    .filter(interval => interval.end > interval.start + 0.001)
    .sort((a, b) => a.start - b.start);

  // Объединяем пересекающиеся чёрные участки.
  const mergedBlackIntervals = [];

  blackIntervals.forEach(interval => {
    const previous = mergedBlackIntervals[mergedBlackIntervals.length - 1];

    if (previous && interval.start <= previous.end + 0.001) {
      previous.end = Math.max(previous.end, interval.end);
    } else {
      mergedBlackIntervals.push({
        start: interval.start,
        end: interval.end
      });
    }
  });

  // При движении мыши отделяем уже зафиксированный маршрут
  // от полупрозрачного предпросмотра.
  const previewIsActive =
    Boolean(cursorPosition && hasMouse && window.routeMode);

  const committedLength = getRouteLength(routePoints);

  // Универсальное создание отрезка маршрута.
  function drawRoutePiece(
    startDistance,
    endDistance,
    color,
    committedOpacity,
    previewOpacity
  ) {
    if (endDistance - startDistance < 0.001) return;

    function addPiece(from, to, opacity) {
      if (to - from < 0.001) return;

      // Делим участок только по границам анимаций. Сами штрихи линии
      // проявляются последовательно от начала нового отрезка к его концу.
      const boundaries = [from, to];
      routeMarkerAnimations.forEach(animation => {
        if (animation.start > from && animation.start < to) boundaries.push(animation.start);
        if (animation.end > from && animation.end < to) boundaries.push(animation.end);
      });
      boundaries.sort((a, b) => a - b);

      for (let part = 0; part < boundaries.length - 1; part++) {
        const partStart = boundaries[part];
        const partEnd = boundaries[part + 1];
        if (partEnd - partStart < 0.001) continue;

        const midpoint = (partStart + partEnd) / 2;
        const activeAnimation = getRouteMarkerAnimation(midpoint);

        // Отдельно рассчитываем экранную геометрию участка. Активная линия
        // будет рисоваться не крупными отрывками, а короткими штрихами.
        const partDisplayStart = totalLength > 0.001
          ? partStart / totalLength * displayRouteLength
          : 0;
        const partDisplayEnd = totalLength > 0.001
          ? partEnd / totalLength * displayRouteLength
          : displayRouteLength;
        const sectionPoints = getRoutePointsBetweenDistances(
          displayRoutePoints,
          partDisplayStart,
          partDisplayEnd
        );
        if (sectionPoints.length < 2) continue;

        const localProtectedDistances = protectedDistances
          .filter(distance =>
            distance >= partStart - 0.01 &&
            distance <= partEnd + 0.01
          )
          .map(distance => distance - partStart);
        const partDisplayPoints = createRouteDisplayPoints(
          sectionPoints,
          localProtectedDistances
        );

        const screenEntries = [];
        let partScreenLength = 0;
        partDisplayPoints.forEach((point, index) => {
          const layerPoint = map.latLngToLayerPoint(point);
          if (index > 0) {
            partScreenLength += layerPoint.distanceTo(screenEntries[index - 1].layerPoint);
          }
          screenEntries.push({ point, layerPoint, distance: partScreenLength });
        });

        if (!activeAnimation) {
          const line = L.polyline(partDisplayPoints, {
            color: color,
            weight: 4.5,
            dashArray: "8, 10",
            opacity: opacity,
            lineCap: "round",
            lineJoin: "round",
            className: "route-line-raised"
          }).addTo(map);
          window.routeRestMarkers.push(line);
          continue;
        }

        // Получаем кусочек кривой между двумя расстояниями в экранных пикселях.
        // Так каждый штрих сохраняет кривизну общего маршрута.
        function getScreenPointAtDistance(targetDistance) {
          if (targetDistance <= 0) return screenEntries[0].layerPoint;
          if (targetDistance >= partScreenLength) {
            return screenEntries[screenEntries.length - 1].layerPoint;
          }
          for (let i = 1; i < screenEntries.length; i++) {
            const previous = screenEntries[i - 1];
            const current = screenEntries[i];
            if (current.distance >= targetDistance) {
              const segmentLength = current.distance - previous.distance;
              const t = segmentLength > 0.001
                ? (targetDistance - previous.distance) / segmentLength
                : 0;
              return L.point(
                previous.layerPoint.x + (current.layerPoint.x - previous.layerPoint.x) * t,
                previous.layerPoint.y + (current.layerPoint.y - previous.layerPoint.y) * t
              );
            }
          }
          return screenEntries[screenEntries.length - 1].layerPoint;
        }

        function getScreenLinePoints(startPx, endPx) {
          const points = [getScreenPointAtDistance(startPx)];
          screenEntries.forEach(entry => {
            if (entry.distance > startPx + 0.01 && entry.distance < endPx - 0.01) {
              points.push(entry.layerPoint);
            }
          });
          points.push(getScreenPointAtDistance(endPx));
          return points.map(point => map.layerPointToLatLng(point));
        }

        const globalScreenStart = getRouteScreenDistanceAtDistance(
          displayRoutePoints,
          partDisplayStart
        );
        const elapsed = Date.now() - activeAnimation.startedAt;

        // Привязываем пунктир к единой экранной шкале всего отрезка, чтобы
        // при внутренних границах (например, у привалов) рисунок не сбивался.
        const firstDashIndex = Math.max(
          0,
          Math.floor((globalScreenStart - activeAnimation.lineStartScreen) / routeLineDashStep)
        );
        const partGlobalScreenEnd = globalScreenStart + partScreenLength;

        for (let dashIndex = firstDashIndex; ; dashIndex++) {
          const dashGlobalStart = activeAnimation.lineStartScreen + dashIndex * routeLineDashStep;
          if (dashGlobalStart >= partGlobalScreenEnd - 0.01) break;

          const dashGlobalEnd = dashGlobalStart + routeLineDashLength;
          const dashStart = Math.max(0, dashGlobalStart - globalScreenStart);
          const dashEnd = Math.min(partScreenLength, dashGlobalEnd - globalScreenStart);
          if (dashEnd - dashStart < 2) continue;

          // Очередь каждого штриха идёт от начальной точки. Интервал
          // постепенно уменьшается, поэтому линия плавно набирает скорость.
          const delay = getRouteLineRevealDelay(dashIndex) - elapsed;
          const dashPoints = getScreenLinePoints(dashStart, dashEnd);
          if (dashPoints.length < 2) continue;

          const line = L.polyline(dashPoints, {
            color: color,
            weight: 4.5,
            opacity: 0,
            lineCap: "round",
            lineJoin: "round",
            className: "route-line-raised route-line-reveal"
          }).addTo(map);

          const path = line.getElement();
          if (path) {
            path.style.setProperty("--route-line-opacity", String(opacity));
            path.style.animationDuration = `${routeLineRevealFadeDuration}ms`;
            path.style.animationDelay = `${delay}ms`;
          }
          window.routeRestMarkers.push(line);
        }
      }
    }

    if (!previewIsActive) {
      addPiece(startDistance, endDistance, committedOpacity);
      return;
    }

    // Весь отрезок уже зафиксирован.
    if (endDistance <= committedLength + 0.001) {
      addPiece(startDistance, endDistance, committedOpacity);
      return;
    }

    // Весь отрезок относится к предпросмотру.
    if (startDistance >= committedLength - 0.001) {
      addPiece(startDistance, endDistance, previewOpacity);
      return;
    }

    // Отрезок пересекает границу между маршрутом и предпросмотром.
    addPiece(startDistance, committedLength, committedOpacity);
    addPiece(committedLength, endDistance, previewOpacity);
  }

  // Рисуем золотые участки, пропуская все чёрные интервалы.
  let goldStart = 0;

  mergedBlackIntervals.forEach(interval => {
    if (interval.start > goldStart + 0.001) {
      drawRoutePiece(
        goldStart,
        interval.start,
        "#e2b95f",
        1.0,
        0.22
      );
    }

    goldStart = Math.max(goldStart, interval.end);
  });

  // Последний золотой участок после всех форсированных маршей.
  if (goldStart < totalLength - 0.001) {
    drawRoutePiece(
      goldStart,
      totalLength,
      "#e2b95f",
      1.0,
      0.22
    );
  }

  // Визуал форсированных маршей остаётся на карте и после их завершения.
  forcedVisualSegments.forEach(segment => {
    const boundaryDistance = segment.start + segment.dailyLimit;
    if (boundaryDistance > segment.end + 0.01) return;

    const boundaryPosition = getRoutePointAtDistance(pointsToDraw, boundaryDistance);
    if (!boundaryPosition) return;

    // Чёрная линия после разделительной черты —
    // до привала, которым завершился форсированный марш.
    drawRoutePiece(
      boundaryDistance,
      segment.end,
      "#171717",
      1.0,
      0.26
    );

    // Направление черты всегда перпендикулярно касательной маршрута.
    const angle = getPerpendicularRouteAngle(pointsToDraw, boundaryDistance);
    const boundaryIsPreview =
      previewIsActive && boundaryDistance > committedLength + 0.001;
    const boundaryAnimationDelay =
      getRouteMarkerAnimationDelay(boundaryDistance);
    const boundaryShouldAnimate = boundaryAnimationDelay !== null;

    const boundaryIcon = L.divIcon({
      className:
        "route-march-boundary" +
        (boundaryIsPreview ? " route-preview-marker" : ""),
      html: `<div class="${boundaryShouldAnimate ? "route-token-appear" : ""}" style="--route-animation-delay:${boundaryAnimationDelay || 0}ms;width:30px;height:4px;"><div style="width:30px;height:4px;background:#e6c77d;border:1px solid #211b16;border-radius:1px;transform:rotate(${angle}deg);box-shadow:1px 2px 4px #000;"></div></div>`,
      iconSize: [32, 6],
      iconAnchor: [16, 3]
    });
    const boundaryMarker = L.marker(boundaryPosition, {
      icon: boundaryIcon,
      interactive: false,
      keyboard: false,
      zIndexOffset: 1100
    }).addTo(map);
    window.routeRestMarkers.push(boundaryMarker);

    // Крестики истощения — каждые 1/8 дневной нормы после черты.
    const interval = segment.dailyLimit / 8;
    const exhaustionPositions = [];

    for (let distance = boundaryDistance + interval;
         distance <= segment.end + 0.01;
         distance += interval) {
      const position = getRoutePointAtDistance(pointsToDraw, distance);
      if (position) exhaustionPositions.push({ distance, position });
    }

    // Если при отдалении карты крестики сблизились, объединяем их.
    const exhaustionClusters = getExhaustionMarkerClusters(
      exhaustionPositions,
      28,
      pointsToDraw
    );

    exhaustionClusters.forEach(cluster => {
      const exhaustionIsPreview =
        previewIsActive &&
        cluster.distances.some(distance => distance > committedLength + 0.001);

      const exhaustionAnimationCandidates = cluster.distances
        .map(distance => ({
          distance,
          delay: getRouteMarkerAnimationDelay(distance)
        }))
        .filter(item => item.delay !== null)
        .sort((a, b) => a.delay - b.delay);
      const exhaustionAnimationDelay = exhaustionAnimationCandidates.length
        ? exhaustionAnimationCandidates[0].delay
        : null;
      const exhaustionShouldAnimate = exhaustionAnimationDelay !== null;

      const countBadge = cluster.count > 1
        ? `<span class="route-exhaustion-count">${cluster.count}</span>`
        : "";

      const exhaustionIcon = L.divIcon({
        className:
          "route-exhaustion-mark" +
          (exhaustionIsPreview ? " route-preview-marker" : ""),
        html: `<div class="${exhaustionShouldAnimate ? "route-token-appear" : ""}" style="--route-animation-delay:${exhaustionAnimationDelay || 0}ms;width:${cluster.count > 1 ? 56 : 28}px;height:${cluster.count > 1 ? 56 : 28}px;"><div class="route-exhaustion-cluster${cluster.count > 1 ? " route-exhaustion-clustered" : ""}"><span class="route-exhaustion-glyph">×</span>${countBadge}</div></div>`,
        iconSize: cluster.count > 1 ? [56, 56] : [28, 28],
        iconAnchor: cluster.count > 1 ? [28, 28] : [14, 14]
      });
      const marker = L.marker(cluster.position, {
        icon: exhaustionIcon,
        interactive: false,
        keyboard: false,
        zIndexOffset: 1100
      }).addTo(map);
      window.routeRestMarkers.push(marker);
    });
  });

  // Обычные привалы рисуем после всех линий и отметок,
  // чтобы они всегда оставались поверх маршрута.
  restDistancesToDraw.forEach(distance => {
    if (distance > totalLength + 0.01) return;

    const position = getRoutePointAtDistance(pointsToDraw, distance);
    if (!position) return;

    const restIsPreview =
      previewIsActive && distance > committedLength + 0.001;
    const restAnimationDelay = getRouteMarkerAnimationDelay(distance);
    const restShouldAnimate = restAnimationDelay !== null;

    const marker = L.circleMarker(position, {
      pane: "route-rest-pane",
      radius: 7,
      color: "#211b16",
      weight: 2,
      fillColor: "#e6c77d",
      fillOpacity: restIsPreview ? 0.72 : 1,
      opacity: restIsPreview ? 0.78 : 1,
      interactive: false,
      className:
        "route-rest-raised" +
        (restIsPreview ? " route-preview-marker" : "") +
        (restShouldAnimate ? " route-marker-appear" : "")
    }).addTo(map);

    if (restShouldAnimate) {
      const element = marker.getElement();
      if (element) {
        element.style.animationDelay = `${restAnimationDelay}ms`;
      }
    }

    // Привал находится в отдельном слое выше крестиков.
    marker.bringToFront();
    window.routeRestMarkers.push(marker);
  });

  // Флажок конечной точки.
  if (routeFinished && routePoints.length >= 2 && !window.routeDestinationCityId) {
    const endPoint = routePoints[routePoints.length - 1];
    const flagIcon = L.divIcon({
      className: "route-end-flag",
      html: `<div style="font-size:30px;line-height:30px;color:#e6c77d;text-shadow:1px 2px 4px #000;">⚑</div>`,
      iconSize: [24, 30],
      iconAnchor: [5, 28]
    });
    routeEndMarker = L.marker(endPoint, {
      pane: "route-flag-pane",
      icon: flagIcon,
      interactive: false,
      keyboard: false,
      zIndexOffset: 1200
    }).addTo(map);
  }

  // Информация в панели.
  if (routePanel) {
    document.getElementById("route-daily-limit").textContent =
      (dailyLimit * KM_PER_PIXEL).toFixed(1) + " км";
    document.getElementById("route-distance").textContent =
      (totalLength * KM_PER_PIXEL).toFixed(1) + " км";

    const completedDays = routeForcedMarch
      ? getNormalRestDistances(routeForcedMarchStartDistance, dailyLimit).length
      : getNormalRestDistances(totalLength, dailyLimit).length;
    document.getElementById("route-days").textContent = completedDays;

    routeConfirmButton.disabled = !routeFinished;

    const forcedButton = document.getElementById("route-forced-march");
    if (forcedButton) {
      forcedButton.disabled = routeFinished || window.routePendingConfirmation;
    }

    document.getElementById("route-undo").disabled = routePoints.length <= 1;
  }

  console.log("Длина маршрута:", Math.round(totalLength));
}

// Применение подтверждённого маршрута, полученного из Firebase.
// Эта функция вызывается одинаково на всех подключённых клиентах.
window.applySynchronizedPartyRoute = function(data) {
  if (!data || !Array.isArray(data.points) || data.points.length < 2) return;

  stopRouteMarkerAnimation();
  routePoints = data.points.map(point => L.latLng(Number(point.lat), Number(point.lng)));
  routePace = data.pace || "normal";
  routeSpeedReduced = Boolean(data.speedReduced);
  routeForcedMarch = Boolean(data.forcedMarch);
  routeForcedMarchStartDistance = Number(data.forcedMarchStartDistance) || 0;
  routeForcedMarchStartUnits = Number(data.forcedMarchStartUnits) || 0;
  routeForcedSegments = Array.isArray(data.forcedSegments) ? data.forcedSegments : [];
  routeFinished = true;
  window.routeMode = false;
  window.routePendingConfirmation = false;
  window.routeDestinationCityId = data.destinationSettlementId || null;
  window.routeDestinationBoundaryPoint = data.destinationBoundaryPoint
    ? L.latLng(data.destinationBoundaryPoint.lat, data.destinationBoundaryPoint.lng) : null;
  window.routeDestinationApproachPoint = data.destinationApproachPoint
    ? L.latLng(data.destinationApproachPoint.lat, data.destinationApproachPoint.lng) : null;
  lastCursorPosition = null;

  if (routePanel) routePanel.style.display = "none";
  map.doubleClickZoom.enable();
  if (window.clearSettlementOutline) window.clearSettlementOutline();

  const total = getRouteLength(routePoints);
  if (total > 0.001) {
    beginRouteMarkerAnimation(0, total, Number(data.startedAt) || Date.now());
  }
  updateRouteLine(null);
  console.log("Получен общий маршрут:", data);
};

// =====================================
// ДОБАВЛЕНИЕ ТОЧКИ МАРШРУТА
// =====================================

window.addPartyRoutePoint = function(latlng) {
  const previousLength = getRouteLength(routePoints);
  routePoints.push(latlng);

  // Во время прокладки маршрут и жетоны отображаются сразу, без анимации.
  lastCursorPosition = null;
  updateRouteLine(null, true);

  console.log("Точки маршрута:", routePoints);
};

// =====================================
// ОБРАБОТКА КЛИКОВ И ЗАВЕРШЕНИЕ МАРШРУТА
// =====================================

// Завершение построения маршрута
function finishPartyRoute(latlng) {
  const previousLength = getRouteLength(routePoints);

  // Добавляем последнюю точку, если она отличается от предыдущей
  const lastPoint = routePoints[routePoints.length - 1];

  if (
    !lastPoint ||
    map.latLngToContainerPoint(lastPoint)
      .distanceTo(map.latLngToContainerPoint(latlng)) > (window.routeDestinationCityId ? 0.05 : 3)
  ) {
    routePoints.push(latlng);
  }

  // Маршрут должен содержать хотя бы одну линию
  if (routePoints.length < 2) {
    console.log("Для завершения маршрута нужна хотя бы одна точка");
    return;
  }

  // До подтверждения маршрут остаётся статичным предпросмотром.
  routeFinished = true;
  window.routeMode = false;
  window.routePendingConfirmation = true;

  lastCursorPosition = null;

  // Возвращаем обычное приближение двойным кликом
  map.doubleClickZoom.enable();

  updateRouteLine(null, true);

  console.log("Маршрут завершён:", routePoints);
}

// Обработка одиночного и двойного клика
window.handlePartyRouteClick = function(latlng) {
  if (!window.routeMode || routeFinished) return;

  // Клик внутри невидимой области поселения автоматически завершает маршрут.
  // Конечная точка линии — ближайшая точка границы от последней точки пути.
  const destinationArea = findSettlementAt(latlng);
  if (destinationArea && routePoints.length > 0) {
    if (pendingRouteClickTimer) clearTimeout(pendingRouteClickTimer);
    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;

    const approachPoint = routePoints[routePoints.length - 1];
    const boundary = findNearestSettlementBoundaryPoint(
      approachPoint,
      destinationArea.points
    );

    if (boundary) {
      window.routeDestinationCityId = destinationArea.id;
      window.routeDestinationBoundaryPoint = boundary.point;
      window.routeDestinationApproachPoint = approachPoint;
      // Сначала показываем обводку тем же способом, что и в рабочей версии,
      // затем завершаем маршрут.
      try {
        if (window.showSettlementOutline) window.showSettlementOutline(destinationArea, 1);
      } catch (outlineError) {
        console.error("Ошибка отображения обводки поселения:", outlineError);
      }
      finishPartyRoute(boundary.point);
      console.log("Маршрут завершён у поселения:", destinationArea.type, destinationArea.id);
      return;
    }
  }

  // Если уже ожидается одиночный клик,
  // проверяем, является ли новый клик вторым
  if (pendingRouteClickTimer) {
    const firstPoint = map.latLngToContainerPoint(
      pendingRouteClickPosition
    );

    const secondPoint = map.latLngToContainerPoint(latlng);

    const distance = firstPoint.distanceTo(secondPoint);

    // Два клика рядом друг с другом — завершаем маршрут
    if (distance <= 30) {
      clearTimeout(pendingRouteClickTimer);

      pendingRouteClickTimer = null;
      pendingRouteClickPosition = null;

      finishPartyRoute(latlng);
      return;
    }

    // Если второй клик далеко — фиксируем предыдущий
    clearTimeout(pendingRouteClickTimer);

    window.addPartyRoutePoint(pendingRouteClickPosition);

    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
  }

  // Запоминаем новый клик
  pendingRouteClickPosition = latlng;

  // Ждём 300 мс: если второго клика не будет,
  // добавляем обычную точку маршрута
  pendingRouteClickTimer = setTimeout(function() {
    window.addPartyRoutePoint(pendingRouteClickPosition);

    pendingRouteClickTimer = null;
    pendingRouteClickPosition = null;
  }, 180);
};

// Движение курсора на ПК
map.on("mousemove", function(e) {
  if (!window.routeMode || !hasMouse) return;

  lastCursorPosition = e.latlng;
  // Ошибка предварительной обводки не должна прерывать построение маршрута.
  try {
    if (window.previewSettlementAt) window.previewSettlementAt(e.latlng);
  } catch (previewError) {
    console.error("Ошибка предварительной обводки поселения:", previewError);
  }

  updateRouteLine(e.latlng);
});

// При изменении масштаба пересобираем группы крестиков,
// чтобы они не накладывались друг на друга.
map.on("zoomend", function() {
  // Сначала переводим активные анимации на новую экранную шкалу,
  // сохраняя их текущий прогресс, и только затем перерисовываем маршрут.
  rebaseRouteMarkerAnimationsForZoom();
  if (routePoints.length >= 2 || window.routeMode) {
    updateRouteLine(lastCursorPosition);
  }
});

        } else {
          // Если маркер уже есть — меняем его положение
          partyMarker.setLatLng(coordinates);
        }

        console.log("Положение отряда:", coordinates);
      });

    } catch (error) {
      console.error("Ошибка загрузки отряда:", error);
    }
  }

 // =====================================
  // НЕВИДИМЫЕ ОБЛАСТИ ГОРОДОВ И ДЕРЕВЕНЬ
  // =====================================

  function pointInSettlement(point, polygon) {
    const x = point.lng;
    const y = point.lat;
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const xi = polygon[i].lng, yi = polygon[i].lat;
      const xj = polygon[j].lng, yj = polygon[j].lat;
      const intersects = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / ((yj - yi) || 0.0000001) + xi);
      if (intersects) inside = !inside;
    }
    return inside;
  }

  function findSettlementAt(point) {
    // Поиск области не должен ломаться, если Firebase ещё не загрузил список.
    const areas = Array.isArray(window.settlementAreas) ? window.settlementAreas : [];
    // Если области пересекаются, выбираем самую маленькую: это наиболее
    // конкретное поселение, в которое попал курсор.
    const matches = areas.filter(area =>
      Array.isArray(area.points) && area.points.length >= 3 &&
      pointInSettlement(point, area.points)
    );
    if (!matches.length) return null;
    return matches.sort((a, b) => polygonArea(a.points) - polygonArea(b.points))[0];
  }

  function polygonArea(points) {
    let area = 0;
    for (let i = 0; i < points.length; i++) {
      const next = points[(i + 1) % points.length];
      area += points[i].lng * next.lat - next.lng * points[i].lat;
    }
    return Math.abs(area / 2);
  }

  function findNearestSettlementBoundaryPoint(origin, polygon) {
    if (!polygon || polygon.length < 3) return null;
    const originPoint = map.latLngToLayerPoint(origin);
    let best = null;
    let bestDistance = Infinity;

    for (let i = 0; i < polygon.length; i++) {
      const a = map.latLngToLayerPoint(polygon[i]);
      const b = map.latLngToLayerPoint(polygon[(i + 1) % polygon.length]);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const lengthSquared = dx * dx + dy * dy;
      const t = lengthSquared > 0
        ? Math.max(0, Math.min(1, ((originPoint.x - a.x) * dx + (originPoint.y - a.y) * dy) / lengthSquared))
        : 0;
      const projected = L.point(a.x + t * dx, a.y + t * dy);
      const distance = originPoint.distanceTo(projected);
      if (distance < bestDistance) {
        bestDistance = distance;
        best = {
          point: map.layerPointToLatLng(projected),
          segmentIndex: i,
          segmentT: t
        };
      }
    }
    return best;
  }

  // Единый расчёт открытого контура поселения. Не зависит от внешних
  // диагностических функций: начинает с ближайшей точки границы и обходит
  // исходный полигон в направлении движения к границе.
  function getOpenSettlementContour(area, startPoint, approachPoint) {
    if (!area || !Array.isArray(area.points) || area.points.length < 3 || !startPoint) return [];
    const boundary = findNearestSettlementBoundaryPoint(startPoint, area.points);
    if (!boundary || !boundary.point) return [];

    const points = area.points;
    const count = points.length;
    const segment = boundary.segmentIndex;
    const start = boundary.point;
    const startPx = map.latLngToLayerPoint(start);
    // Для финального построения направление берём из последнего участка маршрута,
    // а не из нулевого вектора от граничной точки к самой себе.
    const approach = map.latLngToLayerPoint(approachPoint || startPoint);
    const incoming = L.point(startPx.x - approach.x, startPx.y - approach.y);
    const a = map.latLngToLayerPoint(points[segment]);
    const b = map.latLngToLayerPoint(points[(segment + 1) % count]);
    const tangent = L.point(b.x - a.x, b.y - a.y);
    const direction = incoming.x * tangent.x + incoming.y * tangent.y >= 0 ? 1 : -1;

    const contour = [start];
    if (direction > 0) {
      for (let step = 1; step <= count; step++) contour.push(points[(segment + step) % count]);
    } else {
      for (let step = 0; step < count; step++) contour.push(points[(segment - step + count) % count]);
    }

    const layerPoints = contour.map(point => map.latLngToLayerPoint(point));
    const lengths = [];
    let total = 0;
    for (let i = 1; i < layerPoints.length; i++) {
      const len = layerPoints[i - 1].distanceTo(layerPoints[i]);
      lengths.push(len);
      total += len;
    }
    if (total < 1) return [];

    // Оставляем небольшой разрыв: росчерк не замыкает окружность.
    const target = total * 0.88;
    let used = 0;
    const result = [contour[0]];
    for (let i = 0; i < lengths.length; i++) {
      const len = lengths[i];
      if (used + len <= target) {
        result.push(contour[i + 1]);
        used += len;
      } else {
        const t = Math.max(0, Math.min(1, (target - used) / Math.max(len, 0.0001)));
        const a = layerPoints[i], b = layerPoints[i + 1];
        result.push(map.layerPointToLatLng(L.point(a.x + (b.x-a.x)*t, a.y + (b.y-a.y)*t)));
        break;
      }
    }
    return result;
  }

  // Контур теперь детерминированный: один и тот же отступ для каждого
  // поселения, без случайных профилей и повторной генерации при движении мыши.
  const SETTLEMENT_OUTWARD_OFFSET = 18; // CSS-пиксели
  let settlementContourVariant = null;

  function makeRandomizedSettlementContour(area, startPoint, approachPoint) {
    const base = getOpenSettlementContour(area, startPoint, approachPoint);
    if (!base || base.length < 2) return [];

    let signedArea = 0;
    const polygon = area.points;
    for (let i = 0; i < polygon.length; i++) {
      const a = map.latLngToLayerPoint(polygon[i]);
      const b = map.latLngToLayerPoint(polygon[(i + 1) % polygon.length]);
      signedArea += a.x * b.y - b.x * a.y;
    }
    const outwardSign = signedArea >= 0 ? 1 : -1;
    let travelled = 0;
    return base.map((point, i) => {
      const pixel = map.latLngToLayerPoint(point);
      if (i > 0) travelled += pixel.distanceTo(map.latLngToLayerPoint(base[i - 1]));
      const prev = map.latLngToLayerPoint(base[Math.max(0, i - 1)]);
      const next = map.latLngToLayerPoint(base[Math.min(base.length - 1, i + 1)]);
      const dx = next.x - prev.x, dy = next.y - prev.y;
      const magnitude = Math.sqrt(dx*dx + dy*dy) || 1;
      const nx = (dy / magnitude) * outwardSign;
      const ny = (-dx / magnitude) * outwardSign;
      // Начальная точка остаётся точно в месте касания маршрута;
      // далее контур плавно выходит на постоянный экранный отступ.
      const ramp = Math.min(1, travelled / 22);
      const offset = SETTLEMENT_OUTWARD_OFFSET * ramp;
      return map.layerPointToLatLng(L.point(pixel.x + nx*offset, pixel.y + ny*offset));
    });
  }

  function getSettlementContourVariant(area, startPoint, approachPoint, forceNew) {
    if (!area) return [];
    const needsNew = forceNew || !settlementContourVariant ||
      String(settlementContourVariant.areaId) !== String(area.id);
    if (needsNew) {
      const path = makeRandomizedSettlementContour(area, startPoint, approachPoint);
      settlementContourVariant = { areaId: area.id, path, startPoint, approachPoint };
    }
    return settlementContourVariant.path || [];
  }

  // Толщина совпадает с обычной пунктирной линией маршрута (4.5 CSS px).
  // Геометрия ленты строится в экранных координатах, поэтому ширина
  // остаётся визуально постоянной при любом масштабе карты.
  const SETTLEMENT_TRACE_BASE_WIDTH = 4.5;

  function makeTaperedSettlementPolygon(latlngs, maxWidth, opacity) {
    if (!latlngs || latlngs.length < 2) return null;
    const pts = latlngs.map(ll => map.latLngToLayerPoint(ll));
    const left = [], right = [];
    const baseWidth = Number.isFinite(maxWidth) ? maxWidth : SETTLEMENT_TRACE_BASE_WIDTH;
    for (let i = 0; i < pts.length; i++) {
      const prev = pts[Math.max(0, i - 1)];
      const next = pts[Math.min(pts.length - 1, i + 1)];
      let dx = next.x - prev.x, dy = next.y - prev.y;
      const mag = Math.sqrt(dx*dx + dy*dy) || 1;
      const nx = -dy / mag, ny = dx / mag;
      const t = i / Math.max(1, pts.length - 1);

      // До середины сохраняем почти полную толщину. После середины
      // сужение сначала едва заметно, а ближе к концу резко усиливается.
      const taperProgress = Math.max(0, Math.min(1, (t - 0.5) / 0.5));
      const taper = Math.pow(taperProgress, 2.8);
      const width = baseWidth * (1 - 0.96 * taper);
      left.push(map.layerPointToLatLng(L.point(pts[i].x + nx*width/2, pts[i].y + ny*width/2)));
      right.push(map.layerPointToLatLng(L.point(pts[i].x - nx*width/2, pts[i].y - ny*width/2)));
    }
    return L.polygon(left.concat(right.reverse()), {
      stroke: false,
      fill: true,
      fillColor: "#171512",
      fillOpacity: opacity,
      interactive: false,
      smoothFactor: 1
    });
  }

  let settlementHoverOutline = null;
  let settlementSelectedOutline = null;
  let settlementHoverPath = null;
  let settlementSelectedPath = null;
  let settlementSelectedArea = null;
  let settlementHoverAreaId = null;
  let settlementHoverArea = null;
  let hiddenRouteLayers = [];
  const settlementTraceLayers = new Map();
  const settlementTracePaths = new Map();
  let activeSettlementTrace = null;

  // Изолированный тестовый рендерер сухой кисти А.
  // Он использует уже сохранённую геометрию area.points и не меняет
  // маршруты, Firebase, выбор поселения или существующую анимацию.
  let settlementBrushTestEnabled = false;
  let settlementBrushPreviewLayers = [];
  let settlementBrushSelectedLayers = [];
  let settlementBrushPreviewArea = null;
  let settlementBrushSelectedArea = null;
  let settlementBrushSelectedAreaId = null;

  function ensureSettlementDryBrushPane() {
    let pane = map.getPane("settlement-dry-brush-pane");
    if (!pane) pane = map.createPane("settlement-dry-brush-pane");
    // Выше обычных маршрутных линий и привалов, но ниже флажков маршрута.
    pane.style.zIndex = "675";
    pane.style.pointerEvents = "none";
    return pane;
  }

  function removeSettlementBrushLayers(layers) {
    (layers || []).forEach(layer => {
      if (layer && map.hasLayer(layer)) map.removeLayer(layer);
    });
    return [];
  }

  // Постоянный замкнутый контур со смещением в экранных пикселях.
  // Он не меняет форму при наведении/клике и пересчитывается после zoomend.
  function getSettlementDryBrushPath(area) {
    if (!area || !Array.isArray(area.points) || area.points.length < 3) return [];
    const points = area.points.map(point => map.latLngToLayerPoint(point));
    let signedArea = 0;
    for (let i = 0; i < points.length; i++) {
      const a = points[i], b = points[(i + 1) % points.length];
      signedArea += a.x * b.y - b.x * a.y;
    }
    const outwardSign = signedArea >= 0 ? 1 : -1;
    // Наружное смещение постепенно уменьшается при отдалении карты.
    const zoomScale = map.getZoomScale(map.getZoom(), 0);
    const offset = 4.5 * Math.pow(zoomScale, 0.65);
    const result = points.map((point, i) => {
      const previous = points[(i - 1 + points.length) % points.length];
      const next = points[(i + 1) % points.length];
      const dx = next.x - previous.x, dy = next.y - previous.y;
      const length = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = (dy / length) * outwardSign;
      const ny = (-dx / length) * outwardSign;
      return L.point(point.x + nx * offset, point.y + ny * offset);
    });
    result.push(result[0]);
    return result;
  }

  function sampleSettlementBrushPath(points, distance) {
    const sampled = [];
    let travelled = 0;
    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1], b = points[i];
      const length = a.distanceTo(b);
      if (length < 0.01) continue;
      const steps = Math.max(1, Math.ceil(length / distance));
      for (let j = 0; j < steps; j++) {
        const t = j / steps;
        sampled.push({
          point: L.point(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t),
          distance: travelled + length * t
        });
      }
      travelled += length;
    }
    sampled.push({ point: points[points.length - 1], distance: travelled });
    return { samples: sampled, total: travelled };
  }

  function createSettlementDryBrushLayers(area, opacity) {
    const path = getSettlementDryBrushPath(area);
    if (path.length < 4) return [];
    const pane = ensureSettlementDryBrushPane();
    const screenPoints = path.slice(0, -1);
    let contourArea = 0;
    for (let i = 0; i < screenPoints.length; i++) {
      const a = screenPoints[i], b = screenPoints[(i + 1) % screenPoints.length];
      contourArea += a.x * b.y - b.x * a.y;
    }
    const outwardSign = contourArea >= 0 ? 1 : -1;
    // Толщина, длина мазков и промежутки плавно уменьшаются при отдалении.
    const zoomScale = map.getZoomScale(map.getZoom(), 0);
    const brushScale = Math.pow(zoomScale, 0.48);
    const sampledData = sampleSettlementBrushPath(path, 3.2 * brushScale);
    const samples = sampledData.samples;
    const total = sampledData.total;
    if (total < 12) return [];
    const alpha = Number.isFinite(opacity) ? opacity : 1;
    const layers = [];
    const toLatLngs = pts => pts.map(pt => map.layerPointToLatLng(pt));

    // Короткие перекрывающиеся мазки с тонкими концами вместо сплошной толстой полосы.
    let cursor = 0;
    let strokeIndex = 0;
    while (cursor < total) {
      const seed = strokeIndex + 1;
      const strokeLength = (27 + (Math.sin(seed * 12.9898) * 0.5 + 0.5) * 25) * brushScale;
      const gap = (1.5 + (Math.sin(seed * 7.233) * 0.5 + 0.5) * 4.5) * brushScale;
      const end = Math.min(total, cursor + strokeLength);
      const section = samples.filter(sample => sample.distance >= cursor && sample.distance <= end);
      if (section.length >= 2) {
        const left = [], right = [];
        const baseWidth = (3.7 + (Math.sin(seed * 3.17) * 0.5 + 0.5) * 0.95) * brushScale;
        section.forEach((sample, index) => {
          const prev = section[Math.max(0, index - 1)].point;
          const next = section[Math.min(section.length - 1, index + 1)].point;
          const dx = next.x - prev.x, dy = next.y - prev.y;
          const mag = Math.sqrt(dx * dx + dy * dy) || 1;
          const nx = -dy / mag, ny = dx / mag;
          const t = index / Math.max(1, section.length - 1);
          // Сужение на обоих концах — характерный след сухой кисти.
          const taper = Math.pow(Math.sin(Math.PI * t), 0.72);
          const grain = 0.86 + 0.14 * Math.sin((index + seed) * 1.71);
          const half = Math.max(0.18, baseWidth * taper * grain / 2);
          const rough = Math.sin((index + seed * 2) * 2.37) * 0.28;
          left.push(L.point(sample.point.x + nx * (half + rough), sample.point.y + ny * (half + rough)));
          right.push(L.point(sample.point.x - nx * (half - rough), sample.point.y - ny * (half - rough)));
        });
        const stroke = L.polygon(toLatLngs(left.concat(right.reverse())), {
          pane: "settlement-dry-brush-pane", stroke: false, fill: true,
          fillColor: "#17130f", fillOpacity: alpha * (0.72 + (Math.sin(seed * 5.41) * 0.5 + 0.5) * 0.22),
          interactive: false, bubblingMouseEvents: false, smoothFactor: 0
        });
        layers.push(stroke);
      }
      cursor = end + gap;
      strokeIndex++;
    }

    // Тонкие внешние следы щетины: короткие прочерки снаружи основного мазка.
    const bristles = [];
    for (let i = 0; i < samples.length; i += 3) {
      const sample = samples[i];
      const prev = samples[Math.max(0, i - 1)].point;
      const next = samples[Math.min(samples.length - 1, i + 1)].point;
      const dx = next.x - prev.x, dy = next.y - prev.y;
      const mag = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = (dy / mag) * outwardSign;
      const ny = (-dx / mag) * outwardSign;
      const seed = i + 3;
      const reach = (2.2 + (Math.sin(seed * 8.31) * 0.5 + 0.5) * 3.8) * brushScale;
      const tangent = (Math.sin(seed * 4.73) * 0.5) * 3.2 * brushScale;
      const length = (3.5 + (Math.sin(seed * 6.17) * 0.5 + 0.5) * 7.5) * brushScale;
      const start = L.point(sample.point.x + nx * reach, sample.point.y + ny * reach);
      const finish = L.point(start.x + nx * length * 0.45 - dy / mag * tangent, start.y + ny * length * 0.45 + dx / mag * tangent);
      bristles.push([map.layerPointToLatLng(start), map.layerPointToLatLng(finish)]);
    }
    if (bristles.length) {
      layers.push(L.polyline(bristles, {
        pane: "settlement-dry-brush-pane", color: "#17130f", weight: 0.85 * brushScale,
        opacity: alpha * 0.58, lineCap: "butt", lineJoin: "round",
        interactive: false, bubblingMouseEvents: false, smoothFactor: 0
      }));
    }

    // Редкие тонкие внутренние просветы разбивают мазок и добавляют сухую фактуру.
    const dryMarks = [];
    for (let i = 2; i < samples.length; i += 7) {
      const sample = samples[i];
      const prev = samples[Math.max(0, i - 1)].point;
      const next = samples[Math.min(samples.length - 1, i + 1)].point;
      const dx = next.x - prev.x, dy = next.y - prev.y;
      const mag = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = -dy / mag, ny = dx / mag;
      const seed = i + 17;
      const shift = ((Math.sin(seed * 2.91) * 0.5 + 0.5) * 1.7 - 0.85) * brushScale;
      const length = (3 + (Math.sin(seed * 7.13) * 0.5 + 0.5) * 5) * brushScale;
      const a = L.point(sample.point.x + nx * shift, sample.point.y + ny * shift);
      const b = L.point(a.x + dx / mag * length, a.y + dy / mag * length);
      dryMarks.push([map.layerPointToLatLng(a), map.layerPointToLatLng(b)]);
    }
    if (dryMarks.length) {
      layers.push(L.polyline(dryMarks, {
        pane: "settlement-dry-brush-pane", color: "#eee2c8", weight: 0.65 * brushScale,
        opacity: alpha * 0.26, lineCap: "butt", interactive: false,
        bubblingMouseEvents: false, smoothFactor: 0
      }));
    }

    layers.forEach(layer => layer.addTo(map));
    return layers;
  }

  function drawSettlementBrushPreview(area) {
    settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
    settlementBrushPreviewArea = area || null;
    if (area) settlementBrushPreviewLayers = createSettlementDryBrushLayers(area, 0.76);
  }

  function drawSettlementBrushSelected(area, opacity) {
    settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
    settlementBrushPreviewArea = null;
    settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
    settlementBrushSelectedArea = area || null;
    settlementBrushSelectedAreaId = area ? String(area.id) : null;
    if (area) settlementBrushSelectedLayers = createSettlementDryBrushLayers(area, Number.isFinite(opacity) ? opacity : 0.96);
  }

  function removeSettlementLayer(layer) {
    if (layer && map.hasLayer(layer)) map.removeLayer(layer);
  }

  function restoreRouteLayersForSettlement() {
    hiddenRouteLayers.forEach(function(item) {
      if (item.layer && map.hasLayer(item.layer)) item.layer.setStyle({ opacity: item.opacity });
    });
    hiddenRouteLayers = [];
  }

  function hideRouteDashesInsideSettlement(area) {
    restoreRouteLayersForSettlement();
    if (!area || !Array.isArray(area.points)) return;
    const routeLayers = Array.isArray(window.routeRestMarkers) ? window.routeRestMarkers : [];
    routeLayers.forEach(function(layer) {
      if (!layer || typeof layer.getLatLngs !== "function" || typeof layer.setStyle !== "function") return;
      const latlngs = layer.getLatLngs();
      const flat = Array.isArray(latlngs) ? latlngs.flat(Infinity).filter(point => point && Number.isFinite(point.lat) && Number.isFinite(point.lng)) : [];
      if (!flat.length) return;
      // Каждый маршрутный штрих короткий: скрываем штрих, если его середина
      // проходит внутри поселения, чтобы пунктир не просвечивал под обводкой.
      const middle = flat[Math.floor(flat.length / 2)];
      if (pointInSettlement(middle, area.points)) {
        const opacity = typeof layer.options.opacity === "number" ? layer.options.opacity : 1;
        hiddenRouteLayers.push({ layer, opacity });
        layer.setStyle({ opacity: 0 });
      }
    });
  }

  function showSettlementOutline(area, opacity) {
    try {
      if (!area || !Array.isArray(area.points) || area.points.length < 3) return;
      if (settlementBrushTestEnabled) {
        removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
        removeSettlementLayer(settlementSelectedOutline); settlementSelectedOutline = null;
        hideRouteDashesInsideSettlement(area);
        drawSettlementBrushSelected(area, Number.isFinite(opacity) ? opacity : 0.96);
        return;
      }
      const start = window.routeDestinationBoundaryPoint || area.points[0];
      const approach = window.routeDestinationApproachPoint || start;
      // Если поселение уже было под курсором, сохраняем геометрию 1:1:
      // клик лишь переводит preview в selected, не пересчитывая радиус.
      const path = settlementHoverPath && String(settlementHoverAreaId) === String(area.id)
        ? settlementHoverPath.slice()
        : getSettlementContourVariant(area, start, approach, false);
      if (path.length < 2) return;
      let pane = map.getPane("settlement-preview-pane");
      if (!pane) pane = map.createPane("settlement-preview-pane");
      pane.style.zIndex = "675";
      removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
      removeSettlementLayer(settlementSelectedOutline);
      settlementSelectedPath = path.slice();
      settlementSelectedArea = area;
      hideRouteDashesInsideSettlement(area);
      settlementSelectedOutline = makeTaperedSettlementPolygon(path, SETTLEMENT_TRACE_BASE_WIDTH, Number.isFinite(opacity) ? opacity : 0.95);
      if (settlementSelectedOutline) settlementSelectedOutline.addTo(map);
    } catch (error) { console.error("Ошибка выбранной обводки поселения:", error); }
  }
  window.showSettlementOutline = showSettlementOutline;

  function clearSettlementOutline() {
    settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
    settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
    settlementBrushPreviewArea = null;
    settlementBrushSelectedArea = null;
    settlementBrushSelectedAreaId = null;
    removeSettlementLayer(settlementHoverOutline);
    removeSettlementLayer(settlementSelectedOutline);
    settlementHoverOutline = null;
    settlementSelectedOutline = null;
    settlementHoverPath = null;
    settlementSelectedPath = null;
    settlementSelectedArea = null;
    settlementHoverAreaId = null;
    settlementHoverArea = null;
    restoreRouteLayersForSettlement();
  }
  window.clearSettlementOutline = clearSettlementOutline;

  window.previewSettlementAt = function(point) {
    try {
      if (settlementBrushTestEnabled) {
        if (!window.routeMode) {
          settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
          settlementBrushPreviewArea = null;
          restoreRouteLayersForSettlement();
          return;
        }
        const brushArea = findSettlementAt(point);
        if (!brushArea || settlementBrushSelectedAreaId) {
          if (!brushArea) {
            settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
            settlementBrushPreviewArea = null;
            restoreRouteLayersForSettlement();
          }
          return;
        }
        if (!settlementBrushPreviewArea || String(settlementBrushPreviewArea.id) !== String(brushArea.id)) {
          hideRouteDashesInsideSettlement(brushArea);
          drawSettlementBrushPreview(brushArea);
        }
        return;
      }
      if (!window.routeMode) {
        removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null; return;
      }
      const area = findSettlementAt(point);
      if (!area || settlementSelectedOutline) {
        if (!area) {
          removeSettlementLayer(settlementHoverOutline);
          settlementHoverOutline = null;
          settlementHoverPath = null;
          settlementHoverAreaId = null;
          settlementHoverArea = null;
          restoreRouteLayersForSettlement();
          settlementContourVariant = null;
        }
        return;
      }
      const path = getSettlementContourVariant(area, point, point, false);
      if (path.length < 2) return;
      hideRouteDashesInsideSettlement(area);
      removeSettlementLayer(settlementHoverOutline);
      settlementHoverPath = path.slice();
      settlementHoverAreaId = area.id;
      settlementHoverArea = area;
      settlementHoverOutline = makeTaperedSettlementPolygon(path, SETTLEMENT_TRACE_BASE_WIDTH, 0.68);
      if (settlementHoverOutline) settlementHoverOutline.addTo(map);
    } catch (error) {
      console.error("Ошибка предварительной обводки поселения:", error);
      removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
    }
  };

  function animateSettlementTrace(area) {
    try {
      const startPoint = window.routeDestinationBoundaryPoint;
      if (!startPoint) return;
      const contour = getSettlementContourVariant(
        area,
        startPoint,
        window.routeDestinationApproachPoint || startPoint,
        false
      );
      if (contour.length < 2) return;
      const previousTrace = settlementTraceLayers.get(area.id);
      removeSettlementLayer(previousTrace);
      removeSettlementLayer(settlementSelectedOutline);
      settlementSelectedOutline = null;

      let trace = makeTaperedSettlementPolygon([contour[0], contour[0], contour[1]], SETTLEMENT_TRACE_BASE_WIDTH, 1);
      if (!trace) return;
      trace.addTo(map);
      settlementTraceLayers.set(area.id, trace);
      settlementTracePaths.set(area.id, [contour[0], contour[0], contour[1]]);
      activeSettlementTrace = { areaId: area.id, layer: trace };

      let layerPoints = contour.map(point => map.latLngToLayerPoint(point));
      const lengths = [];
      let totalLength = 0;
      for (let i = 1; i < layerPoints.length; i++) {
        const len = layerPoints[i - 1].distanceTo(layerPoints[i]);
        lengths.push(len); totalLength += len;
      }
      if (totalLength < 1) return;
      const duration = Math.max(1800, Math.min(8000, totalLength * 4));
      const startedAt = performance.now();

      // Четыре темповых участка по пройденному расстоянию:
      // 1) первая треть — обычная скорость;
      // 2) короткое, но более заметное замедление;
      // 3) небольшой участок примерно в 1.5 раза быстрее начального;
      // 4) сильное плавное ускорение до самого острого конца.
      // Доли времени подобраны отдельно от долей расстояния, чтобы
      // скорость действительно ощущалась разной, а не просто менялась формально.
      function getTraceDistanceProgress(timeProgress) {
        const t1 = 0.35, t2 = 0.57, t3 = 0.68;
        const d1 = 0.33, d2 = 0.39, d3 = 0.54;
        if (timeProgress <= t1) return (timeProgress / t1) * d1;
        if (timeProgress <= t2) return d1 + ((timeProgress - t1) / (t2 - t1)) * (d2 - d1);
        if (timeProgress <= t3) return d2 + ((timeProgress - t2) / (t3 - t2)) * (d3 - d2);
        const fast = (timeProgress - t3) / (1 - t3);
        return d3 + (1 - d3) * (1 - Math.pow(1 - fast, 3));
      }

      function frame(now) {
        if (!activeSettlementTrace || String(activeSettlementTrace.areaId) !== String(area.id)) return;
        trace = activeSettlementTrace.layer;
        if (!trace || !map.hasLayer(trace)) return;
        // Перепроецируем линию на каждом кадре: её толщина остаётся
        // равной толщине маршрутной линии даже после смены масштаба.
        layerPoints = contour.map(point => map.latLngToLayerPoint(point));
        const timeProgress = Math.min(1, (now - startedAt) / duration);
        const progress = getTraceDistanceProgress(timeProgress);
        let remaining = totalLength * progress;
        const drawn = [contour[0]];
        for (let i = 0; i < lengths.length; i++) {
          if (remaining >= lengths[i]) { drawn.push(contour[i + 1]); remaining -= lengths[i]; }
          else {
            if (remaining > 0 && lengths[i] > 0.001) {
              const t = remaining / lengths[i], a = layerPoints[i], b = layerPoints[i+1];
              drawn.push(map.layerPointToLatLng(L.point(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t)));
            }
            break;
          }
        }
        const next = makeTaperedSettlementPolygon(drawn, SETTLEMENT_TRACE_BASE_WIDTH, 1);
        if (next) {
          const latlngs = next.getLatLngs();
          trace.setLatLngs(latlngs);
          trace.setStyle({stroke:false, fill:true, fillColor:"#171512", fillOpacity:1});
          settlementTracePaths.set(area.id, drawn.slice());
        }
        if (progress < 1) requestAnimationFrame(frame);
        else {
          activeSettlementTrace = null;
          console.log("Обводка поселения: анимация росчерка завершена", area.id);
        }
      }
      requestAnimationFrame(frame);
      console.log("Обводка поселения: анимация чёрного сужающегося росчерка началась", area.id);
    } catch (error) {
      console.error("Диагностика: ошибка анимации контура поселения", error);
    }
  }

  // Пересобираем контуры при смене масштаба. Все ширины заданы в экранных
  // пикселях, как у маршрутного штриха, поэтому геометрия ленты должна
  // пересчитываться после zoomend, а не масштабироваться вместе с картой.
  map.on("zoomend", function() {
    if (settlementBrushTestEnabled) {
      if (settlementBrushPreviewArea) drawSettlementBrushPreview(settlementBrushPreviewArea);
      if (settlementBrushSelectedArea) {
        const selectedArea = settlementBrushSelectedArea;
        settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
        settlementBrushSelectedLayers = createSettlementDryBrushLayers(selectedArea, 0.96);
      }
    }
    if (settlementHoverPath && settlementHoverOutline && settlementHoverArea && settlementContourVariant) {
      settlementHoverPath = makeRandomizedSettlementContour(
        settlementHoverArea, settlementContourVariant.startPoint, settlementContourVariant.approachPoint
      );
      settlementContourVariant.path = settlementHoverPath.slice();
      removeSettlementLayer(settlementHoverOutline);
      settlementHoverOutline = makeTaperedSettlementPolygon(settlementHoverPath, SETTLEMENT_TRACE_BASE_WIDTH, 0.68);
      if (settlementHoverOutline) settlementHoverOutline.addTo(map);
    }
    if (settlementSelectedPath && settlementSelectedOutline) {
      if (settlementSelectedArea && settlementContourVariant && String(settlementContourVariant.areaId) === String(settlementSelectedArea.id)) {
        settlementSelectedPath = makeRandomizedSettlementContour(
          settlementSelectedArea, settlementContourVariant.startPoint, settlementContourVariant.approachPoint
        );
        settlementContourVariant.path = settlementSelectedPath.slice();
      }
      removeSettlementLayer(settlementSelectedOutline);
      settlementSelectedOutline = makeTaperedSettlementPolygon(settlementSelectedPath, SETTLEMENT_TRACE_BASE_WIDTH, 0.95);
      if (settlementSelectedOutline) settlementSelectedOutline.addTo(map);
    }
    settlementTracePaths.forEach(function(path, id) {
      const oldLayer = settlementTraceLayers.get(id);
      removeSettlementLayer(oldLayer);
      const newLayer = makeTaperedSettlementPolygon(path, SETTLEMENT_TRACE_BASE_WIDTH, 1);
      if (newLayer) {
        newLayer.addTo(map);
        settlementTraceLayers.set(id, newLayer);
        if (activeSettlementTrace && String(activeSettlementTrace.areaId) === String(id)) {
          activeSettlementTrace.layer = newLayer;
        }
      }
    });
  });

  // Запускаем обводку не после всей анимации маршрута, а в тот момент,
  // когда анимированный пунктир доходит до конечной точки у границы поселения.
  // Время берём из той же системы расчёта штрихов, что и для появления жетонов.
  let settlementTraceWaitTimer = null;
  let settlementTraceWaitToken = 0;

  function waitForRouteRevealThenTraceSettlement(cityId, synchronizedRoutePoints) {
    if (settlementTraceWaitTimer) clearTimeout(settlementTraceWaitTimer);
    settlementTraceWaitTimer = null;
    const waitToken = ++settlementTraceWaitToken;
    const startedAt = Date.now();
    let loggedStart = false;

    const area = (window.settlementAreas || []).find(
      item => String(item.id) === String(cityId)
    );
    if (!area) {
      console.warn("Обводка поселения: область пока не найдена", cityId);
    }

    // Берём точки непосредственно из подтверждённого Firebase-маршрута.
    // routePoints — локальная переменная другого обработчика и здесь недоступна.
    const boundaryPoint = window.routeDestinationBoundaryPoint;
    const routePointsForTrace = Array.isArray(synchronizedRoutePoints)
      ? synchronizedRoutePoints
      : [];
    let routeEndDistance = 0;
    for (let i = 1; i < routePointsForTrace.length; i++) {
      const previous = routePointsForTrace[i - 1];
      const current = routePointsForTrace[i];
      const dy = Number(current.lat) - Number(previous.lat);
      const dx = Number(current.lng) - Number(previous.lng);
      routeEndDistance += Math.sqrt(dx * dx + dy * dy);
    }
    if (!boundaryPoint || routePointsForTrace.length < 2) {
      console.warn("Обводка поселения: нет конечной точки маршрута или границы", {
        cityId,
        boundaryPoint,
        routePointCount: routePointsForTrace.length
      });
    }

    console.log("Обводка поселения: ожидаем касания границы", {
      cityId,
      routeEndDistance,
      boundaryPoint,
      routeEnd: routePointsForTrace.length
        ? routePointsForTrace[routePointsForTrace.length - 1]
        : null
    });

    function check() {
      if (waitToken !== settlementTraceWaitToken) return;
      if (routePointsForTrace.length < 2) {
        console.warn("Обводка поселения: в подтверждённом маршруте недостаточно точек", cityId);
        settlementTraceWaitTimer = null;
        return;
      }

      const areaNow = (window.settlementAreas || []).find(
        item => String(item.id) === String(cityId)
      );
      const delay = typeof window.getRouteMarkerAnimationDelay === "function"
        ? window.getRouteMarkerAnimationDelay(routeEndDistance)
        : null;
      const routeIsAnimating = typeof window.isRouteRevealRunning === "function"
        ? window.isRouteRevealRunning()
        : false;

      if (!loggedStart) {
        console.log("Обводка поселения: проверка синхронизации", {
          cityId,
          delayUntilBoundary: delay,
          routeIsAnimating,
          areaFound: Boolean(areaNow)
        });
        loggedStart = true;
      }

      // Положительное значение означает, что пунктир ещё не дошёл до
      // позиции поселения. Проверяем часто, чтобы запуск был почти точным.
      if (delay !== null && delay > 0) {
        settlementTraceWaitTimer = setTimeout(check, Math.min(40, Math.max(12, delay)));
        return;
      }

      if (!areaNow) {
        if (Date.now() - startedAt < 15000) {
          settlementTraceWaitTimer = setTimeout(check, 100);
          return;
        }
        console.warn("Обводка поселения: не удалось найти область", cityId);
        return;
      }

      settlementTraceWaitTimer = null;
      console.log("Обводка поселения: пунктир достиг границы, запускаем анимацию", {
        cityId,
        delayUntilBoundary: delay,
        routeIsAnimating
      });
      animateSettlementTrace(areaNow);
    }

    // Небольшая задержка нужна только для того, чтобы обработчик успел
    // увидеть уже созданную общую анимацию маршрута.
    settlementTraceWaitTimer = setTimeout(check, 20);
  }

  function createSettlementToolbar() {
    if (window.settlementToolbar || !window.dndFirebase || !window.dndFirebase.isGameMaster) return;
    const toolbar = document.createElement("div");
    toolbar.id = "settlement-tools";
    toolbar.style.cssText = `
      position:fixed;top:12px;right:12px;z-index:3500;
      display:flex;flex-direction:column;gap:7px;padding:10px;
      background:#211b16;color:#eee2c8;border:2px solid #d6b46a;
      border-radius:9px;box-shadow:0 3px 14px #0009;font:13px Georgia,serif;
      max-width:190px;
    `;
    toolbar.innerHTML = `
      <div style="font-weight:bold;text-align:center;">Области поселений</div>
      <button type="button" data-settlement-type="city">Обвести город</button>
      <button type="button" data-settlement-type="village">Обвести деревню</button>
      <button type="button" id="settlement-draw-cancel" disabled>Отменить обводку</button>
      <button type="button" id="settlement-brush-test-toggle">Тест кисти А: выключен</button>
      <div id="settlement-tool-status" style="line-height:1.35;opacity:.85;">Выбери тип поселения, затем зажми кнопку мыши и обведи его.</div>
    `;
    document.body.appendChild(toolbar);
    window.settlementToolbar = toolbar;

    toolbar.querySelectorAll("[data-settlement-type]").forEach(button => {
      button.style.cssText = "padding:7px;background:#393027;color:#eee2c8;border:1px solid #756044;border-radius:5px;";
      button.addEventListener("click", function() {
        beginSettlementDrawing(this.dataset.settlementType);
      });
    });
    const cancel = toolbar.querySelector("#settlement-draw-cancel");
    cancel.style.cssText = "padding:6px;background:#4a2924;color:#fff;border:1px solid #8d5146;border-radius:5px;";
    cancel.addEventListener("click", cancelSettlementDrawing);

    const brushToggle = toolbar.querySelector("#settlement-brush-test-toggle");
    brushToggle.style.cssText = "padding:7px;background:#393027;color:#eee2c8;border:1px solid #756044;border-radius:5px;";
    brushToggle.addEventListener("click", function() {
      settlementBrushTestEnabled = !settlementBrushTestEnabled;
      this.textContent = settlementBrushTestEnabled ? "Тест кисти А: включён" : "Тест кисти А: выключен";
      this.style.background = settlementBrushTestEnabled ? "#526044" : "#393027";
      // Убираем только графические слои теста; маршрутная механика остаётся нетронутой.
      settlementBrushPreviewLayers = removeSettlementBrushLayers(settlementBrushPreviewLayers);
      settlementBrushSelectedLayers = removeSettlementBrushLayers(settlementBrushSelectedLayers);
      settlementBrushPreviewArea = null;
      settlementBrushSelectedArea = null;
      settlementBrushSelectedAreaId = null;
      restoreRouteLayersForSettlement();
      removeSettlementLayer(settlementHoverOutline); settlementHoverOutline = null;
      removeSettlementLayer(settlementSelectedOutline); settlementSelectedOutline = null;
      if (settlementBrushTestEnabled) {
        setSettlementToolStatus("Тест сухой кисти А включён. Начни прокладку маршрута и наведи курсор на поселение.");
      } else {
        setSettlementToolStatus("Тест кисти выключен. Возвращён прежний способ отображения обводки.");
        if (window.routeMode && lastCursorPosition && window.previewSettlementAt) {
          window.previewSettlementAt(lastCursorPosition);
        }
      }
    });

    map.getContainer().addEventListener("pointerdown", handleSettlementPointerDown, true);
    map.getContainer().addEventListener("pointermove", handleSettlementPointerMove, true);
    map.getContainer().addEventListener("pointerup", handleSettlementPointerUp, true);
    map.getContainer().addEventListener("pointercancel", cancelSettlementDrawing, true);
  }

  function setSettlementToolStatus(message) {
    const status = document.getElementById("settlement-tool-status");
    if (status) status.textContent = message;
    const cancel = document.getElementById("settlement-draw-cancel");
    if (cancel) cancel.disabled = !window.settlementDrawingMode;
  }

  function beginSettlementDrawing(type) {
    if (!window.dndFirebase || !window.dndFirebase.isGameMaster) return;
    cancelSettlementDrawing();
    window.settlementDrawingMode = type;
    window.settlementDrawingActive = true;
    window.settlementDraft = [];
    map.dragging.disable();
    map.doubleClickZoom.disable();
    map.getContainer().style.touchAction = "none";
    setSettlementToolStatus(type === "city"
      ? "Зажми левую кнопку и обведи весь город. Отпусти, чтобы сохранить."
      : "Зажми левую кнопку и обведи всю деревню. Отпусти, чтобы сохранить.");
  }

  function handleSettlementPointerDown(event) {
    if (!window.settlementDrawingMode || event.button !== 0) return;
    event.preventDefault();
    event.stopPropagation();
    window.settlementPointerDown = true;
    window.settlementDraft = [map.mouseEventToLatLng(event)];
    if (window.settlementDraftLine && map.hasLayer(window.settlementDraftLine)) map.removeLayer(window.settlementDraftLine);
    window.settlementDraftLine = L.polyline(window.settlementDraft, {
      color: "#f0d18a", weight: 3, opacity: 0.95,
      lineCap: "round", lineJoin: "round", interactive: false
    }).addTo(map);
    try { map.getContainer().setPointerCapture(event.pointerId); } catch (_) {}
  }

  function handleSettlementPointerMove(event) {
    if (!window.settlementDrawingMode || !window.settlementPointerDown) return;
    event.preventDefault();
    event.stopPropagation();
    const point = map.mouseEventToLatLng(event);
    const previous = window.settlementDraft[window.settlementDraft.length - 1];
    if (map.latLngToContainerPoint(previous).distanceTo(map.latLngToContainerPoint(point)) >= 4) {
      window.settlementDraft.push(point);
      window.settlementDraftLine.setLatLngs(window.settlementDraft);
    }
  }

  async function handleSettlementPointerUp(event) {
    if (!window.settlementDrawingMode || !window.settlementPointerDown) return;
    event.preventDefault();
    event.stopPropagation();
    const finalPoint = map.mouseEventToLatLng(event);
    const previous = window.settlementDraft[window.settlementDraft.length - 1];
    if (!previous || map.latLngToContainerPoint(previous).distanceTo(map.latLngToContainerPoint(finalPoint)) > 1) {
      window.settlementDraft.push(finalPoint);
    }
    window.settlementPointerDown = false;
    settlementJustDrew = true;
    setTimeout(function() { settlementJustDrew = false; }, 350);
    try { map.getContainer().releasePointerCapture(event.pointerId); } catch (_) {}

    if (window.settlementDraft.length < 8 || polygonArea(window.settlementDraft) < 100) {
      setSettlementToolStatus("Контур слишком маленький. Попробуй обвести поселение ещё раз.");
      if (window.settlementDraftLine && map.hasLayer(window.settlementDraftLine)) map.removeLayer(window.settlementDraftLine);
      window.settlementDraftLine = null;
      window.settlementDraft = [];
      return;
    }

    // Замыкаем область автоматически; после сохранения линия исчезнет.
    const type = window.settlementDrawingMode;
    const area = {
      id: "settlement_" + Date.now() + "_" + Math.floor(Math.random() * 100000),
      type: type,
      points: window.settlementDraft.map(point => ({ lat: point.lat, lng: point.lng })),
      entrancePoints: [],
      exitPoints: [],
      createdAt: Date.now()
    };

    try {
      if (!window.dndFirebase || typeof window.dndFirebase.saveSettlementAreas !== "function") {
        throw new Error("Firebase ещё не готов к сохранению поселений");
      }
      await window.dndFirebase.saveSettlementAreas(area);
      setSettlementToolStatus(type === "city"
        ? "Город сохранён. Его контур теперь невидим для всех игроков."
        : "Деревня сохранена. Её контур теперь невидим для всех игроков.");
    } catch (error) {
      console.error("Не удалось сохранить область поселения:", error);
      setSettlementToolStatus("Ошибка сохранения: " + error.message);
      alert("Не удалось сохранить поселение в Firebase: " + error.message);
    }

    if (window.settlementDraftLine && map.hasLayer(window.settlementDraftLine)) map.removeLayer(window.settlementDraftLine);
    window.settlementDraftLine = null;
    window.settlementDraft = [];
    window.settlementDrawingMode = null;
    window.settlementDrawingActive = false;
    map.dragging.enable();
    map.doubleClickZoom.enable();
    map.getContainer().style.touchAction = "";
    setSettlementToolStatus(type === "city"
      ? "Город сохранён. Можно обвести следующий город или деревню."
      : "Деревня сохранена. Можно обвести следующий город или деревню.");
  }

  function cancelSettlementDrawing() {
    window.settlementPointerDown = false;
    window.settlementDrawingMode = null;
    window.settlementDrawingActive = false;
    window.settlementDraft = [];
    if (window.settlementDraftLine && map.hasLayer(window.settlementDraftLine)) map.removeLayer(window.settlementDraftLine);
    window.settlementDraftLine = null;
    if (map.dragging) map.dragging.enable();
    if (map.doubleClickZoom) map.doubleClickZoom.enable();
    if (map.getContainer) map.getContainer().style.touchAction = "";
    setSettlementToolStatus("Обводка отменена. Выбери город или деревню.");
  }

  function initializeSettlementAreas() {
    // Храним флаг на window, чтобы он был доступен независимо от
    // области видимости, в которой оказался обработчик инициализации.
    if (window.settlementListenerStarted) return;
    window.settlementListenerStarted = true;
    const areasRef = ref(database, "settlements/areas");
    window.dndFirebase.saveSettlementAreas = async function(area) {
      if (!window.dndFirebase.ready || !window.dndFirebase.isGameMaster) {
        throw new Error("Создавать поселения может только ведущий");
      }
      await set(ref(database, "settlements/areas/" + area.id), area);
    };

    onValue(areasRef, function(snapshot) {
      const value = snapshot.val() || {};
      window.settlementAreas = Object.keys(value).map(key => ({
        ...value[key], id: value[key].id || key
      })).filter(area => Array.isArray(area.points) && area.points.length >= 3);
      console.log("Области поселений загружены:", window.settlementAreas.length);
    }, function(error) {
      console.error("Ошибка загрузки областей поселений:", error);
    });

    createSettlementToolbar();
  }

 // Тестовая проверка общей базы
  window.testFirebase = async function() {
    const testRef = ref(database, "connectionTest");

    try {
      await set(testRef, {
        message: "Связь работает!",
        updatedAt: Date.now()
      });

      const snapshot = await get(testRef);

      console.log("Проверка Firebase:", snapshot.val());
      alert("Успешно! Firebase записывает и читает данные.");
    } catch (error) {
      console.error("Ошибка Firebase:", error);
      alert("Ошибка Firebase: " + error.message);
    }
  };

  // Делаем Firebase доступным для следующих частей нашей системы.
  // Каждому UID соответствует собственный узел личных меток.
  window.dndFirebase = {
    app: app,
    auth: auth,
    database: database,
    uid: null,
    ready: false,
    isGameMaster: false,
    savePersonalMarkers: null,
    saveSettlementAreas: null
  };

  async function initializePersonalMarkers(uid) {
    const personalMarkersRef = ref(database, "players/" + uid + "/markers");

    // Метод записи доступен только после подтверждённой авторизации.
    window.dndFirebase.savePersonalMarkers = async function(markers) {
      if (!window.dndFirebase.ready || window.dndFirebase.uid !== uid) {
        throw new Error("Firebase ещё не готов для сохранения личных меток");
      }

      const data = {};
      (Array.isArray(markers) ? markers : []).forEach(function(marker) {
        if (marker && marker.id !== undefined && marker.id !== null) {
          data[String(marker.id)] = marker;
        }
      });
      await set(personalMarkersRef, data);
    };

    // Переносим локальные метки этого браузера только если у UID
    // ещё нет личного набора в Firebase. Локальную копию не удаляем.
    const remoteSnapshot = await get(personalMarkersRef);
    if (!remoteSnapshot.exists()) {
      let localMarkers = [];
      try {
        localMarkers = JSON.parse(localStorage.getItem("markers") || "[]");
      } catch (error) {
        console.warn("Локальный список меток не удалось прочитать:", error);
      }

      if (Array.isArray(localMarkers) && localMarkers.length > 0) {
        const migrated = {};
        localMarkers.forEach(function(marker) {
          if (marker && marker.id !== undefined && marker.id !== null) {
            migrated[String(marker.id)] = marker;
          }
        });
        if (Object.keys(migrated).length > 0) {
          await set(personalMarkersRef, migrated);
          console.log("Личные метки перенесены в Firebase:", Object.keys(migrated).length);
        }
      }
    }

    // Слушаем только собственный узел. Чужие метки этому клиенту недоступны.
    onValue(personalMarkersRef, function(snapshot) {
      const value = snapshot.val() || {};
      const markers = Object.keys(value).map(function(key) {
        return value[key];
      });
      if (typeof window.applyPersonalMarkers === "function") {
        window.applyPersonalMarkers(markers);
      }
    }, function(error) {
      console.error("Ошибка чтения личных меток:", error);
    });
  }

  // Индикатор подключения на экране
  const status = document.createElement("div");

  status.style.cssText = `
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 2000;
    padding: 8px 12px;
    border-radius: 6px;
    background: #222;
    color: white;
    font: 13px sans-serif;
  `;

  status.textContent = "Firebase: подключение...";
  document.body.appendChild(status);

  // Анонимная авторизация игрока
  onAuthStateChanged(auth, function(user) {
    if (user) {
      window.dndFirebase.uid = user.uid;
      window.dndFirebase.ready = true;
      window.dndFirebase.isGameMaster = user.uid === GAME_MASTER_UID;

      status.textContent = window.dndFirebase.isGameMaster
        ? "Firebase: ведущий авторизован"
        : "Firebase: игрок авторизован";
      status.style.background = "#245c32";

      console.log("Firebase готов. UID:", user.uid);
      initializePersonalMarkers(user.uid).catch(function(error) {
        console.error("Ошибка загрузки личных меток:", error);
        status.textContent = "Firebase: ошибка загрузки меток";
        status.style.background = "#8b2222";
      });
      initializeParty();
      initializeSettlementAreas();
    } else {
      window.dndFirebase.ready = false;
      window.dndFirebase.isGameMaster = false;
      status.textContent = "Firebase: выполняется вход...";

      signInAnonymously(auth).catch(function(error) {
        console.error("Ошибка авторизации Firebase:", error);

        status.textContent = "Firebase: ошибка авторизации";
        status.style.background = "#8b2222";
      });
    }
  });
</script>

</body>
</html>
